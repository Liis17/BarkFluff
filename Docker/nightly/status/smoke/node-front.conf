# CI-only: TLS-фронт тестовой ноды. Маршруты повторяют ingress: gRPC-хосты через grpc_pass по HTTP/2,
# остальные через proxy_pass с сохранением Host. Сертификат выдан тестовым CA (smoke.sh).
# Наружу отдаётся только точный маршрут /health/ready; остальные пути — 404 на фронте, mock их не видит.

upstream grpc_mock {
    server mock-node:7000;
}

upstream http_mock {
    server mock-node:8080;
}

# gRPC-путь: Host (он же :authority для HTTP/2-апстрима) передаётся явно, mock выбирает ответ по нему.
server {
    listen 443 ssl;
    http2 on;
    server_name beacon.smoke.test identity.smoke.test messages.smoke.test federation.smoke.test onliner.smoke.test;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /health/ready {
        grpc_set_header Host $host;
        grpc_pass grpc://grpc_mock;
    }

    location / {
        return 404;
    }
}

# HTTP-путь: только точный маршрут /health/ready, для всех публичных HTTP-хостов (включая developers).
server {
    listen 443 ssl;
    http2 on;
    server_name bots.smoke.test web.smoke.test developers.smoke.test users.smoke.test updates.smoke.test calls.smoke.test fast-auth.smoke.test files.smoke.test;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /health/ready {
        proxy_pass http://http_mock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
