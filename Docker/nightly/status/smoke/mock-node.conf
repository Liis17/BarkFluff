# CI-only: mock-сервисы тестовой ноды. Ответы /health/ready повторяют контракт ReadinessSnapshot.
# gRPC-мок (порт 7000, HTTP/2 без TLS) отвечает healthy по умолчанию; onliner выбирается по Host (:authority)
# и отвечает 503 — проверка 503 идёт через grpc_pass. HTTP-мок (порт 8080) выбирает ответ по Host.
# На 7000 любой метод, кроме GET, — 405: grpc_pass сохраняет метод клиента (ngx_http_grpc_module.c),
# и smoke должен упасть, если это перестанет быть правдой.

server {
    listen 7000;
    http2 on;
    server_name _;

    location = /health/ready {
        if ($request_method != GET) {
            return 405;
        }
        default_type application/json;
        return 200 '{"status":"healthy","checkedAtUtc":"$time_iso8601","checks":[],"instanceId":"mock-grpc"}';
    }

    location / {
        return 404;
    }
}

# 503 с JSON через gRPC-путь: компонент недоступен.
server {
    listen 7000;
    http2 on;
    server_name onliner.smoke.test;

    location = /health/ready {
        if ($request_method != GET) {
            return 405;
        }
        default_type application/json;
        return 503 '{"status":"down","checkedAtUtc":"$time_iso8601","checks":[{"name":"redis","status":"down","error":"connection refused"}],"instanceId":"mock-down"}';
    }

    location / {
        return 404;
    }
}

# Healthy по HTTP: проксируемые публичные маршруты (bots, web, developers).
server {
    listen 8080;
    server_name bots.smoke.test web.smoke.test developers.smoke.test;

    location = /health/ready {
        default_type application/json;
        return 200 '{"status":"healthy","checkedAtUtc":"$time_iso8601","checks":[{"name":"db","status":"healthy"}],"instanceId":"mock-http"}';
    }

    location / {
        return 404;
    }
}

# Работает с ограничениями.
server {
    listen 8080;
    server_name users.smoke.test;

    location = /health/ready {
        default_type application/json;
        return 200 '{"status":"degraded","checkedAtUtc":"$time_iso8601","checks":[{"name":"s3","status":"down"}],"instanceId":"mock-degraded"}';
    }

    location / {
        return 404;
    }
}

# Снимок с давней отметкой времени: монитор ноды не обновлялся.
server {
    listen 8080;
    server_name updates.smoke.test;

    location = /health/ready {
        default_type application/json;
        return 200 '{"status":"healthy","checkedAtUtc":"2020-01-01T00:00:00+00:00","checks":[],"instanceId":"mock-stale"}';
    }

    location / {
        return 404;
    }
}

# Прогрев: свежий снимок со статусом starting.
server {
    listen 8080;
    server_name files.smoke.test;

    location = /health/ready {
        default_type application/json;
        return 200 '{"status":"starting","checkedAtUtc":"$time_iso8601","checks":[],"instanceId":"mock-starting"}';
    }

    location / {
        return 404;
    }
}

# Не JSON, а страница шлюза: непарсящийся ответ — недоступен.
server {
    listen 8080;
    server_name calls.smoke.test;

    location = /health/ready {
        default_type text/html;
        return 200 '<html>gateway</html>';
    }

    location / {
        return 404;
    }
}

# Редирект: не следуем, это недоступность.
server {
    listen 8080;
    server_name fast-auth.smoke.test;

    location = /health/ready {
        return 301 /moved;
    }

    location / {
        return 404;
    }
}
