      <<: *lognara-application-environment
      LognaraEnable: "${WEB_LOGNARA_ENABLE:-true}"
      SeqEnable: "${WEB_SEQ_ENABLE:-false}"
      ConsoleOutput: "${WEB_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: web
      LOGNARA_SERVICE_INSTANCE: "${WEB_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${WEB_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-web:/app/logs
      - lognara-agent-spool-web:/var/lib/lognara-agent/spool

  developers:
    init: true
    stop_grace_period: 90s
    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${DEVELOPERS_LOGNARA_ENABLE:-true}"
      SeqEnable: "${DEVELOPERS_SEQ_ENABLE:-false}"
      ConsoleOutput: "${DEVELOPERS_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: developers
      LOGNARA_SERVICE_INSTANCE: "${DEVELOPERS_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${DEVELOPERS_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-developers:/app/logs
      - lognara-agent-spool-developers:/var/lib/lognara-agent/spool

  calls:
    init: true
    stop_grace_period: 90s
    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${CALLS_LOGNARA_ENABLE:-true}"
      SeqEnable: "${CALLS_SEQ_ENABLE:-false}"
      ConsoleOutput: "${CALLS_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: calls
      LOGNARA_SERVICE_INSTANCE: "${CALLS_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${CALLS_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-calls:/app/logs
      - lognara-agent-spool-calls:/var/lib/lognara-agent/spool

  bots:
    init: true
    stop_grace_period: 90s
    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${BOTS_LOGNARA_ENABLE:-true}"
      SeqEnable: "${BOTS_SEQ_ENABLE:-false}"
      ConsoleOutput: "${BOTS_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: bots
      LOGNARA_SERVICE_INSTANCE: "${BOTS_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${BOTS_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-bots:/app/logs
      - lognara-agent-spool-bots:/var/lib/lognara-agent/spool

  admin-panel:
    init: true
    stop_grace_period: 90s
    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${ADMIN_PANEL_LOGNARA_ENABLE:-true}"
      SeqEnable: "${ADMIN_PANEL_SEQ_ENABLE:-false}"
      ConsoleOutput: "${ADMIN_PANEL_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: admin-panel
      LOGNARA_SERVICE_INSTANCE: "${ADMIN_PANEL_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${ADMIN_PANEL_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-admin-panel:/app/logs
      - lognara-agent-spool-admin-panel:/var/lib/lognara-agent/spool

  postgres:
    image: "${POSTGRES_LOGNARA_IMAGE:-barkfluff/lognara-postgres:18}"
    build:
      context: ../../..
      dockerfile: Docker/Lognara/Dockerfile.infrastructure
      args:
        BASE_IMAGE: postgres:18
    entrypoint: ["/usr/local/bin/lognara-agent", "run", "--", "/usr/local/bin/docker-entrypoint.sh"]
    command: ["postgres", "-c", "max_connections=150", "-c", "shared_buffers=768MB", "-c", "effective_cache_size=2GB", "-c", "maintenance_work_mem=192MB", "-c", "work_mem=12MB", "-c", "random_page_cost=1.1", "-c", "effective_io_concurrency=200", "-c", "max_wal_size=2GB", "-c", "min_wal_size=512MB", "-c", "checkpoint_completion_target=0.9", "-c", "wal_compression=on", "-c", "jit=off"]
    init: true
    stop_grace_period: 60s
    environment:
      <<: *lognara-capture-environment
      LOGNARA_SERVICE: postgres
      LOGNARA_SERVICE_INSTANCE: "${POSTGRES_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${POSTGRES_LOGNARA_RELAY_TOKEN:?set POSTGRES_LOGNARA_RELAY_TOKEN in the Compose environment}"
    volumes:
      - lognara-agent-spool-postgres:/var/lib/lognara-agent/spool
  postgres-bootstrap:
    image: "${POSTGRES_BOOTSTRAP_LOGNARA_IMAGE:-barkfluff/lognara-postgres:18}"
    entrypoint: ["/usr/local/bin/lognara-agent", "run", "--", "/bin/sh", "-ec"]
    command:
      - |
        for database in "$${SETTINGS_DATABASE:-settings}" identity users messages files onliner calls bots federation developers; do
          echo "Ensuring PostgreSQL database exists: $$database"
          createdb --if-not-exists --maintenance-db=postgres "$$database"
        done
    init: true
    stop_grace_period: 60s
    environment:
      <<: *lognara-capture-environment
      LOGNARA_SERVICE: postgres-bootstrap
      LOGNARA_SERVICE_INSTANCE: "${POSTGRES_BOOTSTRAP_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${POSTGRES_BOOTSTRAP_LOGNARA_RELAY_TOKEN:?set POSTGRES_BOOTSTRAP_LOGNARA_RELAY_TOKEN in the Compose environment}"
    volumes:
      - lognara-agent-spool-postgres-bootstrap:/var/lib/lognara-agent/spool
  rabbitmq:
    image: "${RABBITMQ_LOGNARA_IMAGE:-barkfluff/lognara-rabbitmq:latest}"
    build:
      context: ../../..
      dockerfile: Docker/Lognara/Dockerfile.infrastructure
      args:
        BASE_IMAGE: rabbitmq:latest
    entrypoint: ["/usr/local/bin/lognara-agent", "run", "--", "/usr/local/bin/docker-entrypoint.sh"]
    command: ["rabbitmq-server"]
    init: true
    stop_grace_period: 60s
    environment:
      <<: *lognara-capture-environment
      LOGNARA_SERVICE: rabbitmq
      LOGNARA_SERVICE_INSTANCE: "${RABBITMQ_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${RABBITMQ_LOGNARA_RELAY_TOKEN:?set RABBITMQ_LOGNARA_RELAY_TOKEN in the Compose environment}"
    volumes:
      - lognara-agent-spool-rabbitmq:/var/lib/lognara-agent/spool
  redis:
    image: "${REDIS_LOGNARA_IMAGE:-barkfluff/lognara-redis:latest}"
    build:
      context: ../../..
      dockerfile: Docker/Lognara/Dockerfile.infrastructure
      args:
        BASE_IMAGE: redis:latest
    entrypoint: ["/usr/local/bin/lognara-agent", "run", "--", "/usr/local/bin/docker-entrypoint.sh"]
    command: redis-server --appendonly yes
    init: true
    stop_grace_period: 60s
    environment:
      <<: *lognara-capture-environment
      LOGNARA_SERVICE: redis
      LOGNARA_SERVICE_INSTANCE: "${REDIS_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${REDIS_LOGNARA_RELAY_TOKEN:?set REDIS_LOGNARA_RELAY_TOKEN in the Compose environment}"
    volumes:
      - lognara-agent-spool-redis:/var/lib/lognara-agent/spool
  livekit:
    image: "${LIVEKIT_LOGNARA_IMAGE:-barkfluff/lognara-livekit:latest}"
    build:
      context: ../../..
      dockerfile: Docker/Lognara/Dockerfile.infrastructure
      args:
        BASE_IMAGE: livekit/livekit-server:latest
    entrypoint: ["/usr/local/bin/lognara-agent", "run", "--", "/livekit-server"]
    command: --config /etc/livekit/livekit.yaml
    init: true
    stop_grace_period: 60s
    environment:
      <<: *lognara-capture-environment
      LOGNARA_SERVICE: livekit
      LOGNARA_SERVICE_INSTANCE: "${LIVEKIT_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${LIVEKIT_LOGNARA_RELAY_TOKEN:?set LIVEKIT_LOGNARA_RELAY_TOKEN in the Compose environment}"
    volumes:
      - lognara-agent-spool-livekit:/var/lib/lognara-agent/spool
  seq:
    image: "${SEQ_LOGNARA_IMAGE:-barkfluff/lognara-seq:latest}"
    build:
      context: ../../..
      dockerfile: Docker/Lognara/Dockerfile.infrastructure
      args:
        BASE_IMAGE: datalust/seq:latest
    entrypoint: ["/usr/local/bin/lognara-agent", "run", "--", "/bin/seqentry"]
    command: []
    init: true
    stop_grace_period: 60s
    environment:
      <<: *lognara-capture-environment
      LOGNARA_SERVICE: seq
      LOGNARA_SERVICE_INSTANCE: "${SEQ_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${SEQ_LOGNARA_RELAY_TOKEN:?set SEQ_LOGNARA_RELAY_TOKEN in the Compose environment}"
    volumes:
      - lognara-agent-spool-seq:/var/lib/lognara-agent/spool
  minio:
    profiles: [lognara-minio]
    image: "${MINIO_LOGNARA_IMAGE:-barkfluff/lognara-minio:RELEASE.2025-04-22T22-12-26Z-cpuv1}"
    build:
      context: ../../..
      dockerfile: Docker/Lognara/Dockerfile.infrastructure
      args:
        BASE_IMAGE: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    entrypoint: ["/usr/local/bin/lognara-agent", "run", "--", "/usr/bin/docker-entrypoint.sh"]
    command: server /data --console-address ":${MINIO_WEBPORT:-9001}"
    container_name: minio
    restart: always
    init: true
    stop_grace_period: 60s
    ports:
      - "${MINIO_PORT:-9000}:${MINIO_PORT:-9000}"
      - "${MINIO_WEBPORT:-9001}:${MINIO_WEBPORT:-9001}"
    environment:
      <<: *lognara-capture-environment
      LOGNARA_SERVICE: minio
      LOGNARA_SERVICE_INSTANCE: "${MINIO_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${MINIO_LOGNARA_RELAY_TOKEN:-}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-}"
    volumes:
      - ./data/minio:/data
      - lognara-agent-spool-minio:/var/lib/lognara-agent/spool
    networks:
      - barkfluff-network
  lognara-relay:
    image: "${LOGNARA_RELAY_IMAGE:-docker.barkfluff.com/lognara-relay:master}"
    container_name: lognara-relay
    restart: always
    user: "1000:1000"
    init: true
    stop_grace_period: 60s
    environment:
      LOGNARA_LISTEN_ADDR: 0.0.0.0:7401
      LOGNARA_CORE_URL: "${LOGNARA_CORE_URL:?set LOGNARA_CORE_URL in the Compose environment}"
      LOGNARA_CORE_TOKEN: "${LOGNARA_CORE_TOKEN:?set LOGNARA_CORE_TOKEN in the Compose environment}"
      LOGNARA_SPOOL_DIR: /var/lib/lognara-relay/spool
    volumes:
      - lognara-relay-spool:/var/lib/lognara-relay/spool
    networks:
      - barkfluff-network

