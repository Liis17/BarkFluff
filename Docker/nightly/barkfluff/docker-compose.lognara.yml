      SeqEnable: "${FAST_AUTH_SEQ_ENABLE:-false}"
      ConsoleOutput: "${FAST_AUTH_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: fast-auth
      LOGNARA_SERVICE_INSTANCE: "${FAST_AUTH_LOGNARA_SERVICE_INSTANCE:-}"
