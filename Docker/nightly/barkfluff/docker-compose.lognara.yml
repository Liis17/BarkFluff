    volumes:
      - lognara-buffer-fast-auth:/app/logs
      - lognara-agent-spool-fast-auth:/var/lib/lognara-agent/spool

  updates:
    init: true
    stop_grace_period: 90s
    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${UPDATES_LOGNARA_ENABLE:-true}"
      SeqEnable: "${UPDATES_SEQ_ENABLE:-false}"
      ConsoleOutput: "${UPDATES_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: updates
      LOGNARA_SERVICE_INSTANCE: "${UPDATES_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${UPDATES_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-updates:/app/logs
      - lognara-agent-spool-updates:/var/lib/lognara-agent/spool

  onliner:
    init: true
    stop_grace_period: 90s
    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${ONLINER_LOGNARA_ENABLE:-true}"
      SeqEnable: "${ONLINER_SEQ_ENABLE:-false}"
      ConsoleOutput: "${ONLINER_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: onliner
      LOGNARA_SERVICE_INSTANCE: "${ONLINER_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${ONLINER_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-onliner:/app/logs
      - lognara-agent-spool-onliner:/var/lib/lognara-agent/spool

  federation:
    init: true
    stop_grace_period: 90s
    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${FEDERATION_LOGNARA_ENABLE:-true}"
      SeqEnable: "${FEDERATION_SEQ_ENABLE:-false}"
      ConsoleOutput: "${FEDERATION_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: federation
      LOGNARA_SERVICE_INSTANCE: "${FEDERATION_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${FEDERATION_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-federation:/app/logs
      - lognara-agent-spool-federation:/var/lib/lognara-agent/spool

  cloud-messaging:
    init: true
    stop_grace_period: 90s
    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${CLOUD_MESSAGING_LOGNARA_ENABLE:-true}"
      SeqEnable: "${CLOUD_MESSAGING_SEQ_ENABLE:-false}"
      ConsoleOutput: "${CLOUD_MESSAGING_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: cloud-messaging
      LOGNARA_SERVICE_INSTANCE: "${CLOUD_MESSAGING_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${CLOUD_MESSAGING_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-cloud-messaging:/app/logs
      - lognara-agent-spool-cloud-messaging:/var/lib/lognara-agent/spool

  web:
    init: true
    stop_grace_period: 90s
