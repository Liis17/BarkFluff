    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${USERS_LOGNARA_ENABLE:-true}"
      SeqEnable: "${USERS_SEQ_ENABLE:-false}"
      ConsoleOutput: "${USERS_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: users
      LOGNARA_SERVICE_INSTANCE: "${USERS_LOGNARA_SERVICE_INSTANCE:-}"
