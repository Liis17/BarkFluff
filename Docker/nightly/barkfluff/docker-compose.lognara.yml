      SeqEnable: "${NOTIFICATION_SEQ_ENABLE:-false}"
      ConsoleOutput: "${NOTIFICATION_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: notification
      LOGNARA_SERVICE_INSTANCE: "${NOTIFICATION_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${NOTIFICATION_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-notification:/app/logs
