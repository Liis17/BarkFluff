  lognara-buffer-beacon:
    name: barkfluff-lognara-buffer-beacon
  lognara-agent-spool-beacon:
    name: barkfluff-lognara-agent-spool-beacon
  lognara-buffer-settings:
    name: barkfluff-lognara-buffer-settings
  lognara-agent-spool-settings:
    name: barkfluff-lognara-agent-spool-settings
  lognara-buffer-files:
    name: barkfluff-lognara-buffer-files
  lognara-agent-spool-files:
    name: barkfluff-lognara-agent-spool-files
  lognara-buffer-identity:
    name: barkfluff-lognara-buffer-identity
  lognara-agent-spool-identity:
    name: barkfluff-lognara-agent-spool-identity
  lognara-buffer-messages:
    name: barkfluff-lognara-buffer-messages
  lognara-agent-spool-messages:
    name: barkfluff-lognara-agent-spool-messages
  lognara-buffer-notification:
    name: barkfluff-lognara-buffer-notification
  lognara-agent-spool-notification:
    name: barkfluff-lognara-agent-spool-notification
  lognara-buffer-users:
    name: barkfluff-lognara-buffer-users
  lognara-agent-spool-users:
    name: barkfluff-lognara-agent-spool-users
  lognara-buffer-fast-auth:
    name: barkfluff-lognara-buffer-fast-auth
  lognara-agent-spool-fast-auth:
    name: barkfluff-lognara-agent-spool-fast-auth
  lognara-buffer-updates:
    name: barkfluff-lognara-buffer-updates
  lognara-agent-spool-updates:
    name: barkfluff-lognara-agent-spool-updates
  lognara-buffer-onliner:
    name: barkfluff-lognara-buffer-onliner
  lognara-agent-spool-onliner:
    name: barkfluff-lognara-agent-spool-onliner
  lognara-buffer-federation:
    name: barkfluff-lognara-buffer-federation
  lognara-agent-spool-federation:
    name: barkfluff-lognara-agent-spool-federation
  lognara-buffer-cloud-messaging:
