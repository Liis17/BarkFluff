# Opt-in Lognara deployment overlay for the main BarkFluff node.
# Usage: docker compose -f docker-compose.yml -f docker-compose.lognara.yml up -d --build
x-lognara-application-environment: &lognara-application-environment
  Lognara__AgentExecutable: /usr/local/bin/lognara-agent
  Lognara__AgentUrl: http://127.0.0.1:7400/v1/logs
  LOGNARA_SERVER: "${LOGNARA_SERVER:?set LOGNARA_SERVER in the Compose environment}"
  LOGNARA_BACKEND: "${LOGNARA_BACKEND:-barkfluff}"
  LOGNARA_ENVIRONMENT: "${LOGNARA_ENVIRONMENT:-}"
  LOGNARA_RELAY_URL: "${LOGNARA_RELAY_URL:-http://lognara-relay:7401/v1/batches}"
  LOGNARA_LISTEN_ADDR: 127.0.0.1:7400
  LOGNARA_SPOOL_DIR: /var/lib/lognara-agent/spool

x-lognara-capture-environment: &lognara-capture-environment
  LOGNARA_SERVER: "${LOGNARA_SERVER:?set LOGNARA_SERVER in the Compose environment}"
  LOGNARA_BACKEND: "${LOGNARA_BACKEND:-barkfluff}"
  LOGNARA_ENVIRONMENT: "${LOGNARA_ENVIRONMENT:-}"
  LOGNARA_RELAY_URL: "${LOGNARA_RELAY_URL:-http://lognara-relay:7401/v1/batches}"
  LOGNARA_SPOOL_DIR: /var/lib/lognara-agent/spool

services:
  beacon:
    init: true
    stop_grace_period: 90s
    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${BEACON_LOGNARA_ENABLE:-true}"
      SeqEnable: "${BEACON_SEQ_ENABLE:-false}"
      ConsoleOutput: "${BEACON_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: beacon
      LOGNARA_SERVICE_INSTANCE: "${BEACON_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${BEACON_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-beacon:/app/logs
      - lognara-agent-spool-beacon:/var/lib/lognara-agent/spool

  settings:
    init: true
    stop_grace_period: 90s
    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${SETTINGS_LOGNARA_ENABLE:-true}"
      SeqEnable: "${SETTINGS_SEQ_ENABLE:-false}"
      ConsoleOutput: "${SETTINGS_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: settings
      LOGNARA_SERVICE_INSTANCE: "${SETTINGS_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${SETTINGS_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-settings:/app/logs
      - lognara-agent-spool-settings:/var/lib/lognara-agent/spool

  files:
    init: true
    stop_grace_period: 90s
    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${FILES_LOGNARA_ENABLE:-true}"
