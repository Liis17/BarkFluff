  lognara-agent-spool-postgres-bootstrap:
    name: barkfluff-lognara-agent-spool-postgres-bootstrap
  lognara-agent-spool-rabbitmq:
    name: barkfluff-lognara-agent-spool-rabbitmq
  lognara-agent-spool-redis:
    name: barkfluff-lognara-agent-spool-redis
  lognara-agent-spool-livekit:
    name: barkfluff-lognara-agent-spool-livekit
  lognara-agent-spool-seq:
    name: barkfluff-lognara-agent-spool-seq
  lognara-agent-spool-minio:
