services:
  webserver-nightly:
    container_name: webserver
    image: docker.barkfluff.com/barkfluff-webserver-nightly:latest
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:${WEBSERVER_PORT}"
      WEBSERVER_PORT: ${WEBSERVER_PORT}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      UsersService__Host: ${USERS_SERVICE_HOST}
      UsersService__Token: ${USERS_SERVICE_TOKEN}
      LognaraEnable: "${WEBSERVER_LOGNARA_ENABLE:-false}"
      SeqEnable: "${WEBSERVER_SEQ_ENABLE:-true}"
      ConsoleOutput: "${WEBSERVER_CONSOLE_OUTPUT:-true}"
    networks:
      - barkfluff-network

networks:
  barkfluff-network:
    external: true
    name: barkfluff-network
