x-lognara-application-environment: &lognara-application-environment
  Lognara__AgentExecutable: /usr/local/bin/lognara-agent
  Lognara__AgentUrl: http://127.0.0.1:7400/v1/logs
  LOGNARA_SERVER: "${LOGNARA_SERVER:?set LOGNARA_SERVER in the Compose environment}"
  LOGNARA_BACKEND: "${LOGNARA_BACKEND:-barkfluff}"
  LOGNARA_ENVIRONMENT: "${LOGNARA_ENVIRONMENT:-}"
  LOGNARA_RELAY_URL: "${LOGNARA_RELAY_URL:-http://lognara-relay:7401/v1/batches}"
  LOGNARA_LISTEN_ADDR: 127.0.0.1:7400
  LOGNARA_SPOOL_DIR: /var/lib/lognara-agent/spool

services:
  webserver-nightly:
    init: true
    stop_grace_period: 90s
    environment:
      <<: *lognara-application-environment
      LognaraEnable: "${WEBSERVER_LOGNARA_ENABLE:-true}"
      SeqEnable: "${WEBSERVER_SEQ_ENABLE:-false}"
      ConsoleOutput: "${WEBSERVER_CONSOLE_OUTPUT:-true}"
      LOGNARA_SERVICE: webserver
      LOGNARA_SERVICE_INSTANCE: "${WEBSERVER_LOGNARA_SERVICE_INSTANCE:-}"
      LOGNARA_RELAY_TOKEN: "${WEBSERVER_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-buffer-webserver:/app/logs
      - lognara-agent-spool-webserver:/var/lib/lognara-agent/spool

volumes:
  lognara-buffer-webserver:
    name: barkfluff-lognara-buffer-webserver
  lognara-agent-spool-webserver:
    name: barkfluff-lognara-agent-spool-webserver
