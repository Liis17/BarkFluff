

server {
    listen 80;
    server_name navigator.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name navigator.barkfluff.com;

    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # --- Публичная часть (HTTP/1.1 порт): главная страница, статика, публичный API, админка ---

    location = / {
        set $http_backend http://navigator:64647;
        proxy_pass $http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        set $http_backend http://navigator:64647;
        proxy_pass $http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Публичный список серверов для главной страницы (без авторизации).
    location /api/ {
        set $http_backend http://navigator:64647;
        proxy_pass $http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ping {
        set $http_backend http://navigator:64647;
        proxy_pass $http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin без завершающего слеша не входит в префикс "/admin/" ниже
    # и иначе проваливается в grpc-фолбэк — редиректим на канонический путь.
    location = /admin {
        return 301 /admin/;
    }

    # React-админка + /admin/api/* (cookie-сессия NavigatorAdmin).
    location /admin/ {
        set $http_backend http://navigator:64647;
        proxy_pass $http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Всё остальное — gRPC API (ListServers / RegisterServer / GetServerByName) ---

    location / {
        set $grpc_backend grpc://navigator:64646;
        grpc_pass $grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}
