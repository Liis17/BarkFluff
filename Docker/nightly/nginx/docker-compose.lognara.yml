x-lognara-capture-environment: &lognara-capture-environment
  LOGNARA_SERVER: "${LOGNARA_SERVER:?set LOGNARA_SERVER in the Compose environment}"
  LOGNARA_BACKEND: "${LOGNARA_BACKEND:-barkfluff}"
  LOGNARA_ENVIRONMENT: "${LOGNARA_ENVIRONMENT:-}"
  LOGNARA_RELAY_URL: "${LOGNARA_RELAY_URL:-http://lognara-relay:7401/v1/batches}"
  LOGNARA_SPOOL_DIR: /var/lib/lognara-agent/spool

services:
  nginx:
    image: "${NGINX_LOGNARA_IMAGE:-barkfluff/lognara-nginx:standalone}"
    build:
      context: ../../..
      dockerfile: Docker/Lognara/Dockerfile.infrastructure
      args:
        BASE_IMAGE: nginx:alpine
    entrypoint: ["/usr/local/bin/lognara-agent", "run", "--", "/docker-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    init: true
    stop_grace_period: 60s
    environment:
      <<: *lognara-capture-environment
      LOGNARA_SERVICE: nginx
      LOGNARA_SERVICE_INSTANCE: standalone
      LOGNARA_RELAY_TOKEN: "${NGINX_LOGNARA_RELAY_TOKEN:-}"
    volumes:
      - lognara-agent-spool-nginx:/var/lib/lognara-agent/spool

volumes:
  lognara-agent-spool-nginx:
    name: barkfluff-lognara-agent-spool-nginx
