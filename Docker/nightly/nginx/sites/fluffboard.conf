server {
    listen 80;
    server_name fluffboard.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fluffboard.barkfluff.com;
    include /etc/nginx/conf.d/01-ssl-params.conf;
    location / {
        proxy_pass http://fluffboard:8080;
        include /etc/nginx/conf.d/02-bft-proxy-headers.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
