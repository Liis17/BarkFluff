# files.barkfluff.com - Files Service (gRPC on 7005, HTTP on 7006)
server {
    listen 80;
    server_name files.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name files.barkfluff.com;
    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $grpc_backend grpc://files:7005;
        grpc_pass $grpc_backend;
        include /etc/nginx/conf.d/02-bft-proxy-headers.conf;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $bft_client_ip;
        grpc_set_header X-Forwarded-For $bft_forwarded_for_add;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }

    location /web/ {
        set $http_backend http://files:7006;
        rewrite ^/web/(.*) /$1 break;
        proxy_pass $http_backend;
        include /etc/nginx/conf.d/02-bft-proxy-headers.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }
}
