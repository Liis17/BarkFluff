map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name livekit.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name livekit.barkfluff.com;
    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $lk_backend http://livekit:7880;
        proxy_pass $lk_backend;
        include /etc/nginx/conf.d/02-bft-proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
