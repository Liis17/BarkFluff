# BFT Exit trust is disabled until an operator adds private map entries.
map_hash_bucket_size 128;
map $remote_addr $bft_exit_ip_allowed {
    default 0;
    include /etc/nginx/conf.d/bft-proxy-exit-ips/*.conf;
}

map $http_x_bft_proxy_secret $bft_proxy_secret_valid {
    default 0;
    include /etc/nginx/conf.d/bft-proxy-secrets/*.conf;
}

geo $http_x_bft_client_ip $bft_client_ip_valid {
    default 1;
    # ngx_http_geo_module maps a non-IP value to this sentinel. It is not a
    # usable client address, so it must override the default above.
    255.255.255.255 0;
}

map "$bft_exit_ip_allowed:$bft_proxy_secret_valid:$bft_client_ip_valid" $bft_proxy_trusted {
    default 0;
    "1:1:1" 1;
}

map $bft_proxy_trusted $bft_client_ip {
    default $remote_addr;
    1 $http_x_bft_client_ip;
}

map $bft_proxy_trusted $bft_forwarded_for {
    default $remote_addr;
    1 $http_x_bft_client_ip;
}

map $bft_proxy_trusted $bft_forwarded_for_add {
    default $proxy_add_x_forwarded_for;
    1 $http_x_bft_client_ip;
}

map $bft_proxy_trusted $bft_rate_limit_key {
    default $binary_remote_addr;
    1 $http_x_bft_client_ip;
}

map $http_x_bft_proxy_id $bft_proxy_id_candidate {
    default "";
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_bft_proxy_id;
}

map $bft_proxy_trusted $bft_proxy_id {
    default "";
    1 $bft_proxy_id_candidate;
}
