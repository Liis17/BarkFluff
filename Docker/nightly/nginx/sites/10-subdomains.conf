# -------------------- livekit --------------------
# livekit.barkfluff.com - LiveKit SFU: WSS-сигнализация + HTTP-API (на 7880).
#
# ВАЖНО: через nginx идёт ТОЛЬКО сигнализация (WebSocket) и серверный API LiveKit.
# Сам WebRTC-медиатрафик (UDP 50000-50200 + ICE/TCP 7881) nginx проксировать НЕ может —
# эти порты обязаны быть доступны напрямую на хосте (см. docker-compose / firewall).
# Клиент получает адрес wss://livekit.barkfluff.com (Configuration: LiveKit:Url, дублируется в Beacon).

server {
    listen 80;
    server_name livekit.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    # Без http2: WSS — это HTTP/1.1 Upgrade.
    listen 443 ssl;
    server_name livekit.barkfluff.com;

    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $lk_backend http://livekit:7880;
        proxy_pass $lk_backend;
        include /etc/nginx/conf.d/bft-proxy-headers.inc;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сигнализация живёт всё время звонка.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

