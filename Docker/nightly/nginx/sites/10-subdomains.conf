# -------------------- web --------------------
# web.barkfluff.com - Web Client (HTTP)
server {
    listen 80;
    server_name web.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name web.barkfluff.com;

    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Загрузка файлов через YARP — нужен увеличенный лимит тела запроса
    location /api/files/upload/ {
        set $backend http://web:7016;
        proxy_pass $backend;
        include /etc/nginx/conf.d/bft-proxy-headers.inc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }

    # gRPC-Web server-streaming (Updates, Onliner): send events immediately,
    # without buffering them in nginx.
    location ~ ^/barkfluff\.(updates|onliner)\. {
        set $backend http://web:7016;
        proxy_pass $backend;
        include /etc/nginx/conf.d/bft-proxy-headers.inc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }



    location / {
        set $backend http://web:7016;
        proxy_pass $backend;
        include /etc/nginx/conf.d/bft-proxy-headers.inc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
