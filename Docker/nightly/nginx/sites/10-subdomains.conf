# -------------------- developers --------------------
# developers.barkfluff.com - Developers SPA + API
server {
    listen 80;
    server_name developers.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name developers.barkfluff.com;

    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    limit_req_status 429;

    location /grpc/barkfluff.identity.IdentityApi/ {
        limit_req zone=identity_anon burst=20 nodelay;
        set $grpc_backend grpc://identity:7000;
        rewrite ^/grpc/(.*)$ /$1 break;
        grpc_pass $grpc_backend;
        include /etc/nginx/conf.d/bft-proxy-headers.inc;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $bft_client_ip;
        grpc_set_header X-Forwarded-For $bft_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }

    location /grpc/barkfluff.developers.DevelopersApi/ {
        set $backend http://developers:7020;
        rewrite ^/grpc/(.*)$ /$1 break;
        proxy_pass $backend;
        include /etc/nginx/conf.d/bft-proxy-headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/(ping(?:/|$)|health/) {
        set $backend http://developers:7020;
        proxy_pass $backend;
        include /etc/nginx/conf.d/bft-proxy-headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grpc/ {
        return 404;
    }

    location / {
        set $backend http://developers:7021;
        proxy_pass $backend;
        include /etc/nginx/conf.d/bft-proxy-headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

