# -------------------- storage --------------------
server {
    listen 443 ssl;
    http2 on;

    server_name storage.barkfluff.com;

    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;

