# HTTP-level maps and named upstreams used by the service virtual hosts.
server_names_hash_bucket_size 64;

# WebSocket upgrade (http-контекст; conf.d включается внутрь http{}).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gitnotifier_webhook {
    server gitnotifier:28111;
}

upstream barkfluff_clientstorage {
    server clientstorage:7050;
}

# -------------------- admin-panel --------------------
# panel.barkfluff.com - Admin Panel (HTTP)
server {
    listen 80;
    server_name panel.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    # WebSocket console uses the HTTP/1.1 Upgrade handshake.
    listen 443 ssl;
    server_name panel.barkfluff.com;
    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/remote/ {
        set $backend http://admin-panel:51888;
        proxy_pass $backend;
        include /etc/nginx/conf.d/bft-proxy-headers.inc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        set $backend http://admin-panel:51888;
        proxy_pass $backend;
        include /etc/nginx/conf.d/bft-proxy-headers.inc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

