        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }

    # HTTP web interface для скачивания/загрузки файлов
    location /web/ {
        set $http_backend http://files:7006;
        rewrite ^/web/(.*) /$1 break;
        proxy_pass $http_backend;
        include /etc/nginx/conf.d/bft-proxy-headers.inc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Для больших файлов
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_buffering off;

        # Таймауты для загрузки больших файлов (дефолт 60s — недостаточно)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }
}

# -------------------- files-media --------------------
# files2.barkfluff.com - Files Service HTTP (upload/download) в обход Cloudflare.
#
# files.barkfluff.com проксируется через Cloudflare, у которого жёсткий лимит 100 МБ
# на один файл. Этот субдомен направлен на origin напрямую (без Cloudflare), поэтому
# лимита нет — здесь публикуется только HTTP-часть Files (порт 7006), gRPC остаётся
# на files.barkfluff.com.
#
# Путь /web/ намеренно совпадает с files.barkfluff.com: сервис по-прежнему выдаёт
# ссылки вида https://files.barkfluff.com/web/download/{id}, а клиент, знающий этот
# субдомен (ExternalEndpoint:MediaHost -> Beacon), подменяет в них только хост.
# Клиенты, которые про files2 не знают, продолжают работать через старый адрес.
server {
    listen 80;
    server_name files2.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name files2.barkfluff.com;
    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /web/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        set $http_backend http://files:7006;
        rewrite ^/web/(.*) /$1 break;
        proxy_pass $http_backend;
        include /etc/nginx/conf.d/bft-proxy-headers.inc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bft_client_ip;
        proxy_set_header X-Forwarded-For $bft_forwarded_for_add;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Веб-клиент работает с другого origin (web.barkfluff.com), а Cloudflare,
        # который раньше был перед файловым хостом, здесь отсутствует — CORS-заголовок
        # ставит сам nginx. Ссылки и так capability-based (кто знает URL, тот и качает).
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Expose-Headers 'Retry-After' always;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }
}

