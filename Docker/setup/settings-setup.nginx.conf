# Settings setup console. Copy this file into the already running Nginx host
# (for example, /etc/nginx/conf.d/settings-setup.conf), then replace the
# hostname and certificate paths before running `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    server_name setup.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name setup.example.com;

    ssl_certificate /etc/letsencrypt/live/setup.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/setup.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:7032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
