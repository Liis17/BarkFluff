version: '3.8'

services:
  setup:
    image: docker.barkfluff.com/barkfluff-setup-master:latest
    container_name: barkfluff-setup
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SETUP_PORT:-7032}:7032"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      SETUP_PORT: "7032"
      SETTINGS_URL: "http://settings:7003"
      SETUP_PUBLIC_ORIGIN: "${SETUP_PUBLIC_ORIGIN:-}"
      SETUP_SECRET_FILE: "/run/secrets/setup_token"
    secrets:
      - setup_token
    networks:
      - barkfluff-network
    depends_on:
      settings:
        condition: service_started

  settings:
    image: docker.barkfluff.com/barkfluff-settings-master:latest
    container_name: settings
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      SETTINGS_HOST: "postgres"
      SETTINGS_DBPORT: "5432"
      SETTINGS_DATABASE: "settings"
      SETTINGS_ADMIN_DATABASE: "postgres"
      SETTINGS_USERNAME: "${POSTGRES_USER:-postgres}"
      SETTINGS_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      SETTINGS_PORT: "7003"
      SETTINGS_SETUP_MODE: "true"
      SETTINGS_SETUP_SECRET_FILE: "/run/secrets/setup_token"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}"
    secrets:
      - setup_token
    expose:
      - "7003"
    networks:
      - barkfluff-network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: postgres_barkfluff
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "postgres"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - barkfluff-network

secrets:
  setup_token:
    file: ./secrets/setup_token

networks:
  barkfluff-network:
    external: true
    name: barkfluff-network
