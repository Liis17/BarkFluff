events {
    worker_connections 1024;
}

http {
    # Увеличиваем лимит для загрузки больших слоев образов
    client_max_body_size 0;

    # cloudflared — единственный, кто достучится сюда (порт наружу не публикуется за пределы
    # docker-сети тунеля), поэтому $remote_addr тут его IP, а не клиента. Реальный IP приходит
    # в CF-Connecting-IP (Cloudflare ставит, cloudflared передаёт как есть) — восстанавливаем
    # $remote_addr отсюда, чтобы X-Real-IP ниже остался как есть.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    upstream docker-registry {
        server registry:5000;
    }

    server {
        # Без ssl: TLS терминирует край Cloudflare, cloudflared шлёт сюда голый HTTP.
        listen 5000;
        server_name docker.barkfluff.com;

        # Стримим большие слои потоком, не буферизуя на диск nginx'а.
        # Важно при S3 backend — registry сам стримит в S3, незачем держать копию у nginx.
        proxy_request_buffering off;
        proxy_http_version      1.1;
        chunked_transfer_encoding on;

        location / {
            # Самая важная часть: Разделение прав
            # Для всех методов КРОМЕ GET и HEAD требуем пароль
            limit_except GET HEAD {
                auth_basic "Registry Realm";
                auth_basic_user_file /auth/htpasswd;
            }

            proxy_pass http://docker-registry;

            # Заголовки для правильной работы Registry
            proxy_set_header  Host              $http_host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Между клиентом и краем Cloudflare всегда TLS — $scheme тут был бы "http" (голый порт).
            proxy_set_header  X-Forwarded-Proto https;

            # Таймауты подняты под push/pull больших слоёв через S3
            proxy_connect_timeout               60;
            proxy_send_timeout                  900;
            proxy_read_timeout                  900;
            send_timeout                        900;
        }
    }
}
