services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sites:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    restart: always
    networks:
      - barkfluff-network

networks:
  barkfluff-network:
    external: true
    name: barkfluff-network
