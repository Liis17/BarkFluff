syntax = "proto3";

option csharp_namespace = "BarkFluff.Proto.Updates";

import "google/protobuf/timestamp.proto";
import "shared.proto";

package barkfluff.updates;

service UpdatesApi {

  // Подписаться на новые сообщения
  rpc SubscribeNewMessages(SubscribeNewMessagesRequest) returns (stream NewMessageEvent);

  rpc SubscribeMessagesRead(SubscribeMessagesReadRequest) returns(stream MessageReadEvent);

  // Подписаться на события редактирования сообщений
  rpc SubscribeMessagesEdited(SubscribeMessagesEditedRequest) returns (stream MessageEditedEvent);

  // Подписаться на события удаления сообщений
  rpc SubscribeMessagesDeleted(SubscribeMessagesDeletedRequest) returns (stream MessageDeletedEvent);

  // Подписаться на события закрепления сообщений
  rpc SubscribeMessagesPinned(SubscribeMessagesPinnedRequest) returns (stream MessagePinnedEvent);

  // Подписаться на события открепления сообщений
  rpc SubscribeMessagesUnpinned(SubscribeMessagesUnpinnedRequest) returns (stream MessageUnpinnedEvent);

  // Подписаться на события открепления всех сообщений в чате
  rpc SubscribeAllMessagesUnpinned(SubscribeAllMessagesUnpinnedRequest) returns (stream AllMessagesUnpinnedEvent);

  // -- Приватные чаты (user-scoped: получают все устройства пользователя) -----

  // Новые сообщения в приватных чатах (шифротекст; расшифровка только клиентом со знанием passphrase)
  rpc SubscribePrivateMessages(SubscribePrivateMessagesRequest) returns (stream NewEncryptedMessageEvent);

  // Редактирование сообщений в приватных чатах
  rpc SubscribePrivateMessageEdits(SubscribePrivateMessageEditsRequest) returns (stream EncryptedMessageEditedEvent);

  // Удаление сообщений в приватных чатах
  rpc SubscribePrivateMessageDeletes(SubscribePrivateMessageDeletesRequest) returns (stream EncryptedMessageDeletedEvent);

  // Приглашения в приватные чаты (для приглашённого)
  rpc SubscribePrivateChatInvites(SubscribePrivateChatInvitesRequest) returns (stream PrivateChatInviteEvent);

  // Резолюция инвайта приватного чата (для отправителя инвайта)
  rpc SubscribePrivateChatInviteResolutions(SubscribePrivateChatInviteResolutionsRequest) returns (stream PrivateChatInviteResolutionEvent);

  // -- Секретные чаты (device-scoped: получает только конкретное устройство) --
  //
  // Подписки выполняются от имени устройства, определяемого по JWT текущей
  // gRPC-сессии. Сервер маршрутизирует события только в стрим того устройства,
  // которому адресован invite/message (recipient_device_id).

  // Приглашения в секретные чаты, адресованные текущему устройству
  rpc SubscribeSecretChatInvites(SubscribeSecretChatInvitesRequest) returns (stream SecretChatInviteEvent);

  // Резолюция инвайта секретного чата, отправленного текущим устройством (accept/reject от собеседника)
  rpc SubscribeSecretChatResolutions(SubscribeSecretChatResolutionsRequest) returns (stream SecretChatInviteResolutionEvent);

  // Секретные сообщения, адресованные текущему устройству
  rpc SubscribeSecretMessages(SubscribeSecretMessagesRequest) returns (stream NewSecretMessageEvent);
}

message SubscribeNewMessagesRequest {

}

message SubscribeMessagesReadRequest {

}

message SubscribeMessagesEditedRequest { }

message SubscribeMessagesDeletedRequest { }

message SubscribeMessagesPinnedRequest { }

message SubscribeMessagesUnpinnedRequest { }

message SubscribeAllMessagesUnpinnedRequest { }

message NewMessageEvent {
  barkfluff.shared.Message message = 1; //Отправленное сообщение
  
  string chat_id = 2; // Идентификатор чата на который пришло сообщение
}

message MessageReadEvent {
  string chat_id = 1; // Идентификатор чата
  int64 message_id = 2; // Идентификатор прочитанного сообщения
  repeated int64 new_read_by = 3; // Новый read_by сообщения (НЕ ТОЛЬКО НОВЫЕ, А ПОЛНОСТЬЮ ВСЕ, КТО ПРОЧИТАЛ)
}

message MessageEditedEvent {
  string chat_id = 1; // Идентификатор чата
  barkfluff.shared.Message message = 2; // Обновленное сообщение
}

message MessageDeletedEvent {
  string chat_id = 1; // Идентификатор чата
  int64 message_id = 2; // Идентификатор удаленного сообщения
}

message MessagePinnedEvent {
  string chat_id = 1; // Идентификатор чата
  int64 message_id = 2; // Идентификатор закреплённого сообщения
  int64 pinner_user_id = 3; // Кто закрепил
  google.protobuf.Timestamp pinned_at = 4; // Дата закрепления (UTC)
}

message MessageUnpinnedEvent {
  string chat_id = 1; // Идентификатор чата
  int64 message_id = 2; // Идентификатор откреплённого сообщения
}

message AllMessagesUnpinnedEvent {
  string chat_id = 1; // Идентификатор чата, где откреплены все сообщения
}

// -- Приватные чаты ----------------------------------------------------------

message SubscribePrivateMessagesRequest { }
message SubscribePrivateMessageEditsRequest { }
message SubscribePrivateMessageDeletesRequest { }
message SubscribePrivateChatInvitesRequest { }
message SubscribePrivateChatInviteResolutionsRequest { }

message NewEncryptedMessageEvent {
  string chat_id = 1;                                  // ID приватного чата
  barkfluff.shared.EncryptedMessage message = 2;       // Шифрованное сообщение
}

message EncryptedMessageEditedEvent {
  string chat_id = 1;                                  // ID приватного чата
  barkfluff.shared.EncryptedMessage message = 2;       // Обновлённое сообщение (с is_edited=true)
}

message EncryptedMessageDeletedEvent {
  string chat_id = 1;     // ID приватного чата
  int64 message_id = 2;   // ID удалённого шифрованного сообщения
}

message PrivateChatInviteEvent {
  string chat_id = 1;              // ID приватного чата
  int64 inviter_user_id = 2;       // Кто пригласил
  bytes kdf_salt = 3;              // Salt чата (для вычисления ключа на принимающей стороне)
  bytes passphrase_verifier = 4;   // Verifier для проверки passphrase до Accept
  google.protobuf.Timestamp invited_at = 5; // Когда отправлен инвайт
}

message PrivateChatInviteResolutionEvent {
  string chat_id = 1;          // ID приватного чата
  int64 invitee_user_id = 2;   // Приглашённый пользователь
  bool accepted = 3;           // true = принял, false = отклонил
}

// -- Секретные чаты ----------------------------------------------------------

message SubscribeSecretChatInvitesRequest { }
message SubscribeSecretChatResolutionsRequest { }
message SubscribeSecretMessagesRequest { }

message SecretChatInviteEvent {
  string invite_id = 1;                    // ID инвайта (для AcceptSecretChatInvite/RejectSecretChatInvite)
  int64 sender_user_id = 2;                // ID отправителя
  string sender_device_id = 3;             // ID устройства-отправителя (для libsignal-сессии и UI)
  bytes initial_envelope = 4;              // PreKeySignalMessage от отправителя (opaque)
  google.protobuf.Timestamp invited_at = 5; // Когда отправлен инвайт
  google.protobuf.Timestamp expires_at = 6; // Когда инвайт удалится из буфера (24ч)
}

message SecretChatInviteResolutionEvent {
  string invite_id = 1;            // ID инвайта (отправленного текущим устройством)
  int64 recipient_user_id = 2;     // Получатель, ответивший на инвайт
  string recipient_device_id = 3;  // Устройство получателя
  bool accepted = 4;               // true = принят, false = отклонён
  bytes response_envelope = 5;     // Опциональный ответный SignalMessage от получателя (если он включил его в Accept)
}

message NewSecretMessageEvent {
  barkfluff.shared.SecretEnvelope envelope = 1; // Опаковый envelope (libsignal SignalMessage)
}

