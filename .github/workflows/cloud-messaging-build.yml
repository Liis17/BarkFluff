name: 🐋 Сборка образа Barkfluff.CloudMessaging
on:
  push:
    branches:
      - dev
      - master
    paths:
      - 'Backend/Barkfluff.CloudMessaging/**'
      - 'Shared/BarkFluff.Shared.Queue/**'
      - 'Shared/BarkFluff.Shared.Exceptions/**'
      - 'Shared/BarkFluff.Shared.Auth/**'
      - 'Backend/BarkFluff.GrpcServer/**'
      - '.github/workflows/cloud-messaging-build.yml'
      - 'Backend/rebuild.trigger'
jobs:
  build-cloud-messaging:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set tags
        id: vars
        run: |
          if ("${{ github.ref_name }}" -eq "dev") {
            echo "tags=docker.barkfluff.com:5000/barkfluff-cloud-messaging-dev:latest,docker.barkfluff.com:5000/barkfluff-cloud-messaging-dev:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tags=docker.barkfluff.com:5000/barkfluff-cloud-messaging:latest,docker.barkfluff.com:5000/barkfluff-cloud-messaging:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/Barkfluff.CloudMessaging/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}
