name: Сборка и отправка в регистр Identity

on:
  push:
    branches:
      - master
    paths:
      - 'Backend/BarkFluff.Identity/**'
      - 'BarkFluff.Shared.Queue/**'
      - 'Shared/BarkFluff.Shared.Identity/**'
      - 'BarkFluff.Shared.Exceptions/**'
      - 'Backend/BarkFluff.GrpcServer/**'
      - '.github/workflows/identity-build-master.yml'

jobs:
  build-identity:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Identity/Dockerfile
          push: true
          tags: docker.barkfluff.com/barkfluff-identity:latest,docker.barkfluff.com/barkfluff-identity:${{ github.sha }}