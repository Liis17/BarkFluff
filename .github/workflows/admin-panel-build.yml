name: "🐋 Сборка образа Barkfluff.AdminPanel"
on:
  push:
    branches:
      - dev
      - master
    paths:
      - 'Backend/Barkfluff.AdminPanel/**'
      - '.github/workflows/admin-panel-build.yml'
      - 'Backend/rebuild.trigger'
jobs:
  build-admin-panel:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set tags
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -eq "dev") {
            echo "tags=docker.barkfluff.com:5000/barkfluff-admin-panel-dev:latest,docker.barkfluff.com:5000/barkfluff-admin-panel-dev:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tags=docker.barkfluff.com:5000/barkfluff-admin-panel:latest,docker.barkfluff.com:5000/barkfluff-admin-panel:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          }

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/Barkfluff.AdminPanel/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}
