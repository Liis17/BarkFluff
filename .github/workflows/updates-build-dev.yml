name: Сборка и отправка в регистр Updates

on:
  push:
    branches:
      - dev
    paths:
      - 'Backend/BarkFluff.Updates/**'
      - 'BarkFluff.Shared.Queue/**'
      - 'Backend/BarkFluff.GrpcServer/**'
      - '.github/workflows/updates-build-dev.yml'

jobs:
  build-updates:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Updates/Dockerfile
          push: true
          tags: docker.barkfluff.com/barkfluff-updates-dev:latest,docker.barkfluff.com/barkfluff-updates-dev:${{ github.sha }}