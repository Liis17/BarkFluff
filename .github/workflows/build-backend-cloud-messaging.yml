name: "🚀 Barkfluff.CloudMessaging CI/CD"

on:
  push:
    branches:
      - dev
      - master
      - nightly
    paths:
      - 'Backend/Barkfluff.CloudMessaging/**'
      - '.github/actions/docker-version/**'
      - 'Backend/rebuild.trigger'
      - '.github/workflows/build-backend-cloud-messaging.yml'
      - '.github/scripts/send-telegram.sh'
      - 'global.json'
      - '.dockerignore'
      - 'Shared/**'
      - 'Backend/BarkFluff.GrpcServer/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  2. dotnet publish → Docker build → Push
  # ═══════════════════════════════════════════════════════════════
  build:
    name: "🐳 Сборка и публикация Barkfluff.CloudMessaging"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: "\u2699\uFE0F dotnet publish (Linux Release)"
        run: |
          dotnet publish Backend/Barkfluff.CloudMessaging/Barkfluff.CloudMessaging.csproj \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false
          mkdir -p ./publish/logs

      - name: Login to Private Registry
        uses: docker/login-action@v4
        with:
          registry: docker.barkfluff.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute version
        id: vars
        uses: ./.github/actions/docker-version
        with:
          image: barkfluff-cloud-messaging
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Backend/Barkfluff.CloudMessaging/Dockerfile.slim
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      - name: "\u2705 Уведомление об успехе"
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            🐳 *Barkfluff.CloudMessaging*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.vars.outputs.tag_version }}`
        run: |
          bash .github/scripts/send-telegram.sh

      - name: "\u274C Уведомление об ошибке"
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            🐳 *Barkfluff.CloudMessaging*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          bash .github/scripts/send-telegram.sh
