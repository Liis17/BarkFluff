name: "🚀 Barkfluff.CloudMessaging CI/CD"

on:
  push:
    branches:
      - dev
      - master
    paths:
      - 'Backend/Barkfluff.CloudMessaging/**'
      - 'Backend/BarkFluff.GrpcServer/**'
      - 'Shared/BarkFluff.Shared.Queue/**'
      - 'Shared/BarkFluff.Shared.Exceptions/**'
      - 'Shared/BarkFluff.Shared.Auth/**'
      - 'Backend/rebuild.trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  1. Проверка наличия .NET 10.0 SDK на раннере
  # ═══════════════════════════════════════════════════════════════
  check-dotnet:
    name: "🔍 Проверка .NET 10.0 SDK"
    runs-on: self-hosted
    steps:
      - name: "Проверка наличия .NET 10.0 SDK"
        id: check
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q "^10\."; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "\u274C .NET 10.0 SDK не установлен — уведомление в Telegram"
        if: steps.check.outputs.missing == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ❌ *Сборка невозможна: .NET 10.0 SDK не установлен на раннере*

            🐳 *Barkfluff.CloudMessaging*
            📌 Ветка: `${{ github.ref_name }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"
          exit 1

  # ═══════════════════════════════════════════════════════════════
  #  2. Запрос подтверждения сборки через Telegram
  # ═══════════════════════════════════════════════════════════════
  request-approval:
    name: "📲 Запрос подтверждения"
    needs: check-dotnet
    runs-on: self-hosted
    outputs:
      approved: ${{ steps.result.outputs.approved }}
    steps:
      - name: "\U0001F4F2 Собрать Barkfluff.CloudMessaging?"
        id: approval
        continue-on-error: true
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "Запустить сборку Barkfluff.CloudMessaging?"
          APPROVAL_BUTTON: "\u2705 Собрать"
          REJECT_BUTTON: "\u274C Отменить"
          APPROVED_TEXT: "\u2705 Сборка Barkfluff.CloudMessaging одобрена"
          REJECTED_TEXT: "\u274C Сборка Barkfluff.CloudMessaging отклонена"
          TIMEOUT_TEXT: "\u23F0 Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Результат
        id: result
        run: |
          if [ "${{ steps.approval.outcome }}" = "success" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

  # ═══════════════════════════════════════════════════════════════
  #  3. dotnet publish → Docker build → Push
  # ═══════════════════════════════════════════════════════════════
  build:
    name: "🐳 Сборка и публикация Barkfluff.CloudMessaging"
    needs: [check-dotnet, request-approval]
    if: needs.request-approval.outputs.approved == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: "\u2699\uFE0F dotnet publish (Linux Release)"
        run: |
          dotnet publish Backend/Barkfluff.CloudMessaging/Barkfluff.CloudMessaging.csproj \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false
          mkdir -p ./publish/logs

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set tags
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "tags=docker.barkfluff.com:5000/barkfluff-cloud-messaging-dev:latest,docker.barkfluff.com:5000/barkfluff-cloud-messaging-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tag_sha=docker.barkfluff.com:5000/barkfluff-cloud-messaging-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=docker.barkfluff.com:5000/barkfluff-cloud-messaging:latest,docker.barkfluff.com:5000/barkfluff-cloud-messaging:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tag_sha=docker.barkfluff.com:5000/barkfluff-cloud-messaging:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/Barkfluff.CloudMessaging/Dockerfile.slim
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: "\u2705 Уведомление об успехе"
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            🐳 *Barkfluff.CloudMessaging*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.vars.outputs.tag_sha }}`
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

      - name: "\u274C Уведомление об ошибке"
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            🐳 *Barkfluff.CloudMessaging*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"
