name: Script tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: CI helper tests
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'
      - name: Web and AdminPanel JavaScript tests
        run: |
          for test in Backend/BarkFluff.Web/scripts/test-*.js Tests/BarkFluff.AdminPanel.Tests/Frontend/test-*.js; do
            node "$test"
          done
