name: "🚀 Barkfluff.Developers CI/CD"

on:
  push:
    branches:
      - dev
      - master
      - nightly
    paths:
      - 'Backend/Barkfluff.Developers/**'
      - 'Frontend/Developers/**'
      - 'Tests/BarkFluff.Developers.Tests/**'
      - '.github/actions/docker-version/**'
      - 'Backend/rebuild.trigger'
      - '.github/workflows/build-backend-developers.yml'
      - '.github/scripts/send-telegram.sh'
      - '.github/scripts/push-docker-image.sh'
      - 'global.json'
      - '.dockerignore'
      - 'Shared/**'
      - 'Backend/BarkFluff.GrpcServer/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  2. dotnet publish → Docker build → Push
  # ═══════════════════════════════════════════════════════════════
  build:
    name: "🐳 Сборка и публикация Barkfluff.Developers"
    runs-on: ubuntu-latest
    env:
      DEVELOPERS_TEST_POSTGRES: Host=localhost;Port=5432;Database=developers_test;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: developers_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: "🧪 Тесты Barkfluff.Developers"
        run: dotnet test Tests/BarkFluff.Developers.Tests/BarkFluff.Developers.Tests.csproj -c Release --verbosity normal

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/Developers/package-lock.json

      - name: "🔄 Сборка Developers frontend с актуальными контрактами"
        working-directory: Frontend/Developers
        run: |
          npm ci
          npm run build

      - name: "\u2699\uFE0F dotnet publish (Linux Release)"
        run: |
          dotnet publish Backend/Barkfluff.Developers/Barkfluff.Developers.csproj \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false
          mkdir -p ./publish/logs


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute version
        id: vars
        uses: ./.github/actions/docker-version
        with:
          image: barkfluff-developers
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Backend/Barkfluff.Developers/Dockerfile.slim
          load: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: org.opencontainers.image.version=${{ steps.vars.outputs.version }}
      - name: "📤 Отправка в реестр (пауза 105 с, 3 повтора)"
        env:
          PUSH_DELAY: 105
          TAGS: ${{ steps.vars.outputs.tags }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: bash .github/scripts/push-docker-image.sh

      - name: "\u2705 Уведомление об успехе"
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            🐳 *Barkfluff.Developers*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.vars.outputs.tag_version }}`
        run: |
          bash .github/scripts/send-telegram.sh

      - name: "\u274C Уведомление об ошибке"
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            🐳 *Barkfluff.Developers*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          bash .github/scripts/send-telegram.sh
