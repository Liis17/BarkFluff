name: "🚀 Barkfluff.Developers CI/CD"

on:
  push:
    branches:
      - dev
      - master
      - nightly
    paths:
      - 'Backend/Barkfluff.Developers/**'
      - 'Frontend/Developers/**'
      - 'Shared/BarkFluff.Proto/**'
      - 'Shared/BarkFluff.Shared.Exceptions/**'
      - 'Tests/BarkFluff.Developers.Tests/**'
      - 'Backend/rebuild.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  2. dotnet publish → Docker build → Push
  # ═══════════════════════════════════════════════════════════════
  build:
    name: "🐳 Сборка и публикация Barkfluff.Developers"
    runs-on: ubuntu-latest
    env:
      DEVELOPERS_TEST_POSTGRES: Host=localhost;Port=5432;Database=developers_test;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: developers_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: "🧪 Тесты Barkfluff.Developers"
        run: dotnet test Tests/BarkFluff.Developers.Tests/BarkFluff.Developers.Tests.csproj -c Release --verbosity normal

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/Developers/package-lock.json

      - name: "🔄 Проверка и генерация frontend-контрактов"
        working-directory: Frontend/Developers
        run: |
          npm ci
          npm run sync-proto:check
          npm run generate
          git -C ../.. diff --exit-code -- Frontend/Developers/proto Frontend/Developers/src/gen
          npm run build

      - name: "\u2699\uFE0F dotnet publish (Linux Release)"
        run: |
          dotnet publish Backend/Barkfluff.Developers/Barkfluff.Developers.csproj \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false
          mkdir -p ./publish/logs

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Compute version
        id: vars
        uses: ./.github/actions/docker-version
        with:
          image: barkfluff-developers
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/Barkfluff.Developers/Dockerfile.slim
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: "\u2705 Уведомление об успехе"
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            🐳 *Barkfluff.Developers*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.vars.outputs.tag_version }}`
        run: |
          bash .github/scripts/send-telegram.sh

      - name: "\u274C Уведомление об ошибке"
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            🐳 *Barkfluff.Developers*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          bash .github/scripts/send-telegram.sh
