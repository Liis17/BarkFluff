name: "🚀 BarkFluff.Setup CI/CD"

on:
  push:
    branches: [dev, master, nightly]
    paths:
      - 'Backend/BarkFluff.Setup/**'
      - 'Shared/BarkFluff.Proto/settings_setup_api.proto'
      - 'Backend/rebuild.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "🐳 Сборка и публикация BarkFluff.Setup"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: "🧪 Tests"
        run: dotnet test Tests/BarkFluff.Setup.Tests/BarkFluff.Setup.Tests.csproj -c Release
      - name: "⚙️ dotnet publish (Linux Release)"
        run: dotnet publish Backend/BarkFluff.Setup/BarkFluff.Setup.csproj -c Release -o ./publish /p:UseAppHost=false
      - name: "⏳ Задержка 255 с перед обращением к реестру"
        run: sleep 255

      - name: Login to Private Registry
        uses: ./.github/actions/docker-login-retry
        with:
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Compute version
        id: vars
        uses: ./.github/actions/docker-version
        with:
          image: barkfluff-setup
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and Push Docker image
        uses: ./.github/actions/docker-push-retry
        with:
          file: ./Backend/BarkFluff.Setup/Dockerfile.slim
          tags: ${{ steps.vars.outputs.tags }}
