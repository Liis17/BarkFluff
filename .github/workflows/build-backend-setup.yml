name: "🚀 BarkFluff.Setup CI/CD"

on:
  push:
    branches: [dev, master, nightly]
    paths:
      - 'Backend/BarkFluff.Setup/**'
      - '.github/actions/docker-version/**'
      - 'Backend/rebuild.trigger'
      - '.github/workflows/build-backend-setup.yml'
      - '.github/scripts/send-telegram.sh'
      - '.github/scripts/push-docker-image.sh'
      - 'global.json'
      - '.dockerignore'
      - 'Shared/**'
      - 'Tests/BarkFluff.Setup.Tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: "🐳 Сборка и публикация BarkFluff.Setup"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: "🧪 Tests"
        run: dotnet test Tests/BarkFluff.Setup.Tests/BarkFluff.Setup.Tests.csproj -c Release
      - name: "⚙️ dotnet publish (Linux Release)"
        run: dotnet publish Backend/BarkFluff.Setup/BarkFluff.Setup.csproj -c Release -o ./publish /p:UseAppHost=false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Compute version
        id: vars
        uses: ./.github/actions/docker-version
        with:
          image: barkfluff-setup
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: "📤 Сборка образа и отправка в реестр (пауза 255 с, 3 повтора)"
        env:
          PUSH_DELAY: 255
          DOCKERFILE: ./Backend/BarkFluff.Setup/Dockerfile.slim
          VERSION: ${{ steps.vars.outputs.version }}
          TAGS: ${{ steps.vars.outputs.tags }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: bash .github/scripts/push-docker-image.sh

      - name: "\u2705 Уведомление об успехе"
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            🐳 *BarkFluff.Setup*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.vars.outputs.tag_version }}`
        run: |
          bash .github/scripts/send-telegram.sh

      - name: "\u274C Уведомление об ошибке"
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            🐳 *BarkFluff.Setup*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          bash .github/scripts/send-telegram.sh
