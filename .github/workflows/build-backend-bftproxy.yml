name: "🚀 BarkFluff.BftProxy CI/CD"

on:
  push:
    branches:
      - dev
      - master
      - nightly
    paths:
      - 'Backend/BarkFluff.BftProxy/**'
      - 'Shared/BarkFluff.Bft/**'
      - 'Tests/BarkFluff.Bft.Tests/**'
      - 'Tests/BarkFluff.BftProxy.Tests/**'
      - 'Docs/BFTv1.md'
      - 'Docs/bft/**'
      - '.github/actions/docker-version/**'
      - 'Backend/rebuild.trigger'
      - '.github/workflows/build-backend-bftproxy.yml'
      - '.github/workflows/test-backend.yml'
      - '.github/workflows/test-scripts.yml'
      - '.github/scripts/send-telegram.sh'
      - '.github/scripts/push-docker-image.sh'
      - '.github/tests/**'
      - 'global.json'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  scripts:
    uses: ./.github/workflows/test-scripts.yml

  tests:
    uses: ./.github/workflows/test-backend.yml
    with:
      project: BarkFluff.Bft.Tests,BarkFluff.BftProxy.Tests

  build:
    needs: [tests, scripts]
    name: "🐳 Сборка и публикация BarkFluff.BftProxy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: "⚙️ dotnet publish (Linux Release)"
        run: |
          dotnet publish Backend/BarkFluff.BftProxy/BarkFluff.BftProxy.csproj \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute version
        id: vars
        uses: ./.github/actions/docker-version
        with:
          image: barkfluff-bftproxy
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: "📤 Сборка образа и отправка в реестр"
        env:
          PUSH_DELAY: 60
          DOCKERFILE: ./Backend/BarkFluff.BftProxy/Dockerfile
          VERSION: ${{ steps.vars.outputs.version }}
          TAGS: ${{ steps.vars.outputs.tags }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: bash .github/scripts/push-docker-image.sh

      - name: "✅ Уведомление об успехе"
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            🐳 *BarkFluff.BftProxy*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.vars.outputs.tag_version }}`
        run: bash .github/scripts/send-telegram.sh

      - name: "❌ Уведомление об ошибке"
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            🐳 *BarkFluff.BftProxy*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: bash .github/scripts/send-telegram.sh
