name: "🚀 BarkFluff.Web CI/CD"

on:
  push:
    branches:
      - dev
      - master
      - nightly
    paths:
      - 'Backend/BarkFluff.Web/**'
      - 'Icons/**'
      - 'Backend/rebuild.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  3. dotnet publish → Docker build (Node/proto в Docker, .NET на раннере) → Push
  # ═══════════════════════════════════════════════════════════════
  build:
    name: "🐋 Сборка и публикация BarkFluff.Web"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: "\U0001F9F9 Проверка JavaScript"
        run: |
          npm --prefix Backend/BarkFluff.Web/scripts install --no-package-lock --ignore-scripts
          npm --prefix Backend/BarkFluff.Web/scripts run lint
          npm --prefix Backend/BarkFluff.Web/scripts run format:check

      - name: "⚙️ dotnet publish (Linux Release)"
        run: |
          dotnet publish Backend/BarkFluff.Web/BarkFluff.Web.csproj \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Compute version
        id: vars
        uses: ./.github/actions/docker-version
        with:
          image: barkfluff-web
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Web/Dockerfile.slim
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: "✅ Уведомление об успехе"
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            🐋 *BarkFluff.Web*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.vars.outputs.tag_version }}`
        run: |
          bash .github/scripts/send-telegram.sh

      - name: "❌ Уведомление об ошибке"
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            🐋 *BarkFluff.Web*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          bash .github/scripts/send-telegram.sh
