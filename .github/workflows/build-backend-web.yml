name: "🚀 BarkFluff.Web CI/CD"

on:
  push:
    branches:
      - dev
      - master
      - nightly
    paths:
      - 'Backend/BarkFluff.Web/**'
      - 'Icons/**'
      - '.github/actions/docker-version/**'
      - 'Backend/rebuild.trigger'
      - '.github/workflows/build-backend-web.yml'
      - '.github/scripts/send-telegram.sh'
      - '.github/scripts/push-docker-image.sh'
      - 'global.json'
      - '.dockerignore'
      - 'Shared/**'
      - 'Backend/BarkFluff.GrpcServer/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  3. dotnet publish → Docker build (Node/proto в Docker, .NET на раннере) → Push
  # ═══════════════════════════════════════════════════════════════
  build:
    name: "🐋 Сборка и публикация BarkFluff.Web"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: "\U0001F9F9 Проверка JavaScript"
        run: |
          npm --prefix Backend/BarkFluff.Web/scripts install --no-package-lock --ignore-scripts
          npm --prefix Backend/BarkFluff.Web/scripts run lint
          npm --prefix Backend/BarkFluff.Web/scripts run format:check

      - name: "⚙️ dotnet publish (Linux Release)"
        run: |
          dotnet publish Backend/BarkFluff.Web/BarkFluff.Web.csproj \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute version
        id: vars
        uses: ./.github/actions/docker-version
        with:
          image: barkfluff-web
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Backend/BarkFluff.Web/Dockerfile.slim
          load: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: org.opencontainers.image.version=${{ steps.vars.outputs.version }}
      - name: "📤 Отправка в реестр (пауза 300 с, 3 повтора)"
        env:
          PUSH_DELAY: 300
          TAGS: ${{ steps.vars.outputs.tags }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: bash .github/scripts/push-docker-image.sh

      - name: "✅ Уведомление об успехе"
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            🐋 *BarkFluff.Web*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.vars.outputs.tag_version }}`
        run: |
          bash .github/scripts/send-telegram.sh

      - name: "❌ Уведомление об ошибке"
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            🐋 *BarkFluff.Web*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          bash .github/scripts/send-telegram.sh
