name: Сборка и отправка в регистр FastAuth

on:
  push:
    branches:
      - master
    paths:
      - 'Backend/BarkFluff.FastAuth/**'
      - 'Backend/BarkFluff.Identity/**'
      - 'Backend/BarkFluff.GrpcServer/**'
      - '.github/workflows/fast-auth-build-master.yml'

jobs:
  build-fast-auth:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.FastAuth/Dockerfile
          push: true
          tags: docker.barkfluff.com/barkfluff-fast-auth:latest,docker.barkfluff.com/barkfluff-fast-auth:${{ github.sha }}