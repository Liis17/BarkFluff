name: "📦 WPF Client CI/CD"

on:
  push:
    branches:
      - dev
      - master
    paths:
      - 'Windows/BarkFluff.Client.WPF/**'
      - 'Windows/BarkFluff.WebApi.Core/**'
      - 'Windows/client-rebuild.trigger'
      - 'Shared/BarkFluff.Shared.Exceptions/**'
      - 'Shared/BarkFluff.Shared.Auth/**'
      - 'Shared/BarkFluff.Shared.SecurityUtilities/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  1. Проверка наличия .NET 10.0 SDK на раннере
  # ═══════════════════════════════════════════════════════════════
  check-dotnet:
    name: "🔍 Проверка .NET 10.0 SDK"
    runs-on: [self-hosted, linux]
    steps:
      - name: "Проверка наличия .NET 10.0 SDK"
        id: check
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q "^10\."; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "❌ .NET 10.0 SDK не установлен — уведомление в Telegram"
        if: steps.check.outputs.missing == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ❌ *Сборка невозможна: .NET 10.0 SDK не установлен на раннере*

            📦 *WPF Client*
            📌 Ветка: `${{ github.ref_name }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"
          exit 1

  # ═══════════════════════════════════════════════════════════════
  #  2. Запрос подтверждения сборки через Telegram
  # ═══════════════════════════════════════════════════════════════
  request-approval:
    name: "📲 Запрос подтверждения"
    needs: check-dotnet
    runs-on: [self-hosted, linux]
    outputs:
      approved: ${{ steps.result.outputs.approved }}
    steps:
      - name: "📲 Собрать WPF Client?"
        id: approval
        continue-on-error: true
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "Запустить сборку WPF Client?"
          APPROVAL_BUTTON: "\u2705 Собрать"
          REJECT_BUTTON: "\u274C Отменить"
          APPROVED_TEXT: "\u2705 Сборка WPF Client одобрена"
          REJECTED_TEXT: "\u274C Сборка WPF Client отклонена"
          TIMEOUT_TEXT: "\u23F0 Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Результат
        id: result
        run: |
          if [ "${{ steps.approval.outcome }}" = "success" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

  # ═══════════════════════════════════════════════════════════════
  #  3. Сборка + публикация WPF Client
  # ═══════════════════════════════════════════════════════════════
  build:
    name: "📦 Сборка и публикация WPF Client"
    needs: [check-dotnet, request-approval]
    if: needs.request-approval.outputs.approved == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Автоподнятие версии
        id: bump
        run: |
          VERSION_FILE="Windows/BarkFluff.Client.WPF/Services/App/AppVersion.cs"

          RESPONSE=$(curl -sf "https://storage.barkfluff.com/get/barkfluffwindows/beta/version" || echo "")

          if [ -n "$RESPONSE" ]; then
            SERVER_VERSION=$(echo "$RESPONSE" | grep -oP '"version"\s*:\s*"\K[^"]+')
          fi

          if [ -z "$SERVER_VERSION" ]; then
            SERVER_VERSION=$(grep -oP 'Version\s*\{\s*get;\s*set;\s*\}\s*=\s*"\K[^"]+' "$VERSION_FILE" || echo "0.0.0.0")
          fi

          # Стрипаем любой нечисловой суффикс (например " beta")
          SERVER_VERSION=$(echo "$SERVER_VERSION" | grep -oP '^\d+(\.\d+){0,3}' | head -1)
          [ -z "$SERVER_VERSION" ] && SERVER_VERSION="0.0.0.0"

          # Нормализация до четырёх частей
          DOTS=$(echo "$SERVER_VERSION" | tr -cd '.' | wc -c | tr -d ' ')
          if [ "$DOTS" = "0" ]; then SERVER_VERSION="${SERVER_VERSION}.0.0.0"; fi
          if [ "$DOTS" = "1" ]; then SERVER_VERSION="${SERVER_VERSION}.0.0"; fi
          if [ "$DOTS" = "2" ]; then SERVER_VERSION="${SERVER_VERSION}.0"; fi

          echo "Server version: $SERVER_VERSION"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            MAJOR=$(echo "$SERVER_VERSION" | cut -d. -f1)
            MINOR=$(echo "$SERVER_VERSION" | cut -d. -f2)
            PATCH=$(echo "$SERVER_VERSION" | cut -d. -f3)
            BUILD=$(echo "$SERVER_VERSION" | cut -d. -f4)
            BUILD=$((BUILD + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
          else
            NEW_VERSION="$SERVER_VERSION"
          fi

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          sed -i -E "s/(public static string Version \{ get; set; \} = \")[^\"]+(\";)/\1${NEW_VERSION}\2/" "$VERSION_FILE"

      - name: Restore dependencies
        env:
          EnableWindowsTargeting: true
        run: dotnet restore Windows/BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj

      - name: Build
        env:
          EnableWindowsTargeting: true
        run: dotnet build Windows/BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj --no-restore --configuration Release

      - name: Publish
        env:
          EnableWindowsTargeting: true
        run: dotnet publish Windows/BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj --configuration Release --runtime win-x64 --self-contained true --output ./publish

      - name: Zip build
        uses: vimtor/action-zip@v1
        with:
          files: publish/
          dest: wpf-build.zip

      - name: Get tag
        id: meta
        run: |
          echo "version=${{ steps.bump.outputs.version }}" >> "$GITHUB_OUTPUT"

          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          RANDOM_NUM=$((RANDOM % 9000 + 1000))
          TAG="${{ github.ref_name }}-${TIMESTAMP}-${COMMIT_HASH}-${RANDOM_NUM}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: "🚀 Создать релиз"
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.OWNER_RELEASE_REPO }}/${{ secrets.RELEASE_REPO_NAME }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "BarkFluff WPF Client v${{ steps.meta.outputs.version }}"
          body: |
            ## 📦 BarkFluff WPF Client

            **Версия:** `${{ steps.meta.outputs.version }}`
            **Ветка:** `${{ github.ref_name }}`
            **Коммит:** `${{ github.sha }}`
            **Автор:** ${{ github.actor }}
          draft: false
          prerelease: false
          files: wpf-build.zip

      - name: "📤 Загрузка на сервер обновлений"
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            CHANNEL="beta"
          else
            CHANNEL="release"
          fi
          curl -f -X POST "${{ secrets.CLIENT_STORAGE_URL }}/set/barkfluffwindows/${CHANNEL}" \
            -H "Authorization: Bearer ${{ secrets.CLIENT_STORAGE_TOKEN }}" \
            -H "X-App-Version: ${{ steps.meta.outputs.version }}" \
            -F "file=@wpf-build.zip"

      - name: "✅ Уведомление об успехе"
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            📦 *WPF Client* v${{ steps.meta.outputs.version }}
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.meta.outputs.tag }}`

            [Скачать релиз](https://github.com/${{ secrets.OWNER_RELEASE_REPO }}/${{ secrets.RELEASE_REPO_NAME }}/releases/tag/${{ steps.meta.outputs.tag }})
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

      - name: "❌ Уведомление об ошибке"
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            📦 *WPF Client*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"
