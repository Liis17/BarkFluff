  # --- Updates ---
  build-updates:
    name: "\U0001F433 Updates"
    needs: detect-changes
    if: needs.detect-changes.outputs.updates == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: "\U0001F4F2 Запрос подтверждения сборки"
