      # --- Updates ---
      - name: "\U0001F4F2 Updates"
        if: needs.detect-changes.outputs.updates == 'true'
        id: approval-updates
        continue-on-error: true
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "Запустить сборку BarkFluff.Updates?"
          APPROVAL_BUTTON: "\u2705 Собрать"
          REJECT_BUTTON: "\u274C Отменить"
          APPROVED_TEXT: "\u2705 Сборка Updates одобрена"
          REJECTED_TEXT: "\u274C Сборка Updates отклонена"
          TIMEOUT_TEXT: "\u23F0 Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Результат Updates
        if: needs.detect-changes.outputs.updates == 'true'
        id: result-updates
        run: |
          if [ "${{ steps.approval-updates.outcome }}" = "success" ]; then
