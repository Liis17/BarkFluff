        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *Сборка провалена*

            🐋 *BarkFluff\.Users*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*

            [Открыть workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # --- Messages ---
  build-messages:
    name: "\U0001F433 Messages"
    needs: detect-changes
    if: needs.detect-changes.outputs.messages == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: "\U0001F4F2 Запрос подтверждения сборки"
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "🐋 *BarkFluff\\.Messages*\n\nВетка: `${{ github.ref_name }}`\nКоммит: `${{ github.sha }}`\nАвтор: *${{ github.actor }}*\n\nЗапустить сборку?"
          APPROVAL_BUTTON: "✅ Собрать"
          REJECT_BUTTON: "❌ Отменить"
          APPROVED_TEXT: "✅ Сборка Messages одобрена"
          REJECTED_TEXT: "❌ Сборка Messages отклонена"
          TIMEOUT_TEXT: "⏰ Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set tags
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -eq "dev") {
            echo "tags=docker.barkfluff.com:5000/barkfluff-messages-dev:latest,docker.barkfluff.com:5000/barkfluff-messages-dev:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tags=docker.barkfluff.com:5000/barkfluff-messages:latest,docker.barkfluff.com:5000/barkfluff-messages:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          }

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Messages/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: "\U00002705 Уведомление об успехе"
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *Сборка успешна*

            🐋 *BarkFluff\.Messages*
