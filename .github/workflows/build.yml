name: "\U0001F680 BarkFluff CI/CD"

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  Определение изменений
  # ═══════════════════════════════════════════════════════════════
  detect-changes:
    name: "\U0001F50D Определение изменений"
    runs-on: self-hosted
    outputs:
      identity: ${{ steps.changes.outputs.identity }}
      users: ${{ steps.changes.outputs.users }}
      messages: ${{ steps.changes.outputs.messages }}
      files: ${{ steps.changes.outputs.files }}
      updates: ${{ steps.changes.outputs.updates }}
      notification: ${{ steps.changes.outputs.notification }}
      configuration: ${{ steps.changes.outputs.configuration }}
      beacon: ${{ steps.changes.outputs.beacon }}
      fast-auth: ${{ steps.changes.outputs.fast-auth }}
      navigator: ${{ steps.changes.outputs.navigator }}
      onliner: ${{ steps.changes.outputs.onliner }}
      cloud-messaging: ${{ steps.changes.outputs.cloud-messaging }}
      admin-panel: ${{ steps.changes.outputs.admin-panel }}
      client-storage: ${{ steps.changes.outputs.client-storage }}
      wpf-client: ${{ steps.changes.outputs.wpf-client }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Определение изменённых файлов
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff-tree --no-commit-id --name-only -r HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          has_match() {
            echo "$CHANGED" | grep -q "$1" && echo "true" || echo "false"
          }

          BACKEND_REBUILD=$(has_match "Backend/rebuild.trigger")
          GRPC_SERVER=$(has_match "Backend/BarkFluff.GrpcServer/")
          SHARED_QUEUE=$(has_match "Shared/BarkFluff.Shared.Queue/")
          SHARED_IDENTITY=$(has_match "Shared/BarkFluff.Shared.Identity/")
          SHARED_EXCEPTIONS=$(has_match "Shared/BarkFluff.Shared.Exceptions/")
          SHARED_AUTH=$(has_match "Shared/BarkFluff.Shared.Auth/")
          SHARED_SECURITY=$(has_match "Shared/BarkFluff.Shared.SecurityUtilities/")
          IDENTITY_CHANGED=$(has_match "Backend/BarkFluff.Identity/")

          is_true() {
            for v in "$@"; do [ "$v" = "true" ] && return 0; done
            return 1
          }

          # Identity
          if is_true "$(has_match 'Backend/BarkFluff.Identity/')" "$SHARED_QUEUE" "$SHARED_IDENTITY" "$SHARED_EXCEPTIONS" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "identity=true" >> "$GITHUB_OUTPUT"
          else
            echo "identity=false" >> "$GITHUB_OUTPUT"
          fi

          # Users
          if is_true "$(has_match 'Backend/BarkFluff.Users/')" "$SHARED_QUEUE" "$SHARED_EXCEPTIONS" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "users=true" >> "$GITHUB_OUTPUT"
          else
            echo "users=false" >> "$GITHUB_OUTPUT"
          fi

          # Messages
          if is_true "$(has_match 'Backend/BarkFluff.Messages/')" "$SHARED_QUEUE" "$SHARED_AUTH" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "messages=true" >> "$GITHUB_OUTPUT"
          else
            echo "messages=false" >> "$GITHUB_OUTPUT"
          fi

          # Files
          if is_true "$(has_match 'Backend/BarkFluff.Files/')" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "files=true" >> "$GITHUB_OUTPUT"
          else
            echo "files=false" >> "$GITHUB_OUTPUT"
          fi

          # Updates
          if is_true "$(has_match 'Backend/BarkFluff.Updates/')" "$SHARED_QUEUE" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "updates=false" >> "$GITHUB_OUTPUT"
          fi

          # Notification
          if is_true "$(has_match 'Backend/BarkFluff.Notification/')" "$SHARED_QUEUE" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "notification=true" >> "$GITHUB_OUTPUT"
          else
            echo "notification=false" >> "$GITHUB_OUTPUT"
          fi

          # Configuration
          if is_true "$(has_match 'Backend/BarkFluff.Configuration/')" "$IDENTITY_CHANGED" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "configuration=true" >> "$GITHUB_OUTPUT"
          else
            echo "configuration=false" >> "$GITHUB_OUTPUT"
          fi

          # Beacon
          if is_true "$(has_match 'Backend/BarkFluff.Beacon/')" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "beacon=true" >> "$GITHUB_OUTPUT"
          else
            echo "beacon=false" >> "$GITHUB_OUTPUT"
          fi

          # FastAuth
          if is_true "$(has_match 'Backend/BarkFluff.FastAuth/')" "$IDENTITY_CHANGED" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "fast-auth=true" >> "$GITHUB_OUTPUT"
          else
            echo "fast-auth=false" >> "$GITHUB_OUTPUT"
          fi

          # Navigator
          if is_true "$(has_match 'Backend/BarkFluff.Navigator/')" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "navigator=true" >> "$GITHUB_OUTPUT"
          else
            echo "navigator=false" >> "$GITHUB_OUTPUT"
          fi

          # Onliner
          if is_true "$(has_match 'Backend/BarkFluff.Onliner/')" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "onliner=true" >> "$GITHUB_OUTPUT"
          else
            echo "onliner=false" >> "$GITHUB_OUTPUT"
          fi

          # CloudMessaging
          if is_true "$(has_match 'Backend/Barkfluff.CloudMessaging/')" "$SHARED_QUEUE" "$SHARED_EXCEPTIONS" "$SHARED_AUTH" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "cloud-messaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloud-messaging=false" >> "$GITHUB_OUTPUT"
          fi

          # AdminPanel
          if is_true "$(has_match 'Backend/Barkfluff.AdminPanel/')" "$BACKEND_REBUILD"; then
            echo "admin-panel=true" >> "$GITHUB_OUTPUT"
          else
            echo "admin-panel=false" >> "$GITHUB_OUTPUT"
          fi

          # ClientStorage
          if is_true "$(has_match 'Backend/BarkFluff.ClientStorage/')" "$GRPC_SERVER" "$BACKEND_REBUILD"; then
            echo "client-storage=true" >> "$GITHUB_OUTPUT"
          else
            echo "client-storage=false" >> "$GITHUB_OUTPUT"
          fi

          # WPF Client
          if is_true "$(has_match 'Windows/BarkFluff.Client.WPF/')" "$(has_match 'Windows/BarkFluff.WebApi.Core/')" "$(has_match 'Windows/client-rebuild.trigger')" "$SHARED_EXCEPTIONS" "$SHARED_AUTH" "$SHARED_SECURITY"; then
            echo "wpf-client=true" >> "$GITHUB_OUTPUT"
          else
            echo "wpf-client=false" >> "$GITHUB_OUTPUT"
          fi

          echo ""
          echo "Outputs:"
          cat "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════
  #  Backend Docker builds
  # ═══════════════════════════════════════════════════════════════

  # --- Identity ---
  build-identity:
    name: "\U0001F433 Identity"
    needs: detect-changes
    if: needs.detect-changes.outputs.identity == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: "\U0001F4F2 Запрос подтверждения сборки"
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "🐋 *BarkFluff\\.Identity*\n\nВетка: `${{ github.ref_name }}`\nКоммит: `${{ github.sha }}`\nАвтор: *${{ github.actor }}*\n\nЗапустить сборку?"
          APPROVAL_BUTTON: "✅ Собрать"
          REJECT_BUTTON: "❌ Отменить"
          APPROVED_TEXT: "✅ Сборка Identity одобрена"
          REJECTED_TEXT: "❌ Сборка Identity отклонена"
          TIMEOUT_TEXT: "⏰ Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set tags
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "tags=docker.barkfluff.com:5000/barkfluff-identity-dev:latest,docker.barkfluff.com:5000/barkfluff-identity-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=docker.barkfluff.com:5000/barkfluff-identity:latest,docker.barkfluff.com:5000/barkfluff-identity:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Identity/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: "\U00002705 Уведомление об успехе"
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *Сборка успешна*

            🐋 *BarkFluff\.Identity*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Теги: `${{ steps.vars.outputs.tags }}`

            [Открыть workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: "\U0000274C Уведомление об ошибке"
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *Сборка провалена*

            🐋 *BarkFluff\.Identity*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*

            [Открыть workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # --- Users ---
  build-users:
    name: "\U0001F433 Users"
    needs: detect-changes
    if: needs.detect-changes.outputs.users == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: "\U0001F4F2 Запрос подтверждения сборки"
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "🐋 *BarkFluff\\.Users*\n\nВетка: `${{ github.ref_name }}`\nКоммит: `${{ github.sha }}`\nАвтор: *${{ github.actor }}*\n\nЗапустить сборку?"
          APPROVAL_BUTTON: "✅ Собрать"
          REJECT_BUTTON: "❌ Отменить"
          APPROVED_TEXT: "✅ Сборка Users одобрена"
          REJECTED_TEXT: "❌ Сборка Users отклонена"
          TIMEOUT_TEXT: "⏰ Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set tags
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "tags=docker.barkfluff.com:5000/barkfluff-users-dev:latest,docker.barkfluff.com:5000/barkfluff-users-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=docker.barkfluff.com:5000/barkfluff-users:latest,docker.barkfluff.com:5000/barkfluff-users:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Users/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: "\U00002705 Уведомление об успехе"
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *Сборка успешна*

            🐋 *BarkFluff\.Users*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Теги: `${{ steps.vars.outputs.tags }}`

            [Открыть workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: "\U0000274C Уведомление об ошибке"
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *Сборка провалена*

            🐋 *BarkFluff\.Users*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*

            [Открыть workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # --- Messages ---
  build-messages:
    name: "\U0001F433 Messages"
    needs: detect-changes
    if: needs.detect-changes.outputs.messages == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: "\U0001F4F2 Запрос подтверждения сборки"
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "🐋 *BarkFluff\\.Messages*\n\nВетка: `${{ github.ref_name }}`\nКоммит: `${{ github.sha }}`\nАвтор: *${{ github.actor }}*\n\nЗапустить сборку?"
          APPROVAL_BUTTON: "✅ Собрать"
          REJECT_BUTTON: "❌ Отменить"
          APPROVED_TEXT: "✅ Сборка Messages одобрена"
          REJECTED_TEXT: "❌ Сборка Messages отклонена"
          TIMEOUT_TEXT: "⏰ Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set tags
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "tags=docker.barkfluff.com:5000/barkfluff-messages-dev:latest,docker.barkfluff.com:5000/barkfluff-messages-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=docker.barkfluff.com:5000/barkfluff-messages:latest,docker.barkfluff.com:5000/barkfluff-messages:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Messages/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: "\U00002705 Уведомление об успехе"
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *Сборка успешна*

            🐋 *BarkFluff\.Messages*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Теги: `${{ steps.vars.outputs.tags }}`

            [Открыть workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: "\U0000274C Уведомление об ошибке"
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *Сборка провалена*

            🐋 *BarkFluff\.Messages*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*

            [Открыть workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # --- Files ---
  build-files:
    name: "\U0001F433 Files"
    needs: detect-changes
    if: needs.detect-changes.outputs.files == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: "\U0001F4F2 Запрос подтверждения сборки"
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "🐋 *BarkFluff\\.Files*\n\nВетка: `${{ github.ref_name }}`\nКоммит: `${{ github.sha }}`\nАвтор: *${{ github.actor }}*\n\nЗапустить сборку?"
          APPROVAL_BUTTON: "✅ Собрать"
          REJECT_BUTTON: "❌ Отменить"
          APPROVED_TEXT: "✅ Сборка Files одобрена"
          REJECTED_TEXT: "❌ Сборка Files отклонена"
          TIMEOUT_TEXT: "⏰ Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set tags
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "tags=docker.barkfluff.com:5000/barkfluff-files-dev:latest,docker.barkfluff.com:5000/barkfluff-files-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=docker.barkfluff.com:5000/barkfluff-files:latest,docker.barkfluff.com:5000/barkfluff-files:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Files/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: "\U00002705 Уведомление об успехе"
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *Сборка успешна*

            🐋 *BarkFluff\.Files*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Теги: `${{ steps.vars.outputs.tags }}`

            [Открыть workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: "\U0000274C Уведомление об ошибке"
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *Сборка провалена*

