          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Files ---
      - name: "\U0001F4F2 Files"
        if: needs.detect-changes.outputs.files == 'true'
        id: approval-files
        continue-on-error: true
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "Запустить сборку BarkFluff.Files?"
          APPROVAL_BUTTON: "\u2705 Собрать"
          REJECT_BUTTON: "\u274C Отменить"
          APPROVED_TEXT: "\u2705 Сборка Files одобрена"
          REJECTED_TEXT: "\u274C Сборка Files отклонена"
          TIMEOUT_TEXT: "\u23F0 Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Результат Files
        if: needs.detect-changes.outputs.files == 'true'
        id: result-files
