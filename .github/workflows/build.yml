  # ═══════════════════════════════════════════════════════════════
  #  WPF Client — сборка + релиз в GitHub
  # ═══════════════════════════════════════════════════════════════
  build-wpf-client:
    name: "\U0001F4E6 WPF Client"
    needs: detect-changes
    if: needs.detect-changes.outputs.wpf-client == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: "\U0001F4F2 Запрос подтверждения сборки"
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "📦 *WPF Client*\n\nВетка: `${{ github.ref_name }}`\nКоммит: `${{ github.sha }}`\nАвтор: *${{ github.actor }}*\n\nЗапустить сборку клиента?"
          APPROVAL_BUTTON: "✅ Собрать"
          REJECT_BUTTON: "❌ Отменить"
          APPROVED_TEXT: "✅ Сборка WPF Client одобрена"
          REJECTED_TEXT: "❌ Сборка WPF Client отклонена"
          TIMEOUT_TEXT: "⏰ Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Windows/BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj

      - name: Build
        run: dotnet build Windows/BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj --no-restore --configuration Release

      - name: Publish
        run: dotnet publish Windows/BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj --configuration Release --runtime win-x64 --self-contained true --output ./publish

      - name: Zip build
        uses: vimtor/action-zip@v1
        with:
          files: publish/
          dest: wpf-build.zip

      - name: Get version and tag
        id: meta
        run: |
          VERSION=$(grep -oP 'Version\s*\{\s*get;\s*set;\s*\}\s*=\s*"\K[^"]+' Windows/BarkFluff.Client.WPF/Services/App/AppVersion.cs || echo "0.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          RANDOM_NUM=$((RANDOM % 9000 + 1000))
          TAG="${{ github.ref_name }}-${TIMESTAMP}-${COMMIT_HASH}-${RANDOM_NUM}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: "\U0001F680 Создать релиз"
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.OWNER_RELEASE_REPO }}/${{ secrets.RELEASE_REPO_NAME }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "BarkFluff WPF Client v${{ steps.meta.outputs.version }}"
          body: |
            ## 📦 BarkFluff WPF Client

            **Версия:** `${{ steps.meta.outputs.version }}`
            **Ветка:** `${{ github.ref_name }}`
            **Коммит:** `${{ github.sha }}`
            **Автор:** ${{ github.actor }}

            ---

            🔗 [Workflow запуск](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          draft: false
          prerelease: ${{ github.ref_name == 'dev' }}
          files: wpf-build.zip

      - name: "\U00002705 Уведомление об успехе"
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *Сборка успешна*

            📦 *WPF Client* v${{ steps.meta.outputs.version }}
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.meta.outputs.tag }}`

            [Открыть workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: "\U0000274C Уведомление об ошибке"
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *Сборка провалена*

            📦 *WPF Client*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*

            [Открыть workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
