name: "\U0001F680 BarkFluff CI/CD"

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  Определение изменений
  # ═══════════════════════════════════════════════════════════════
  detect-changes:
    name: "\U0001F50D Определение изменений"
    runs-on: self-hosted
    outputs:
      identity: ${{ steps.changes.outputs.identity }}
      users: ${{ steps.changes.outputs.users }}
      messages: ${{ steps.changes.outputs.messages }}
      files: ${{ steps.changes.outputs.files }}
      updates: ${{ steps.changes.outputs.updates }}
      notification: ${{ steps.changes.outputs.notification }}
      configuration: ${{ steps.changes.outputs.configuration }}
      beacon: ${{ steps.changes.outputs.beacon }}
      fast-auth: ${{ steps.changes.outputs.fast-auth }}
      navigator: ${{ steps.changes.outputs.navigator }}
      onliner: ${{ steps.changes.outputs.onliner }}
      cloud-messaging: ${{ steps.changes.outputs.cloud-messaging }}
      admin-panel: ${{ steps.changes.outputs.admin-panel }}
      client-storage: ${{ steps.changes.outputs.client-storage }}
      web: ${{ steps.changes.outputs.web }}
      developers: ${{ steps.changes.outputs.developers }}
      wpf-client: ${{ steps.changes.outputs.wpf-client }}
      android-client: ${{ steps.changes.outputs.android-client }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Определение изменённых файлов
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            echo "Initial push or missing before — using HEAD~1 fallback"
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff-tree --no-commit-id --name-only -r HEAD)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff-tree --no-commit-id --name-only -r HEAD)
          fi

          echo "Changed files:"
          echo "$CHANGED"

          has_match() {
            echo "$CHANGED" | grep -q "$1" && echo "true" || echo "false"
          }

          BACKEND_REBUILD=$(has_match "Backend/rebuild.trigger")
          GRPC_SERVER=$(has_match "Backend/BarkFluff.GrpcServer/")
          SHARED_QUEUE=$(has_match "Shared/BarkFluff.Shared.Queue/")
          SHARED_IDENTITY=$(has_match "Shared/BarkFluff.Shared.Identity/")
          SHARED_EXCEPTIONS=$(has_match "Shared/BarkFluff.Shared.Exceptions/")
          SHARED_AUTH=$(has_match "Shared/BarkFluff.Shared.Auth/")
          SHARED_SECURITY=$(has_match "Shared/BarkFluff.Shared.SecurityUtilities/")
          PROTO=$(has_match "Shared/BarkFluff.Proto/")
          IDENTITY_CHANGED=$(has_match "Backend/BarkFluff.Identity/")

          is_true() {
            for v in "$@"; do [ "$v" = "true" ] && return 0; done
            return 1
          }

          # Identity
          if is_true "$(has_match 'Backend/BarkFluff.Identity/')" "$SHARED_QUEUE" "$SHARED_IDENTITY" "$SHARED_EXCEPTIONS" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "identity=true" >> "$GITHUB_OUTPUT"
          else
            echo "identity=false" >> "$GITHUB_OUTPUT"
          fi

          # Users
          if is_true "$(has_match 'Backend/BarkFluff.Users/')" "$SHARED_QUEUE" "$SHARED_EXCEPTIONS" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "users=true" >> "$GITHUB_OUTPUT"
          else
            echo "users=false" >> "$GITHUB_OUTPUT"
          fi

          # Messages
          if is_true "$(has_match 'Backend/BarkFluff.Messages/')" "$SHARED_QUEUE" "$SHARED_AUTH" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "messages=true" >> "$GITHUB_OUTPUT"
          else
            echo "messages=false" >> "$GITHUB_OUTPUT"
          fi

          # Files
          if is_true "$(has_match 'Backend/BarkFluff.Files/')" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "files=true" >> "$GITHUB_OUTPUT"
          else
            echo "files=false" >> "$GITHUB_OUTPUT"
          fi

          # Updates
          if is_true "$(has_match 'Backend/BarkFluff.Updates/')" "$SHARED_QUEUE" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "updates=false" >> "$GITHUB_OUTPUT"
          fi

          # Notification
          if is_true "$(has_match 'Backend/BarkFluff.Notification/')" "$SHARED_QUEUE" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "notification=true" >> "$GITHUB_OUTPUT"
          else
            echo "notification=false" >> "$GITHUB_OUTPUT"
          fi

          # Configuration
          if is_true "$(has_match 'Backend/BarkFluff.Configuration/')" "$IDENTITY_CHANGED" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "configuration=true" >> "$GITHUB_OUTPUT"
          else
            echo "configuration=false" >> "$GITHUB_OUTPUT"
          fi

          # Beacon
          if is_true "$(has_match 'Backend/BarkFluff.Beacon/')" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "beacon=true" >> "$GITHUB_OUTPUT"
          else
            echo "beacon=false" >> "$GITHUB_OUTPUT"
          fi

          # FastAuth
          if is_true "$(has_match 'Backend/BarkFluff.FastAuth/')" "$IDENTITY_CHANGED" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "fast-auth=true" >> "$GITHUB_OUTPUT"
          else
            echo "fast-auth=false" >> "$GITHUB_OUTPUT"
          fi

          # Navigator
          if is_true "$(has_match 'Backend/BarkFluff.Navigator/')" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "navigator=true" >> "$GITHUB_OUTPUT"
          else
            echo "navigator=false" >> "$GITHUB_OUTPUT"
          fi

          # Onliner
          if is_true "$(has_match 'Backend/BarkFluff.Onliner/')" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "onliner=true" >> "$GITHUB_OUTPUT"
          else
            echo "onliner=false" >> "$GITHUB_OUTPUT"
          fi

          # CloudMessaging
          if is_true "$(has_match 'Backend/Barkfluff.CloudMessaging/')" "$SHARED_QUEUE" "$SHARED_EXCEPTIONS" "$SHARED_AUTH" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "cloud-messaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloud-messaging=false" >> "$GITHUB_OUTPUT"
          fi

          # AdminPanel
          if is_true "$(has_match 'Backend/Barkfluff.AdminPanel/')" "$PROTO" "$BACKEND_REBUILD"; then
            echo "admin-panel=true" >> "$GITHUB_OUTPUT"
          else
            echo "admin-panel=false" >> "$GITHUB_OUTPUT"
          fi

          # ClientStorage
          if is_true "$(has_match 'Backend/BarkFluff.ClientStorage/')" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "client-storage=true" >> "$GITHUB_OUTPUT"
          else
            echo "client-storage=false" >> "$GITHUB_OUTPUT"
          fi

          # Web
          if is_true "$(has_match 'Backend/BarkFluff.Web/')" "$GRPC_SERVER" "$PROTO" "$BACKEND_REBUILD"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

          # Developers
          if is_true "$(has_match 'Backend/Barkfluff.Developers/')" "$BACKEND_REBUILD"; then
            echo "developers=true" >> "$GITHUB_OUTPUT"
          else
            echo "developers=false" >> "$GITHUB_OUTPUT"
          fi

          # WPF Client
          if is_true "$(has_match 'Windows/BarkFluff.Client.WPF/')" "$(has_match 'Windows/BarkFluff.WebApi.Core/')" "$(has_match 'Windows/client-rebuild.trigger')" "$SHARED_EXCEPTIONS" "$SHARED_AUTH" "$SHARED_SECURITY" "$PROTO"; then
            echo "wpf-client=true" >> "$GITHUB_OUTPUT"
          else
            echo "wpf-client=false" >> "$GITHUB_OUTPUT"
          fi

          # Android Client
          if is_true "$(has_match 'Android/Barkfluff.Client.Android/')" "$(has_match 'Android/android-rebuild.trigger')"; then
            echo "android-client=true" >> "$GITHUB_OUTPUT"
          else
            echo "android-client=false" >> "$GITHUB_OUTPUT"
          fi

          echo ""
          echo "Outputs:"
          cat "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════
  #  Последовательный запрос подтверждений сборки
  # ═══════════════════════════════════════════════════════════════
  request-approvals:
    name: "\U0001F4F2 Запрос подтверждений"
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.identity == 'true' ||
      needs.detect-changes.outputs.users == 'true' ||
      needs.detect-changes.outputs.messages == 'true' ||
      needs.detect-changes.outputs.files == 'true' ||
      needs.detect-changes.outputs.updates == 'true' ||
      needs.detect-changes.outputs.notification == 'true' ||
      needs.detect-changes.outputs.configuration == 'true' ||
      needs.detect-changes.outputs.beacon == 'true' ||
      needs.detect-changes.outputs.fast-auth == 'true' ||
      needs.detect-changes.outputs.navigator == 'true' ||
      needs.detect-changes.outputs.onliner == 'true' ||
      needs.detect-changes.outputs.cloud-messaging == 'true' ||
      needs.detect-changes.outputs.admin-panel == 'true' ||
      needs.detect-changes.outputs.client-storage == 'true' ||
      needs.detect-changes.outputs.web == 'true' ||
      needs.detect-changes.outputs.developers == 'true' ||
      needs.detect-changes.outputs.wpf-client == 'true' ||
      needs.detect-changes.outputs.android-client == 'true'
    runs-on: self-hosted
    outputs:
      identity-approved: ${{ steps.result-identity.outputs.approved }}
      users-approved: ${{ steps.result-users.outputs.approved }}
      messages-approved: ${{ steps.result-messages.outputs.approved }}
      files-approved: ${{ steps.result-files.outputs.approved }}
      updates-approved: ${{ steps.result-updates.outputs.approved }}
      notification-approved: ${{ steps.result-notification.outputs.approved }}
      configuration-approved: ${{ steps.result-configuration.outputs.approved }}
      beacon-approved: ${{ steps.result-beacon.outputs.approved }}
      fast-auth-approved: ${{ steps.result-fast-auth.outputs.approved }}
      navigator-approved: ${{ steps.result-navigator.outputs.approved }}
      onliner-approved: ${{ steps.result-onliner.outputs.approved }}
      cloud-messaging-approved: ${{ steps.result-cloud-messaging.outputs.approved }}
      admin-panel-approved: ${{ steps.result-admin-panel.outputs.approved }}
      client-storage-approved: ${{ steps.result-client-storage.outputs.approved }}
      web-approved: ${{ steps.result-web.outputs.approved }}
      developers-approved: ${{ steps.result-developers.outputs.approved }}
      wpf-client-approved: ${{ steps.result-wpf-client.outputs.approved }}
      android-client-approved: ${{ steps.result-android-client.outputs.approved }}
    steps:
      # --- Identity ---
      - name: "\U0001F4F2 Identity"
        if: needs.detect-changes.outputs.identity == 'true'
        id: approval-identity
        continue-on-error: true
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "Запустить сборку BarkFluff.Identity?"
          APPROVAL_BUTTON: "\u2705 Собрать"
          REJECT_BUTTON: "\u274C Отменить"
          APPROVED_TEXT: "\u2705 Сборка Identity одобрена"
          REJECTED_TEXT: "\u274C Сборка Identity отклонена"
          TIMEOUT_TEXT: "\u23F0 Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Результат Identity
        if: needs.detect-changes.outputs.identity == 'true'
        id: result-identity
        run: |
          if [ "${{ steps.approval-identity.outcome }}" = "success" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Users ---
      - name: "\U0001F4F2 Users"
        if: needs.detect-changes.outputs.users == 'true'
        id: approval-users
        continue-on-error: true
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "Запустить сборку BarkFluff.Users?"
          APPROVAL_BUTTON: "\u2705 Собрать"
          REJECT_BUTTON: "\u274C Отменить"
          APPROVED_TEXT: "\u2705 Сборка Users одобрена"
          REJECTED_TEXT: "\u274C Сборка Users отклонена"
          TIMEOUT_TEXT: "\u23F0 Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Результат Users
        if: needs.detect-changes.outputs.users == 'true'
        id: result-users
        run: |
          if [ "${{ steps.approval-users.outcome }}" = "success" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Messages ---
      - name: "\U0001F4F2 Messages"
        if: needs.detect-changes.outputs.messages == 'true'
        id: approval-messages
        continue-on-error: true
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "Запустить сборку BarkFluff.Messages?"
          APPROVAL_BUTTON: "\u2705 Собрать"
          REJECT_BUTTON: "\u274C Отменить"
          APPROVED_TEXT: "\u2705 Сборка Messages одобрена"
          REJECTED_TEXT: "\u274C Сборка Messages отклонена"
          TIMEOUT_TEXT: "\u23F0 Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Результат Messages
        if: needs.detect-changes.outputs.messages == 'true'
        id: result-messages
        run: |
          if [ "${{ steps.approval-messages.outcome }}" = "success" ]; then
