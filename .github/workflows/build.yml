          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "🐋 *BarkFluff\\.Users*\n\nВетка: `${{ github.ref_name }}`\nКоммит: `${{ github.sha }}`\nАвтор: *${{ github.actor }}*\n\nЗапустить сборку?"
          APPROVAL_BUTTON: "✅ Собрать"
          REJECT_BUTTON: "❌ Отменить"
          APPROVED_TEXT: "✅ Сборка Users одобрена"
          REJECTED_TEXT: "❌ Сборка Users отклонена"
          TIMEOUT_TEXT: "⏰ Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set tags
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -eq "dev") {
            echo "tags=docker.barkfluff.com:5000/barkfluff-users-dev:latest,docker.barkfluff.com:5000/barkfluff-users-dev:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tags=docker.barkfluff.com:5000/barkfluff-users:latest,docker.barkfluff.com:5000/barkfluff-users:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          }

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Users/Dockerfile
          push: true
