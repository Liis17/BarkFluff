name: "\U0001F680 BarkFluff CI/CD"

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  Определение изменений
  # ═══════════════════════════════════════════════════════════════
  detect-changes:
    name: "\U0001F50D Определение изменений"
    runs-on: self-hosted
    outputs:
      identity: ${{ steps.changes.outputs.identity }}
      users: ${{ steps.changes.outputs.users }}
      messages: ${{ steps.changes.outputs.messages }}
      files: ${{ steps.changes.outputs.files }}
      updates: ${{ steps.changes.outputs.updates }}
      notification: ${{ steps.changes.outputs.notification }}
      configuration: ${{ steps.changes.outputs.configuration }}
      beacon: ${{ steps.changes.outputs.beacon }}
      fast-auth: ${{ steps.changes.outputs.fast-auth }}
      navigator: ${{ steps.changes.outputs.navigator }}
      onliner: ${{ steps.changes.outputs.onliner }}
      cloud-messaging: ${{ steps.changes.outputs.cloud-messaging }}
      admin-panel: ${{ steps.changes.outputs.admin-panel }}
      client-storage: ${{ steps.changes.outputs.client-storage }}
      wpf-client: ${{ steps.changes.outputs.wpf-client }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Определение изменённых файлов
        id: changes
        shell: pwsh
        run: |
          # Получаем список изменённых файлов
          $changed = git diff --name-only HEAD~1 HEAD 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "HEAD~1 недоступен, берём все файлы текущего коммита"
            $changed = git diff-tree --no-commit-id --name-only -r HEAD
          }
          Write-Host "Changed files:"
          Write-Host $changed

          $changedList = $changed -split "`n" | Where-Object { $_ -ne "" }

          function Test-Path-Changed($pattern) {
            return ($changedList | Where-Object { $_ -like "$pattern" }).Count -gt 0
          }

          # Backend trigger file перезапускает все бэкенд-сервисы
          $backendRebuild = Test-Path-Changed "Backend/rebuild.trigger"

          # Shared libraries
          $grpcServer       = Test-Path-Changed "Backend/BarkFluff.GrpcServer/*"
          $sharedQueue      = Test-Path-Changed "Shared/BarkFluff.Shared.Queue/*"
          $sharedIdentity   = Test-Path-Changed "Shared/BarkFluff.Shared.Identity/*"
          $sharedExceptions = Test-Path-Changed "Shared/BarkFluff.Shared.Exceptions/*"
          $sharedAuth       = Test-Path-Changed "Shared/BarkFluff.Shared.Auth/*"
          $sharedSecurity   = Test-Path-Changed "Shared/BarkFluff.Shared.SecurityUtilities/*"
          $identityChanged  = Test-Path-Changed "Backend/BarkFluff.Identity/*"

          # Identity
          $val = (Test-Path-Changed "Backend/BarkFluff.Identity/*") -or $sharedQueue -or $sharedIdentity -or $sharedExceptions -or $grpcServer -or $backendRebuild
          echo "identity=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # Users
          $val = (Test-Path-Changed "Backend/BarkFluff.Users/*") -or $sharedQueue -or $sharedExceptions -or $grpcServer -or $backendRebuild
          echo "users=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # Messages
          $val = (Test-Path-Changed "Backend/BarkFluff.Messages/*") -or $sharedQueue -or $sharedAuth -or $grpcServer -or $backendRebuild
          echo "messages=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # Files
          $val = (Test-Path-Changed "Backend/BarkFluff.Files/*") -or $grpcServer -or $backendRebuild
          echo "files=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # Updates
          $val = (Test-Path-Changed "Backend/BarkFluff.Updates/*") -or $sharedQueue -or $grpcServer -or $backendRebuild
          echo "updates=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # Notification
          $val = (Test-Path-Changed "Backend/BarkFluff.Notification/*") -or $sharedQueue -or $grpcServer -or $backendRebuild
          echo "notification=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # Configuration
          $val = (Test-Path-Changed "Backend/BarkFluff.Configuration/*") -or $identityChanged -or $grpcServer -or $backendRebuild
          echo "configuration=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # Beacon
          $val = (Test-Path-Changed "Backend/BarkFluff.Beacon/*") -or $grpcServer -or $backendRebuild
          echo "beacon=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # FastAuth
          $val = (Test-Path-Changed "Backend/BarkFluff.FastAuth/*") -or $identityChanged -or $grpcServer -or $backendRebuild
          echo "fast-auth=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # Navigator
          $val = (Test-Path-Changed "Backend/BarkFluff.Navigator/*") -or $grpcServer -or $backendRebuild
          echo "navigator=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # Onliner
          $val = (Test-Path-Changed "Backend/BarkFluff.Onliner/*") -or $grpcServer -or $backendRebuild
          echo "onliner=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # CloudMessaging
          $val = (Test-Path-Changed "Backend/Barkfluff.CloudMessaging/*") -or $sharedQueue -or $sharedExceptions -or $sharedAuth -or $grpcServer -or $backendRebuild
          echo "cloud-messaging=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # AdminPanel
          $val = (Test-Path-Changed "Backend/Barkfluff.AdminPanel/*") -or $backendRebuild
          echo "admin-panel=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # ClientStorage
          $val = (Test-Path-Changed "Backend/BarkFluff.ClientStorage/*") -or $grpcServer -or $backendRebuild
          echo "client-storage=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # WPF Client
          $val = (Test-Path-Changed "Windows/BarkFluff.Client.WPF/*") -or (Test-Path-Changed "Windows/BarkFluff.WebApi.Core/*") -or (Test-Path-Changed "Windows/client-rebuild.trigger") -or $sharedExceptions -or $sharedAuth -or $sharedSecurity
          echo "wpf-client=$($val.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          Write-Host "`nOutputs:"
          Get-Content $env:GITHUB_OUTPUT

  # ═══════════════════════════════════════════════════════════════
  #  Backend Docker builds
  # ═══════════════════════════════════════════════════════════════

  # --- Identity ---
  build-identity:
    name: "\U0001F433 Identity"
    needs: detect-changes
    if: needs.detect-changes.outputs.identity == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: "\U0001F4F2 Запрос подтверждения сборки"
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "🐋 *BarkFluff\\.Identity*\n\nВетка: `${{ github.ref_name }}`\nКоммит: `${{ github.sha }}`\nАвтор: *${{ github.actor }}*\n\nЗапустить сборку?"
          APPROVAL_BUTTON: "✅ Собрать"
          REJECT_BUTTON: "❌ Отменить"
          APPROVED_TEXT: "✅ Сборка Identity одобрена"
          REJECTED_TEXT: "❌ Сборка Identity отклонена"
          TIMEOUT_TEXT: "⏰ Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set tags
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -eq "dev") {
            echo "tags=docker.barkfluff.com:5000/barkfluff-identity-dev:latest,docker.barkfluff.com:5000/barkfluff-identity-dev:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tags=docker.barkfluff.com:5000/barkfluff-identity:latest,docker.barkfluff.com:5000/barkfluff-identity:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          }

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Identity/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: "\U00002705 Уведомление об успехе"
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *Сборка успешна*

            🐋 *BarkFluff\.Identity*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Теги: `${{ steps.vars.outputs.tags }}`

            [Открыть workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: "\U0000274C Уведомление об ошибке"
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *Сборка провалена*

            🐋 *BarkFluff\.Identity*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*

            [Открыть workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # --- Users ---
  build-users:
    name: "\U0001F433 Users"
    needs: detect-changes
    if: needs.detect-changes.outputs.users == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: "\U0001F4F2 Запрос подтверждения сборки"
        uses: powerdot/telegram-manual-approval@main
