      # --- FastAuth ---
      - name: "\U0001F4F2 FastAuth"
        if: needs.detect-changes.outputs.fast-auth == 'true'
        id: approval-fast-auth
        continue-on-error: true
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "Запустить сборку BarkFluff.FastAuth?"
          APPROVAL_BUTTON: "\u2705 Собрать"
          REJECT_BUTTON: "\u274C Отменить"
          APPROVED_TEXT: "\u2705 Сборка FastAuth одобрена"
          REJECTED_TEXT: "\u274C Сборка FastAuth отклонена"
          TIMEOUT_TEXT: "\u23F0 Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Результат FastAuth
        if: needs.detect-changes.outputs.fast-auth == 'true'
        id: result-fast-auth
        run: |
          if [ "${{ steps.approval-fast-auth.outcome }}" = "success" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
