  # --- Identity ---
  build-identity:
    name: "\U0001F433 Identity"
    needs: [detect-changes, request-approvals]
    if: needs.detect-changes.outputs.identity == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Login to Private Registry
        if: needs.request-approvals.outputs.identity-approved == 'true'
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        if: needs.request-approvals.outputs.identity-approved == 'true'
        uses: docker/setup-buildx-action@v2

      - name: Set tags
        if: needs.request-approvals.outputs.identity-approved == 'true'
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "tags=docker.barkfluff.com:5000/barkfluff-identity-dev:latest,docker.barkfluff.com:5000/barkfluff-identity-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tag_sha=docker.barkfluff.com:5000/barkfluff-identity-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=docker.barkfluff.com:5000/barkfluff-identity:latest,docker.barkfluff.com:5000/barkfluff-identity:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tag_sha=docker.barkfluff.com:5000/barkfluff-identity:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push
        if: needs.request-approvals.outputs.identity-approved == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Identity/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: "\U0001F6AB Сборка отменена"
        if: needs.request-approvals.outputs.identity-approved != 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            🚫 *Сборка отменена*

            🐋 *BarkFluff.Identity*
            📌 Ветка: `${{ github.ref_name }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

      - name: "\u2705 Уведомление об успехе"
        if: success() && needs.request-approvals.outputs.identity-approved == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            🐋 *BarkFluff.Identity*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.vars.outputs.tag_sha }}`
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

      - name: "\u274C Уведомление об ошибке"
        if: failure() && needs.request-approvals.outputs.identity-approved == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
