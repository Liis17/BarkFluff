          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Notification ---
      - name: "\U0001F4F2 Notification"
        if: needs.detect-changes.outputs.notification == 'true'
        id: approval-notification
        continue-on-error: true
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          APPROVAL_TEXT: "Запустить сборку BarkFluff.Notification?"
          APPROVAL_BUTTON: "\u2705 Собрать"
          REJECT_BUTTON: "\u274C Отменить"
          APPROVED_TEXT: "\u2705 Сборка Notification одобрена"
          REJECTED_TEXT: "\u274C Сборка Notification отклонена"
          TIMEOUT_TEXT: "\u23F0 Время ожидания истекло"
          UPDATE_REQUESTS: 120

      - name: Результат Notification
        if: needs.detect-changes.outputs.notification == 'true'
        id: result-notification
        run: |
          if [ "${{ steps.approval-notification.outcome }}" = "success" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Configuration ---
      - name: "\U0001F4F2 Configuration"
        if: needs.detect-changes.outputs.configuration == 'true'
        id: approval-configuration
        continue-on-error: true
        uses: powerdot/telegram-manual-approval@main
        with:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_APPROVAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
