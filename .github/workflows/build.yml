          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

  # --- Developers ---
  build-developers:
    name: "\U0001F433 Developers"
    needs: [detect-changes, request-approvals]
    if: needs.detect-changes.outputs.developers == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Login to Private Registry
        if: needs.request-approvals.outputs.developers-approved == 'true'
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        if: needs.request-approvals.outputs.developers-approved == 'true'
        uses: docker/setup-buildx-action@v2

      - name: Set tags
        if: needs.request-approvals.outputs.developers-approved == 'true'
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "tags=docker.barkfluff.com:5000/barkfluff-developers-dev:latest,docker.barkfluff.com:5000/barkfluff-developers-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tag_sha=docker.barkfluff.com:5000/barkfluff-developers-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=docker.barkfluff.com:5000/barkfluff-developers:latest,docker.barkfluff.com:5000/barkfluff-developers:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tag_sha=docker.barkfluff.com:5000/barkfluff-developers:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push
        if: needs.request-approvals.outputs.developers-approved == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/Barkfluff.Developers/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: "\U0001F6AB Сборка отменена"
        if: needs.request-approvals.outputs.developers-approved != 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            🚫 *Сборка отменена*

            🐋 *Barkfluff.Developers*
            📌 Ветка: `${{ github.ref_name }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

      - name: "\u2705 Уведомление об успехе"
        if: success() && needs.request-approvals.outputs.developers-approved == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            🐋 *Barkfluff.Developers*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.vars.outputs.tag_sha }}`
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

      - name: "\u274C Уведомление об ошибке"
        if: failure() && needs.request-approvals.outputs.developers-approved == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            🐋 *Barkfluff.Developers*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

  # ═══════════════════════════════════════════════════════════════
  #  WPF Client — сборка + релиз в GitHub
  # ═══════════════════════════════════════════════════════════════
  build-wpf-client:
    name: "\U0001F4E6 WPF Client"
    needs: [detect-changes, request-approvals]
    if: needs.detect-changes.outputs.wpf-client == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore dependencies
        if: needs.request-approvals.outputs.wpf-client-approved == 'true'
        env:
          EnableWindowsTargeting: true
        run: dotnet restore Windows/BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj

      - name: Build
        if: needs.request-approvals.outputs.wpf-client-approved == 'true'
        env:
          EnableWindowsTargeting: true
        run: dotnet build Windows/BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj --no-restore --configuration Release

      - name: Publish
        if: needs.request-approvals.outputs.wpf-client-approved == 'true'
        env:
          EnableWindowsTargeting: true
        run: dotnet publish Windows/BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj --configuration Release --runtime win-x64 --self-contained true --output ./publish

      - name: Zip build
        if: needs.request-approvals.outputs.wpf-client-approved == 'true'
        uses: vimtor/action-zip@v1
        with:
          files: publish/
          dest: wpf-build.zip

      - name: Get version and tag
        if: needs.request-approvals.outputs.wpf-client-approved == 'true'
        id: meta
        run: |
          VERSION=$(grep -oP 'Version\s*\{\s*get;\s*set;\s*\}\s*=\s*"\K[^"]+' Windows/BarkFluff.Client.WPF/Services/App/AppVersion.cs || echo "0.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          RANDOM_NUM=$((RANDOM % 9000 + 1000))
          TAG="${{ github.ref_name }}-${TIMESTAMP}-${COMMIT_HASH}-${RANDOM_NUM}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: "\U0001F680 Создать релиз"
        if: needs.request-approvals.outputs.wpf-client-approved == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.OWNER_RELEASE_REPO }}/${{ secrets.RELEASE_REPO_NAME }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "BarkFluff WPF Client v${{ steps.meta.outputs.version }}"
          body: |
            ## 📦 BarkFluff WPF Client

            **Версия:** `${{ steps.meta.outputs.version }}`
            **Ветка:** `${{ github.ref_name }}`
            **Коммит:** `${{ github.sha }}`
            **Автор:** ${{ github.actor }}
          draft: false
          prerelease: false
          files: wpf-build.zip

      - name: "\U0001F4E4 Загрузка на сервер обновлений"
        if: needs.request-approvals.outputs.wpf-client-approved == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            CHANNEL="beta"
          else
            CHANNEL="release"
          fi
          curl -f -X POST "${{ secrets.CLIENT_STORAGE_URL }}/set/barkfluffwindows/${CHANNEL}" \
            -H "Authorization: Bearer ${{ secrets.CLIENT_STORAGE_TOKEN }}" \
            -H "X-App-Version: ${{ steps.meta.outputs.version }}" \
            -F "file=@wpf-build.zip"

      - name: "\U0001F6AB Сборка отменена"
        if: needs.request-approvals.outputs.wpf-client-approved != 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            🚫 *Сборка отменена*

            📦 *WPF Client*
            📌 Ветка: `${{ github.ref_name }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

      - name: "\u2705 Уведомление об успехе"
        if: success() && needs.request-approvals.outputs.wpf-client-approved == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            📦 *WPF Client* v${{ steps.meta.outputs.version }}
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.meta.outputs.tag }}`

            [Скачать релиз](https://github.com/${{ secrets.OWNER_RELEASE_REPO }}/${{ secrets.RELEASE_REPO_NAME }}/releases/tag/${{ steps.meta.outputs.tag }})
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

      - name: "\u274C Уведомление об ошибке"
        if: failure() && needs.request-approvals.outputs.wpf-client-approved == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            📦 *WPF Client*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

  # ═══════════════════════════════════════════════════════════════
  #  Android Client — сборка + загрузка на сервер обновлений
  # ═══════════════════════════════════════════════════════════════
  build-android-client:
    name: "\U0001F4F1 Android Client"
    needs: [detect-changes, request-approvals]
    if: needs.detect-changes.outputs.android-client == 'true'
    runs-on: self-hosted
    env:
      ANDROID_HOME: /home/liis/android-sdk
      ANDROID_SDK_ROOT: /home/liis/android-sdk
    defaults:
      run:
        working-directory: Android/Barkfluff.Client.Android
    steps:
      - uses: actions/checkout@v4

      - name: Подготовка gradlew
        if: needs.request-approvals.outputs.android-client-approved == 'true'
        run: |
          dos2unix gradlew
          chmod +x gradlew

      - name: Настройка Android SDK
        if: needs.request-approvals.outputs.android-client-approved == 'true'
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}"

      - name: Автоподнятие версии
        if: needs.request-approvals.outputs.android-client-approved == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            CHANNEL="beta"
          else
            CHANNEL="release"
          fi

          RESPONSE=$(curl -sf "https://storage.barkfluff.com/get/barkfluffkotlin/${CHANNEL}/version" || echo "")

          if [ -n "$RESPONSE" ]; then
            SERVER_VERSION=$(echo "$RESPONSE" | grep -oP '"version"\s*:\s*"\K[^"]+')
          else
            SERVER_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "0.0.0")
          fi

          # Стрипаем любой нечисловой суффикс (например " beta")
          SERVER_VERSION=$(echo "$SERVER_VERSION" | grep -oP '^\d+\.\d+\.\d+' || echo "0.0.0")

          echo "Server version: $SERVER_VERSION"

          MAJOR=$(echo "$SERVER_VERSION" | cut -d. -f1)
          MINOR=$(echo "$SERVER_VERSION" | cut -d. -f2)
          PATCH=$(echo "$SERVER_VERSION" | cut -d. -f3)
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "New version: $NEW_VERSION"

          sed -i "s/versionName\s*=\s*\"[^\"]*\"/versionName = \"${NEW_VERSION}\"/" app/build.gradle.kts

      - name: Пометка beta-версии
        if: needs.request-approvals.outputs.android-client-approved == 'true' && github.ref_name == 'dev'
        run: |
          sed -i 's/versionName\s*=\s*"\([^"]*\)"/versionName = "\1 beta"/' app/build.gradle.kts

      - name: Сборка APK
        if: needs.request-approvals.outputs.android-client-approved == 'true'
        env:
          RELEASE_STORE_FILE: ${{ secrets.ANDROID_RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Поиск APK
        if: needs.request-approvals.outputs.android-client-approved == 'true'
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Get version
        if: needs.request-approvals.outputs.android-client-approved == 'true'
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "0.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: "\U0001F4E4 Загрузка на сервер обновлений"
        if: needs.request-approvals.outputs.android-client-approved == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            CHANNEL="beta"
          else
            CHANNEL="release"
          fi
          curl -f -X POST "${{ secrets.CLIENT_STORAGE_URL }}/set/barkfluffkotlin/${CHANNEL}" \
            -H "Authorization: Bearer ${{ secrets.CLIENT_STORAGE_TOKEN }}" \
            -H "X-App-Version: ${{ steps.meta.outputs.version }}" \
            -F "file=@${{ steps.apk.outputs.path }}"

      - name: "\U0001F6AB Сборка отменена"
        if: needs.request-approvals.outputs.android-client-approved != 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            🚫 *Сборка отменена*

            📱 *Android Client*
            📌 Ветка: `${{ github.ref_name }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

      - name: "\u2705 Уведомление об успехе"
        if: success() && needs.request-approvals.outputs.android-client-approved == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ✅ *Сборка успешна*

            📱 *Android Client*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"

      - name: "\u274C Уведомление об ошибке"
        if: failure() && needs.request-approvals.outputs.android-client-approved == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            📱 *Android Client*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${TG_MESSAGE}"
