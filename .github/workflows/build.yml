          APPROVAL_TEXT: "🐋 *BarkFluff\\.Updates*\n\nВетка: `${{ github.ref_name }}`\nКоммит: `${{ github.sha }}`\nАвтор: *${{ github.actor }}*\n\nЗапустить сборку?"
