name: Deploy Microservices
on:
  push:
    branches:
      - master
      - dev
    paths:
      - 'Backend/BarkFluff.**/**'
      - '.github/workflows/deploy-microservices.yml'

jobs:
  detect-changes:
    runs-on: ["self-hosted", "windows"]
    outputs:
      beacon: ${{ steps.filter.outputs.beacon }}
      configuration: ${{ steps.filter.outputs.configuration }}
      files: ${{ steps.filter.outputs.files }}
      identity: ${{ steps.filter.outputs.identity }}
      messages: ${{ steps.filter.outputs.messages }}
      notification: ${{ steps.filter.outputs.notification }}
      users: ${{ steps.filter.outputs.users }}
      fast-auth: ${{ steps.filter.outputs.fast-auth }}
      navigator: ${{ steps.filter.outputs.navigator }}
      updates: ${{ steps.filter.outputs.updates }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            beacon:
              - 'Backend/BarkFluff.Beacon/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            configuration:
              - 'Backend/BarkFluff.Configuration/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            files:
              - 'Backend/BarkFluff.Files/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            identity:
              - 'Backend/BarkFluff.Identity/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            messages:
              - 'Backend/BarkFluff.Messages/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            notification:
              - 'Backend/BarkFluff.Notification/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            users:
              - 'Backend/BarkFluff.Users/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            fast-auth:
              - 'Backend/BarkFluff.FastAuth/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            navigator:
              - 'Backend/BarkFluff.Navigator/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            updates:
              - 'Backend/BarkFluff.Updates/**'
              - 'Backend/BarkFluff.GrpcServer/**'

  build:
    needs: detect-changes
    runs-on: ["self-hosted", "windows"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: beacon
            path: ./Backend/BarkFluff.Beacon/Dockerfile
            image: barkfluff-beacon
          - name: configuration
            path: ./Backend/BarkFluff.Configuration/Dockerfile
            image: barkfluff-configuration
          - name: files
            path: ./Backend/BarkFluff.Files/Dockerfile
            image: barkfluff-files
          - name: identity
            path: ./Backend/BarkFluff.Identity/Dockerfile
            image: barkfluff-identity
          - name: messages
            path: ./Backend/BarkFluff.Messages/Dockerfile
            image: barkfluff-messages
          - name: notification
            path: ./Backend/BarkFluff.Notification/Dockerfile
            image: barkfluff-notification
          - name: users
            path: ./Backend/BarkFluff.Users/Dockerfile
            image: barkfluff-users
          - name: fast-auth
            path: ./Backend/BarkFluff.FastAuth/Dockerfile
            image: barkfluff-fast-auth
          - name: navigator
            path: ./Backend/BarkFluff.Navigator/Dockerfile
            image: barkfluff-navigator
          - name: updates
            path: ./Backend/BarkFluff.Updates/Dockerfile
            image: barkfluff-updates

    steps:
      - uses: actions/checkout@v3

      # Пробросим флаг изменений для текущего сервиса из detect-changes
      - name: Compute change flag for service
        id: changed
        shell: pwsh
        env:
          BEACON_CHANGED: ${{ needs.detect-changes.outputs.beacon }}
          CONFIGURATION_CHANGED: ${{ needs.detect-changes.outputs.configuration }}
          FILES_CHANGED: ${{ needs.detect-changes.outputs.files }}
          IDENTITY_CHANGED: ${{ needs.detect-changes.outputs.identity }}
          MESSAGES_CHANGED: ${{ needs.detect-changes.outputs.messages }}
          NOTIFICATION_CHANGED: ${{ needs.detect-changes.outputs.notification }}
          USERS_CHANGED: ${{ needs.detect-changes.outputs.users }}
          FAST_AUTH_CHANGED: ${{ needs.detect-changes.outputs['fast-auth'] }}
          NAVIGATOR_CHANGED: ${{ needs.detect-changes.outputs.navigator }}
          UPDATES_CHANGED: ${{ needs.detect-changes.outputs.updates }}
        run: |
          $name='${{ matrix.name }}'
          $changed='false'
          switch ($name) {
            'beacon'        { $changed = $env:BEACON_CHANGED }
            'configuration' { $changed = $env:CONFIGURATION_CHANGED }
            'files'         { $changed = $env:FILES_CHANGED }
            'identity'      { $changed = $env:IDENTITY_CHANGED }
            'messages'      { $changed = $env:MESSAGES_CHANGED }
            'notification'  { $changed = $env:NOTIFICATION_CHANGED }
            'users'         { $changed = $env:USERS_CHANGED }
            'fast-auth'     { $changed = $env:FAST_AUTH_CHANGED }
            'navigator'     { $changed = $env:NAVIGATOR_CHANGED }
            'updates'       { $changed = $env:UPDATES_CHANGED }
            default         { $changed = 'false' }
          }
          "CHANGED=$changed" | Out-File -FilePath $env:GITHUB_ENV -Append
          if ($changed -ne 'true') { Write-Host "No changes for $name" }

      - name: Login to Private Registry
        if: env.CHANGED == 'true'
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        if: env.CHANGED == 'true'
        uses: docker/setup-buildx-action@v2

      - name: Define tags
        if: env.CHANGED == 'true'
        shell: pwsh
        run: |
          $image='${{ matrix.image }}'
          if ("${{ github.ref_name }}" -eq "dev") {
            "LATEST_TAG=docker.barkfluff.com/$image:latest-dev" | Out-File -FilePath $env:GITHUB_ENV -Append
            "SHA_TAG=docker.barkfluff.com/$image:${{ github.sha }}-dev" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "LATEST_TAG=docker.barkfluff.com/$image:latest" | Out-File -FilePath $env:GITHUB_ENV -Append
            "SHA_TAG=docker.barkfluff.com/$image:${{ github.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build and Push
        if: env.CHANGED == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.path }}
          push: true
          tags: ${{ env.LATEST_TAG }},${{ env.SHA_TAG }}
