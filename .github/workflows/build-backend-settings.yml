name: "🚀 BarkFluff.Settings CI/CD"

on:
  push:
    branches: [dev, master, nightly]
    paths:
      - 'Backend/BarkFluff.Settings/**'
      - 'Backend/BarkFluff.GrpcServer/**'
      - '.github/actions/docker-version/**'
      - 'Backend/rebuild.trigger'
      - '.github/workflows/build-backend-settings.yml'
      - '.github/scripts/send-telegram.sh'
      - 'global.json'
      - '.dockerignore'
      - 'Shared/**'
      - 'Tests/BarkFluff.Settings.Tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: "🐳 Сборка и публикация BarkFluff.Settings"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: "🧪 Tests"
        run: dotnet test Tests/BarkFluff.Settings.Tests/BarkFluff.Settings.Tests.csproj -c Release
      - name: "⚙️ dotnet publish (Linux Release)"
        run: |
          dotnet publish Backend/BarkFluff.Settings/BarkFluff.Settings.csproj \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false
          mkdir -p ./publish/logs
      - name: Login to Private Registry
        uses: docker/login-action@v4
        with:
          registry: docker.barkfluff.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Compute version
        id: vars
        uses: ./.github/actions/docker-version
        with:
          image: barkfluff-settings
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Backend/BarkFluff.Settings/Dockerfile.slim
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: org.opencontainers.image.version=${{ steps.vars.outputs.version }}
