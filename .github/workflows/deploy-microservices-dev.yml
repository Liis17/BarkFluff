name: Deploy Microservices

on:
  push:
    branches:
      - dev 
    paths:
      - 'Backend/BarkFluff.Beacon/**'
      - 'Backend/BarkFluff.Configuration/**'
      - 'Backend/BarkFluff.Files/**'
      - 'Backend/BarkFluff.Identity/**'
      - 'Backend/BarkFluff.Messages/**'
      - 'Backend/BarkFluff.Notification/**'
      - 'Backend/BarkFluff.Users/**'
      - 'Backend/BarkFluff.GrpcServer/**'
      - 'Backend/BarkFluff.FastAuth/**'
      - 'Backend/BarkFluff.Navigator/**'
      - 'Backend/BarkFluff.Updates/**'
      - '.github/workflows/deploy-microservices-dev.yml'

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      beacon: ${{ steps.filter.outputs.beacon }}
      configuration: ${{ steps.filter.outputs.configuration }}
      files: ${{ steps.filter.outputs.files }}
      identity: ${{ steps.filter.outputs.identity }}
      messages: ${{ steps.filter.outputs.messages }}
      notification: ${{ steps.filter.outputs.notification }}
      users: ${{ steps.filter.outputs.users }}
      fast-auth: ${{ steps.filter.outputs.fast-auth }}
      navigator: ${{ steps.filter.outputs.navigator }}
      updates: ${{ steps.filter.outputs.updates }}
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            beacon:
              - 'Backend/BarkFluff.Beacon/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            configuration:
              - 'Backend/BarkFluff.Configuration/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            files:
              - 'Backend/BarkFluff.Files/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            identity:
              - 'Backend/BarkFluff.Identity/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            messages:
              - 'Backend/BarkFluff.Messages/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            notification:
              - 'Backend/BarkFluff.Notification/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            users:
              - 'Backend/BarkFluff.Users/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            fast-auth:
              - 'Backend/BarkFluff.FastAuth/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            navigator:
              - 'Backend/BarkFluff.Navigator/**'
              - 'Backend/BarkFluff.GrpcServer/**'
            updates:
              - 'Backend/BarkFluff.Updates/**'
              - 'Backend/BarkFluff.GrpcServer/**'

  build-beacon:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.beacon == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and Push Beacon
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Beacon/Dockerfile
          push: true
          tags: docker.barkfluff.com/barkfluff-beacon-dev:latest,docker.barkfluff.com/barkfluff-beacon-dev:${{ github.sha }}
  
  build-configuration:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.configuration == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
