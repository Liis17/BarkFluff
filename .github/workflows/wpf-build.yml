name: WPF Build and Release

on:
  push:
    branches:
      - Dev
    paths:
      - 'BarkFluff.Client.WPF/**'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'  

    - name: Restore dependencies
      run: dotnet restore BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj

    - name: Build
      run: dotnet build BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj --no-restore --configuration Release

    - name: Publish
      run: dotnet publish BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj --no-build --configuration Release --self-contained true --runtime win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish

    - name: Zip build
      uses: vimtor/action-zip@v1
      with:
        files: publish/
        dest: wpf-build.zip

    - name: Upload to public repo release
      env:
        GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      run: |
        gh release create ${{ env.TAG }} --repo Liis17/BarkFluff.Releases --title "Build ${{ github.sha }}" --notes "Automated build from Dev branch" || true
        gh release upload ${{ env.TAG }} wpf-build.zip --repo Liis17/BarkFluff.Releases
