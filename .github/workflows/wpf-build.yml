name: WPF Build and Release
on:
  push:
    branches:
      - Dev
    paths:
      - 'BarkFluff.Client.WPF/**'
jobs:
  build:
    runs-on: self-hosted
    steps:
    - name: Debug GITHUB_WORKSPACE
      run: echo "GITHUB_WORKSPACE is $env:GITHUB_WORKSPACE"
    - name: Configure Git safe directory
      run: git config --global --add safe.directory "$env:GITHUB_WORKSPACE"
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj
    - name: Build
      run: dotnet build BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj --no-restore --configuration Release
    - name: Publish
      run: dotnet publish BarkFluff.Client.WPF/BarkFluff.Client.WPF.csproj --no-build --configuration Release --self-contained true --runtime win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish
    - name: Zip build
      uses: vimtor/action-zip@v1
      with:
        files: publish/
        dest: wpf-build.zip
    - name: Verify zip file
      run: |
        if (Test-Path wpf-build.zip) { echo "wpf-build.zip exists" } else { echo "wpf-build.zip not found"; exit 1 }
        dir wpf-build.zip
    - name: Generate tag
      id: generate_tag
      run: |
        $commitHash = $(git rev-parse --short HEAD)
        $timestamp = $(Get-Date -Format 'yyyyMMddHHmmss')
        $random = Get-Random -Minimum 1000 -Maximum 9999
        $tag = "dev-$timestamp-$commitHash-$random"
        echo "TAG=$tag" >> $env:GITHUB_ENV
        echo "Generated tag: $tag"
    - name: Delete existing tag if it exists
      env:
        GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      run: |
        $ErrorActionPreference = "Continue"
        gh release delete $env:TAG --repo Liis17/BarkFluff.Releases --yes 2>$null
        git push --delete origin $env:TAG 2>$null

    - name: Create new release
      env:
        GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      run: |
        gh release create $env:TAG ./wpf-build.zip --repo Liis17/BarkFluff.Releases --title "Dev Release $env:TAG" --notes "Automated build from Dev branch"
