name: 🐋 Сборка образа BarkFluff.Updates
on:
  push:
    branches:
      - dev
      - master
    paths:
      - 'Backend/BarkFluff.Updates/**'
      - 'BarkFluff.Shared.Queue/**'
      - 'Backend/BarkFluff.GrpcServer/**'
      - '.github/workflows/updates-build.yml'
      - 'rebuild.trigger'
jobs:
  build-updates:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Set tags
        id: vars
        run: |
          if ("${{ github.ref_name }}" -eq "dev") {
            echo "tags=docker.barkfluff.com:5000/barkfluff-updates-dev:latest,docker.barkfluff.com:5000/barkfluff-updates-dev:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tags=docker.barkfluff.com:5000/barkfluff-updates:latest,docker.barkfluff.com:5000/barkfluff-updates:${{ github.sha }}" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh
      
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Updates/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}