name: Сборка и отправка в регистр Beacon

on:
  push:
    branches:
      - master
    paths:
      - 'Backend/BarkFluff.Beacon/**'
      - 'Backend/BarkFluff.GrpcServer/**'
      - '.github/workflows/beacon-build-master.yml'
      - 'rebuild.trigger'

jobs:
  build-beacon:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Beacon/Dockerfile
          push: true
          tags: docker.barkfluff.com:5000/barkfluff-beacon:latest,docker.barkfluff.com:5000/barkfluff-beacon:${{ github.sha }}