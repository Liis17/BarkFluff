name: Сборка и отправка в регистр Configuration

on:
  push:
    branches:
      - master
    paths:
      - 'Backend/BarkFluff.Configuration/**'
      - 'Backend/BarkFluff.Identity/**'
      - 'Backend/BarkFluff.GrpcServer/**'
      - '.github/workflows/configuration-build-master.yml'

jobs:
  build-configuration:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: docker.barkfluff.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Backend/BarkFluff.Configuration/Dockerfile
          push: true
          tags: docker.barkfluff.com/barkfluff-configuration:latest,docker.barkfluff.com/barkfluff-configuration:${{ github.sha }}