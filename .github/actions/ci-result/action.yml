name: "CI result"
description: "Сохраняет итог сборки компонента для общего уведомления в Telegram"

inputs:
  key:
    description: "Уникальный ключ компонента (имя artifact)"
    required: true
  status:
    description: "Статус job (job.status)"
    required: true
  label:
    description: "Подпись компонента в уведомлении"
    required: true
  detail:
    description: "Версия или пояснение"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Write result
      shell: bash
      env:
        RESULT_KEY: ${{ inputs.key }}
        RESULT_STATUS: ${{ inputs.status }}
        RESULT_LABEL: ${{ inputs.label }}
        RESULT_DETAIL: ${{ inputs.detail }}
      run: |
        mkdir -p "$RUNNER_TEMP/ci-results"
        printf '%s|%s|%s\n' "$RESULT_STATUS" "$RESULT_LABEL" "$RESULT_DETAIL" > "$RUNNER_TEMP/ci-results/$RESULT_KEY.txt"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ci-result-${{ inputs.key }}
        path: ${{ runner.temp }}/ci-results/${{ inputs.key }}.txt
        retention-days: 3
