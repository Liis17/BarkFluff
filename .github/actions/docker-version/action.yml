name: "Docker semver version"
description: "Запрашивает у реестра последний semver-тег образа, инкрементирует patch и формирует теги для push"

inputs:
  image:
    description: "Базовое имя образа без суффикса окружения (например barkfluff-messages)"
    required: true
  registry-username:
    description: "Логин к docker-реестру"
    required: true
  registry-password:
    description: "Пароль к docker-реестру"
    required: true

outputs:
  version:
    description: "Новая версия (например 1.0.5)"
    value: ${{ steps.compute.outputs.version }}
  tags:
    description: "Строка тегов для docker/build-push-action (версия + latest)"
    value: ${{ steps.compute.outputs.tags }}
  tag_version:
    description: "Полный тег с версией (для уведомлений)"
    value: ${{ steps.compute.outputs.tag_version }}

runs:
  using: "composite"
  steps:
    - name: Compute next version
      id: compute
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REG_USER: ${{ inputs.registry-username }}
        REG_PASS: ${{ inputs.registry-password }}
      run: |
        REGISTRY="docker.barkfluff.com"

        case "$GITHUB_REF_NAME" in
          dev)
            REPO="${IMAGE}-dev"
            ;;
          nightly)
            REPO="${IMAGE}-nightly"
            ;;
          master|*)
            REPO="$IMAGE"
            ;;
        esac

        # -k: самоподписанный сертификат; 404 (репозитория ещё нет) не валит шаг
        RESP=$(curl -sk -u "$REG_USER:$REG_PASS" "https://$REGISTRY/v2/$REPO/tags/list" || true)

        # || true: grep без совпадений даёт exit 1 — под set -e -o pipefail это валит шаг
        LAST=$(echo "$RESP" | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"' | sort -V | tail -n1 || true)

        if [ -z "$LAST" ]; then
          VERSION="1.0.0"
        else
          VERSION="${LAST%.*}.$(( ${LAST##*.} + 1 ))"
        fi

        echo "Последний тег в реестре: ${LAST:-<нет>}, новая версия: $VERSION"

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tags=$REGISTRY/$REPO:$VERSION,$REGISTRY/$REPO:latest" >> "$GITHUB_OUTPUT"
        echo "tag_version=$REGISTRY/$REPO:$VERSION" >> "$GITHUB_OUTPUT"
