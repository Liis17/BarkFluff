syntax = "proto3";

option csharp_namespace = "BarkFluff.Proto.Navigator";

import "google/protobuf/timestamp.proto";

package barkfluff.navigator;


service NavigatorApi {
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  rpc RegisterServer(RegisterServerRequest) returns (RegisterServerResponse);

  // Найти сервер по DNS-домену федерации (реализация — Фаза 1)
  rpc GetServerByName(GetServerByNameRequest) returns (GetServerByNameResponse);
}

message ListServersRequest {
  
}

message ListServersResponse {
  repeated ServerInfo servers = 1; // Сервера
}

message ServerColor {
  string lite_hex = 1; // Светлый цвет сервера
  string main_hex = 2; // Основной цвет сервера
  string hard_hex = 3; // Темный цвет сервера
}

message ServerInfo {
  string name = 1; // Имя сервера
  string description = 2; // Описание
  int64 accounts_count = 3; // Количество пользователей
  ServiceEndpoint beacon_uri = 4; // Адрес маяка
  string server_public_name = 5; // Публичное имя сервера
  string location = 6; // Локация сервера
  ServerColor color = 7; // Цвета сервера
  string server_name = 8;                      // DNS-домен ноды (глобальное имя в федерации)
  string federation_endpoint = 9;              // публичный S2S-адрес
  repeated NavigatorSigningKey signing_keys = 10;
  repeated string tls_spki_sha256 = 11;        // SPKI-отпечатки TLS-серта (для self-signed)
  repeated int32 federation_protocol_versions = 12;
  string web_endpoint = 13;                    // gRPC-Web шлюз ноды для браузера ('https://gw.node.example'); пусто = веб-клиент не поддерживается
}

message NavigatorSigningKey {
  string key_id = 1;
  bytes public_key = 2;
  google.protobuf.Timestamp expired_at = 3;
}

message ServiceEndpoint {
  string host = 1; // Хост
  int32 port = 2; // Порт
}

message RegisterServerRequest {
  ServerInfo server = 1; // Данные о сервере
}

message RegisterServerResponse {
  // Можно добавить поля при необходимости, пока пусто
}

message GetServerByNameRequest {
  string server_name = 1;
}

message GetServerByNameResponse {
  bool found = 1;
  ServerInfo server = 2;
}
