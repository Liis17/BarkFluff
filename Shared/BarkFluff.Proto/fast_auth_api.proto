syntax = "proto3";

option csharp_namespace = "BarkFluff.Proto.FastAuth";

import "google/protobuf/timestamp.proto";

package barkfluff.fast.auth;

service FastAuthApi {

  // Шаг 1. Анонимный клиент запрашивает QR-токен.
  // Метаданные нового устройства сервер забирает из gRPC headers
  // (x-device-name, x-os-name, x-app-name, x-app-version, x-ip-address).
  // Authorization: без авторизации
  rpc GenerateFastAuthToken(GenerateFastAuthTokenRequest) returns (GenerateFastAuthTokenResponse);

  // Шаг 2. Анонимный клиент подписывается на real-time статус.
  // Стрим живёт до финального статуса (ACCEPTED / REJECTED / EXPIRED).
  // На ACCEPTED отправляются access_token и refresh_token.
  // Authorization: без авторизации
  rpc SubscribeFastAuthResult(SubscribeFastAuthResultRequest) returns (stream FastAuthResult);

  // Шаг 3. Авторизованный мобильный клиент сканирует QR.
  // В ответе — метаданные нового устройства + одноразовый confirmation_code (GUID).
  // Authorization: User token
  rpc ScanFastAuth(ScanFastAuthRequest) returns (ScanFastAuthResponse);

  // Шаг 4a. Подтвердить вход. Передаются fast_auth_id и confirmation_code из ScanFastAuth.
  // Authorization: User token
  rpc AcceptFastAuth(AcceptFastAuthRequest) returns (AcceptFastAuthResponse);

  // Шаг 4b. Отклонить вход. Закрывает стрим со статусом REJECTED.
  // Authorization: User token
  rpc RejectFastAuth(RejectFastAuthRequest) returns (RejectFastAuthResponse);
}

service FastAuthServerApi {

  // Получить инфу о fast-auth сессии.
  // Authorization: xAuth Service токен
  rpc GetFastAuthInfo(GetFastAuthInfoRequest) returns (GetFastAuthInfoResponse);
}

message GenerateFastAuthTokenRequest {
  TokenFormat format = 1; // Формат — QR (PNG base64) или TEXT (значение fast_auth_id строкой).
}

message GenerateFastAuthTokenResponse {
  FastAuthToken token = 1;                       // Полезная нагрузка для отображения клиенту.
  string fast_auth_id = 2;                       // Идентификатор сессии (используется в Subscribe / Scan и т. д.).
  google.protobuf.Timestamp expires_at = 3;      // Время истечения сессии.
}

message SubscribeFastAuthResultRequest {
  string fast_auth_id = 1;
}

message FastAuthResult {
  FastAuthStatus status = 1;
  // Заполняются только при ACCEPTED:
  string access_token = 2;
  google.protobuf.Timestamp access_token_expires_at = 3;
  string refresh_token = 4;
  google.protobuf.Timestamp refresh_token_expires_at = 5;
}

message ScanFastAuthRequest {
  string fast_auth_id = 1;
}

message ScanFastAuthResponse {
  string device_name = 1;
  string operation_system = 2;
  string app_name = 3;
  string app_version = 4;
  string ip_address = 5;
  string confirmation_code = 6;                  // Одноразовый GUID, нужен для Accept/Reject.
  google.protobuf.Timestamp expires_at = 7;
}

message AcceptFastAuthRequest {
  string fast_auth_id = 1;
  string confirmation_code = 2;
}

message AcceptFastAuthResponse { }

message RejectFastAuthRequest {
  string fast_auth_id = 1;
  string confirmation_code = 2;
}

message RejectFastAuthResponse { }

message GetFastAuthInfoRequest {
  string fast_auth_id = 1;
}

message GetFastAuthInfoResponse {
  FastAuthStatus status = 1;
  google.protobuf.Timestamp expires_at = 2;
  int64 user_id = 3;                             // 0 если ещё не отсканировано.
}

message FastAuthToken {
  TokenFormat format = 1;
  string value = 2;
}

enum FastAuthStatus {
  FAST_AUTH_STATUS_UNKNOWN = 0;
  FAST_AUTH_STATUS_PENDING = 1;                  // Создан, ждёт сканирования.
  FAST_AUTH_STATUS_SCANNED = 2;                  // Мобильный отсканировал, ждёт Accept/Reject.
  FAST_AUTH_STATUS_ACCEPTED = 3;                 // Подтверждён, токены выпущены.
  FAST_AUTH_STATUS_REJECTED = 4;                 // Отклонён мобильным.
  FAST_AUTH_STATUS_EXPIRED = 5;                  // Истёк (TTL = 5 минут с момента генерации).
}

enum TokenFormat {
  TOKEN_FORMAT_UNKNOWN = 0;
  TOKEN_FORMAT_QR = 1;                           // PNG, base64.
  TOKEN_FORMAT_TEXT = 2;                         // Строковое значение fast_auth_id.
}
