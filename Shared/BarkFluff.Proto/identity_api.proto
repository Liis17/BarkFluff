syntax = "proto3";

option csharp_namespace = "BarkFluff.Proto.Identity";

import "google/protobuf/timestamp.proto";

package barkfluff.identity;

service IdentityApi {
  
  // Аторизация пользователя
  rpc Auth(AuthRequest) returns(AuthResponse); 
  
  // Быстрый вход
  rpc FastAuth(FastAuthRequest) returns(AuthResponse);
  
  // Получить токен по refresh токену
  rpc CreateToken(CreateTokenRequest) returns(CreateTokenResponse); 
  
  // Создать аккаунт
  rpc CreateAccount(CreateAccountRequest) returns(CreateAccountResponse); 
  
  // Подтвердить создания аккаунта
  rpc ConfirmAccount(ConfirmAccountRequest) returns(ConfirmAccountResponse);
  
  // Получить активные сессии
  rpc GetActiveSessions(GetActiveSessionsRequest) returns(GetActiveSessionsResponse);
  
  // Удалить активную сессию
  rpc RemoveActiveSession(RemoveActiveSessionRequest) returns(RemoveActiveSessionResponse);
  
  // Включить 2ФА авторизацию
  rpc EnableOtpVerification(EnableOtpVerificationRequest) returns(EnableOtpVerificationResponse);
  
  // Подтвержить включение 2ФА авторизации
  rpc ConfirmOtpVerification(ConfirmOtpVerificationRequest) returns(ConfirmOtpVerificationResponse);
  
  // Отключить метод 2ФА авторизации
  rpc DisableOtpVerification(DisableOtpVerificationRequest) returns(DisableOtpVerificationResponse);
  
  // Получить статус 2ФА авторизации
  rpc ListOtpVerification(ListOtpVerificationRequest) returns(ListOtpVerificationResponse);
  
  // Запрос на сброс пароля
  rpc ResetPassword(ResetPasswordRequest) returns(ResetPasswordResponse);
  
  // Подтвердить сброс пароля
  rpc ConfirmResetPassword(ConfirmResetPasswordRequest) returns(ConfirmResetPasswordResponse);
  
  // Установить пароль
  rpc SetPassword(SetPasswordRequest) returns(SetPasswordResponse);

  // Разлогиниться с текущего устройства
  rpc Logout(LogoutRequest) returns(LogoutResponse);

  rpc GetAuthCapabilities(GetAuthCapabilitiesRequest) returns(GetAuthCapabilitiesResponse);
  rpc BeginRegistration(BeginRegistrationRequest) returns(AuthChallengeResponse);
  rpc BeginSignIn(BeginSignInRequest) returns(AuthChallengeResponse);
  rpc GetAuthChallenge(AuthChallengeReference) returns(AuthChallengeResponse);
  rpc CompleteAuthChallenge(CompleteAuthChallengeRequest) returns(CompleteAuthChallengeResponse);
  rpc CancelAuthChallenge(AuthChallengeReference) returns(AuthChallengeResponse);
  rpc ResendAuthChallenge(AuthChallengeReference) returns(AuthChallengeResponse);
  rpc GetSecuritySettings(GetSecuritySettingsRequest) returns(SecuritySettingsResponse);
  rpc BeginReauthentication(BeginReauthenticationRequest) returns(AuthChallengeResponse);
  rpc UpdateSecuritySettings(UpdateSecuritySettingsRequest) returns(SecuritySettingsResponse);
  rpc BeginTelegramBinding(SecurityProofRequest) returns(AuthChallengeResponse);
  rpc UnlinkTelegram(UpdateSecuritySettingsRequest) returns(SecuritySettingsResponse);
  rpc BeginEmailBinding(BeginEmailBindingRequest) returns(AuthChallengeResponse);
  rpc GenerateRecoveryCodes(SecurityProofRequest) returns(RecoveryCodesResponse);
  rpc BeginPasswordRecovery(BeginPasswordRecoveryRequest) returns(AuthChallengeResponse);
  rpc SetRecoveredPassword(SetRecoveredPasswordRequest) returns(SetPasswordResponse);
}

// Серверное API для админ-панели
service IdentityServerApi {
  // Получить статус 2FA пользователя
  rpc ListOtpVerificationServer(ListOtpVerificationServerRequest) returns(ListOtpVerificationResponse);

  // Принудительно отключить 2FA пользователя
  rpc DisableOtpVerificationServer(DisableOtpVerificationServerRequest) returns(DisableOtpVerificationResponse);

  // Получить активные сессии пользователя
  rpc GetActiveSessionsServer(GetActiveSessionsServerRequest) returns(GetActiveSessionsResponse);

  // Удалить активную сессию пользователя
  rpc RemoveActiveSessionServer(RemoveActiveSessionServerRequest) returns(RemoveActiveSessionResponse);

  // Создать сессию (refresh + access) для пользователя из другого сервиса (например FastAuth).
  // Регистрирует устройство в Users, отправляет уведомление о входе.
  rpc CreateSessionForUserServer(CreateSessionForUserServerRequest) returns(CreateSessionForUserServerResponse);

  // Принудительно сменить пароль пользователя (для админ-панели, без OTP).
  // Отправляет email-уведомление пользователю.
  rpc ForceSetPasswordServer(ForceSetPasswordServerRequest) returns(ForceSetPasswordServerResponse);

  // Выпустить долгоживущий JWT для бота (вызывается сервисом Bots)
  rpc CreateBotTokenServer(CreateBotTokenServerRequest) returns(CreateBotTokenServerResponse);

  // Выпустить JWT для бота с уже существующим token_id, не отзывая действующий токен.
  rpc GetBotTokenServer(GetBotTokenServerRequest) returns(GetBotTokenServerResponse);
}

message CreateSessionForUserServerRequest {
  int64 user_id = 1;
  string device_id = 2;            // GUID нового устройства
  string device_name = 3;
  string operation_system = 4;
  string app_name = 5;             // "AppName v.X.Y.Z" (склеено вызывающим)
  string ip_address = 6;
  string attempt_id = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message CreateSessionForUserServerResponse {
  Token access_token = 1;
  Token refresh_token = 2;
  AuthChallengeState confirmation_state = 3;
}

message ListOtpVerificationServerRequest {
  int64 user_id = 1;
}

message DisableOtpVerificationServerRequest {
  int64 user_id = 1;
  OtpTypeId otp_type = 2;
}

message GetActiveSessionsServerRequest {
  int64 user_id = 1;
}

message RemoveActiveSessionServerRequest {
  int64 user_id = 1;
  string device_id = 2;
}

message CreateBotTokenServerRequest {
  int64 bot_user_id = 1; // Идентификатор бота (Users.Id)
}

message CreateBotTokenServerResponse {
  string token = 1; // JWT бота
  string token_id = 2; // Идентификатор выпуска токена (для отзыва)
}

message GetBotTokenServerRequest {
  int64 bot_user_id = 1; // Идентификатор бота (Users.Id)
  string token_id = 2; // Существующий идентификатор выпуска токена
}

message GetBotTokenServerResponse {
  string token = 1; // JWT бота с тем же token_id
}

// Принудительная смена пароля (серверный, для админ-панели)
message ForceSetPasswordServerRequest {
  int64 user_id = 1;
  string new_password = 2;
}

message ForceSetPasswordServerResponse { }

message ConfirmResetPasswordRequest {
  string reset_id = 1; // идентификатор сброса пароля
  string otp_code = 2; // код подтверждения
}

message ConfirmResetPasswordResponse {
  Token access_token = 1; // токен доступа
  Token refresh_token = 2; // токен обновления
}

message ResetPasswordRequest {
  oneof login {
    string username = 1; // имя пользователя
    string email = 2; // емейл
  }

  OtpTypeId otp_type = 3; // тип кода подверждения
}

message ResetPasswordResponse {
  string reset_id = 1; // идентификатор сброса пароля
}

message FastAuthRequest {
  string fast_auth_id = 1; // Идентификатор быстрого входа
}


message SendEmailOtpCodeRequest {
  
}

message SendEmailOtpCodeResponse {
  
}

message ListOtpVerificationRequest {
  
}

message ListOtpVerificationResponse {
  bool authenticator_enabled = 1; // Включен ли 2ФА по otp анутиифкатору
  bool email_enabled = 2; // Включен ли 2ФА по почте
}

enum OtpTypeId {
  Unknown = 0; // Неизвестный
  Authenticator = 1; // Гугл аунтификатор, etc
  Email = 2; // Почта
  Telegram = 3;
}

message DisableOtpVerificationRequest {
  
  OtpTypeId otp_type = 1; // Тип 2ФА авторизации
  
  string otp_code = 2; // Код для отключения (при отключении email не передавать)
  AuthChallengeReference security_proof = 3;
}

message DisableOtpVerificationResponse {
  
}

message ConfirmOtpVerificationRequest {
  string otp_code = 1; // ОТП код
  AuthChallengeReference security_proof = 2;
}

message ConfirmOtpVerificationResponse {
  repeated string recovery_codes = 1;
}

message EnableOtpVerificationRequest {
    OtpTypeId otp_type = 1; // Тип 2ФА авторизации
    AuthChallengeReference security_proof = 2;
}

message EnableOtpVerificationResponse {
  string otp_qr = 1; // base64 QR кода для подключения гугл аунтификатора
  string otp_code = 2; // код для подключения вручную
}

message RemoveActiveSessionRequest {
  string device_id = 1; // Идентификатор устройства (GUID)
}

message RemoveActiveSessionResponse { }

message GetActiveSessionsRequest { }

message GetActiveSessionsResponse {

  message Session {
    int64 id = 1; // Идентификатор сессии
    google.protobuf.Timestamp created_at = 2; // Когда был первый вход
    google.protobuf.Timestamp expiration_at = 3; // Когда сессия станет недействительной
    string device_id = 4; // Идентификатор устройства (GUID)
    string original_name = 5; // Оригинальное имя устройства
    string custom_name = 6; // Кастомное имя устройства
    string app_name = 7; // Имя приложения
    string operation_system = 8; // Операционная система
    string location = 9; // Страна/город
  }

  repeated Session sessions = 1; // Список сессий
}


message GenerateTestTokenRequest {
  int64 user_id = 1; // Идентификатор пользователя
}

message GenerateTestTokenResponse {
  string token = 1; // Токен доступа
}

message CreateAccountRequest {
  string first_name = 1; // Имя
  string last_name = 2; // Фамилия
  string username = 3; // Имя пользователя
  string email = 4; // Почта
}

message CreateAccountResponse { 
  string code_id = 1; // Идентификатор кода подтверждения
}

message ConfirmAccountRequest {
  string code_id = 1; // Идентификатор кода подтверждения
  string code_value = 2; // Значение кода
}

message ConfirmAccountResponse {
  Token refresh_token = 1; // Токен обновления
}


message CreateTokenRequest {
  string refresh_token = 1; // Токен обновления
}

message CreateTokenResponse {
  Token access_token = 2; // Токен доступа
}

message AuthRequest {
  oneof login {
    string username = 1; // имя пользователя
    string email = 2; // емейл
  }
  string password = 3; // пароль
  string otp_code = 4; // Код 2ФА авторизации
}

message AuthResponse {
  Token access_token = 1; // токен доступа
  Token refresh_token = 2; // токен обновления
}

message Token {
  string value = 1; // значение
  google.protobuf.Timestamp expiration_date = 2; // дата окончания действия
}

message SetPasswordRequest {
  string password = 1; // пароль
  string old_password = 2; // старый пароль (обязателен если пароль уже установлен)
}

message SetPasswordResponse { }

message LogoutRequest { }

message LogoutResponse { }

enum AuthLoginMode {
  LOGIN_MODE_UNSPECIFIED = 0;
  PASSWORD = 1;
  TELEGRAM_LOGIN = 2;
  PASSWORD_SECOND_FACTOR = 3;
}

enum AuthChallengeState {
  CHALLENGE_UNSPECIFIED = 0;
  WAITING = 1;
  APPROVED = 2;
  REJECTED = 3;
  EXPIRED = 4;
  COMPLETED = 5;
  CANCELLED = 6;
}

message GetAuthCapabilitiesRequest { }
message GetAuthCapabilitiesResponse {
  bool email_available = 1;
  bool telegram_available = 2;
  string telegram_bot_username = 3;
}
message AuthChallengeReference {
  string id = 1;
  string secret = 2;
}
message AuthChallengeResponse {
  AuthChallengeReference challenge = 1;
  AuthChallengeState state = 2;
  OtpTypeId factor = 3;
  string telegram_url = 4;
  google.protobuf.Timestamp expires_at = 5;
  repeated OtpTypeId available_factors = 6;
  bool needs_code = 7;
}
message BeginRegistrationRequest {
  string username = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  OtpTypeId confirmation_method = 6;
  AuthLoginMode login_mode = 7;
}
message BeginSignInRequest {
  string login = 1;
  string password = 2;
  AuthLoginMode login_mode = 3;
  OtpTypeId factor = 4;
  bool use_recovery_code = 5;
}
message CompleteAuthChallengeRequest {
  AuthChallengeReference challenge = 1;
  string code = 2;
  bool use_recovery_code = 3;
}
message CompleteAuthChallengeResponse {
  AuthChallengeState state = 1;
  AuthResponse session = 2;
  AuthChallengeReference security_proof = 3;
  repeated string recovery_codes = 4;
  string error_code = 5;
}
message GetSecuritySettingsRequest { }
message SecuritySettingsResponse {
  AuthLoginMode login_mode = 1;
  OtpTypeId preferred_factor = 2;
  bool authenticator_enabled = 3;
  bool email_enabled = 4;
  bool telegram_linked = 5;
  bool telegram_enabled = 6;
  bool telegram_otp_enabled = 7;
  bool fast_auth_telegram_enabled = 8;
  string telegram_username = 9;
  string verified_email = 10;
  int32 remaining_recovery_codes = 11;
  repeated string recovery_codes = 12;
}
message BeginReauthenticationRequest {
  string password = 1;
  OtpTypeId factor = 2;
  bool use_recovery_code = 3;
}
message SecurityProofRequest { AuthChallengeReference security_proof = 1; }
message UpdateSecuritySettingsRequest {
  AuthChallengeReference security_proof = 1;
  AuthLoginMode login_mode = 2;
  OtpTypeId preferred_factor = 3;
  bool telegram_enabled = 4;
  bool telegram_otp_enabled = 5;
  bool fast_auth_telegram_enabled = 6;
}
message BeginEmailBindingRequest {
  AuthChallengeReference security_proof = 1;
  string email = 2;
}
message RecoveryCodesResponse { repeated string codes = 1; }
message BeginPasswordRecoveryRequest { string login = 1; }
message SetRecoveredPasswordRequest {
  AuthChallengeReference security_proof = 1;
  string password = 2;
}
