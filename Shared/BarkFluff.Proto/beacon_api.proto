syntax = "proto3";

option csharp_namespace = "BarkFluff.Proto.Beacon";

package barkfluff.beacon;

service BeaconApi {
  
  // Получить инфу о сервере
  rpc GetServerInfo(GetServerInfoRequest) returns(GetServerInfoResponse);
}

message GetServerInfoRequest {
  
}

message GetServerInfoResponse {
  
  string name = 1; // Имя сервера
  
  string description = 2; // Описание сервера
  
  ServerColor color = 3; // Цвета сервера
  
  Service identity = 4; // Микросервис identity
  
  Service users = 5; // Микросервис users
  
  Service files = 6; // Микросервис files
  
  Service messages = 7; // Микросервис messages
  
  Service updates = 8; // Микросервис updates
  
  Service onliner = 9; // Микросервис onliner

  Service fast_auth = 10; // Микросервис fast_auth

  string public_name = 11; // Публичное имя сервера (@servername)

  string location = 12; // Локация сервера

  string livekit_url = 13; // WSS-адрес LiveKit SFU для звонков (пусто, если звонки не настроены)

  Service calls = 14; // Микросервис calls (gRPC-сигнализация звонков)

  Service bots = 15; // Микросервис bots (Bot API)

  string server_name = 16; // DNS-домен этой ноды (пусто, если федерация не настроена)

  bool federation_enabled = 17; // Включена ли федерация на ноде
}

message ServerColor {
  
  string lite_hex = 1; // Светлый цвет сервера
  
  string main_hex = 2; // Основной цвет сервера
  
  string hard_hex = 3; // Темный цвет сервера
}

message Service {
  string name = 1; // Название микросервиса
  
  ServiceEndpoint endpoint = 2; // Эндоинт микросервиса
  
  bool tls_enabled = 3; // Включен ли ssl
  
  ServiceStatus status = 4; // Состояние сервиса
}

enum ServiceStatus {
  Unknown = 0;
  Healthy = 1; // Живчик
  Degraded = 2; // Имеются отклонения
  Unhealthy = 3; // Нездоровый жесть
  Offline = 4; // Помер капец
}

message ServiceEndpoint {
  string host = 1; // Хост
  int32 port = 2; // Порт
}
