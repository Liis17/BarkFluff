syntax = "proto3";

option csharp_namespace = "BarkFluff.Proto.Users";

import "google/protobuf/timestamp.proto";
import "shared.proto";

package barkfluff.users;

service UsersApi {

  
  // Получить информацию о пользователе
  rpc GetUser(GetUserRequest) returns(GetUserResponse);
  
  // Установить аватарку
  rpc SetProfilePicture(SetProfilePictureRequest) returns(SetProfilePictureResponse);

  // Проверить существование юзернейма
  rpc CheckExistUsername(CheckExistUsernameRequest) returns(CheckExistResponse);

  // Проверить существование емейла
  rpc CheckExistEmail(CheckExistEmailRequest) returns(CheckExistResponse);
  
  // Изменить имя или фамилию
  rpc ChangeName(ChangeNameRequest) returns(ChangeNameResponse);
  
  // Изменить юзернейм
  rpc ChangeUsername(ChangeUsernameRequest) returns(ChangeUsernameResponse);
  
  // Изменить био
  rpc ChangeBio(ChangeBioRequest) returns(ChangeBioResponse);
  
  // Найти пользователей по имени/фамилии/юзернейму
  rpc SearchUsers(SearchUsersRequest) returns(SearchUsersResponse);

  // Резолв федеративного адреса @username:servername (Фаза 2; до неё — Unimplemented)
  rpc ResolveFederatedUser(ResolveFederatedUserRequest) returns (ResolveFederatedUserResponse);

  // Получить баджи пользователя
  rpc GetUserBadges(GetUserBadgesRequest) returns(GetUserBadgesResponse);

  // Получить список устройств текущего пользователя
  rpc GetDevices(GetDevicesRequest) returns(GetDevicesResponse);

  // Получить текущее устройство
  rpc GetCurrentDevice(GetCurrentDeviceRequest) returns(GetCurrentDeviceResponse);

  // Переименовать устройство
  rpc RenameDevice(RenameDeviceRequest) returns(RenameDeviceResponse);

  // Установить Firebase токен устройства
  rpc SetFirebaseToken(SetFirebaseTokenRequest) returns(SetFirebaseTokenResponse);

  // Включить или выключить уведомления для текущего устройства
  rpc SetNotificationsEnabled(SetNotificationsEnabledRequest) returns(SetNotificationsEnabledResponse);

  // Заглушить/включить уведомления для конкретного чата (per-chat mute)
  rpc SetChatMuted(SetChatMutedRequest) returns(SetChatMutedResponse);

  // Получить список замьюченных чатов текущего пользователя
  rpc GetMutedChats(GetMutedChatsRequest) returns(GetMutedChatsResponse);

  // Получить настройки приватности текущего пользователя
  rpc GetPrivacySettings(GetPrivacySettingsRequest) returns(GetPrivacySettingsResponse);

  // Обновить настройки приватности текущего пользователя
  rpc UpdatePrivacySettings(UpdatePrivacySettingsRequest) returns(UpdatePrivacySettingsResponse);

  // Получить персонализацию текущего пользователя
  rpc GetPersonalization(GetPersonalizationRequest) returns(GetPersonalizationResponse);

  // Обновить персонализацию текущего пользователя
  rpc UpdatePersonalization(UpdatePersonalizationRequest) returns(UpdatePersonalizationResponse);

  // Получить постер профиля текущего пользователя
  rpc GetProfilePoster(GetProfilePosterRequest) returns(GetProfilePosterResponse);

  // Установить (или удалить) постер профиля текущего пользователя
  rpc SetProfilePoster(SetProfilePosterRequest) returns(SetProfilePosterResponse);

  // Получить папки чатов текущего пользователя
  rpc GetChatFolders(GetChatFoldersRequest) returns(GetChatFoldersResponse);

  // Создать новую папку чатов
  rpc CreateChatFolder(CreateChatFolderRequest) returns(CreateChatFolderResponse);

  // Обновить папку чатов (частичное обновление)
  rpc UpdateChatFolder(UpdateChatFolderRequest) returns(UpdateChatFolderResponse);

  // Удалить папку чатов
  rpc DeleteChatFolder(DeleteChatFolderRequest) returns(DeleteChatFolderResponse);

  // Добавить чат в папку
  rpc AddChatToFolder(AddChatToFolderRequest) returns(AddChatToFolderResponse);

  // Удалить чат из папки
  rpc RemoveChatFromFolder(RemoveChatFromFolderRequest) returns(RemoveChatFromFolderResponse);

  // Изменить порядок папок
  rpc ReorderChatFolders(ReorderChatFoldersRequest) returns(ReorderChatFoldersResponse);

  // -- Prekey bundle (X3DH) для секретных чатов ---------------------------------
  //
  // Bundle принадлежит устройству (device_id берётся из текущей сессии).
  // identity_pubkey — Ed25519 (long-term ключ, не меняется).
  // signed_prekey   — X25519, подписан identity_key, ротируется периодически (~раз в неделю).
  // one_time_prekey — X25519, пул разовых ключей, расходуется FetchPrekeyBundle.
  // Сервер НЕ валидирует подпись signed_prekey — это делает клиент-получатель.

  // Зарегистрировать prekey-bundle текущего устройства (вызывается один раз после генерации ключей).
  rpc RegisterPrekeyBundle(RegisterPrekeyBundleRequest) returns(RegisterPrekeyBundleResponse);

  // Получить prekey-bundle устройства собеседника. Расходует одну one-time prekey (если осталась).
  rpc FetchPrekeyBundle(FetchPrekeyBundleRequest) returns(FetchPrekeyBundleResponse);

  // Список устройств пользователя c флагом наличия bundle (для выбора целевого устройства секретного чата).
  rpc ListPeerDevices(ListPeerDevicesRequest) returns(ListPeerDevicesResponse);

  // Пополнить пул one-time prekeys текущего устройства.
  rpc ReplenishOneTimePrekeys(ReplenishOneTimePrekeysRequest) returns(ReplenishOneTimePrekeysResponse);

  // Сменить signed prekey текущего устройства.
  rpc RotateSignedPrekey(RotateSignedPrekeyRequest) returns(RotateSignedPrekeyResponse);
}

service UsersServerApi {
  
  // Найти по логину
  rpc FindByLogin(FindByLoginRequest) returns(FindByLoginResponse);

  // Проверить существование юзернейма
  rpc CheckExistUsername(CheckExistUsernameRequest) returns(CheckExistResponse);

  // Проверить существование емейла
  rpc CheckExistEmail(CheckExistEmailRequest) returns(CheckExistResponse);
  
  // Добавить черновик юзера
  rpc AddDraftUser(AddDraftUserRequest) returns(AddDraftUserResponse);

  // Переопределить черновик пользователя
  rpc OverrideDraftUser(AddDraftUserRequest) returns(AddDraftUserResponse);
  
  // Подтвердить пользователя
  rpc ConfirmUser(ConfirmUserRequest) returns(ConfirmUserResponse);
  
  // Получить пользователя по id
  rpc GetById(GetByIdRequest) returns(GetByIdResponse);
  
  // Получить контакты пользователя по id
  rpc GetUserContacts(GetUserContactsRequest) returns(GetUserContactsResponse);
  
  // Получить пользователей по id
  rpc ListByIds(ListByIdsRequest) returns(ListByIdsResponse);

  // Назначить бадж пользователю
  rpc AssignUserBadge(AssignUserBadgeRequest) returns(AssignUserBadgeResponse);

  // Снять бадж с пользователя
  rpc RemoveUserBadge(RemoveUserBadgeRequest) returns(RemoveUserBadgeResponse);

  // Обновить приоритет баджа пользователя
  rpc UpdateUserBadgePriority(UpdateUserBadgePriorityRequest) returns(UpdateUserBadgePriorityResponse);

  // Создать новый бадж
  rpc CreateBadge(CreateBadgeRequest) returns(CreateBadgeResponse);

  // Получить все баджи
  rpc GetAllBadges(GetAllBadgesRequest) returns(GetAllBadgesResponse);

  // Обновить бадж
  rpc UpdateBadge(UpdateBadgeRequest) returns(UpdateBadgeResponse);

  // Удалить бадж
  rpc DeleteBadge(DeleteBadgeRequest) returns(DeleteBadgeResponse);

  // Экспорт всех данных пользователя (для GDPR и других целей)
  rpc ExportData(ExportDataRequest) returns(ExportDataResponse);

  // Зарегистрировать устройство (вызывается Identity при авторизации)
  rpc RegisterDevice(RegisterDeviceRequest) returns(RegisterDeviceResponse);

  // Получить устройства пользователя по userId
  rpc GetUserDevices(GetUserDevicesRequest) returns(GetUserDevicesResponse);

  // Удалить устройство пользователя
  rpc DeleteUserDevice(DeleteUserDeviceRequest) returns(DeleteUserDeviceResponse);

  // Обновить имя устройства и версию приложения (вызывается Identity при refresh токена)
  rpc UpdateDeviceAppInfo(UpdateDeviceAppInfoRequest) returns(UpdateDeviceAppInfoResponse);

  // Получить публичную информацию пользователя по юзернейму (для веб-сервера)
  rpc GetUserByUsername(GetUserByUsernameRequest) returns(GetUserByUsernameResponse);

  // Поиск пользователей (для админ-панели)
  rpc SearchUsersServer(SearchUsersServerRequest) returns(SearchUsersServerResponse);

  // Обновить лимит хранилища пользователя
  rpc UpdateStorageLimit(UpdateStorageLimitRequest) returns(UpdateStorageLimitResponse);

  // Установить аватарку пользователю (для админ-панели)
  rpc SetProfilePictureServer(SetProfilePictureServerRequest) returns(SetProfilePictureServerResponse);

  // Получить устройства с Firebase токенами
  rpc GetDevicesWithFirebaseTokens(GetDevicesWithFirebaseTokensRequest) returns(GetDevicesWithFirebaseTokensResponse);

  // Получить устройства с Firebase токенами по списку DeviceId (для админ-рассылки)
  rpc GetDevicesWithFirebaseTokensByDeviceIds(GetDevicesWithFirebaseTokensByDeviceIdsRequest) returns(GetDevicesWithFirebaseTokensResponse);

  // Получить ВСЕ устройства с Firebase токенами (для админ-рассылки на всех)
  rpc GetAllDevicesWithFirebaseTokens(GetAllDevicesWithFirebaseTokensRequest) returns(GetDevicesWithFirebaseTokensResponse);

  // Получить настройки приватности пользователя (для других микросервисов, напр. Onliner)
  rpc GetUserPrivacy(GetUserPrivacyRequest) returns(GetUserPrivacyResponse);

  // Получить подмножество чатов, замьюченных пользователем (для флага muted в Messages)
  rpc GetMutedChatIds(GetMutedChatIdsRequest) returns(GetMutedChatIdsResponse);

  // Обновить профиль пользователя (для админ-панели)
  rpc UpdateProfileServer(UpdateProfileServerRequest) returns(UpdateProfileServerResponse);

  // Установить постер профиля пользователя (для админ-панели)
  rpc SetProfilePosterServer(SetProfilePosterServerRequest) returns(SetProfilePosterServerResponse);

  // Получить URL постера профиля пользователя (для админ-панели)
  rpc GetProfilePosterServer(GetProfilePosterServerRequest) returns(GetProfilePosterServerResponse);

  // Создать бот-пользователя (для сервиса Bots). Идемпотентно: если username уже занят ботом — вернуть его id.
  rpc CreateBotUser(CreateBotUserRequest) returns(CreateBotUserResponse);

  // Удалить бот-аккаунт (для сервиса Bots): освободить username, исключить из поиска. Чаты сохраняются.
  rpc DeleteBotUser(DeleteBotUserRequest) returns(DeleteBotUserResponse);

  // Федерация: батч-upsert кешей remote-профилей (валидация — правила пиннинга uuid к server_name).
  // Этап 2.1.
  rpc UpsertRemoteUsers(UpsertRemoteUsersRequest) returns(UpsertRemoteUsersResponse);

  // Messages: батч-чтение профилей по UUID (локальные и remote вперемешку) для отображения remote-авторов.
  // Этап 2.1.
  rpc GetUsersByUuid(GetUsersByUuidRequest) returns(GetUsersByUuidResponse);

  // Федерация: профиль локального пользователя (privacy-фильтрованный) по username или uuid.
  // Используется S2S GetUserProfile. Этап 2.1.
  rpc GetFederatedProfile(GetFederatedProfileRequest) returns(GetFederatedProfileResponse);
}

// Удаление бот-аккаунта (серверный, для сервиса Bots)
message DeleteBotUserRequest {
  int64 user_id = 1; // идентификатор бота
}

message DeleteBotUserResponse { }

// Создание бот-пользователя (серверный, для сервиса Bots)
message CreateBotUserRequest {
  string username = 1;               // юзернейм бота (обязан заканчиваться на "bot", кроме bypass)
  string first_name = 2;             // отображаемое имя бота
  bool bypass_username_rules = 3;    // true для системных ботов (напр. botfather): пропустить проверку формата/суффикса
}

message CreateBotUserResponse {
  int64 user_id = 1;         // идентификатор созданного (или существующего) бота
  bool already_existed = 2;  // true если бот с таким username уже существовал
}

// Установить аватарку (серверный)
message SetProfilePictureServerRequest {
  int64 user_id = 1;
  string profile_picture_url = 2;         // ссылка на полное изображение
  string profile_picture_preview_url = 3; // ссылка на превью
}

message SetProfilePictureServerResponse { }

// Обновить профиль пользователя (серверный, для админ-панели)
message UpdateProfileServerRequest {
  int64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string bio = 4;
  string username = 5;
}

message UpdateProfileServerResponse { }

// Установить постер профиля (серверный, для админ-панели)
message SetProfilePosterServerRequest {
  int64 user_id = 1;
  string poster_file_id = 2; // пусто — удалить постер
}

message SetProfilePosterServerResponse { }

// Получить URL постера профиля (серверный, для админ-панели)
message GetProfilePosterServerRequest {
  int64 user_id = 1;
}

message GetProfilePosterServerResponse {
  string poster_url = 1; // пусто если постер не задан
}

// Поиск пользователей (серверный)
message SearchUsersServerRequest {
  string query = 1;   // Поиск по username или user_id (пустой = все)
  int32 offset = 2;
  int32 size = 3;     // макс 50
}

message SearchUsersServerResponse {
  repeated User users = 1;
  int32 total_count = 2;
}

// Обновление лимита хранилища
message UpdateStorageLimitRequest {
  int64 user_id = 1;
  int32 storage_limit_gb = 2; // 1-250
}

message UpdateStorageLimitResponse {
  User user = 1;
}

message SearchUsersRequest {
  string query = 1; // Поисковой запрос
  barkfluff.shared.PageRequest pagination = 2; // Пагинация (макс 50 элементов)
}

message SearchUsersResponse {
  repeated User users = 1;

  int32 total_count = 2; // Общее количество чатов
}


message ChangeBioRequest {
  string bio = 1; // Новое био
}

message ChangeBioResponse { }

message ChangeUsernameRequest {
  string username = 1; // Имя пользователя
}

message ChangeUsernameResponse {
  
}

message ChangeNameRequest {
  string first_name = 1; // Имя
  string last_name = 2; // Фамилия
}

message ChangeNameResponse { }

message ListByIdsRequest {
  repeated int64 ids = 1; // айдишники
}

message ListByIdsResponse {
  repeated User users = 1; // пользователи
}

message SetProfilePictureRequest {
  string file_id = 1; // идетификатор файла
}

message SetProfilePictureResponse { }

message GetUserContactsRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message GetUserContactsResponse {
  User user = 1; // пользователб
  UserContact contact = 2; // контакты пользователя
}

message UserContact {
  string email = 1; // эл. почта
}

message GetByIdRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message GetByIdResponse {
  User user = 1; // пользователь
}

message GetUserRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message GetUserResponse {
  User user = 1; // пользователь
}

message ConfirmUserRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message ConfirmUserResponse { }



message AddDraftUserRequest {
  string first_name = 1; // имя 
  string last_name = 2; // фамилия
  string username = 3; // имя пользователя
  string email = 4; // почта
}

message AddDraftUserResponse {
  int64 user_id = 1; // идентификатор пользователя
}

message CheckExistEmailRequest {
  string email = 1; // эл. почта
}

message CheckExistUsernameRequest {
  string username = 1; // имя пользователя
}

message CheckExistResponse {
  bool exist = 1; // существует или нет
}


message FindByLoginRequest {
  oneof login {
    string username = 1; // имя пользователя
    string email = 2; // почта
  }
}

message FindByLoginResponse {
  User user = 1; // пользователь
}

message User{
  int64 id = 1; // идентификатор пользователя
  string first_name = 2; // имя
  string last_name = 3; // фамилия
  string username = 4; // юзернейм
  google.protobuf.Timestamp registration_date = 5; // дата регистрации
  string profile_picture = 6; // ссылка на аватарку пользователя
  string bio = 7; // Био
  string profile_picture_preview = 8; // ссылка на превью аватарки
  repeated UserBadge badges = 9; // баджи пользователя
  int32 storage_limit_gb = 10; // лимит хранилища в гигабайтах
  string profile_poster_file_id = 11; // FileId постера/фона профиля (пусто если не задан)
  bool is_bot = 12; // является ли пользователь ботом
  string uuid = 13; // Глобально уникальный идентификатор пользователя (Guid), для федерации
}

message ResolveFederatedUserRequest {
  string fid = 1; // "@username:servername" (допускается без @)
}

message ResolveFederatedUserResponse {
  bool found = 1;
  string uuid = 2;
  string username = 3;
  string server_name = 4;
  string first_name = 5;
  string last_name = 6;
  string bio = 7;
  string avatar_url = 8; // проксируемый URL своей ноды (пусто, если скрыт/нет)
}

// Сообщения для работы с баджами

message Badge {
  int32 id = 1; // идентификатор баджа
  string name = 2; // название баджа
  string description = 3; // описание баджа
  string image_url = 4; // ссылка на изображение баджа
  google.protobuf.Timestamp created_date = 5; // дата создания
  bool is_active = 6; // активен ли бадж
}

message UserBadge {
  Badge badge = 1; // информация о бадже
  int32 priority = 2; // приоритет отображения (меньше = выше приоритет)
  google.protobuf.Timestamp assigned_date = 3; // дата назначения
}

// Запросы и ответы для получения баджей пользователя

message GetUserBadgesRequest {
  int64 user_id = 1; // идентификатор пользователя
  optional int32 limit = 2; // лимит количества баджей (1 для списков, 3 для профиля, null для всех)
}

message GetUserBadgesResponse {
  repeated UserBadge badges = 1; // баджи пользователя, отсортированные по приоритету
}

// Запросы и ответы для назначения баджа

message AssignUserBadgeRequest {
  int64 user_id = 1; // идентификатор пользователя
  int32 badge_id = 2; // идентификатор баджа
  optional int32 priority = 3; // приоритет (по умолчанию 1000)
}

message AssignUserBadgeResponse {
  UserBadge user_badge = 1; // назначенный бадж
}

// Запросы и ответы для снятия баджа

message RemoveUserBadgeRequest {
  int64 user_id = 1; // идентификатор пользователя
  int32 badge_id = 2; // идентификатор баджа
}

message RemoveUserBadgeResponse {
  bool success = 1; // успешность операции
}

// Запросы и ответы для обновления приоритета баджа

message UpdateUserBadgePriorityRequest {
  int64 user_id = 1; // идентификатор пользователя
  int32 badge_id = 2; // идентификатор баджа
  int32 new_priority = 3; // новый приоритет
}

message UpdateUserBadgePriorityResponse {
  UserBadge user_badge = 1; // обновленный бадж
}

// Запросы и ответы для создания баджа

message CreateBadgeRequest {
  string name = 1; // название баджа
  string description = 2; // описание баджа
  string image_url = 3; // ссылка на изображение баджа
}

message CreateBadgeResponse {
  Badge badge = 1; // созданный бадж
}

// Запросы и ответы для получения всех баджей

message GetAllBadgesRequest {
  bool include_inactive = 1; // включать ли неактивные баджи
}

message GetAllBadgesResponse {
  repeated Badge badges = 1; // список всех баджей
}

// Запросы и ответы для обновления баджа

message UpdateBadgeRequest {
  int32 id = 1; // идентификатор баджа
  string name = 2; // новое название баджа
  string description = 3; // новое описание баджа
  string image_url = 4; // новая ссылка на изображение баджа
  bool is_active = 5; // активен ли бадж
}

message UpdateBadgeResponse {
  Badge badge = 1; // обновлённый бадж
}

// Запросы и ответы для удаления баджа

message DeleteBadgeRequest {
  int32 id = 1; // идентификатор баджа
}

message DeleteBadgeResponse {
  bool success = 1; // результат удаления
}

// Экспорт данных пользователя

message ExportDataRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message ExportDataResponse {
  repeated JsonFile files = 1; // массив JSON файлов с данными
}

message JsonFile {
  string filename = 1; // имя файла (например, "profile.json", "messages.json")
  string content = 2; // содержимое файла в формате JSON
}

// Сообщения для работы с устройствами

message Device {
  string device_id = 1; // Уникальный идентификатор устройства (GUID)
  int64 user_id = 2; // Идентификатор пользователя
  string original_name = 3; // Оригинальное имя устройства
  string custom_name = 4; // Кастомное имя устройства (задается пользователем)
  google.protobuf.Timestamp authorized_at = 5; // Дата и время авторизации
  string app_name = 6; // Имя приложения
  string operation_system = 7; // Операционная система
  string location = 8; // Страна/город
  bool notifications_enabled = 9; // Включены ли push-уведомления на этом устройстве
}

// Запросы и ответы для получения списка устройств

message GetDevicesRequest { }

message GetDevicesResponse {
  repeated Device devices = 1; // Список устройств пользователя
}

// Запросы и ответы для получения текущего устройства

message GetCurrentDeviceRequest { }

message GetCurrentDeviceResponse {
  Device device = 1; // Текущее устройство
}

// Запросы и ответы для переименования устройства

message RenameDeviceRequest {
  string device_id = 1; // Идентификатор устройства
  string custom_name = 2; // Новое кастомное имя
}

message RenameDeviceResponse { }

// Запросы и ответы для регистрации устройства (внутренний эндпоинт)

message RegisterDeviceRequest {
  string device_id = 1; // Уникальный идентификатор устройства (GUID)
  int64 user_id = 2; // Идентификатор пользователя
  string original_name = 3; // Оригинальное имя устройства
