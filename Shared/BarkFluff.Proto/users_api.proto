// -- Prekey bundle (X3DH) -------------------------------------------------------

// X25519 prekey, подписанный identity-ключом устройства.
message SignedPreKey {
  uint32 prekey_id = 1; // ID prekey (генерируется устройством, уникален в рамках устройства)
  bytes public_key = 2; // X25519 публичный ключ (32 байта)
  bytes signature = 3;  // Ed25519-подпись public_key, сделанная identity-ключом устройства (64 байта)
}

// X25519 разовая prekey. Расходуется при первом FetchPrekeyBundle.
message OneTimePreKey {
  uint32 prekey_id = 1; // ID prekey (уникален в рамках устройства)
  bytes public_key = 2; // X25519 публичный ключ (32 байта)
}

// Bundle для X3DH-инициации сессии Double Ratchet.
message PrekeyBundle {
  string device_id = 1;             // Устройство, которому принадлежит bundle
  uint32 registration_id = 2;       // ID регистрации устройства в libsignal
  bytes identity_pubkey = 3;        // Ed25519 публичный identity-ключ устройства (32 байта)
  SignedPreKey signed_prekey = 4;   // Текущий signed prekey
  OneTimePreKey one_time_prekey = 5; // Разовая prekey (отсутствует если пул исчерпан)
  bool has_one_time_prekey = 6;     // true если one_time_prekey заполнен — позволяет различать "пусто" и "не задан"
}

// Регистрация bundle текущего устройства

message RegisterPrekeyBundleRequest {
  uint32 registration_id = 1;            // ID регистрации устройства в libsignal
  bytes identity_pubkey = 2;             // Ed25519 публичный identity-ключ устройства (32 байта)
  SignedPreKey signed_prekey = 3;        // Начальный signed prekey
  repeated OneTimePreKey one_time_prekeys = 4; // Стартовый пул разовых prekeys (рекомендуется 100 шт)
}

message RegisterPrekeyBundleResponse { }

// Получение bundle устройства собеседника

message FetchPrekeyBundleRequest {
  int64 user_id = 1;       // ID пользователя-собеседника
  string device_id = 2;    // ID устройства собеседника
}

message FetchPrekeyBundleResponse {
  PrekeyBundle bundle = 1;     // Bundle с расходуемой one-time prekey (если осталась)
  int32 remaining_one_time_prekeys = 2; // Сколько prekey осталось у этого устройства после fetch
}

// Список устройств пользователя для выбора цели секретного чата

message ListPeerDevicesRequest {
  int64 user_id = 1; // ID пользователя
}

message ListPeerDevicesResponse {
  repeated PeerDeviceInfo devices = 1; // Устройства пользователя
}

message PeerDeviceInfo {
  string device_id = 1;   // ID устройства
  string display_name = 2; // Имя для отображения (custom_name либо original_name)
  bool has_bundle = 3;    // true если устройство зарегистрировало prekey-bundle (без этого секретный чат с ним невозможен)
  google.protobuf.Timestamp last_seen_at = 4; // Время последней активности (опционально, для сортировки в UI)
}

// Пополнение пула one-time prekeys текущего устройства

message ReplenishOneTimePrekeysRequest {
  repeated OneTimePreKey prekeys = 1; // Новые prekeys; ID не должны пересекаться с уже существующими у устройства
}

message ReplenishOneTimePrekeysResponse {
  int32 total_one_time_prekeys = 1; // Сколько prekey теперь у устройства всего
}

// Ротация signed prekey текущего устройства

message RotateSignedPrekeyRequest {
  SignedPreKey signed_prekey = 1; // Новый signed prekey (старый удерживается на сервере короткое время для in-flight handshakes)
}

message RotateSignedPrekeyResponse { }

// -- Федеративные профили (этап 2.1) --------------------------------------------

// Одна запись батча UpsertRemoteUsers. Federation присылает профиль, полученный с origin-ноды;
// Users применяет правила пиннинга (uuid↔server_name) и возвращает per-запись результат.
message UpsertRemoteUserInfo {
  string uuid = 1;            // UUID с origin-ноды (PK в RemoteUsers)
  string username = 2;
  string server_name = 3;     // punycode A-label lowercase
  string first_name = 4;
  string last_name = 5;
  string bio = 6;
  string avatar_file_id = 7;  // FileId на origin (пусто = нет)
  bool is_deactivated = 8;
}

message UpsertRemoteUsersRequest {
  repeated UpsertRemoteUserInfo records = 1;
}

message UpsertRemoteUserResult {
  string uuid = 1;
  bool ok = 2;
  // Пусто при ok=true. Возможные значения: "LocalUuidCollision", "ServerNameMismatch".
  string reject_reason = 3;
}

message UpsertRemoteUsersResponse {
  repeated UpsertRemoteUserResult results = 1;
}

// Профиль пользователя по UUID (локальный или remote). Для рендеринга remote-авторов в Messages.
message UserProfileByUuid {
  string uuid = 1;
  bool found = 2;
  bool is_remote = 3;        // true — RemoteUser, false — локальный User
  string server_name = 4;    // punycode A-label lowercase (пусто для локального)
  string username = 5;
  string first_name = 6;
  string last_name = 7;
  string bio = 8;            // локальный: после privacy-фильтра (None здесь — для межсервисного запроса отдаём как есть)
  string avatar_file_id = 9; // для локального: ProfilePicture; для remote: AvatarFileId на origin
  bool is_deactivated = 10;  // только для remote
}

message GetUsersByUuidRequest {
  repeated string uuids = 1; // Guid в строковой форме
}

message GetUsersByUuidResponse {
  repeated UserProfileByUuid users = 1;
}

// Privacy-фильтрованный профиль локального пользователя для S2S-отдачи (GetUserProfile).
// bio/avatar_file_id пустые, если скрыты privacy; found=false если профиль скрыт целиком или
// пользователь деактивирован/черновик.
message GetFederatedProfileRequest {
  oneof user {
    string username = 1; // username без домена
    string uuid = 2;     // Guid в строковой форме
  }
}

message GetFederatedProfileResponse {
  bool found = 1;
  string uuid = 2;
  string username = 3;
  string first_name = 4;
  string last_name = 5;
  string bio = 6;
  string avatar_file_id = 7; // FileId на этой ноде (пусто если скрыт/нет)
}
