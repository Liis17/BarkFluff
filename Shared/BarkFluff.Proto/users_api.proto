syntax = "proto3";

option csharp_namespace = "BarkFluff.Proto.Users";

import "google/protobuf/timestamp.proto";
import "shared.proto";

package barkfluff.users;

service UsersApi {

  
  // Получить информацию о пользователе
  rpc GetUser(GetUserRequest) returns(GetUserResponse);
  
  // Установить аватарку
  rpc SetProfilePicture(SetProfilePictureRequest) returns(SetProfilePictureResponse);

  // Проверить существование юзернейма
  rpc CheckExistUsername(CheckExistUsernameRequest) returns(CheckExistResponse);

  // Проверить существование емейла
  rpc CheckExistEmail(CheckExistEmailRequest) returns(CheckExistResponse);
  
  // Изменить имя или фамилию
  rpc ChangeName(ChangeNameRequest) returns(ChangeNameResponse);
  
  // Изменить юзернейм
  rpc ChangeUsername(ChangeUsernameRequest) returns(ChangeUsernameResponse);
  
  // Изменить био
  rpc ChangeBio(ChangeBioRequest) returns(ChangeBioResponse);
  
  // Найти пользователей по имени/фамилии/юзернейму
  rpc SearchUsers(SearchUsersRequest) returns(SearchUsersResponse);
}

service UsersServerApi {
  
  // Найти по логину
  rpc FindByLogin(FindByLoginRequest) returns(FindByLoginResponse);

  // Проверить существование юзернейма
  rpc CheckExistUsername(CheckExistUsernameRequest) returns(CheckExistResponse);

  // Проверить существование емейла
  rpc CheckExistEmail(CheckExistEmailRequest) returns(CheckExistResponse);
  
  // Добавить черновик юзера
  rpc AddDraftUser(AddDraftUserRequest) returns(AddDraftUserResponse);

  // Переопределить черновик пользователя
  rpc OverrideDraftUser(AddDraftUserRequest) returns(AddDraftUserResponse);
  
  // Подтвердить пользователя
  rpc ConfirmUser(ConfirmUserRequest) returns(ConfirmUserResponse);
  
  // Получить пользователя по id
  rpc GetById(GetByIdRequest) returns(GetByIdResponse);
  
  // Получить контакты пользователя по id
  rpc GetUserContacts(GetUserContactsRequest) returns(GetUserContactsResponse);
  
  // Получить пользователей по id
  rpc ListByIds(ListByIdsRequest) returns(ListByIdsResponse);
}

message SearchUsersRequest {
  string query = 1; // Поисковой запрос
  barkfluff.shared.PageRequest pagination = 2; // Пагинация (макс 50 элементов)
}

message SearchUsersResponse {
  repeated User users = 1;

  int32 total_count = 2; // Общее количество чатов
}

message ChangeUserPasswordRequest {
  string new_password = 1; // новый пароль
  int64 user_id = 2; // идентификатор пользователя
}

message ChangeUserPasswordResponse { 
  string password_hash = 1;
}

message ChangeBioRequest {
  string bio = 1; // Новое био
}

message ChangeBioResponse { }

message ChangeUsernameRequest {
  string username = 1; // Имя пользователя
}

message ChangeUsernameResponse {
  
}

message ChangeNameRequest {
  string first_name = 1; // Имя
  string last_name = 2; // Фамилия
}

message ChangeNameResponse { }

message ListByIdsRequest {
  repeated int64 ids = 1; // айдишники
}

message ListByIdsResponse {
  repeated User users = 1; // пользователи
}

message SetProfilePictureRequest {
  string file_id = 1; // идетификатор файла
}

message SetProfilePictureResponse { }

message GetUserContactsRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message GetUserContactsResponse {
  User user = 1; // пользователб
  UserContact contact = 2; // контакты пользователя
}

message UserContact {
  string email = 1; // эл. почта
}

message GetByIdRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message GetByIdResponse {
  User user = 1; // пользователь
}

message GetUserRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message GetUserResponse {
  User user = 1; // пользователь
}

message ConfirmUserRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message ConfirmUserResponse { }



message AddDraftUserRequest {
  string first_name = 1; // имя 
  string last_name = 2; // фамилия
  string username = 3; // имя пользователя
  string email = 4; // почта
}

message AddDraftUserResponse {
  int64 user_id = 1; // идентификатор пользователя
}

message CheckExistEmailRequest {
  string email = 1; // эл. почта
}

message CheckExistUsernameRequest {
  string username = 1; // имя пользователя
}

message CheckExistResponse {
  bool exist = 1; // существует или нет
}


message FindByLoginRequest {
  oneof login {
    string username = 1; // имя пользователя
    string email = 2; // почта
  }
}

message FindByLoginResponse {
  User user = 1; // пользователь
}

message User{
  int64 id = 1; // идентификатор пользователя
  string first_name = 2; // имя
  string last_name = 3; // фамилия
  string username = 4; // юзернейм
  google.protobuf.Timestamp registration_date = 5; // дата регистрации
  string profile_picture = 6; // ссылка на аватарку пользователя
  string bio = 7; // Био
}

