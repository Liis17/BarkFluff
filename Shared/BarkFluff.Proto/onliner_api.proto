syntax = "proto3";

option csharp_namespace = "BarkFluff.Proto.Onliner";

import "google/protobuf/timestamp.proto";

package barkfluff.onliner;

message SubscribeToOnlineStatusRequest {
  repeated int64 user_ids = 1; // Идентификаторы пользователей
  repeated string user_uuids = 2; // remote-пользователи (UUID); объединяется с user_ids
}

message GetOnlineStatusRequest {
  repeated int64 user_ids = 1;
}

message GetOnlineStatusResponse {
  repeated UserOnlineStatus users_statuses = 1;
}

message SetOnlineStatusRequest { }

message SetOnlineStatusResponse { }

message UserOnlineStatus {
  int64 user_id = 1; // Идентификатор пользователя
  StatusTypeId status = 2; // Тип состояния
  google.protobuf.Timestamp last_seen = 3; // Дата последнего изменения статуса
  string user_uuid = 4; // заполнен для remote-пользователя (тогда user_id = 0)
}

message ChangeUsersInSubscriptionRequest {
  repeated int64 user_ids = 1; // Новый массив идентификаторов пользователей
  repeated string user_uuids = 2; // remote-пользователи (UUID); объединяется с user_ids
}

message ChangeUsersInSubscriptionResponse {

}

message SetTypingStatusRequest {
  string chat_id = 1; // Чат (Guid-строка), в котором пользователь печатает
  TypingAction action = 2; // Действие: печатает / прекратил (по умолчанию — печатает)
}

message SetTypingStatusResponse { }

message SubscribeToTypingRequest {
  repeated string chat_ids = 1; // Чаты (Guid-строки), для которых нужны индикаторы набора
}

message TypingEvent {
  string chat_id = 1; // Чат (Guid-строка), в котором происходит набор
  int64 user_id = 2; // Кто печатает
  TypingAction action = 3; // Действие
  string user_uuid = 4; // кто печатает, если remote (тогда user_id = 0)
}

message ChangeChatsInTypingSubscriptionRequest {
  repeated string chat_ids = 1; // Новый массив идентификаторов чатов (Guid-строки)
}

message ChangeChatsInTypingSubscriptionResponse { }

enum StatusTypeId {
  STATUS_TYPE_ID_UNKNOWN = 0;
  STATUS_ONLINE = 1;
  STATUS_OFFLINE = 2;
}

enum TypingAction {
  TYPING_ACTION_UNKNOWN = 0;
  TYPING_ACTION_TYPING = 1;
  TYPING_ACTION_CANCELLED = 2;
}

service OnlinerApi {
  
  // Подписаться на изменения статуса онлайна
  rpc SubscribeToOnlineStatus(SubscribeToOnlineStatusRequest) returns (stream UserOnlineStatus);
  
  // Установить статус "В сети"
  rpc SetOnlineStatus(SetOnlineStatusRequest) returns (SetOnlineStatusResponse);
  
  // Получить статус пользователей
  rpc GetOnlineStatus(GetOnlineStatusRequest) returns (GetOnlineStatusResponse);
  
  // Изменить список пользователей на которые ты подписан
  rpc ChangeUsersInSubscription(ChangeUsersInSubscriptionRequest) returns (ChangeUsersInSubscriptionResponse);

  // Сообщить, что пользователь печатает в чате (heartbeat, ретранслируется участникам)
  rpc SetTypingStatus(SetTypingStatusRequest) returns (SetTypingStatusResponse);

  // Подписаться на индикаторы набора текста в выбранных чатах
  rpc SubscribeToTyping(SubscribeToTypingRequest) returns (stream TypingEvent);

  // Изменить список чатов, для которых приходят индикаторы набора
  rpc ChangeChatsInTypingSubscription(ChangeChatsInTypingSubscriptionRequest) returns (ChangeChatsInTypingSubscriptionResponse);
}

// Внутренний API (TokenType.Service): мост федеративного presence/typing.
// Реализация — Фаза 4.
service OnlinerServerApi {

  // Federation вливает статус remote-пользователя в in-memory кеш
  rpc UpsertRemoteStatus(UpsertRemoteStatusRequest) returns (UpsertRemoteStatusResponse);

  // Federation вливает typing remote-пользователя для ретрансляции подписчикам чата
  rpc InjectRemoteTyping(InjectRemoteTypingRequest) returns (InjectRemoteTypingResponse);
}

message UpsertRemoteStatusRequest {
  string user_uuid = 1;
  StatusTypeId status = 2;
  google.protobuf.Timestamp last_seen = 3;
}

message UpsertRemoteStatusResponse { }

message InjectRemoteTypingRequest {
  string chat_id = 1;
  string user_uuid = 2;
  TypingAction action = 3;
}

message InjectRemoteTypingResponse { }
