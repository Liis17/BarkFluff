syntax = "proto3";

option csharp_namespace = "BarkFluff.Proto.Files";

package barkfluff.files;

service FilesApi {
  rpc SayHello (HelloRequest) returns (HelloResponse);
}

message HelloRequest {
  int32 firstName = 1;
  string name = 2;
}

message HelloResponse {
  int32 code = 1;
}

message Hui {
  string Loh = 1;
  string Gay = 2;
}