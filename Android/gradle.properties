org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Ограничиваем параллельные воркеры и Kotlin-демон, чтобы не выйти за ОЗУ слабого раннера.
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536m
# VFS file-watching даёт лишний disk I/O (особенно в WSL) — на CI не нужен.
org.gradle.vfs.watch=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
