syntax = "proto3";

option csharp_namespace = "BarkFluff.Proto.Messages";

import "shared.proto";
import "google/protobuf/timestamp.proto";

package barkfluff.messages;

service MessagesApi {
  
  // Получить список чатов
  rpc ListChats(ListChatsRequest) returns(ListChatsResponse);
  
  // Получить список сообщений в чате
  rpc ListMessages(ListMessagesRequest) returns(ListMessagesResponse);
  
  // Получить список участников в чате
  rpc ListChatMembers(ListChatMembersRequest) returns(ListChatMembersResponse);
  
  // Отправить сообщение в чат
  rpc SendMessage(SendMessageRequest) returns(SendMessageResponse);
  
  // Создать групповой чат
  rpc CreateGroupChat(CreateGroupChatRequest) returns(CreateGroupChatResponse);
  
  // Убрать пользователя из группового чата
  rpc KickUser(KickUserRequest) returns(KickUserResponse);

  // Добавить пользователя в групповой чат
  rpc AddUser(AddUserRequest) returns(AddUserResponse);

  // Изменить групповой чат (название и/или аватар)
  rpc UpdateGroupChat(UpdateGroupChatRequest) returns(UpdateGroupChatResponse);

  // Отментить сообщения как прочитанные
  rpc MarkAsRead(MarkAsReadRequest) returns(MarkAsReadResponse);

  // Получить список вложений в чате
  rpc ListChatAttachments(ListChatAttachmentsRequest) returns(ListChatAttachmentsResponse);

  // Получить ID личного чата с пользователем
  rpc GetPersonChatId(GetPersonChatIdRequest) returns(GetPersonChatIdResponse);

  // Получить информацию о чате
  rpc GetChatInfo(GetChatInfoRequest) returns(GetChatInfoResponse);

  // Получить сохранённый черновик обычного чата
  rpc GetChatDraft(GetChatDraftRequest) returns(GetChatDraftResponse);

  // Создать или заменить черновик обычного чата
  rpc UpsertChatDraft(UpsertChatDraftRequest) returns(UpsertChatDraftResponse);

  // Удалить черновик, только если его версия не изменилась
  rpc DeleteChatDraft(DeleteChatDraftRequest) returns(DeleteChatDraftResponse);

  // Редактировать сообщение (текст и/или вложения)
  rpc EditMessage(EditMessageRequest) returns(EditMessageResponse);

  // Удалить сообщение (soft-delete: скрывается у всех клиентов)
  rpc DeleteMessage(DeleteMessageRequest) returns(DeleteMessageResponse);

  // Закрепить сообщение в чате
  rpc PinMessage(PinMessageRequest) returns(PinMessageResponse);

  // Открепить сообщение в чате
  rpc UnpinMessage(UnpinMessageRequest) returns(UnpinMessageResponse);

  // Получить список закреплённых сообщений в чате
  rpc ListPinnedMessages(ListPinnedMessagesRequest) returns(ListPinnedMessagesResponse);

  // Открепить все сообщения в чате
  rpc UnpinAll(UnpinAllRequest) returns(UnpinAllResponse);

  // -- Приватные чаты (E2E через passphrase) ------------------------------------
  //
  // Сервер хранит только шифротекст (EncryptedMessage) и метаданные чата
  // (kdf_salt, passphrase_verifier). Ключ AES-256-GCM выводится клиентом из
  // passphrase через Argon2id(passphrase, kdf_salt). Сервер расшифровать
  // не может. Приватные чаты — только 1-к-1 на первой итерации.

  // Создать приватный чат с пользователем. Собеседник присоединится через AcceptPrivateChat
  // после получения SubscribePrivateChatInvites и проверки passphrase.
  rpc CreatePrivateChat(CreatePrivateChatRequest) returns(CreatePrivateChatResponse);

  // Присоединиться к приватному чату (вызывается приглашённым после успешной проверки verifier на клиенте).
  rpc AcceptPrivateChat(AcceptPrivateChatRequest) returns(AcceptPrivateChatResponse);

  // Отклонить приглашение в приватный чат (приглашённым).
  rpc RejectPrivateChat(RejectPrivateChatRequest) returns(RejectPrivateChatResponse);

  // Отправить шифрованное сообщение в приватный чат.
  rpc SendPrivateMessage(SendPrivateMessageRequest) returns(SendPrivateMessageResponse);

  // Получить список шифрованных сообщений приватного чата (двунаправленная пагинация по аналогии с ListMessages).
  rpc ListPrivateMessages(ListPrivateMessagesRequest) returns(ListPrivateMessagesResponse);

  // Редактировать шифрованное сообщение (новый ciphertext+nonce+AAD).
  rpc EditPrivateMessage(EditPrivateMessageRequest) returns(EditPrivateMessageResponse);

  // Удалить шифрованное сообщение (soft-delete; ciphertext очищается).
  rpc DeletePrivateMessage(DeletePrivateMessageRequest) returns(DeletePrivateMessageResponse);

  // Отметить все зашифрованные сообщения до указанного как прочитанные.
  rpc MarkPrivateMessagesAsRead(MarkPrivateMessagesAsReadRequest) returns(MarkPrivateMessagesAsReadResponse);

  // -- Секретные чаты (Signal Double Ratchet) -----------------------------------
  //
  // Сервер НЕ хранит ни сам чат, ни сообщения. Метаданные чата держит только
  // клиент-инициатор и клиент-получатель в локальном хранилище. Сервер выполняет
  // три функции: (1) релэит SecretEnvelope получателю, (2) буферизует в Redis
  // (TTL 24ч) если получатель оффлайн, (3) шлёт push без содержимого.
  // Все секретные чаты — 1-к-1 и привязаны к конкретным устройствам обеих сторон.

  // Отправить инвайт секретного чата. Содержит initial X3DH message (PreKeySignalMessage).
  // Инвайт буферизуется на сервере (Redis, TTL 24ч) до Accept/Reject получателя.
  rpc SendSecretChatInvite(SendSecretChatInviteRequest) returns(SendSecretChatInviteResponse);

  // Принять инвайт секретного чата (вызывается на устройстве получателя). После accept
  // отправитель получит событие через SubscribeSecretChatAccepts и сможет отправлять SecretMessage.
  rpc AcceptSecretChatInvite(AcceptSecretChatInviteRequest) returns(AcceptSecretChatInviteResponse);

  // Отклонить инвайт секретного чата. Отправитель получает уведомление через SubscribeSecretChatAccepts
  // (с флагом accepted=false). Инвайт удаляется из буфера.
  rpc RejectSecretChatInvite(RejectSecretChatInviteRequest) returns(RejectSecretChatInviteResponse);

  // Отправить шифрованное сообщение секретного чата конкретному устройству собеседника.
  // Envelope opaque (libsignal SignalMessage). Сервер кладёт в Redis на 24ч и шлёт push без содержимого.
  rpc SendSecretMessage(SendSecretMessageRequest) returns(SendSecretMessageResponse);

  // Подтвердить доставку секретного сообщения (получатель). После ack сервер удаляет envelope из буфера.
  rpc AckSecretMessage(AckSecretMessageRequest) returns(AckSecretMessageResponse);
}

message EditMessageRequest {
  int64 message_id = 1; // Идентификатор сообщения
  string text = 2; // Новый текст сообщения
  repeated string files_ids = 3; // Новый список файлов (без forwarded — он не редактируется)
}

message EditMessageResponse {
  barkfluff.shared.Message message = 1; // Обновленное сообщение
}

message DeleteMessageRequest {
  int64 message_id = 1; // Идентификатор сообщения
}

message DeleteMessageResponse { }

message PinMessageRequest {
  string chat_id = 1; // Идентификатор чата
  int64 message_id = 2; // Идентификатор закрепляемого сообщения
}

message PinMessageResponse {
  barkfluff.shared.PinnedMessageInfo pinned = 1; // Информация о закреплённом сообщении
}

message UnpinMessageRequest {
  string chat_id = 1; // Идентификатор чата
  int64 message_id = 2; // Идентификатор откреплямого сообщения
}

message UnpinMessageResponse { }

message ListPinnedMessagesRequest {
  string chat_id = 1; // Идентификатор чата
  barkfluff.shared.PageRequest pagination = 2; // Пагинация
}

message ListPinnedMessagesResponse {
  repeated barkfluff.shared.PinnedMessageInfo pinned = 1; // Закреплённые сообщения
  int32 total_count = 2; // Общее количество закреплённых сообщений в чате
}

message UnpinAllRequest {
  string chat_id = 1; // Идентификатор чата
}

message UnpinAllResponse {
  int32 unpinned_count = 1; // Сколько сообщений было откреплено
}

message MarkAsReadRequest {
  repeated int64 message_ids = 1; // Идентификаторы сообщений
}

message MarkAsReadResponse { }

message KickUserRequest {
  string chat_id = 1; // Идентификатор чата
  int64 user_id = 2; // Пользователь которого необходимо кикнуть
}

message KickUserResponse { }

message AddUserRequest {
  string chat_id = 1; // Идентификатор чата
  int64 user_id = 2; // Пользователь которого необходимо добавить
}

message AddUserResponse { }

message UpdateGroupChatRequest {
  string chat_id = 1; // Идентификатор чата
  string title = 2; // Новое название (пусто = не менять)
  string picture_file_id = 3; // Идентификатор нового файла обложки (пусто = не менять)
}

message UpdateGroupChatResponse {
  Chat chat = 1; // Обновлённый чат
}

message CreateGroupChatRequest {
  
  repeated int64 user_ids = 1; // Идентификаторы пользователей
  
  string title = 2; // Заголовок чата
  
  string picture_file_id = 3; // Идентификатор файла для обложки чата
}

message CreateGroupChatResponse {
    Chat created_chat = 1; // Созданный чат
}

message SendMessageRequest {
  
  oneof source_id {
    string chat_id = 1; // Идентификатор чата
    
    int64 user_id = 2; // Идентификатор пользователя (использовать, только если неизвестен id чата)
  }
  
  OutgoingMessage message = 3; // Отправляемое сообщение
  
}

message SendMessageResponse {
  barkfluff.shared.Message message = 1; //Отправленное сообщение
}

message ListChatMembersRequest {
  
  barkfluff.shared.PageRequest pagination = 1; // Пагинация (макс 50 элементов)
  
  string chat_id = 2; // Идентификатор чата
}

message ListChatMembersResponse {
  message DetailedChatMemberInfo {
    ChatMember general_info = 1; // Основная информация об участнике
    
    string first_name = 2; // Имя
    
    string last_name = 3; // Фамилия
  }
  
  repeated DetailedChatMemberInfo chat_members = 1; // Участники чата
  
  int32 total_count = 2; // Общее количество записей
}

message ListMessagesRequest {
  
  int64 from_message_id = 1; // Message ID from which to start
  
  int32 count = 2; // Number of messages to retrieve (max 50) - deprecated, use offset_before for backward pagination
  
  string chat_id = 3; // Chat identifier
  
  int32 offset_before = 4; // Number of messages before the reference message (older), max 50
  
  int32 offset_after = 5; // Number of messages after the reference message (newer), max 50
}

message ListMessagesResponse {
  repeated barkfluff.shared.Message messages = 1; // Список сообщений
}

message ListChatsRequest {
  barkfluff.shared.PageRequest pagination = 1; // Пагинация (макс 50 элементов)
}

message ListChatsResponse {
  repeated Chat chats = 1; // Список чатов
  
  int32 total_count = 2; // Общее количество чатов
}

message Chat {

  string id = 1; // Идентификатор чата

  string title = 2; // Название чата

  string picture = 3; // Картиночка чата

  bool is_group_chat = 4; // Признак того что это групповой чат

  barkfluff.shared.Message last_message = 5; // Последнее отправленное сообщение

  repeated ChatMember members = 6; // Участники чата (возвращается только для ЛС)

  int64 count_unread = 7; // Количество непрочитанных сообщений

  int64 first_unread_message_id = 8; // Идентификатор первого непрочитанного сообщения

  barkfluff.shared.ChatType chat_type = 9; // Тип чата (REGULAR/PRIVATE; SECRET через ListChats не возвращается)

  bytes kdf_salt = 10; // Соль для Argon2id (только для PRIVATE; пусто для REGULAR)

  bytes passphrase_verifier = 11; // Верификатор passphrase, HMAC от константы (только для PRIVATE; пусто для REGULAR)

  bool muted = 12; // Уведомления этого чата отключены текущим пользователем

  google.protobuf.Timestamp muted_until = 13; // До какого времени mute (пусто => навсегда, если muted=true)

  // Время последней видимой активности. Для PRIVATE не раскрывает содержимое.
  google.protobuf.Timestamp last_activity_at = 14;

  barkfluff.shared.PrivateChatInviteState private_invite_state = 15;

  // Инициатор приватного инвайта (только PRIVATE и state != ACCEPTED; иначе 0).
  // Позволяет клиенту понять роль: получатель показывает «принять/отклонить».
  int64 private_inviter_user_id = 16;

  // У текущего пользователя есть сохранённый черновик в этом обычном чате.
  bool has_draft = 17;
}

message ChatMember {
  
  int64 user_id = 1; // Идетификатор пользователя
  
  google.protobuf.Timestamp joined_at = 4; // Когда присоеденился
}

message OutgoingMessage {

  string text = 1; //Текст сообщения

  repeated string files_ids = 2; // Идентификаторы файлов

  // DEPRECATED: до разделения reply/forward этим полем отправлялись и ответы, и пересылки.
  // Оставлено рабочим для клиентов, которые ещё не перешли на поля 4/5 (iOS, macOS, ClientV2.WPF).
  // Одновременно с reply_to_message_id или forwarded_message_ids — InvalidArgument.
  int64 forwarded_message_id = 3; // ID пересылаемого сообщения (0 = не пересылка)

  int64 reply_to_message_id = 4; // ID сообщения, на которое отвечаем (0 = не ответ). Только из этого же чата

  repeated int64 forwarded_message_ids = 5; // Пересылаемые сообщения (до 20), порядок сохраняется
}

message GetPersonChatIdRequest {
  int64 user_id = 1; // Идентификатор пользователя
}

message GetPersonChatIdResponse {
  string chat_id = 1; // Идентификатор чата
}

message ListChatAttachmentsRequest {
  string chat_id = 1; // Идентификатор чата
  barkfluff.shared.PageRequest pagination = 2; // Пагинация
  barkfluff.shared.MessageAttachmentType attachment_type = 3; // Фильтр по типу (0 = все)
  bool sort_descending = 4; // true = новые первыми (по умолчанию)
  string file_name_query = 5; // Подстрока имени документа (пусто = без поиска)
}

message ListChatAttachmentsResponse {
  repeated ChatAttachmentInfo attachments = 1; // Список вложений
  int32 total_count = 2; // Общее количество вложений с учетом фильтра
}

message ChatAttachmentInfo {
  int64 message_id = 1; // ID сообщения для перехода к нему
  int64 attachment_id = 2; // ID вложения
  barkfluff.shared.MessageAttachment attachment = 3; // Данные вложения
  google.protobuf.Timestamp sent_at = 4; // Дата отправки
  int64 sender_id = 5; // ID отправителя
}

message GetChatInfoRequest {
  string chat_id = 1; // Идентификатор чата
}

message GetChatInfoResponse {
  int64 last_message_id = 1; // Идентификатор последнего сообщения
  int64 first_unread_message_id = 2; // Идентификатор первого непрочитанного сообщения
  string title = 3; // Название чата
  string picture = 4; // Картинка чата
  bool is_group_chat = 5; // Является ли групповым чатом
  int64 count_unread = 6; // Количество непрочитанных сообщений
  repeated int64 members_id = 7; // Идентификаторы участников чата
  bool muted = 8; // Уведомления этого чата отключены текущим пользователем
  google.protobuf.Timestamp muted_until = 9; // До какого времени mute (пусто => навсегда, если muted=true)
}

message ChatDraftInfo {
  string text = 1;
  int64 reply_to_message_id = 2; // 0 = reply не выбран
  string revision = 3; // UUID, используется для условного удаления после отправки
  google.protobuf.Timestamp updated_at = 4;
}

message GetChatDraftRequest {
  string chat_id = 1;
}

message GetChatDraftResponse {
  ChatDraftInfo draft = 1; // пусто, если черновика нет
}

message UpsertChatDraftRequest {
  string chat_id = 1;
  string text = 2;
  int64 reply_to_message_id = 3; // 0 = reply не выбран
}

message UpsertChatDraftResponse {
  ChatDraftInfo draft = 1;
}

message DeleteChatDraftRequest {
  string chat_id = 1;
  string expected_revision = 2;
}

message DeleteChatDraftResponse {
  bool deleted = 1;
}

// -- Приватные чаты (E2E через passphrase) ------------------------------------

message CreatePrivateChatRequest {
  int64 peer_user_id = 1;          // ID собеседника
  bytes kdf_salt = 2;              // Соль Argon2id (32 байта, генерируется создателем)
  bytes passphrase_verifier = 3;   // Верификатор passphrase: HMAC-SHA256(derived_key, "BARKFLUFF_PRIVATE_CHAT_VERIFIER")
}

message CreatePrivateChatResponse {
  Chat chat = 1; // Созданный чат (с chat_type=PRIVATE; собеседник пока не присоединён)
  bool created = 2; // false, если вернулся уже существующий чат этой пары
}

message AcceptPrivateChatRequest {
  string chat_id = 1; // ID приватного чата, в который пользователь приглашён
}

message AcceptPrivateChatResponse {
  Chat chat = 1; // Чат с присоединившимся участником
}

message RejectPrivateChatRequest {
  string chat_id = 1; // ID приватного чата
}

message RejectPrivateChatResponse { }

message SendPrivateMessageRequest {
  string chat_id = 1;          // ID приватного чата
  bytes ciphertext = 2;        // Шифротекст AES-256-GCM
  bytes nonce = 3;             // Уникальный nonce (12 байт), генерируется отправителем
  bytes associated_data = 4;   // AAD для AES-GCM (привязка к chat_id и т.п.)
}

message SendPrivateMessageResponse {
  barkfluff.shared.EncryptedMessage message = 1; // Сохранённое сообщение
}

message ListPrivateMessagesRequest {
  string chat_id = 1;          // ID приватного чата
  int64 from_message_id = 2;   // ID опорного сообщения
  int32 offset_before = 3;     // Сколько сообщений до опорного (макс 50)
  int32 offset_after = 4;      // Сколько сообщений после опорного (макс 50)
}

message ListPrivateMessagesResponse {
  repeated barkfluff.shared.EncryptedMessage messages = 1; // Шифрованные сообщения
}

message EditPrivateMessageRequest {
  int64 message_id = 1;        // ID шифрованного сообщения
  bytes ciphertext = 2;        // Новый шифротекст
  bytes nonce = 3;             // Новый nonce (обязательно отличный от старого)
  bytes associated_data = 4;   // AAD
}

message EditPrivateMessageResponse {
  barkfluff.shared.EncryptedMessage message = 1; // Обновлённое сообщение
}

message DeletePrivateMessageRequest {
  int64 message_id = 1; // ID шифрованного сообщения
}

message DeletePrivateMessageResponse { }

message MarkPrivateMessagesAsReadRequest {
  string chat_id = 1;
  int64 last_read_message_id = 2;
}

message MarkPrivateMessagesAsReadResponse { }

// -- Секретные чаты (Signal Double Ratchet) -----------------------------------

message SendSecretChatInviteRequest {
  int64 recipient_user_id = 1;     // ID пользователя-получателя
  string recipient_device_id = 2;  // ID устройства-получателя (выбирается отправителем из ListPeerDevices)
  bytes initial_envelope = 3;      // libsignal PreKeySignalMessage (opaque)
}

message SendSecretChatInviteResponse {
  string invite_id = 1;                                  // ID инвайта (для AcceptSecretChatInvite)
  google.protobuf.Timestamp invite_expires_at = 2;       // Когда инвайт удалится из буфера (24ч от sent_at)
}

message AcceptSecretChatInviteRequest {
  string invite_id = 1;            // ID инвайта
  bytes response_envelope = 2;     // Опционально: первое ответное сообщение (libsignal SignalMessage). Пусто = только подтверждение.
}

message AcceptSecretChatInviteResponse { }

message RejectSecretChatInviteRequest {
  string invite_id = 1; // ID инвайта
}

message RejectSecretChatInviteResponse { }

message SendSecretMessageRequest {
  int64 recipient_user_id = 1;     // ID пользователя-получателя (для маршрутизации в Updates)
  string recipient_device_id = 2;  // ID устройства-получателя
  bytes envelope = 3;              // libsignal SignalMessage (opaque)
}

message SendSecretMessageResponse {
  string message_id = 1;                            // ID сообщения (для Ack клиентом-получателем)
  google.protobuf.Timestamp expires_at = 2;         // Когда сообщение удалится из буфера (24ч)
}

message AckSecretMessageRequest {
  string message_id = 1; // ID сообщения
}

message AckSecretMessageResponse { }

// Server API для межсервисного взаимодействия

service MessagesServerApi {

  // Получить все сообщения пользователя для экспорта
  rpc GetUserAllMessages(GetUserAllMessagesRequest) returns(GetUserAllMessagesResponse);

  // Отфильтровать чаты, в которых пользователь состоит (батч-проверка членства)
  rpc CheckChatMembership(CheckChatMembershipRequest) returns(CheckChatMembershipResponse);

  // Получить идентификаторы участников чата (для рассылки ринга группового звонка)
  rpc GetChatMemberIds(GetChatMemberIdsRequest) returns(GetChatMemberIdsResponse);

  // Записать системное сообщение об итоге звонка в чат (вызывает сервис Calls)
  rpc PostCallSystemMessage(PostCallSystemMessageRequest) returns(PostCallSystemMessageResponse);
}

message GetUserAllMessagesRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message GetUserAllMessagesResponse {
  repeated ExportMessage messages = 1; // все сообщения пользователя
  repeated ExportChat chats = 2; // все чаты пользователя
}

message ExportMessage {
  int64 id = 1; // идентификатор сообщения
  string chat_id = 2; // идентификатор чата
  int64 sender_id = 3; // идентификатор отправителя
  repeated int64 read_by = 4; // идентификаторы пользователей, прочитавших сообщение
  google.protobuf.Timestamp sent_at = 5; // дата отправки
  string text = 6; // текст сообщения
  repeated ExportAttachment attachments = 7; // вложения
  int32 content_type = 8; // тип содержимого (0 = unknown, 1 = generic, 2 = system)
}

message ExportAttachment {
  int64 id = 1; // идентификатор вложения
  int32 type = 2; // тип вложения (0 = unknown, 1 = image, 2 = video, 3 = gif, 4 = document)
  string file_id = 3; // идентификатор файла
  string preview_url = 4; // ссылка на превью
  int64 attachment_size = 5; // размер файла в байтах
  string preview_file_id = 6; // идентификатор файла превью
  string file_name = 7; // оригинальное имя файла
}

message ExportChat {
  string id = 1; // идентификатор чата
  string title = 2; // название чата
  bool is_group_chat = 3; // является ли групповым чатом
  repeated int64 member_ids = 4; // идентификаторы участников
}

message CheckChatMembershipRequest {
  int64 user_id = 1; // проверяемый пользователь
  repeated string chat_ids = 2; // идентификаторы чатов (Guid-строки)
}

message CheckChatMembershipResponse {
  repeated string member_chat_ids = 1; // подмножество chat_ids, где пользователь состоит
}

message GetChatMemberIdsRequest {
  string chat_id = 1; // идентификатор чата (Guid-строка)
}

message GetChatMemberIdsResponse {
  repeated int64 user_ids = 1; // идентификаторы участников чата
}

// Итог звонка для системного сообщения. Текст форматирует Messages.
enum CallSystemResult {
  CALL_SYSTEM_RESULT_UNKNOWN = 0;
  CALL_SYSTEM_RESULT_ENDED = 1;    // состоялся (с длительностью)
  CALL_SYSTEM_RESULT_MISSED = 2;   // пропущен
  CALL_SYSTEM_RESULT_REJECTED = 3; // отклонён
}

// Цель личного звонка (системное сообщение пишется в личный чат двух пользователей).
message PersonCallTarget {
  int64 caller_user_id = 1;
  int64 callee_user_id = 2;
}

message PostCallSystemMessageRequest {
  // Ровно одно из двух: групповой чат (chat_id) или личный звонок (person).
  oneof target {
    string chat_id = 1;          // групповой чат (Guid-строка)
    PersonCallTarget person = 2; // личный звонок
  }
  int64 sender_user_id = 3;      // от кого системное сообщение (инициатор звонка)
  CallSystemResult result = 4;
  int64 duration_seconds = 5;    // длительность разговора (0 для несостоявшихся)
}

message PostCallSystemMessageResponse {
  bool posted = 1; // false, если личного чата ещё нет (сообщение не записано)
}
