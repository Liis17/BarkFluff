syntax = "proto3";

option csharp_namespace = "BarkFluff.Proto.Shared";

import "google/protobuf/timestamp.proto";

package barkfluff.shared;

message PageRequest {
  
  int32 offset = 1; // Количество элементов для пропуска
  
  int32 size = 2; // Размер элементов на странице
  
}

message Message {

  int64 id = 1; // Идетификатор сообщения

  int64 sender_id = 2; // Идентификатор отправителя

  repeated int64 read_by = 3; // Идентификатор пользователей, которые прочитали сообщение

  google.protobuf.Timestamp sent_at = 4; // Дата отправки сообщения

  MessageContent content = 5; // Содержимое сообщения

  MessageContentType type = 6; // Тип сообщения

  bool is_edited = 7; // Признак того что сообщение было отредактировано

  google.protobuf.Timestamp edited_at = 8; // Дата последней правки сообщения
}

message MessageContent {

  string text = 1; // Текст сообщения

  repeated MessageAttachment attachments = 2; // Вложения
}

message MessageAttachment {

  int64 id = 1; // Идентификатор вложения

  MessageAttachmentType type = 2; // Тип вложения

  string file_id = 3; // Индетификатор файла

  string preview_url = 4; // Ссылка на превью файла (может быть пустым)

  int64 attachment_size = 5; // Размер файла в байтах

  string preview_file_id = 6; // Идентификатор файла превью (может быть пустым)

  string file_name = 7; // Оригинальное имя файла

  int32 image_width = 8; // Ширина изображения в пикселях (0 если не изображение)

  int32 image_height = 9; // Высота изображения в пикселях (0 если не изображение)

  ForwardedMessageAttachment forwarded_message = 10; // Данные пересланного сообщения (только для type = FORWARDED_MESSAGE)
}

message ForwardedMessageAttachment {

  string author_name = 1; // Имя и фамилия автора оригинального сообщения

  int64 original_message_id = 2; // ID оригинального сообщения

  string text = 3; // Текст оригинального сообщения

  repeated MessageAttachment attachments = 4; // Вложения оригинального сообщения (без FORWARDED_MESSAGE для исключения рекурсии)
}

enum MessageAttachmentType {

  MESSAGE_ATTACHMENT_TYPE_UNKNOWN = 0; // Неизвестно

  IMAGE = 1; // Изображение

  VIDEO = 2; // Видео

  GIF = 3; // Гифка

  DOCUMENT = 4; // Документ

  AUDIO = 5; // Аудио

  VOICE = 6; // Голосовое сообщение

  STICKER = 7; // Стикер (WebP)

  FORWARDED_MESSAGE = 8; // Пересланное сообщение
}

enum MessageContentType {

  MESSAGE_CONTENT_TYPE_UNKNOWN = 0; // Неизвестно

  GENERIC = 1; // Обычное содержимое

  SYSTEM = 2; // Системное содержимое
}

message PinnedMessageInfo {

  Message message = 1; // Закреплённое сообщение

  int64 pinner_user_id = 2; // ID пользователя, закрепившего сообщение

  google.protobuf.Timestamp pinned_at = 3; // Дата закрепления
}

// Тип чата.
//   REGULAR  — обычный чат, plaintext в БД сервера (поведение по умолчанию, существующие чаты).
//   PRIVATE  — E2E через общий passphrase: сервер хранит только шифротекст в EncryptedMessages.
//              Чат материализуется в БД (Chat-стержень + KdfSalt + PassphraseVerifier).
//   SECRET   — E2E Signal Double Ratchet, привязка к устройству-инициатору сессии.
//              Сервер НЕ хранит ни сообщения, ни сам Chat — только релэит SecretEnvelope
//              и буферизует в Redis на 24ч. Через ListChats секретные чаты НЕ возвращаются —
//              клиент держит их в локальном хранилище.
enum ChatType {
  CHAT_TYPE_REGULAR = 0;
  CHAT_TYPE_PRIVATE = 1;
  CHAT_TYPE_SECRET = 2;
}

// Состояние приглашения в приватный чат. Нужно клиенту, чтобы не предлагать
// отправку до принятия приглашения второй стороной.
enum PrivateChatInviteState {
  PRIVATE_CHAT_INVITE_STATE_PENDING = 0;
  PRIVATE_CHAT_INVITE_STATE_ACCEPTED = 1;
  PRIVATE_CHAT_INVITE_STATE_REJECTED = 2;
}

// Зашифрованное сообщение приватного чата.
// Сервер хранит как opaque blob в отдельной таблице EncryptedMessages и
// никогда не имеет ключа для расшифровки. Расшифровка только клиентами,
// знающими passphrase (через Argon2id(passphrase, Chat.kdf_salt) → AES-256-GCM key).
message EncryptedMessage {

  int64 id = 1; // Идентификатор шифрованного сообщения (auto-increment, отдельная последовательность от Message.id)

  string chat_id = 2; // Идентификатор приватного чата

  int64 sender_id = 3; // Идентификатор отправителя (известен серверу — нужен для авторизации)

  string sender_device_id = 4; // Идентификатор устройства-отправителя (для UI у получателя)

  google.protobuf.Timestamp sent_at = 5; // Дата отправки (UTC, проставляется сервером)

  bytes ciphertext = 6; // Шифротекст AES-256-GCM

  bytes nonce = 7; // Уникальный nonce для AES-GCM (12 байт), генерируется отправителем

  bytes associated_data = 8; // AAD для AES-GCM (например, привязка к chat_id и message_id)

  bool is_edited = 9; // Признак редактирования

  google.protobuf.Timestamp edited_at = 10; // Дата последнего редактирования

  bool is_deleted = 11; // Soft-delete: true => сообщение скрыто, ciphertext очищен
}

// Конверт секретного сообщения (Signal Double Ratchet).
// Сервер обращается с envelope как с opaque blob: только релэит указанному
// recipient_device_id и буферизует в Redis (TTL 24ч) если получатель оффлайн.
// В БД сервер НЕ сохраняет.
message SecretEnvelope {

  string message_id = 1; // Уникальный ID сообщения для ack (Guid, генерируется сервером при приёме)

  int64 sender_user_id = 2; // ID пользователя-отправителя (для UX: "от кого")

  string sender_device_id = 3; // ID устройства-отправителя (нужен получателю для маршрутизации в правильную ratchet-сессию)

  string recipient_device_id = 4; // ID устройства-получателя (определяется отправителем при создании секретного чата)

  bytes envelope = 5; // Опаковый payload libsignal (PreKeySignalMessage или SignalMessage), включает ratchet headers + ciphertext

  google.protobuf.Timestamp sent_at = 6; // Дата отправки (UTC, проставляется сервером)
}

