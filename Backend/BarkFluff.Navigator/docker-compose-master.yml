x-common-variables: &common-variables
  CONFIGURATION_SERVICE_URL: "http://192.168.1.177:7003"
  ASPNETCORE_ENVIRONMENT: Production

services:
  navigator:
    image: docker.barkfluff.com:5000/barkfluff-navigator:latest
    restart: always
    ports: [ "${NAVIGATOR_PORT}:${NAVIGATOR_PORT}" ]
    environment:
      <<: *common-variables
      NAVIGATOR_PORT: ${NAVIGATOR_PORT}
      # Этап 1.5 rearch: Navigator вне платформенного шаблона (без LoadConfiguration) — БД через
      # переменную окружения напрямую, не через Configuration-сервис.
      NAVIGATOR_DB: "Host=navigator-postgres;Database=${NAVIGATOR_POSTGRES_DB};Username=${NAVIGATOR_POSTGRES_USER};Password=${NAVIGATOR_POSTGRES_PASSWORD}"
    depends_on:
      - navigator-postgres
    networks:
      - barkfluff-network

  navigator-postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: "${NAVIGATOR_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${NAVIGATOR_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${NAVIGATOR_POSTGRES_DB}"
    volumes:
      - navigator_pgdata:/var/lib/postgresql
    networks:
      - barkfluff-network

networks:
  barkfluff-network:
    driver: bridge

volumes:
  navigator_pgdata:
