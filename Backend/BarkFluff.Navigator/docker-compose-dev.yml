x-common-variables: &common-variables
  CONFIGURATION_SERVICE_URL: "http://192.168.1.177:7003"
  ASPNETCORE_ENVIRONMENT: Production

services:
  navigator-dev:
    image: docker.barkfluff.com:5000/barkfluff-navigator-dev:latest
    restart: always
    user: root
    ports: [ "${NAVIGATOR_PORT}:${NAVIGATOR_PORT}" ]
    environment:
      <<: *common-variables
      NAVIGATOR_PORT: ${NAVIGATOR_PORT}
      # Этап 1.5 rearch: Navigator вне платформенного шаблона (без LoadConfiguration) — локальная
      # SQLite-БД, путь через переменную окружения напрямую, не через Configuration-сервис.
      NAVIGATOR_DB: "Data Source=/app/db/navigator.db"
    volumes:
      - navigator_data:/app/db
    networks:
      - barkfluff-network

networks:
  barkfluff-network:
    driver: bridge

volumes:
  navigator_data:
