version: '3.8'

# Второй узел для двух-нодового стенда XFed (docs/rearch/phase-1/step-1.3-xfed-signing.md,
# Изменение 7.2). Нода 1 — обычный dev-стек (docker/backend/docker-compose-dev-backend.yml, сервисы postgres/
# configuration/federation). Нода 2 — этот файл, отдельные контейнеры/volume/порты, общая сеть
# barkfluff-network (объявлена в основном файле — здесь не переопределяется).
#
# Запуск (из Backend/):
#   docker compose -f docker-compose-dev.yml -f dev-federation-testbed/docker-compose.node2.yml \
#     up -d postgres configuration federation postgres2 configuration2 federation2
#
# Плейнтекст (http://) — до этапа 1.6 (nginx + self-signed + SPKI). Порты наружу не публикуются:
# см. README.md этой папки — доступ только изнутри сети barkfluff-network (fedping, docker exec).

services:
  postgres2:
    image: postgres:18
    container_name: postgres2_barkfluff
    restart: always
    environment:
      POSTGRES_USER: barkfluff
      POSTGRES_PASSWORD: barkfluff
      POSTGRES_DB: postgres
    volumes:
      - pgdata2:/var/lib/postgresql
    networks:
      - barkfluff-network

  configuration2:
    image: docker.barkfluff.com:5000/barkfluff-configuration-dev:latest
    container_name: configuration2
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      CONFIGURATION_HOST: postgres2
      CONFIGURATION_DATABASE: barkfluff_configuration
      CONFIGURATION_USERNAME: barkfluff
      CONFIGURATION_PASSWORD: barkfluff
      CONFIGURATION_PORT: "7003"
    depends_on:
      - postgres2
    networks:
      - barkfluff-network

  federation2:
    image: docker.barkfluff.com:5000/barkfluff-federation-dev:latest
    container_name: federation2
    restart: always
    environment:
      CONFIGURATION_SERVICE_URL: "http://configuration2:7003"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      - configuration2
    networks:
      - barkfluff-network

volumes:
  pgdata2:
