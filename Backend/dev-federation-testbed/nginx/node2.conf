# Стенд, нода 2 — self-signed TLS перед federation2:7030 (docs/rearch/phase-1/step-1.6-nginx.md).
server {
    listen 443 ssl http2;
    server_name nginx-node2;

    ssl_certificate     /etc/nginx/certs/node2.crt.pem;
    ssl_certificate_key /etc/nginx/certs/node2.key.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $grpc_backend grpc://federation2:7030;
        grpc_pass $grpc_backend;
        grpc_set_header Host $host;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }

    location = /.well-known/barkfluff {
        proxy_pass http://federation2:7031/.well-known/barkfluff;
        proxy_set_header Host $host;
    }
}
