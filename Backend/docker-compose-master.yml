# УСТАРЕЛО: этот файл не актуализировался и не используется в production.
# Актуальный compose — docker-compose-dev.yml.
# Перед использованием необходима полная ревизия и обновление под текущую архитектуру.

version: '3.8'

x-common-variables: &common-variables
  CONFIGURATION_SERVICE_URL: "${CONFIGURATION_SERVICE_URL}"
  ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"

services:
  # Основные
  beacon:
    image: docker.barkfluff.com:5000/barkfluff-beacon:latest 
    restart: always
    ports: ["${BEACON_PORT}:${BEACON_PORT}"]
    environment:
      <<: *common-variables
      BEACON_PORT: ${BEACON_PORT}
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  configuration:
    image: docker.barkfluff.com:5000/barkfluff-configuration:latest
    restart: always
    ports: ["${CONFIGURATION_PORT}:${CONFIGURATION_PORT}"]
    env_file:
    - .env
    environment:
      <<: *common-variables
      CONFIGURATION_HOST: ${CONFIGURATION_HOST}
      CONFIGURATION_DATABASE: ${CONFIGURATION_DATABASE}
      CONFIGURATION_USERNAME: ${CONFIGURATION_USERNAME}
      CONFIGURATION_PASSWORD: ${CONFIGURATION_PASSWORD}
      CONFIGURATION_PORT: ${CONFIGURATION_PORT}
    networks:
      - barkfluff-network

  files:
    image: docker.barkfluff.com:5000/barkfluff-files:latest
    restart: always
    ports:
      - "${FILES_PORT}:${FILES_PORT}"
      - "${FILES_HTTP1PORT}:${FILES_HTTP1PORT}"
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  identity:
    image: docker.barkfluff.com:5000/barkfluff-identity:latest
    restart: always
    ports: ["${IDENTITY_PORT}:${IDENTITY_PORT}"]
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  messages:
    image: docker.barkfluff.com:5000/barkfluff-messages:latest
    restart: always
    ports: ["${MESSAGES_PORT}:${MESSAGES_PORT}"]
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration
  
  notification:
    image: docker.barkfluff.com:5000/barkfluff-notification:latest
    restart: always
    ports: ["${NOTIFICATION_PORT}:${NOTIFICATION_PORT}"]
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  users:
    image: docker.barkfluff.com:5000/barkfluff-users:latest
    restart: always
    ports: ["${USERS_PORT}:${USERS_PORT}"]
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  fast-auth:
    image: docker.barkfluff.com:5000/barkfluff-fast-auth:latest
    restart: always
    ports: ["${FASTAUTH_PORT}:${FASTAUTH_PORT}"]
    environment:
      <<: *common-variables
      FASTAUTH_PORT: ${FASTAUTH_PORT}
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  updates:
    image: docker.barkfluff.com:5000/barkfluff-updates:latest
    restart: always
    ports: ["${UPDATES_PORT}:${UPDATES_PORT}"]
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration
  
  onliner:
    image: docker.barkfluff.com:5000/barkfluff-onliner:latest
    restart: always
    ports: ["${ONLINER_PORT}:${ONLINER_PORT}"]
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  cloud-messaging:
    image: docker.barkfluff.com:5000/barkfluff-cloud-messaging:latest
    container_name: cloud-messaging
    restart: always
    environment:
      <<: *common-variables
    volumes:
      - ./barkfluff-firebase-adminsdk.json:/app/firebase/barkfluff-firebase-adminsdk.json:ro
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  bots:
    image: docker.barkfluff.com:5000/barkfluff-bots:latest
    container_name: bots
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration
      - users
      - messages
      - files

  # Панель администрирования
  admin-panel:
    image: docker.barkfluff.com:5000/barkfluff-admin-panel:latest
    container_name: admin-panel
    restart: always
    user: root
    environment:
      <<: *common-variables
      ConfigurationServiceAddr: "${CONFIGURATION_SERVICE_URL}"
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN}"
      Telegram__Admins: "${TELEGRAM_ADMINS}"
      Seq__ServerUrl: "http://seq:80"
      Seq__ApiKey: "${SEQ_API_KEY:-}"
      UsersService__Host: "http://users:7001"
      FilesService__Host: "http://files:7005"
      UsersService__Token: "${USERS_SERVICE_TOKEN}"
      FilesService__Token: "${FILES_SERVICE_TOKEN}"
      IdentityService__Host: "http://identity:7000"
      IdentityService__Token: "${IDENTITY_SERVICE_TOKEN}"
      BotsService__Host: "http://bots:7027"
      BotsService__Token: "${BOTS_SERVICE_TOKEN:-}"
      Mail__SmtpHost: "${MAIL_SMTP_HOST:-}"
      Mail__SmtpPort: "${MAIL_SMTP_PORT:-587}"
      Mail__ImapHost: "${MAIL_IMAP_HOST:-}"
      Mail__ImapPort: "${MAIL_IMAP_PORT:-993}"
      Mail__ImapSecurity: "${MAIL_IMAP_SECURITY:-SslOnConnect}"
      Mail__SmtpSecurity: "${MAIL_SMTP_SECURITY:-Auto}"
      Mail__AcceptInvalidCertificates: "${MAIL_ACCEPT_INVALID_CERTIFICATES:-false}"
      Mail__Accounts__0__Address: "support@barkfluff.com"
      Mail__Accounts__0__Password: "${MAIL_SUPPORT_PASSWORD:-}"
      Mail__Accounts__1__Address: "help@barkfluff.com"
      Mail__Accounts__1__Password: "${MAIL_HELP_PASSWORD:-}"
      Mail__Accounts__2__Address: "noreply@barkfluff.com"
      Mail__Accounts__2__Password: "${MAIL_NOREPLY_PASSWORD:-}"
      Mail__Accounts__3__Address: "privacy@barkfluff.com"
      Mail__Accounts__3__Password: "${MAIL_PRIVACY_PASSWORD:-}"
      Mail__Accounts__4__Address: "security@barkfluff.com"
      Mail__Accounts__4__Password: "${MAIL_SECURITY_PASSWORD:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - admin_panel_data:/app/db
      - ./docker-compose.yml:/docker-compose.yml:ro
      - ./.env:/.env:ro
    networks:
      - barkfluff-network
    depends_on:
      - configuration
      - seq

  # Seq логирование
  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: always
    ports:
      - "${SEQ_WEBPORT}:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_ADMIN_PASSWORD}"
    volumes:
      - seq_data:/data
    networks:
      - barkfluff-network

  # Дополнительные
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    restart: always
    container_name: minio
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_WEBPORT}:${MINIO_WEBPORT}"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":${MINIO_WEBPORT}"
    networks:
      - barkfluff-network

  rabbitmq:
    image: rabbitmq:latest
    restart: always
    container_name: rabbitmq
    # Порты не проброшены наружу — доступен только внутри Docker-сети
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
    networks:
      - barkfluff-network

  redis:
    image: redis:latest
    restart: always
    container_name: redis
    # Порты не проброшены наружу — доступен только внутри Docker-сети
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - barkfluff-network

  postgres:
    image: postgres:18
    container_name: postgres_barkfluff
    # Тюнинг под 2 ядра / 8 ГБ (БД делит машину с остальными сервисами).
    # Значения — стартовая точка, подгоняй под реальную нагрузку.
    command:
      - "postgres"
      - "-c"
      - "max_connections=150"
      - "-c"
      - "shared_buffers=768MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "maintenance_work_mem=192MB"
      - "-c"
      - "work_mem=12MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "jit=off"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql
      - backup_volume:/backup
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    restart: always
    networks:
      - barkfluff-network

networks:
  barkfluff-network:
    driver: bridge

volumes:
  pgdata:
  rabbitmq_data:
  redis_data:
  minio_data:
  backup_volume:
  admin_panel_data:
  seq_data:
