// Вендорённая копия стандартного well-known типа google.protobuf.Timestamp.
// Нужна protoc для резолва `import "google/protobuf/timestamp.proto"`.
// В Rust маппится на ::prost_types::Timestamp через extern_path (см. build.rs),
// поэтому собственный тип не генерируется.
syntax = "proto3";

package google.protobuf;

option csharp_namespace = "Google.Protobuf.WellKnownTypes";
option go_package = "google.golang.org/protobuf/types/known/timestamppb";
option java_package = "com.google.protobuf";
option java_outer_classname = "TimestampProto";
option java_multiple_files = true;
option objc_class_prefix = "GPB";
option cc_enable_arenas = true;

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}
