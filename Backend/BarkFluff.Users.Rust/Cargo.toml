[package]
name = "barkfluff-users"
version = "0.1.0"
edition = "2021"
description = "Rust drop-in порт микросервиса BarkFluff.Users (.NET 10 → Rust)"

[[bin]]
name = "barkfluff-users"
path = "src/main.rs"

[dependencies]
# gRPC
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tonic-reflection = "0.12"

# async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
tokio-stream = "0.1"
futures-util = "0.3"

# PostgreSQL (без TLS → без ring)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }

# RabbitMQ (без TLS), интеграция с tokio
lapin = { version = "2.5", default-features = false }
tokio-executor-trait = "2"

# JWT HS256 (чистый Rust, без ring)
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# вспомогательное
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dashmap = "6"
regex = "1"
anyhow = "1"
thiserror = "2"
once_cell = "1"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
