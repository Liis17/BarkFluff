<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Аккаунт заблокирован</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      color: #2e2e2e;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .highlight {
      font-weight: 600;
      color: #000;
    }
    .info-box {
      background-color: #fdecea;
      border-left: 4px solid #d32f2f;
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    .info-box p {
      margin: 8px 0;
      font-size: 15px;
      color: #8e1b1b;
    }
    .device-info {
      background-color: #f9fafb;
      border-left: 4px solid #007bff;
      padding: 16px 20px;
      border-radius: 8px;
      font-size: 14px;
      color: #444;
      margin-bottom: 24px;
    }
    .device-info p {
      margin: 4px 0;
    }
    .footer {
      font-size: 13px;
      color: #999;
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚫 Аккаунт BarkFluff заблокирован</h1>
    <p>Здравствуйте, <span class="highlight">ꟿꟿꟿusernameꟿꟿꟿ</span>!</p>
    <div class="info-box">
      <p><strong>Администратор ноды ограничил вход в ваш аккаунт.</strong></p>
      <p>Если вы считаете это ошибкой, обратитесь к администратору ноды.</p>
    </div>
    <div class="device-info">
      <p><strong>Причина:</strong> ꟿꟿꟿreasonꟿꟿꟿ</p>
      <p><strong>Дата и время (UTC):</strong> ꟿꟿꟿdatetimeꟿꟿꟿ</p>
    </div>
    <div class="footer"> ꟿꟿꟿcurrentyearꟿꟿꟿ BarkFluff</div>
  </div>
</body>
</html>
