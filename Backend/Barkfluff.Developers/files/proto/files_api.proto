syntax = "proto3";

option csharp_namespace = "BarkFluff.Proto.Files";

import "google/protobuf/timestamp.proto";
import "shared.proto";

package barkfluff.files;

service FilesApi {
  rpc GetUploadUrl(GetUploadUrlRequest) returns(GetUploadUrlResponse); // Получить ссылку для загрузки файла

  rpc GetTempDownloadUrl(GetTempDownloadUrlRequest) returns(GetTempDownloadUrlResponse); // Получить ссылку для скачивания файла

  rpc CheckFileHash(CheckFileHashRequest) returns(CheckFileHashResponse); // Проверить существует ли файл с таким хешем

  rpc GetUserStorageInfo(GetUserStorageInfoRequest) returns(GetUserStorageInfoResponse); // Получить информацию о хранилище пользователя

  // Стикерпаки (клиентский доступ, только чтение)
  rpc ListStickerPacks(ListStickerPacksRequest) returns(ListStickerPacksResponse); // Список стикерпаков
  rpc GetStickerPack(GetStickerPackRequest) returns(GetStickerPackResponse); // Получить стикерпак со стикерами
}

service FilesServerApi {
  rpc GetFileData(GetFileDataRequest) returns(GetFileDataResponse); // Получить информацию о загруженном файле

  rpc GetFilesData(GetFilesDataRequest) returns(GetFilesDataResponse); // Получить информацию о загруженных файлах

  rpc UploadBadgeImage(UploadBadgeImageRequest) returns(UploadBadgeImageResponse); // Загрузить PNG-картинку для бейджа (постоянная ссылка, без сжатия)

  rpc GetUserStorageInfoServer(GetUserStorageInfoServerRequest) returns(GetUserStorageInfoResponse); // Получить информацию о хранилище пользователя (для админ-панели)

  rpc UploadAvatarServer(UploadAvatarServerRequest) returns(UploadAvatarServerResponse); // Загрузить аватарку пользователя (для админ-панели)

  // Стикерпаки
  rpc CreateStickerPack(CreateStickerPackRequest) returns(CreateStickerPackResponse);
  rpc UpdateStickerPack(UpdateStickerPackRequest) returns(UpdateStickerPackResponse);
  rpc DeleteStickerPack(DeleteStickerPackRequest) returns(DeleteStickerPackResponse);
  rpc ListStickerPacks(ListStickerPacksRequest) returns(ListStickerPacksResponse);
  rpc GetStickerPack(GetStickerPackRequest) returns(GetStickerPackResponse);

  // Стикеры
  rpc AddSticker(AddStickerRequest) returns(AddStickerResponse);
  rpc RemoveSticker(RemoveStickerRequest) returns(RemoveStickerResponse);
  rpc UpdateSticker(UpdateStickerRequest) returns(UpdateStickerResponse);
  rpc GetStickers(GetStickersRequest) returns(GetStickersResponse);

  // Загрузка изображения стикера (для админ-панели)
  rpc UploadStickerImage(UploadStickerImageRequest) returns(UploadStickerImageResponse);
}

message GetTempDownloadUrlRequest {
  repeated string file_ids = 1; // Идентификаторы файлов
}

message GetTempDownloadUrlResponse {
  
  message DownloadFileData {
    string file_id = 1; // идентификатор файла
    string url = 2; // ссылка на загрузку
    string preview_url = 3; // ссылка на превью файла
  }
  
  repeated DownloadFileData file_urls = 1; // ссылки на файлы
  
}

message GetFilesDataRequest {
  repeated string file_ids = 1; // Идентификаторы файлов
}

message GetFilesDataResponse {
  repeated UploadFileInfo files_infos = 1; // Информация о файлах
}

message GetFileDataRequest {
  string file_id = 1;
}

message GetFileDataResponse {
    UploadFileInfo file_info = 1;
}

message UploadFileInfo {
  string id = 1; // Идентификатор файла
  repeated int64 uploaders = 2; // Идентификаторы пользователей загрузивших файл
  google.protobuf.Timestamp created_at = 3; // Время создания
  google.protobuf.Timestamp uploaded_at = 4; // время загрузки
  string etag = 5; // Etag S3
  UploadFileType type = 6; // Тип загруженного файла
  string file_name = 7; // Имя файла
  string file_url = 8; // Ссылка на загрузку файла
  string preview_url = 9; // Ссылка на превью, если есть
  int64 file_size = 10; // Размер файла в байтах
  string preview_file_id = 11; // Идентификатор файла превью, если есть
}

message GetUploadUrlRequest {
  UploadFileType file_type = 1; // Тип загружаемого файла
}

message GetUploadUrlResponse {
  string url = 1; // адрес для загрузки файла
  string file_id = 2; // идентификатор файла
}

enum UploadFileType {
  UPLOAD_FILE_TYPE_UNKNOWN = 0;

  USER_AVATAR = 1; // Аватарка пользователя

  MESSAGE_ATTACHMENT_IMAGE = 2; // Вложение сообщения - изображение

  MESSAGE_ATTACHMENT_VIDEO = 3; // Вложение сообщения - видео

  MESSAGE_ATTACHMENT_GIF = 4; // Вложение сообщения - гифка

  MESSAGE_ATTACHMENT_DOCUMENT = 5; // Вложение сообщения - документ

  CHAT_PICTURE = 6; // Обложка группового чата

  MESSAGE_ATTACHMENT_AUDIO = 7; // Вложение сообщения - аудио

  MESSAGE_ATTACHMENT_VOICE = 8; // Вложение сообщения - голосовое сообщение

  MESSAGE_ATTACHMENT_STICKER = 9; // Вложение сообщения - стикер (WebP)
}

message UploadBadgeImageRequest {
  bytes image_data = 1; // содержимое PNG-файла
  string filename = 2;  // имя файла (например "badge.png")
}

message UploadBadgeImageResponse {
  string badge_image_id = 1; // идентификатор изображения бейджа
  string permanent_url = 2;  // постоянная ссылка на скачивание
}

message GetUserStorageInfoServerRequest {
  int64 user_id = 1;
}

message UploadAvatarServerRequest {
  bytes image_data = 1;   // содержимое файла
  string filename = 2;    // имя файла
  int64 user_id = 3;      // идентификатор пользователя
}

message UploadAvatarServerResponse {
  string file_url = 1;          // ссылка на полное изображение
  string preview_url = 2;       // ссылка на превью
  string file_id = 3;           // идентификатор файла
}

message CheckFileHashRequest {
  string file_hash = 1; // SHA256 хеш файла (hex строка, 64 символа)
}

message CheckFileHashResponse {
  string file_id = 1; // Идентификатор файла если найден, пустая строка если не найден
}

message GetUserStorageInfoRequest {
}

message GetUserStorageInfoResponse {
  message StorageByType {
    UploadFileType file_type = 1; // Тип файла
    int64 used_storage = 2; // Занятое пространство для данного типа в байтах
  }
  
  int64 total_used_storage = 1; // Общее занятое пространство в байтах
  int64 storage_limit = 2; // Лимит хранилища в байтах
  repeated StorageByType storage_by_types = 3; // Использованное пространство по типам файлов
}

// --- Стикерпаки ---

message StickerPackInfo {
  string id = 1;
  int64 creator_user_id = 2;
  string cover_sticker_id = 3;
  string name = 4;
  string description = 5;
  google.protobuf.Timestamp created_at = 6;
  int32 sticker_count = 7;
}

message StickerInfo {
  string id = 1;
  string sticker_pack_id = 2;
  string file_id = 3;
  string preview_file_id = 4;
  string emoji = 5;
  google.protobuf.Timestamp added_at = 6;
  string file_url = 7;
  string preview_url = 8;
}

message CreateStickerPackRequest {
  int64 creator_user_id = 1;
  string name = 2;
  string description = 3;
}

message CreateStickerPackResponse {
  StickerPackInfo pack = 1;
}

message UpdateStickerPackRequest {
  string pack_id = 1;
  string name = 2;
  string description = 3;
  string cover_sticker_id = 4;
}

message UpdateStickerPackResponse {
  StickerPackInfo pack = 1;
}

message DeleteStickerPackRequest {
  string pack_id = 1;
}

message DeleteStickerPackResponse {}

message ListStickerPacksRequest {
  barkfluff.shared.PageRequest pagination = 1;
}

message ListStickerPacksResponse {
  repeated StickerPackInfo packs = 1;
  int32 total_count = 2;
}

message GetStickerPackRequest {
  string pack_id = 1;
}

message GetStickerPackResponse {
  StickerPackInfo pack = 1;
  repeated StickerInfo stickers = 2;
}

message AddStickerRequest {
  string pack_id = 1;
  string file_id = 2;
  string emoji = 3;
}

message AddStickerResponse {
  StickerInfo sticker = 1;
}

message RemoveStickerRequest {
  string sticker_id = 1;
}

message RemoveStickerResponse {}

message UpdateStickerRequest {
  string sticker_id = 1;
  string emoji = 2;
}

message UpdateStickerResponse {
  StickerInfo sticker = 1;
}

message GetStickersRequest {
  repeated string sticker_ids = 1;
}

message GetStickersResponse {
  repeated StickerInfo stickers = 1;
}

message UploadStickerImageRequest {
  bytes image_data = 1;
  string filename = 2;
}

message UploadStickerImageResponse {
  string file_id = 1;
  string file_url = 2;
}