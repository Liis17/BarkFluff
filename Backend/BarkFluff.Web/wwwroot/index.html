<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff — Войти</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --card-bg: rgba(30, 41, 59, 0.6);
            --card-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-focus: rgba(59, 130, 246, 0.5);
            --error: #E74856;
            --success: #10b981;
            --link: #60a5fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        .blobs {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            animation: float 20s infinite alternate;
        }

        .b1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: #4f46e5;
            animation-duration: 25s;
        }

        .b2 {
            bottom: -10%;
            right: -10%;
            width: 40vw;
            height: 40vw;
            background: #0ea5e9;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, -40px); }
        }

        .page {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 440px;
            animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: white;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            padding: 36px 30px;
            border-radius: 24px;
            width: 100%;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
        }

        .card-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .card-subtitle {
            color: var(--text-sub);
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--input-focus);
        }

        .form-input::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .form-input.error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(231, 72, 86, 0.2);
        }

        .form-error {
            font-size: 12px;
            color: var(--error);
            margin-top: 6px;
            display: none;
        }

        .form-error.visible {
            display: block;
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 13px;
            color: var(--link);
            text-decoration: none;
            margin-bottom: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #93c5fd;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.5);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-primary .arrow {
            font-size: 18px;
            transition: transform 0.2s;
        }

        .btn-primary:hover:not(:disabled) .arrow {
            transform: translateX(3px);
        }

        .btn-primary .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        .btn-primary.loading .spinner { display: block; }
        .btn-primary.loading .btn-text,
        .btn-primary.loading .arrow { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            height: 1px;
            background: var(--card-border);
            margin: 20px 0;
        }

        .footer-section {
            text-align: center;
        }

        .footer-section p {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 14px;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-secondary .arrow {
            font-size: 16px;
            transition: transform 0.2s;
        }

        .btn-secondary:hover .arrow {
            transform: translateX(3px);
        }

        .copyright {
            margin-top: 16px;
            font-size: 12px;
            color: #475569;
            text-align: center;
        }

        /* OTP секция */
        .section { display: block; }
        .section.hidden { display: none; }

        .otp-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .otp-subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .otp-input {
            width: 48px;
            height: 56px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 22px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            text-align: center;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .otp-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--input-focus);
        }

        .otp-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--link);
            cursor: pointer;
            margin-bottom: 20px;
            transition: color 0.2s;
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
        }

        .otp-back:hover { color: #93c5fd; }

        /* Авторизованное состояние */
        .welcome-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--success), #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
        }

        .welcome-title {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: var(--text-sub);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="blobs">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
    </div>

    <div class="page">
        <div class="logo">
            <div class="logo-icon">B</div>
            <span class="logo-text">BarkFluff</span>
        </div>

        <div class="card">
            <!-- Секция логина -->
            <div id="loginSection" class="section">
                <h1 class="card-title">Добро пожаловать</h1>
                <p class="card-subtitle">Войдите в свой аккаунт</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Почта или username</label>
                        <input type="text" class="form-input" id="loginInput" placeholder="user@example.com" maxlength="50" autocomplete="username">
                        <div class="form-error" id="loginError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-input" id="passwordInput" placeholder="Введите пароль" autocomplete="current-password">
                        <div class="form-error" id="passwordError"></div>
                    </div>

                    <a class="forgot-link">Забыли пароль?</a>

                    <button type="submit" class="btn-primary" id="signInBtn">
                        <span class="btn-text">Войти</span>
                        <span class="arrow">&rarr;</span>
                        <div class="spinner"></div>
                    </button>
                </form>
            </div>

            <!-- Секция OTP -->
            <div id="otpSection" class="section hidden">
                <button class="otp-back" id="otpBack">&larr; Назад</button>
                <h2 class="otp-title">Код подтверждения</h2>
                <p class="otp-subtitle">Введите 6-значный код из приложения-аутентификатора или письма</p>

                <div class="otp-inputs" id="otpInputs">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                </div>
                <div class="form-error" id="otpError" style="text-align:center;margin-bottom:12px"></div>

                <button type="button" class="btn-primary" id="otpSubmitBtn">
                    <span class="btn-text">Подтвердить</span>
                    <span class="arrow">&rarr;</span>
                    <div class="spinner"></div>
                </button>
            </div>

            <!-- Секция после входа -->
            <div id="welcomeSection" class="section hidden">
                <div class="welcome-icon">&#10003;</div>
                <h2 class="welcome-title">Вы вошли в аккаунт</h2>
                <p class="welcome-subtitle">Веб-версия мессенджера скоро будет доступна</p>
            </div>

            <div class="divider" id="divider"></div>

            <div class="footer-section" id="footerSection">
                <p>Еще нет аккаунта?</p>
                <button class="btn-secondary">
                    Создать новый аккаунт
                    <span class="arrow">&rarr;</span>
                </button>
            </div>
        </div>

        <p class="copyright">2025 BarkFluff. Никакие права не защищены.</p>
    </div>

    <script>
    (() => {
        'use strict';

        // --- Хранилище токенов (sessionStorage) ---
        const TokenStore = {
            _key: 'barkfluff_auth',

            save(data) {
                sessionStorage.setItem(this._key, JSON.stringify(data));
            },

            get() {
                const raw = sessionStorage.getItem(this._key);
                return raw ? JSON.parse(raw) : null;
            },

            clear() {
                sessionStorage.removeItem(this._key);
            },

            getAccessToken() {
                const data = this.get();
                return data?.accessToken ?? null;
            },

            getRefreshToken() {
                const data = this.get();
                return data?.refreshToken ?? null;
            },

            isAccessExpired() {
                const data = this.get();
                if (!data?.accessTokenExpiration) return true;
                return Date.now() >= data.accessTokenExpiration - 30000; // 30 сек запас
            }
        };

        // --- Device ID (localStorage — переживает сессию) ---
        function getDeviceId() {
            let id = localStorage.getItem('barkfluff_device_id');
            if (!id) {
                id = crypto.randomUUID();
                localStorage.setItem('barkfluff_device_id', id);
            }
            return id;
        }

        // --- API ---
        async function apiLogin(login, password, otpCode) {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    login,
                    password,
                    otpCode: otpCode || null,
                    deviceId: getDeviceId()
                })
            });
            return { status: res.status, data: await res.json() };
        }

        async function apiRefresh() {
            const refreshToken = TokenStore.getRefreshToken();
            if (!refreshToken) return null;

            const res = await fetch('/api/auth/refresh', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refreshToken })
            });

            if (!res.ok) {
                TokenStore.clear();
                return null;
            }

            const data = await res.json();
            const stored = TokenStore.get();
            stored.accessToken = data.accessToken;
            stored.accessTokenExpiration = data.expiration;
            TokenStore.save(stored);
            return data.accessToken;
        }

        // Получить валидный access token (с авто-обновлением)
        async function getValidAccessToken() {
            if (!TokenStore.isAccessExpired()) {
                return TokenStore.getAccessToken();
            }
            return await apiRefresh();
        }

        // --- DOM ---
        const $ = (sel) => document.querySelector(sel);
        const loginSection = $('#loginSection');
        const otpSection = $('#otpSection');
        const welcomeSection = $('#welcomeSection');
        const divider = $('#divider');
        const footerSection = $('#footerSection');

        const loginForm = $('#loginForm');
        const loginInput = $('#loginInput');
        const passwordInput = $('#passwordInput');
        const loginError = $('#loginError');
        const passwordError = $('#passwordError');
        const signInBtn = $('#signInBtn');

        const otpInputs = document.querySelectorAll('.otp-input');
        const otpError = $('#otpError');
        const otpSubmitBtn = $('#otpSubmitBtn');
        const otpBack = $('#otpBack');

        let pendingLogin = '';
        let pendingPassword = '';

        // --- Переключение секций ---
        function showSection(name) {
            loginSection.classList.toggle('hidden', name !== 'login');
            otpSection.classList.toggle('hidden', name !== 'otp');
            welcomeSection.classList.toggle('hidden', name !== 'welcome');
            divider.style.display = name === 'welcome' ? 'none' : '';
            footerSection.style.display = name === 'welcome' ? 'none' : '';
        }

        function clearErrors() {
            loginError.classList.remove('visible');
            passwordError.classList.remove('visible');
            otpError.classList.remove('visible');
            loginInput.classList.remove('error');
            passwordInput.classList.remove('error');
        }

        function showError(el, inputEl, msg) {
            el.textContent = msg;
            el.classList.add('visible');
            if (inputEl) inputEl.classList.add('error');
        }

        function setLoading(btn, loading) {
            btn.classList.toggle('loading', loading);
            btn.disabled = loading;
        }

        // --- Обработка логина ---
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();

            const login = loginInput.value.trim();
            const password = passwordInput.value;

            if (!login) {
                showError(loginError, loginInput, 'Введите логин или email');
                return;
            }
            if (!password) {
                showError(passwordError, passwordInput, 'Введите пароль');
                return;
            }

            pendingLogin = login;
            pendingPassword = password;

            setLoading(signInBtn, true);

            try {
                const { status, data } = await apiLogin(login, password);

                if (data.error === 'otp_required') {
                    showSection('otp');
                    otpInputs[0].focus();
                    return;
                }

                if (data.error === 'invalid_credentials') {
                    showError(passwordError, passwordInput, 'Неверный логин или пароль');
                    return;
                }

                if (data.error) {
                    showError(passwordError, null, 'Ошибка сервера');
                    return;
                }

                // Успешный вход
                TokenStore.save(data);
                showSection('welcome');
            } catch {
                showError(passwordError, null, 'Не удалось подключиться к серверу');
            } finally {
                setLoading(signInBtn, false);
            }
        });

        // --- OTP ---
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value.replace(/[^0-9]/g, '');
                e.target.value = value;
                if (value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
                otpInputs.forEach((inp, i) => {
                    if (i < paste.length) inp.value = paste[i];
                });
                const nextIndex = Math.min(paste.length, otpInputs.length - 1);
                otpInputs[nextIndex].focus();
            });
        });

        otpSubmitBtn.addEventListener('click', async () => {
            clearErrors();
            const code = Array.from(otpInputs).map(i => i.value).join('');

            if (code.length !== 6) {
                otpError.textContent = 'Введите все 6 цифр';
                otpError.classList.add('visible');
                return;
            }

            setLoading(otpSubmitBtn, true);

            try {
                const { status, data } = await apiLogin(pendingLogin, pendingPassword, code);

                if (data.error === 'invalid_otp') {
                    otpError.textContent = 'Неверный код подтверждения';
                    otpError.classList.add('visible');
                    otpInputs.forEach(i => i.value = '');
                    otpInputs[0].focus();
                    return;
                }

                if (data.error) {
                    otpError.textContent = 'Ошибка сервера';
                    otpError.classList.add('visible');
                    return;
                }

                TokenStore.save(data);
                showSection('welcome');
            } catch {
                otpError.textContent = 'Не удалось подключиться к серверу';
                otpError.classList.add('visible');
            } finally {
                setLoading(otpSubmitBtn, false);
            }
        });

        otpBack.addEventListener('click', () => {
            clearErrors();
            otpInputs.forEach(i => i.value = '');
            showSection('login');
        });

        // --- Проверка при загрузке ---
        if (TokenStore.get()) {
            getValidAccessToken().then(token => {
                if (token) showSection('welcome');
            });
        }

        // Экспорт для будущего использования
        window.BarkFluff = { getValidAccessToken, TokenStore };
    })();
    </script>
</body>
</html>
