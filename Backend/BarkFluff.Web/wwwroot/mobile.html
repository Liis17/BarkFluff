<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff — Установите приложение</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #f5f5f5;
            --text-main: #1a1a1a;
            --text-sub: #6b7280;
            --primary: #8c351c;
            --primary-hover: #732c17;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .blobs {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.3;
        }

        .b1 { top: -10%; left: -10%; width: 80vw; height: 80vw; background: #f0c4a8; }
        .b2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #fde8d0; }

        .card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
        }

        .icon {
            font-size: 56px;
            margin-bottom: 20px;
            line-height: 1;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .description {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-download {
            display: inline-block;
            background: linear-gradient(135deg, #8c351c, #a0442a);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 16px rgba(140, 53, 28, 0.25);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(140, 53, 28, 0.35);
        }

        .btn-download:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="blobs">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
    </div>

    <div class="card">
        <div class="logo">
            <img src="/favicon.ico" alt="BarkFluff">
            <span class="logo-text">BarkFluff</span>
        </div>

        <div class="icon">&#128241;</div>

        <div class="title">BarkFluff недоступен в браузере на мобильных устройствах</div>

        <div class="description">
            Для использования BarkFluff на смартфоне установите официальное приложение для Android или iOS.
        </div>

        <a href="https://barkfluff.com" class="btn-download">
            Скачать приложение
        </a>
    </div>
</body>
</html>
