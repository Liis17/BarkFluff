    </div>

    <script>
    (() => {
        'use strict';

        // ========== TOKEN STORE ==========

        const TokenStore = {
            _key: 'barkfluff_auth',
            save(data) { sessionStorage.setItem(this._key, JSON.stringify(data)); },
            get() { const r = sessionStorage.getItem(this._key); return r ? JSON.parse(r) : null; },
            clear() { sessionStorage.removeItem(this._key); },
            getAccessToken() { return this.get()?.accessToken ?? null; },
            getRefreshToken() { return this.get()?.refreshToken ?? null; },
            isAccessExpired() {
                const d = this.get();
                if (!d?.accessTokenExpiration) return true;
                return Date.now() >= d.accessTokenExpiration - 30000;
            }
        };

        // --- Auth check ---
        if (!TokenStore.get()) {
            window.location.href = '/';
            return;
        }

        // Clean URL: /messenger → /
        history.replaceState(null, '', '/');

        // ========== HELPERS ==========

        function getDeviceId() {
            let id = localStorage.getItem('barkfluff_device_id');
            if (!id) { id = crypto.randomUUID(); localStorage.setItem('barkfluff_device_id', id); }
            return id;
        }

        function getBrowserName() {
            const ua = navigator.userAgent;
            if (ua.includes('Firefox')) return 'Firefox';
            if (ua.includes('Edg/')) return 'Microsoft Edge';
            if (ua.includes('OPR/') || ua.includes('Opera')) return 'Opera';
            if (ua.includes('YaBrowser')) return 'Yandex Browser';
            if (ua.includes('Chrome')) return 'Chrome';
            if (ua.includes('Safari')) return 'Safari';
            return 'Unknown';
        }

        function getOsName() {
            const ua = navigator.userAgent;
            if (ua.includes('Windows NT 10')) return 'Windows 10/11';
            if (ua.includes('Windows')) return 'Windows';
            if (ua.includes('Mac OS X')) return 'macOS';
            if (ua.includes('Android')) return 'Android';
            if (ua.includes('iPhone') || ua.includes('iPad')) return 'iOS';
            if (ua.includes('Linux')) return 'Linux';
            return 'Unknown';
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const today = new Date();
            if (d.toDateString() === today.toDateString()) return 'Сегодня';
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            if (d.toDateString() === yesterday.toDateString()) return 'Вчера';
            return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' Б';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
            return (bytes / (1024 * 1024)).toFixed(1) + ' МБ';
        }

        function truncate(text, len) {
            if (!text) return '';
            return text.length > len ? text.slice(0, len) + '...' : text;
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // ========== API LAYER ==========

        let refreshPromise = null;

        async function apiRefresh() {
            if (refreshPromise) return refreshPromise;
            refreshPromise = (async () => {
                const refreshToken = TokenStore.getRefreshToken();
                if (!refreshToken) return null;
                const res = await fetch('/api/auth/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken })
                });
                if (!res.ok) { TokenStore.clear(); return null; }
                const data = await res.json();
                const stored = TokenStore.get();
                stored.accessToken = data.accessToken;
                stored.accessTokenExpiration = data.expiration;
                TokenStore.save(stored);
                return data.accessToken;
            })();
            try { return await refreshPromise; }
            finally { refreshPromise = null; }
        }

        async function getValidAccessToken() {
            if (!TokenStore.isAccessExpired()) return TokenStore.getAccessToken();
            return await apiRefresh();
        }

        const API = {
            async request(path, opts = {}) {
                let token = await getValidAccessToken();
                if (!token) { window.location.href = '/'; return null; }

                const headers = {
                    'Authorization': `Bearer ${token}`,
                    'X-Device-Id': getDeviceId(),
                    'X-Browser-Name': getBrowserName(),
                    'X-Os-Name': getOsName(),
                    ...(opts.headers || {})
                };

                // Don't set Content-Type for FormData — browser sets it with boundary
                if (opts.body instanceof FormData) {
                    delete headers['Content-Type'];
                }

                let res = await fetch(path, { ...opts, headers });

                if (res.status === 401) {
                    token = await apiRefresh();
                    if (!token) { window.location.href = '/'; return null; }
                    headers['Authorization'] = `Bearer ${token}`;
                    res = await fetch(path, { ...opts, headers });
                }

                return res.json();
            },

            get(path) { return this.request(path); },

            postJson(path, body) {
                return this.request(path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
            }
        };

        // ========== USER CACHE ==========

        const userCache = new Map();
        let myUserId = null;

        async function getUser(userId) {
            if (userCache.has(userId)) return userCache.get(userId);
            const data = await API.get(`/api/users/${userId}`);
            if (data?.user) {
                userCache.set(userId, data.user);
                return data.user;
            }
            return null;
        }

        // Detect my user ID from JWT
        function parseJwtPayload(token) {
            try {
                const payload = token.split('.')[1];
                return JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/')));
            } catch { return null; }
        }

        const tokenPayload = parseJwtPayload(TokenStore.getAccessToken());
        if (tokenPayload) {
            myUserId = Number(tokenPayload['x-user-id']);
        }

        // ========== FILE URL CACHE ==========

        const fileUrlCache = new Map();

        async function getFileUrls(fileIds) {
            const missing = fileIds.filter(id => !fileUrlCache.has(id));
            if (missing.length > 0) {
                const data = await API.get(`/api/files/download-urls?fileIds=${missing.join(',')}`);
                if (data?.files) {
                    for (const f of data.files) {
                        fileUrlCache.set(f.fileId, f);
                    }
                }
            }
            return fileIds.map(id => fileUrlCache.get(id)).filter(Boolean);
        }

        // ========== STATE ==========

        let chats = [];
        let currentChatId = null;
        let currentChatInfo = null;
        let messages = [];
        let isLoadingOlder = false;
        let noMoreOlder = false;
        let pendingFiles = []; // { file, fileId, uploadUrl }
        let markReadTimer = null;
        let markReadPending = new Set();
        let sseUpdates = null;
        let sseOnline = null;
        let onlineSubscribedUserIds = new Set();

        // ========== DOM ==========

        const $ = sel => document.querySelector(sel);
        const chatListEl = $('#chatList');
        const searchInput = $('#searchInput');
        const searchResults = $('#searchResults');
        const chatHeader = $('#chatHeader');
        const chatHeaderAvatar = $('#chatHeaderAvatar');
        const chatHeaderName = $('#chatHeaderName');
        const chatHeaderStatus = $('#chatHeaderStatus');
        const chatEmpty = $('#chatEmpty');
        const messagesArea = $('#messagesArea');
        const loadingMessages = $('#loadingMessages');
        const inputBar = $('#inputBar');
        const messageInput = $('#messageInput');
        const sendBtn = $('#sendBtn');
        const attachBtn = $('#attachBtn');
        const fileInput = $('#fileInput');
        const filePreviewBar = $('#filePreviewBar');
        const imageOverlay = $('#imageOverlay');
        const overlayImage = $('#overlayImage');

        // ========== CHAT LIST ==========

        let chatListOffset = 0;
        let chatListTotal = 0;
        let chatListLoading = false;

        async function loadChats(reset = false) {
            if (chatListLoading) return;
            if (!reset && chats.length >= chatListTotal && chatListTotal > 0) return;

            chatListLoading = true;
            if (reset) { chatListOffset = 0; chats = []; }

            const data = await API.get(`/api/chats?offset=${chatListOffset}&size=50`);
            if (!data?.chats) { chatListLoading = false; return; }

            chatListTotal = data.totalCount;
            chats = reset ? data.chats : chats.concat(data.chats);
            chats.sort((a, b) => (b.lastMessage?.sentAt || 0) - (a.lastMessage?.sentAt || 0));
            chatListOffset = chats.length;
            chatListLoading = false;

            renderChatList();
            collectOnlineUserIds();
        }

        function renderChatList() {
            chatListEl.innerHTML = '';
            for (const chat of chats) {
                const el = document.createElement('div');
                el.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
                el.dataset.chatId = chat.id;

                const avatarInitial = (chat.title || '?')[0].toUpperCase();
                const avatarHtml = chat.picture
                    ? `<img src="${escapeHtml(chat.picture)}" alt="">`
                    : avatarInitial;

                const lastMsg = chat.lastMessage;
                let preview = '';
                if (lastMsg) {
                    const text = lastMsg.content?.text || '';
                    const attachCount = lastMsg.content?.attachments?.length || 0;
                    if (text) preview = truncate(text, 50);
                    else if (attachCount > 0) preview = attachmentEmoji(lastMsg.content.attachments[0].type);
                }

                const time = lastMsg?.sentAt ? formatTime(lastMsg.sentAt) : '';
                const unread = chat.countUnread || 0;
                const unreadText = unread > 99 ? '99+' : unread;

                // Determine userId for online dot (only personal chats)
                let peerUserId = null;
                if (!chat.isGroupChat && chat.members?.length > 0) {
                    const peer = chat.members.find(m => m.userId !== myUserId);
                    if (peer) peerUserId = peer.userId;
                }

                el.innerHTML = `
                    <div class="chat-avatar">
                        ${avatarHtml}
                        <div class="online-dot${peerUserId && isUserOnline(peerUserId) ? ' visible' : ''}" data-online-user="${peerUserId || ''}"></div>
                    </div>
                    <div class="chat-info">
                        <div class="chat-info-top">
                            <span class="chat-name">${escapeHtml(chat.title || 'Чат')}</span>
                            <span class="chat-time">${time}</span>
                        </div>
                        <div class="chat-info-bottom">
                            <span class="chat-preview">${escapeHtml(preview)}</span>
                            <span class="chat-unread${unread > 0 ? ' visible' : ''}">${unreadText}</span>
                        </div>
                    </div>
                `;

                el.addEventListener('click', () => openChat(chat.id));
                chatListEl.appendChild(el);
            }
        }

        function attachmentEmoji(type) {
            switch (type) {
                case 'IMAGE': case 'GIF': return '\u{1F4F7} Фото';
                case 'VIDEO': return '\u{1F3AC} Видео';
                case 'AUDIO': return '\u{1F3B5} Аудио';
                case 'VOICE': return '\u{1F3A4} Голосовое';
                case 'DOCUMENT': return '\u{1F4C4} Документ';
                case 'STICKER': return '\u{1F92A} Стикер';
                default: return '\u{1F4CE} Вложение';
            }
        }

        // Infinite scroll for chat list
        chatListEl.addEventListener('scroll', () => {
            if (chatListEl.scrollTop + chatListEl.clientHeight >= chatListEl.scrollHeight - 100) {
                loadChats();
            }
        });

        // ========== MESSAGES ==========

        // --- Audio Player Singleton ---
        const AudioPlayer = {
            current: null,
            play(item) {
                if (this.current && this.current !== item) {
                    this.current.audio.pause();
                    this.current.playBtn.textContent = '\u25B6';
                }
                item.audio.play();
                item.playBtn.textContent = '\u23F8';
                this.current = item;
            },
            pause() {
                if (!this.current) return;
                this.current.audio.pause();
                this.current.playBtn.textContent = '\u25B6';
            },
            toggle(item) {
                if (this.current === item && !item.audio.paused) {
                    this.pause();
                } else {
                    this.play(item);
                }
            }
        };

        function formatDuration(sec) {
            if (!sec || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function docIcon(fileName) {
            if (!fileName) return '\u{1F4C4}';
            const ext = fileName.split('.').pop()?.toLowerCase();
            if (['pdf'].includes(ext)) return '\u{1F4D1}';
            if (['doc','docx'].includes(ext)) return '\u{1F4DD}';
            if (['xls','xlsx'].includes(ext)) return '\u{1F4CA}';
            if (['zip','rar','7z','tar','gz'].includes(ext)) return '\u{1F4E6}';
            if (['apk'].includes(ext)) return '\u{1F4F1}';
            return '\u{1F4C4}';
        }

        // --- Attachment rendering functions ---

        function renderAttachments(attachments, bubble) {
            if (attachments.length === 0) return;

            const images = [];
            const videos = [];
            const audios = [];
            const docs = [];

            for (const a of attachments) {
                switch (a.type) {
                    case 'IMAGE': case 'GIF': images.push(a); break;
                    case 'STICKER': images.push(a); break;
                    case 'VIDEO': videos.push(a); break;
                    case 'AUDIO': case 'VOICE': audios.push(a); break;
                    case 'DOCUMENT': docs.push(a); break;
                    default: docs.push(a); break;
                }
            }

            const attDiv = document.createElement('div');
            attDiv.className = 'msg-attachments';

            if (images.length > 0) renderImageGrid(images, attDiv);
            if (videos.length > 0) renderVideos(videos, attDiv);
            if (audios.length > 0) renderAudios(audios, attDiv);
            if (docs.length > 0) renderDocs(docs, attDiv);

            bubble.appendChild(attDiv);
        }

        function renderImageGrid(images, container) {
            const isSticker = images.length === 1 && images[0].type === 'STICKER';
            if (isSticker) {
                const a = images[0];
                const fileData = fileUrlCache.get(a.fileId);
                const url = fileData?.url || fileData?.previewUrl || a.previewUrl || '';
                const img = document.createElement('img');
                img.className = 'attach-sticker';
                img.src = url;
                img.loading = 'lazy';
                container.appendChild(img);
                return;
            }

            const grid = document.createElement('div');
            const visibleCount = Math.min(images.length, 4);
            grid.className = `attach-image-grid grid-${visibleCount}`;

            for (let i = 0; i < visibleCount; i++) {
                const a = images[i];
                const fileData = fileUrlCache.get(a.fileId);
                const url = fileData?.url || '';
                const previewUrl = fileData?.previewUrl || a.previewUrl || '';

                if (i === 3 && images.length > 4) {
                    const wrap = document.createElement('div');
                    wrap.className = 'more-overlay';
                    const img = document.createElement('img');
                    img.src = previewUrl || url;
                    img.loading = 'lazy';
                    img.onerror = () => { if (img.src !== url && url) img.src = url; };
                    wrap.appendChild(img);
                    const count = document.createElement('div');
                    count.className = 'more-count';
                    count.textContent = `+${images.length - 3}`;
                    wrap.appendChild(count);
                    wrap.addEventListener('click', () => showMediaOverlay('image', url || img.src));
                    grid.appendChild(wrap);
                } else {
                    const img = document.createElement('img');
                    img.src = previewUrl || url;
                    img.loading = 'lazy';
                    img.onerror = () => { if (img.src !== url && url) img.src = url; };
                    img.addEventListener('click', () => showMediaOverlay('image', url || img.src));
                    grid.appendChild(img);
                }
            }
            container.appendChild(grid);
        }

        function renderVideos(videos, container) {
            for (const a of videos) {
                const fileData = fileUrlCache.get(a.fileId);
                const url = fileData?.url || '';
                const previewUrl = fileData?.previewUrl || a.previewUrl || '';

                const wrap = document.createElement('div');
                wrap.className = 'attach-video-wrap';

                const vid = document.createElement('video');
                vid.preload = 'metadata';
                if (previewUrl) vid.poster = previewUrl;
                vid.src = url;

                const overlay = document.createElement('div');
                overlay.className = 'video-play-overlay';
                overlay.innerHTML = '<span>\u25B6</span>';

                wrap.appendChild(vid);
                wrap.appendChild(overlay);
                wrap.addEventListener('click', () => showMediaOverlay('video', url));
                container.appendChild(wrap);
            }
        }

        function renderAudios(audioAttachments, container) {
            for (const a of audioAttachments) {
                const fileData = fileUrlCache.get(a.fileId);
                const url = fileData?.url || '';
                const isVoice = a.type === 'VOICE';

                const wrap = document.createElement('div');
                wrap.className = 'attach-audio';

                const playBtn = document.createElement('button');
                playBtn.className = 'audio-play-btn';
                playBtn.textContent = '\u25B6';

                const info = document.createElement('div');
                info.className = 'audio-info';

                const progress = document.createElement('div');
                progress.className = 'audio-progress';
                const progressFill = document.createElement('div');
                progressFill.className = 'audio-progress-fill';
                progress.appendChild(progressFill);

                const meta = document.createElement('div');
                meta.className = 'audio-meta';
                const timeEl = document.createElement('span');
                timeEl.className = 'audio-time';
                timeEl.textContent = '0:00';
                const nameEl = document.createElement('span');
                nameEl.className = 'audio-name';
                nameEl.textContent = isVoice ? '\u{1F3A4} Голосовое' : (a.fileName || 'Аудио');
                meta.appendChild(timeEl);
                meta.appendChild(nameEl);

                info.appendChild(progress);
                info.appendChild(meta);

                wrap.appendChild(playBtn);
                wrap.appendChild(info);

                const audio = new Audio(url);
                audio.preload = 'metadata';

                const item = { audio, playBtn, progressFill, timeEl };

                audio.addEventListener('loadedmetadata', () => {
                    timeEl.textContent = formatDuration(audio.duration);
                });

                audio.addEventListener('timeupdate', () => {
                    if (audio.duration) {
                        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
                        timeEl.textContent = formatDuration(audio.currentTime);
                    }
                });

                audio.addEventListener('ended', () => {
                    playBtn.textContent = '\u25B6';
                    progressFill.style.width = '0%';
                    timeEl.textContent = formatDuration(audio.duration);
                    AudioPlayer.current = null;
                });

                progress.addEventListener('click', (e) => {
                    const rect = progress.getBoundingClientRect();
                    const ratio = (e.clientX - rect.left) / rect.width;
                    if (audio.duration) audio.currentTime = ratio * audio.duration;
                });

                playBtn.addEventListener('click', () => AudioPlayer.toggle(item));

                container.appendChild(wrap);
            }
        }

        function renderDocs(docAttachments, container) {
            for (const a of docAttachments) {
                const fileData = fileUrlCache.get(a.fileId);
                const url = fileData?.url || '';

                const link = document.createElement('a');
                link.className = 'attach-doc';
                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener';
                link.download = a.fileName || '';
                link.innerHTML = `
                    <span class="attach-doc-icon">${docIcon(a.fileName)}</span>
                    <div class="attach-doc-info">
                        <div class="attach-doc-name">${escapeHtml(a.fileName || 'Файл')}</div>
                        <div class="attach-doc-size">${formatFileSize(a.attachmentSize || 0)}</div>
                    </div>
                `;
                container.appendChild(link);
            }
        }

        async function openChat(chatId) {
            if (chatId === currentChatId) return;

            currentChatId = chatId;
            messages = [];
            noMoreOlder = false;
            pendingFiles = [];
            filePreviewBar.classList.remove('visible');
            filePreviewBar.innerHTML = '';

            chatEmpty.style.display = 'none';
            chatHeader.classList.add('visible');
            messagesArea.classList.add('visible');
            messagesArea.innerHTML = '';
            inputBar.classList.add('visible');
            loadingMessages.classList.add('visible');

            renderChatList();

            const infoData = await API.get(`/api/chats/${chatId}/info`);
            if (!infoData || infoData.error) {
                loadingMessages.classList.remove('visible');
                return;
            }
            currentChatInfo = infoData;

            // Header
            chatHeaderName.textContent = infoData.title || 'Чат';
            if (infoData.picture) {
                chatHeaderAvatar.innerHTML = `<img src="${escapeHtml(infoData.picture)}" alt="">`;
            } else {
                chatHeaderAvatar.textContent = (infoData.title || '?')[0].toUpperCase();
            }

            // Online status for personal chat
            if (!infoData.isGroupChat && infoData.membersId?.length > 0) {
                const peerId = infoData.membersId.find(id => id !== myUserId);
                if (peerId) {
                    updateChatHeaderOnline(peerId);
                    subscribeOnlineForUsers([peerId]);
                }
            } else {
                chatHeaderStatus.textContent = `${infoData.membersId?.length || 0} участников`;
                chatHeaderStatus.classList.remove('online');
            }

            // Load messages from first unread or latest
            const fromId = infoData.firstUnreadMessageId || 0;
            const msgData = await API.get(`/api/chats/${chatId}/messages?from=${fromId}&before=30&after=10`);
            loadingMessages.classList.remove('visible');

            if (msgData?.messages) {
                messages = msgData.messages;
                await renderMessages();
                scrollToBottom();
                scheduleMarkRead();
            }
        }

        async function renderMessages() {
            messagesArea.innerHTML = '';
            let lastDate = null;

            // Collect all file IDs for attachments
            const allFileIds = [];
            for (const msg of messages) {
                for (const a of (msg.content?.attachments || [])) {
                    if (a.fileId && !fileUrlCache.has(a.fileId)) allFileIds.push(a.fileId);
                }
            }
            if (allFileIds.length > 0) await getFileUrls(allFileIds);

            for (const msg of messages) {
                const msgDate = formatDate(msg.sentAt);
                if (msgDate !== lastDate) {
                    lastDate = msgDate;
                    const sep = document.createElement('div');
                    sep.className = 'msg-date-separator';
                    sep.innerHTML = `<span>${escapeHtml(msgDate)}</span>`;
                    messagesArea.appendChild(sep);
                }

                const isOutgoing = msg.senderId === myUserId;
                const direction = isOutgoing ? 'outgoing' : 'incoming';

                const group = document.createElement('div');
                group.className = `msg-group ${direction}`;
                group.dataset.msgId = msg.id;

                // Sender name for group incoming
                if (!isOutgoing && currentChatInfo?.isGroupChat) {
                    const sender = await getUser(msg.senderId);
                    if (sender) {
                        const nameEl = document.createElement('div');
                        nameEl.className = 'msg-sender';
                        nameEl.textContent = `${sender.firstName} ${sender.lastName}`.trim() || sender.username;
                        group.appendChild(nameEl);
                    }
                }

                const isSticker = msg.content?.attachments?.length === 1 && msg.content.attachments[0].type === 'STICKER';
                const bubble = document.createElement('div');
                bubble.className = `msg-bubble ${direction}${isSticker ? ' sticker' : ''}`;

                // Attachments
                const attachments = msg.content?.attachments || [];
                if (attachments.length > 0) {
                    renderAttachments(attachments, bubble);
                }

                // Text
                const text = msg.content?.text;
                if (text) {
                    const textEl = document.createElement('div');
                    textEl.className = 'msg-text';
                    textEl.textContent = text;
                    bubble.appendChild(textEl);
                }

                // Meta (time + read status)
                if (!isSticker) {
                    const meta = document.createElement('div');
                    meta.className = 'msg-meta';

                    const timeEl = document.createElement('span');
                    timeEl.className = 'msg-time';
                    timeEl.textContent = formatTime(msg.sentAt);
                    meta.appendChild(timeEl);

                    if (isOutgoing) {
                        const statusEl = document.createElement('span');
                        statusEl.className = 'msg-status';
                        statusEl.dataset.msgId = msg.id;
                        const readCount = (msg.readBy || []).filter(id => id !== myUserId).length;
                        statusEl.innerHTML = readCount > 0 ? '&#10003;&#10003;' : '&#10003;';
                        meta.appendChild(statusEl);
                    }

                    bubble.appendChild(meta);
                }

                group.appendChild(bubble);
                messagesArea.appendChild(group);
            }
        }

        function scrollToBottom() {
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        async function appendMessageToView(msg) {
            // Fetch file URLs if needed
            const fileIds = (msg.content?.attachments || []).map(a => a.fileId).filter(id => id && !fileUrlCache.has(id));
            if (fileIds.length > 0) await getFileUrls(fileIds);

            // Date separator if needed
            const msgDate = formatDate(msg.sentAt);
            const lastGroup = messagesArea.lastElementChild;
            const lastMsgDate = lastGroup?.dataset?.date;
            if (msgDate !== lastMsgDate) {
                const sep = document.createElement('div');
                sep.className = 'msg-date-separator';
                sep.dataset.date = msgDate;
                sep.innerHTML = `<span>${escapeHtml(msgDate)}</span>`;
                messagesArea.appendChild(sep);
            }

            const isOutgoing = msg.senderId === myUserId;
            const direction = isOutgoing ? 'outgoing' : 'incoming';

            const group = document.createElement('div');
            group.className = `msg-group ${direction}`;
            group.dataset.msgId = msg.id;
            group.dataset.date = msgDate;

            if (!isOutgoing && currentChatInfo?.isGroupChat) {
                const sender = await getUser(msg.senderId);
                if (sender) {
                    const nameEl = document.createElement('div');
                    nameEl.className = 'msg-sender';
                    nameEl.textContent = `${sender.firstName} ${sender.lastName}`.trim() || sender.username;
                    group.appendChild(nameEl);
                }
            }

            const isSticker = msg.content?.attachments?.length === 1 && msg.content.attachments[0].type === 'STICKER';
            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${direction}${isSticker ? ' sticker' : ''}`;

            const attachments = msg.content?.attachments || [];
            if (attachments.length > 0) {
                renderAttachments(attachments, bubble);
            }

            const text = msg.content?.text;
            if (text) {
                const textEl = document.createElement('div');
                textEl.className = 'msg-text';
                textEl.textContent = text;
                bubble.appendChild(textEl);
            }

            if (!isSticker) {
                const meta = document.createElement('div');
                meta.className = 'msg-meta';
                const timeEl = document.createElement('span');
                timeEl.className = 'msg-time';
                timeEl.textContent = formatTime(msg.sentAt);
                meta.appendChild(timeEl);
                if (isOutgoing) {
                    const statusEl = document.createElement('span');
                    statusEl.className = 'msg-status';
                    statusEl.dataset.msgId = msg.id;
                    const readCount = (msg.readBy || []).filter(id => id !== myUserId).length;
                    statusEl.innerHTML = readCount > 0 ? '&#10003;&#10003;' : '&#10003;';
                    meta.appendChild(statusEl);
                }
                bubble.appendChild(meta);
            }

            group.appendChild(bubble);
            messagesArea.appendChild(group);
        }

        // Lazy-load older messages
        messagesArea.addEventListener('scroll', async () => {
            if (messagesArea.scrollTop < 100 && !isLoadingOlder && !noMoreOlder && currentChatId && messages.length > 0) {
                isLoadingOlder = true;
                loadingMessages.classList.add('visible');

                const oldestId = messages[0]?.id || 0;
                const prevHeight = messagesArea.scrollHeight;

                const data = await API.get(`/api/chats/${currentChatId}/messages?from=${oldestId}&before=30&after=0`);

                if (data?.messages?.length > 0) {
                    const newMsgs = data.messages.filter(m => !messages.some(em => em.id === m.id));
                    if (newMsgs.length === 0) {
                        noMoreOlder = true;
                    } else {
                        messages = [...newMsgs, ...messages];
                        await renderMessages();
                        messagesArea.scrollTop = messagesArea.scrollHeight - prevHeight;
                    }
                } else {
                    noMoreOlder = true;
                }

                loadingMessages.classList.remove('visible');
                isLoadingOlder = false;
            }
        });

        // ========== SEND MESSAGE ==========

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && pendingFiles.length === 0) return;
            if (!currentChatId) return;

            sendBtn.disabled = true;

            // Upload pending files via proxy to Files service
            const fileIds = [];
            for (const pf of pendingFiles) {
                try {
                    const formData = new FormData();
                    formData.append('file', pf.file, pf.file.name);
                    const uploadRes = await API.request(`/api/files/upload/${pf.fileId}`, { method: 'POST', body: formData });
                    if (uploadRes?.fileId) fileIds.push(pf.fileId);
                    else fileIds.push(pf.fileId); // assume success if no error thrown
                } catch (e) {
                    console.error('File upload failed:', e);
                }
            }

            // Guard: don't send empty message if all uploads failed
            if (!text && fileIds.length === 0) {
                sendBtn.disabled = false;
                return;
            }

            const body = { chatId: currentChatId, text: text || null, fileIds: fileIds.length > 0 ? fileIds : null };
            const sentChatId = currentChatId;
            const response = await API.postJson('/api/chats/send', body);

            messageInput.value = '';
            messageInput.style.height = 'auto';
            pendingFiles = [];
            filePreviewBar.classList.remove('visible');
            filePreviewBar.innerHTML = '';
            sendBtn.disabled = false;
            messageInput.focus();

            // Add sent message to UI immediately
            if (response?.message) {
                const msg = response.message;
                if (sentChatId === currentChatId && !messages.some(m => m.id === msg.id)) {
                    messages.push(msg);
                    await appendMessageToView(msg);
                    scrollToBottom();
                }
                // Move chat to top and update lastMessage
                const chatIdx = chats.findIndex(c => c.id === sentChatId);
                if (chatIdx >= 0) {
                    const chat = chats[chatIdx];
                    chat.lastMessage = msg;
                    chats.splice(chatIdx, 1);
                    chats.unshift(chat);
                    renderChatList();
                }
            }
        }

        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        });

        // ========== FILE UPLOAD ==========

        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async () => {
            const files = Array.from(fileInput.files);
            fileInput.value = '';

            for (const file of files) {
                const fileType = getUploadFileType(file.type);
                const data = await API.get(`/api/files/upload-url?fileType=${fileType}`);
                if (!data?.fileId) continue;

                pendingFiles.push({ file, fileId: data.fileId });
            }

            renderFilePreview();
        });

        function getUploadFileType(mimeType) {
            if (mimeType.startsWith('image/gif')) return 4; // GIF
            if (mimeType.startsWith('image/')) return 2; // IMAGE
            if (mimeType.startsWith('video/')) return 3; // VIDEO
            if (mimeType.startsWith('audio/')) return 7; // AUDIO
            return 5; // DOCUMENT
        }

        function renderFilePreview() {
            if (pendingFiles.length === 0) {
                filePreviewBar.classList.remove('visible');
                filePreviewBar.innerHTML = '';
                return;
            }
            filePreviewBar.classList.add('visible');
            filePreviewBar.innerHTML = pendingFiles.map((pf, i) => `
                <div class="file-preview-item">
                    <span>${escapeHtml(truncate(pf.file.name, 25))}</span>
                    <button class="file-preview-remove" data-index="${i}">&#10005;</button>
                </div>
            `).join('');

            filePreviewBar.querySelectorAll('.file-preview-remove').forEach(btn => {
                btn.addEventListener('click', () => {
                    pendingFiles.splice(Number(btn.dataset.index), 1);
                    renderFilePreview();
                });
            });
        }

        // ========== MARK AS READ ==========

        function scheduleMarkRead() {
            if (markReadTimer) clearTimeout(markReadTimer);
            markReadTimer = setTimeout(flushMarkRead, 1000);

            // Collect visible incoming messages
            if (!currentChatId) return;
            for (const msg of messages) {
                if (msg.senderId !== myUserId && !(msg.readBy || []).includes(myUserId)) {
                    markReadPending.add(msg.id);
                }
            }
        }

        async function flushMarkRead() {
            if (markReadPending.size === 0) return;
            const ids = Array.from(markReadPending);
            markReadPending.clear();
            await API.postJson('/api/chats/mark-read', { messageIds: ids });
        }

        // ========== SSE ==========

        let sseUpdatesBackoff = 1000;
        let sseOnlineBackoff = 1000;

        async function connectSSE() {
            const token = await getValidAccessToken();
            if (!token) return;

            if (sseUpdates) sseUpdates.close();
            sseUpdates = new EventSource(`/api/sse/updates?token=${encodeURIComponent(token)}`);

            sseUpdates.addEventListener('new_message', (e) => {
                try {
                    const data = JSON.parse(e.data);
                    handleNewMessage(data.chatId, data.message);
                } catch {}
            });

            sseUpdates.addEventListener('message_read', (e) => {
                try {
                    const data = JSON.parse(e.data);
                    handleMessageRead(data.chatId, data.messageId, data.readBy);
                } catch {}
            });

            sseUpdates.onopen = () => { sseUpdatesBackoff = 1000; };

            sseUpdates.onerror = async () => {
                sseUpdates.close();
                await getValidAccessToken();
                setTimeout(connectSSE, sseUpdatesBackoff);
                sseUpdatesBackoff = Math.min(sseUpdatesBackoff * 2, 30000);
            };
        }

        async function connectOnlineSSE(userIds) {
            if (userIds.length === 0) return;

            const token = await getValidAccessToken();
            if (!token) return;

            if (sseOnline) sseOnline.close();
            sseOnline = new EventSource(`/api/sse/online?userIds=${userIds.join(',')}&token=${encodeURIComponent(token)}`);

            sseOnline.addEventListener('online_status', (e) => {
                try {
                    const data = JSON.parse(e.data);
                    handleOnlineStatus(data.userId, data.status, data.lastSeen);
                } catch {}
            });

            sseOnline.onopen = () => { sseOnlineBackoff = 1000; };

            sseOnline.onerror = async () => {
                sseOnline.close();
                await getValidAccessToken();
                setTimeout(() => connectOnlineSSE(Array.from(onlineSubscribedUserIds)), sseOnlineBackoff);
                sseOnlineBackoff = Math.min(sseOnlineBackoff * 2, 30000);
            };
        }

        // ========== SSE HANDLERS ==========

        function handleNewMessage(chatId, msg) {
            // Dedup: skip if already in messages
            if (chatId === currentChatId && messages.some(m => m.id === msg.id)) return;

            // Update chat in list
            const chatIdx = chats.findIndex(c => c.id === chatId);
            if (chatIdx >= 0) {
                const chat = chats[chatIdx];
                chat.lastMessage = msg;
                if (chatId !== currentChatId) {
                    chat.countUnread = (chat.countUnread || 0) + 1;
                }
                // Move to top
                chats.splice(chatIdx, 1);
                chats.unshift(chat);
                renderChatList();
            } else {
                // New chat — reload
                loadChats(true);
            }

            // If current chat, append single message
            if (chatId === currentChatId) {
                const isAtBottom = messagesArea.scrollHeight - messagesArea.scrollTop - messagesArea.clientHeight < 100;
                messages.push(msg);
                appendMessageToView(msg).then(() => {
                    if (isAtBottom) scrollToBottom();
                    scheduleMarkRead();
                });
            }
        }

        function handleMessageRead(chatId, messageId, readBy) {
            // Update message in current view
            if (chatId === currentChatId) {
                const msg = messages.find(m => m.id === messageId);
                if (msg) {
                    msg.readBy = readBy;
                    // Update status icon
                    const el = messagesArea.querySelector(`.msg-status[data-msg-id="${messageId}"]`);
                    if (el) {
                        const readCount = readBy.filter(id => id !== myUserId).length;
                        el.innerHTML = readCount > 0 ? '&#10003;&#10003;' : '&#10003;';
                    }
                }
            }

            // Update unread badge in chat list
            const chat = chats.find(c => c.id === chatId);
            if (chat && readBy.includes(myUserId)) {
                if (chatId === currentChatId) {
                    chat.countUnread = 0;
                } else {
                    chat.countUnread = Math.max(0, (chat.countUnread || 0) - 1);
                }
                renderChatList();
            }
        }

        const onlineStatuses = new Map();

        function isUserOnline(userId) {
            return onlineStatuses.get(userId) === 'StatusOnline';
        }

        function handleOnlineStatus(userId, status, lastSeen) {
            onlineStatuses.set(userId, status);

            // Update chat list dots
            document.querySelectorAll(`.online-dot[data-online-user="${userId}"]`).forEach(dot => {
                dot.classList.toggle('visible', status === 'StatusOnline');
            });

            // Update chat header
            if (currentChatInfo && !currentChatInfo.isGroupChat) {
                const peerId = currentChatInfo.membersId?.find(id => id !== myUserId);
                if (peerId === userId) updateChatHeaderOnline(userId);
            }
        }

        function updateChatHeaderOnline(userId) {
            const online = isUserOnline(userId);
            chatHeaderStatus.textContent = online ? 'в сети' : 'не в сети';
            chatHeaderStatus.classList.toggle('online', online);
        }

        function collectOnlineUserIds() {
            const ids = new Set();
            for (const chat of chats) {
                if (!chat.isGroupChat && chat.members) {
                    for (const m of chat.members) {
                        if (m.userId !== myUserId) ids.add(m.userId);
                    }
                }
            }
            subscribeOnlineForUsers(Array.from(ids));
        }

        function subscribeOnlineForUsers(userIds) {
            let changed = false;
            for (const id of userIds) {
                if (!onlineSubscribedUserIds.has(id)) {
                    onlineSubscribedUserIds.add(id);
                    changed = true;
                }
            }
            if (changed) {
                connectOnlineSSE(Array.from(onlineSubscribedUserIds));
            }
        }

        // ========== SEARCH ==========

        let searchTimer = null;

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            const query = searchInput.value.trim();

            if (!query) {
                searchResults.classList.remove('visible');
                searchResults.innerHTML = '';
                return;
            }

            searchTimer = setTimeout(async () => {
                const data = await API.get(`/api/users/search?query=${encodeURIComponent(query)}&offset=0&size=20`);
                if (!data?.users) return;

                searchResults.classList.add('visible');
                searchResults.innerHTML = '';

                for (const user of data.users) {
                    const el = document.createElement('div');
                    el.className = 'search-result-item';

                    const avatarInitial = (user.firstName || user.username || '?')[0].toUpperCase();
                    const avatarHtml = user.profilePicturePreview
                        ? `<img src="${escapeHtml(user.profilePicturePreview)}" alt="">`
                        : avatarInitial;

                    el.innerHTML = `
                        <div class="chat-avatar">${avatarHtml}</div>
                        <div class="search-result-info">
                            <div class="user-name">${escapeHtml(`${user.firstName || ''} ${user.lastName || ''}`.trim() || user.username)}</div>
                            <div class="user-username">@${escapeHtml(user.username || '')}</div>
                        </div>
                    `;

                    el.addEventListener('click', async () => {
                        searchInput.value = '';
                        searchResults.classList.remove('visible');
                        searchResults.innerHTML = '';

                        const chatData = await API.get(`/api/chats/personal/${user.id}`);
                        if (chatData?.chatId) {
                            await openChat(chatData.chatId);
                        }
                    });

                    searchResults.appendChild(el);
                }

                if (data.users.length === 0) {
                    searchResults.innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-sub);font-size:14px;">Ничего не найдено</div>';
                }
            }, 300);
        });

        // ========== MEDIA OVERLAY ==========

        const overlayVideo = $('#overlayVideo');

        function showMediaOverlay(type, url) {
            if (type === 'video') {
                overlayImage.style.display = 'none';
                overlayVideo.style.display = 'block';
                overlayVideo.src = url;
                overlayVideo.play();
            } else {
                overlayVideo.style.display = 'none';
                overlayImage.style.display = 'block';
                overlayImage.src = url;
            }
            imageOverlay.classList.add('visible');
        }

        imageOverlay.addEventListener('click', (e) => {
            if (e.target === overlayVideo) return; // don't close when clicking video controls
            imageOverlay.classList.remove('visible');
            overlayImage.src = '';
            overlayVideo.pause();
            overlayVideo.src = '';
        });

        // ========== LOGOUT ==========

        $('#logoutBtn').addEventListener('click', () => {
            if (sseUpdates) sseUpdates.close();
            if (sseOnline) sseOnline.close();
            TokenStore.clear();
            window.location.href = '/';
        });

        // ========== ONLINE KEEPALIVE ==========

        setInterval(() => API.postJson('/api/online/ping', {}), 30000);
        API.postJson('/api/online/ping', {});

        // ========== PROACTIVE TOKEN REFRESH ==========

        setInterval(async () => {
            if (TokenStore.isAccessExpired()) {
                const token = await apiRefresh();
                if (token) {
                    // Reconnect SSE with fresh token
                    connectSSE();
                    if (onlineSubscribedUserIds.size > 0) {
                        connectOnlineSSE(Array.from(onlineSubscribedUserIds));
                    }
                }
            }
        }, 60000);

        // ========== USER PROFILE ==========

        const profileOverlay = $('#profileOverlay');
        const profileClose = $('#profileClose');
        const profileAvatar = $('#profileAvatar');
        const profileName = $('#profileName');
        const profileUsername = $('#profileUsername');
        const profileStatus = $('#profileStatus');
        const profileBio = $('#profileBio');
        const profileBadges = $('#profileBadges');
        const profileRegDate = $('#profileRegDate');
        const profileMediaGrid = $('#profileMediaGrid');
        const profileMediaContent = $('#profileMediaContent');
        let currentProfileUserId = null;

        async function openProfile(userId) {
            if (!userId) return;
            currentProfileUserId = userId;

            const data = await API.get(`/api/users/${userId}`);
            if (!data?.user) return;
            const user = data.user;

            // Avatar
            const initial = (user.firstName || user.username || '?')[0].toUpperCase();
            if (user.profilePicture) {
                profileAvatar.innerHTML = `<img src="${user.profilePicture}" alt="">`;
            } else {
                profileAvatar.innerHTML = initial;
            }

            profileName.textContent = [user.firstName, user.lastName].filter(Boolean).join(' ') || user.username;
            profileUsername.textContent = user.username ? `@${user.username}` : '';
            profileBio.textContent = user.bio || '';
            profileBio.style.display = user.bio ? 'block' : 'none';

            // Online status
            const online = isUserOnline(userId);
            profileStatus.textContent = online ? 'в сети' : 'не в сети';
            profileStatus.className = 'profile-status-line' + (online ? ' online' : '');

            // Registration date
            if (user.registrationDate) {
                const d = new Date(user.registrationDate);
                profileRegDate.textContent = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            } else {
                profileRegDate.textContent = '—';
            }

            // Badges
            profileBadges.innerHTML = '';
            if (user.badges && user.badges.length > 0) {
                for (const badge of user.badges) {
                    const el = document.createElement('div');
                    el.className = 'profile-badge';
                    el.innerHTML = (badge.imageUrl ? `<img src="${badge.imageUrl}" alt="">` : '') + badge.name;
                    profileBadges.appendChild(el);
                }
            }

            // Load media tab by default
            loadProfileMedia('media');

            profileOverlay.classList.add('visible');
        }

        async function loadProfileMedia(type) {
            profileMediaContent.innerHTML = '';

            if (!currentChatId) return;

            if (type === 'media') {
                // Load images + videos
                const data = await API.get(`/api/chats/${currentChatId}/attachments?type=1&offset=0&size=30`);
                const videoData = await API.get(`/api/chats/${currentChatId}/attachments?type=2&offset=0&size=30`);

                const allMedia = [...(data?.attachments || []), ...(videoData?.attachments || [])];
                allMedia.sort((a, b) => (b.sentAt || 0) - (a.sentAt || 0));

                if (allMedia.length === 0) {
                    profileMediaContent.innerHTML = '<div class="profile-media-empty">Нет медиафайлов</div>';
                    return;
                }

                const grid = document.createElement('div');
                grid.className = 'profile-media-grid';

                for (const item of allMedia) {
                    const att = item.attachment;
                    if (!att?.fileId) continue;

                    let url = att.previewUrl || '';
                    if (!url && att.fileId) {
                        const urlData = await API.get(`/api/files/download-urls?fileIds=${att.fileId}`);
                        if (urlData?.files?.[0]) url = urlData.files[0].previewUrl || urlData.files[0].url;
                    }
                    if (!url) continue;

                    const img = document.createElement('img');
                    img.src = url;
                    img.loading = 'lazy';
                    img.addEventListener('click', () => openMediaViewer(url, att.type === 'VIDEO'));
                    grid.appendChild(img);
                }

                profileMediaContent.appendChild(grid);
            } else {
                // Load documents
                const data = await API.get(`/api/chats/${currentChatId}/attachments?type=4&offset=0&size=30`);
                const files = data?.attachments || [];

                if (files.length === 0) {
                    profileMediaContent.innerHTML = '<div class="profile-media-empty">Нет файлов</div>';
                    return;
                }

                const list = document.createElement('div');
                list.className = 'profile-file-list';

                for (const item of files) {
                    const att = item.attachment;
                    if (!att?.fileId) continue;

                    const urlData = await API.get(`/api/files/download-urls?fileIds=${att.fileId}`);
                    const fileUrl = urlData?.files?.[0]?.url || '#';

                    const el = document.createElement('a');
                    el.className = 'profile-file-item';
                    el.href = fileUrl;
                    el.target = '_blank';
                    el.innerHTML = `<span>&#128196;</span> ${att.fileName || 'Файл'}`;
                    list.appendChild(el);
                }

                profileMediaContent.appendChild(list);
            }
        }

        // Profile media tabs
        document.querySelectorAll('.profile-media-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.profile-media-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                loadProfileMedia(tab.dataset.type);
            });
        });

        // Chat header click → profile
        chatHeaderAvatar.addEventListener('click', () => {
            if (!currentChatInfo || currentChatInfo.isGroupChat) return;
            const peerId = currentChatInfo.membersId?.find(id => id !== myUserId);
            if (peerId) openProfile(peerId);
        });

        chatHeaderName.addEventListener('click', () => {
            if (!currentChatInfo || currentChatInfo.isGroupChat) return;
            const peerId = currentChatInfo.membersId?.find(id => id !== myUserId);
            if (peerId) openProfile(peerId);
        });

        profileClose.addEventListener('click', () => {
            profileOverlay.classList.remove('visible');
        });

        profileOverlay.addEventListener('click', (e) => {
            if (e.target === profileOverlay) profileOverlay.classList.remove('visible');
        });

        // ========== INIT ==========

        loadChats(true);
        connectSSE();

    })();
    </script>
</body>
</html>
