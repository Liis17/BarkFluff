# ─────────────────────────────────────────────────────────────────────────────
# nginx site configuration — web.barkfluff.com
#
# Reverse-proxy to BarkFluff.Web (Kestrel на порту 7016, HTTP/1.1 + HTTP/2).
# Особые настройки:
#   • gRPC-Web server-streaming (Updates, Onliner) — proxy_read_timeout 24h,
#     proxy_buffering off, chunked transfer-encoding
#   • Загрузка файлов до 512 МБ
#   • TLS через общий include 01-ssl-params.conf
# ─────────────────────────────────────────────────────────────────────────────

# Upstream — BarkFluff.Web (Kestrel)
upstream barkfluff_web {
    server 127.0.0.1:7016;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name web.barkfluff.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web.barkfluff.com;

    # ── TLS (общие параметры из 01-ssl-params.conf) ──────────────────────────
    include /etc/nginx/conf.d/01-ssl-params.conf;

    # ── Общие настройки ─────────────────────────────────────────────────────
    client_max_body_size 512m;

    # Общие proxy-заголовки (наследуются вложенными location)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ── gRPC-Web: server-streaming (Updates + Onliner) ──────────────────────
    # Эти два сервиса используют server-streaming RPC (SubscribeNewMessages,
    # SubscribeMessagesRead, SubscribeToOnlineStatus). Соединение может жить
    # часами — поэтому таймауты увеличены до 24 ч, буферизация отключена.
    location ~ ^/barkfluff\.(updates|onliner)\. {
        proxy_pass http://barkfluff_web;

        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 10s;

        # Отключаем буферизацию — чанки сразу отправляются клиенту
        proxy_buffering off;
        proxy_cache    off;

        # Chunked transfer для потоковых ответов
        proxy_set_header Connection "";
        chunked_transfer_encoding on;

        # Заголовки для Kestrel (уже установлены выше, дублируем для ясности)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── gRPC-Web: unary RPC (Identity, Users, Messages, Files, etc.) ────────
    location ~ ^/barkfluff\. {
        proxy_pass http://barkfluff_web;

        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;

        proxy_buffering off;

        proxy_set_header Connection "";
    }

    # ── REST: загрузка файлов ────────────────────────────────────────────────
    location /api/files/upload/ {
        proxy_pass http://barkfluff_web;

        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 10s;

        # 512 МБ — максимальный размер файла (совпадает с бэкендом)
        client_max_body_size 512m;

        proxy_request_buffering off;
    }

    # ── Всё остальное (статика, страницы) ────────────────────────────────────
    location / {
        proxy_pass http://barkfluff_web;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;

        proxy_set_header Connection "";
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
