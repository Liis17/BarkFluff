<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff Admin - Почта</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        #loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity .3s ease; }
        #loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        * { scrollbar-width: thin; scrollbar-color: #94a3b8 transparent; }
        .msg-item.unread { background: #eff6ff; }
        .msg-item.unread .msg-from { font-weight: 700; color: #0f172a; }
        .msg-item.selected { background: #dbeafe; }
        .msg-item:hover { background: #f1f5f9; }
        .msg-item.selected:hover { background: #dbeafe; }
        .mail-body-frame { width: 100%; height: 100%; border: 0; display: block; }
        .account-tab.active { background: #2563eb; color: #fff; }
        .account-tab.active .unread-badge { background: rgba(255,255,255,.3); color: #fff; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex overflow-x-hidden">

    <div id="loading-overlay">
        <div class="flex flex-col items-center gap-4">
            <div class="spinner"></div>
            <span class="text-slate-500 text-sm font-medium">Загрузка...</span>
        </div>
    </div>

    <aside class="w-64 bg-slate-900 text-white flex flex-col min-h-screen fixed inset-y-0 left-0 z-50 flex-shrink-0">
        <div class="px-6 py-5 border-b border-slate-700">
            <div class="flex items-center gap-3">
                <i data-lucide="message-circle" class="w-7 h-7 text-blue-400"></i>
                <span class="text-xl font-bold tracking-wide">BF::ADMIN</span>
            </div>
        </div>
        <nav class="flex-1 px-3 py-4 space-y-1">
            <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>Дашборд</span>
            </a>
            <a href="/services" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="server" class="w-5 h-5"></i><span>Сервисы</span>
            </a>
            <a href="/logs" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="terminal-square" class="w-5 h-5"></i><span>Логи</span>
            </a>
            <a href="/badges" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="award" class="w-5 h-5"></i><span>Бейджи</span>
            </a>
            <a href="/stickers" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="smile" class="w-5 h-5"></i><span>Стикеры</span>
            </a>
            <a href="/users" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="users" class="w-5 h-5"></i><span>Юзеры</span>
            </a>
            <a href="/notifications" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="bell" class="w-5 h-5"></i><span>Уведомления</span>
            </a>
            <a href="/mail" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-600 text-white font-medium transition-colors">
                <i data-lucide="mail" class="w-5 h-5"></i><span>Почта</span>
            </a>
            <div>
                <div class="flex items-center">
                    <a href="/s3-storage" class="flex-1 flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
                        <i data-lucide="hard-drive" class="w-5 h-5"></i><span>Хранилище S3</span>
                    </a>
                </div>
            </div>
        </nav>
        <div class="px-4 py-4 border-t border-slate-700">
            <div class="text-xs text-slate-400 space-y-1">
                <div class="flex items-center gap-2">
                    <i data-lucide="key-round" class="w-3.5 h-3.5"></i>
                    <span id="token-name" class="truncate">-</span>
                </div>
                <div class="flex items-center gap-2">
                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                    <span id="token-created">-</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 ml-64 min-w-0 flex flex-col h-screen">
        <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between sticky top-0 z-40 flex-shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-bold text-gray-900">Почта</h1>
                <span id="connection-status" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600">
                    <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                    Готово
                </span>
            </div>
            <div class="flex items-center gap-2">
                <button id="refresh-btn" onclick="refreshActive()" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>Обновить
                </button>
                <button id="logout-btn" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 hover:text-red-600 hover:border-red-300 transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4"></i>Выйти
                </button>
            </div>
        </header>

        <div class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-2 flex-shrink-0">
            <div id="account-tabs" class="flex gap-1.5 flex-1 flex-wrap"></div>
            <button onclick="openCompose(null)" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">
                <i data-lucide="pencil" class="w-4 h-4"></i>Написать
            </button>
        </div>

        <div class="flex-1 flex min-h-0">
            <div class="w-96 border-r border-gray-200 bg-white overflow-y-auto flex-shrink-0" id="message-list">
                <div class="p-8 text-center text-gray-400 text-sm">Выберите ящик</div>
            </div>
            <div class="flex-1 bg-white flex flex-col min-h-0 overflow-hidden" id="message-detail">
                <div class="flex-1 flex items-center justify-center text-gray-400">
                    <div class="text-center">
                        <i data-lucide="mail-open" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                        <p class="text-sm">Выберите письмо для просмотра</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Compose modal -->
    <div id="compose-modal" class="hidden fixed inset-0 z-[100] bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl">
            <header class="px-6 py-4 border-b border-gray-200 flex items-center justify-between flex-shrink-0">
                <h2 class="text-lg font-bold text-gray-900" id="compose-title">Новое письмо</h2>
                <button onclick="closeCompose()" class="text-slate-400 hover:text-slate-700">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </header>
            <div class="px-6 py-4 flex-1 overflow-y-auto space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">От</label>
                    <div id="compose-from" class="px-3 py-2 bg-slate-50 rounded text-slate-700 text-sm">-</div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Кому <span class="text-slate-400">(адреса через запятую)</span></label>
                    <input id="compose-to" type="text" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Копия</label>
                    <input id="compose-cc" type="text" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Тема</label>
                    <input id="compose-subject" type="text" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Сообщение</label>
                    <textarea id="compose-body" rows="12" class="w-full px-3 py-2 border border-gray-300 rounded text-sm font-mono focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 text-sm text-slate-600">
                        <input type="checkbox" id="compose-html" class="rounded">
                        Отправить как HTML
                    </label>
                    <div>
                        <input type="file" id="compose-files" multiple class="hidden" onchange="onFilesSelected()">
                        <button type="button" onclick="document.getElementById('compose-files').click()" class="flex items-center gap-1.5 text-sm text-blue-600 hover:text-blue-700">
                            <i data-lucide="paperclip" class="w-4 h-4"></i>Добавить файлы
                        </button>
                    </div>
                </div>
                <div id="compose-files-list" class="space-y-1"></div>
            </div>
            <footer class="px-6 py-4 border-t border-gray-200 flex justify-end gap-2 flex-shrink-0">
                <button onclick="closeCompose()" class="px-4 py-2 text-sm text-slate-600 border border-gray-300 rounded hover:bg-gray-50">Отмена</button>
                <button id="compose-send-btn" onclick="sendMail()" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700">
                    <i data-lucide="send" class="w-4 h-4"></i>Отправить
                </button>
            </footer>
        </div>
    </div>

    <div id="toast" class="hidden fixed bottom-6 right-6 px-4 py-3 rounded-lg shadow-lg z-[200] text-white text-sm font-medium"></div>

    <script>
        const state = {
            accounts: [],
            activeAccount: null,
            messages: [],
            selectedUid: null,
            selectedDetail: null,
            pendingFiles: [],
            replyContext: null,
            pollTimer: null
        };

        const $ = (id) => document.getElementById(id);

        function showLoading(on) {
            $('loading-overlay').classList.toggle('hidden', !on);
        }
        function toast(msg, kind = 'info') {
            const t = $('toast');
            t.textContent = msg;
            const colors = { info: 'bg-slate-700', ok: 'bg-emerald-600', warn: 'bg-amber-600', err: 'bg-rose-600' };
            t.className = 'fixed bottom-6 right-6 px-4 py-3 rounded-lg shadow-lg z-[200] text-white text-sm font-medium ' + (colors[kind] || colors.info);
            setTimeout(() => t.classList.add('hidden'), 4000);
        }
        function setStatus(text, ok = true) {
            const el = $('connection-status');
            el.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium ' + (ok ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700');
            el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${ok ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}"></span>${text}`;
        }

        function fmtDate(d) {
            const dt = new Date(d);
            if (isNaN(dt)) return '-';
            const now = new Date();
            const sameDay = dt.toDateString() === now.toDateString();
            if (sameDay) return dt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const sameYear = dt.getFullYear() === now.getFullYear();
            return dt.toLocaleDateString('ru-RU', sameYear ? { day: '2-digit', month: 'short' } : { day: '2-digit', month: '2-digit', year: 'numeric' });
        }
        function fmtSize(b) {
            if (b < 1024) return b + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1024 / 1024).toFixed(1) + ' MB';
        }
        function escapeHtml(s) {
            if (s == null) return '';
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function addrText(a) {
            if (!a) return '';
            return a.name ? `${a.name} <${a.address}>` : a.address;
        }
        function addrShort(a) {
            if (!a) return '-';
            return a.name || a.address;
        }

        async function loadAccounts() {
            const r = await fetch('/api/mail/accounts');
            if (r.status === 401) { window.location.href = '/'; return; }
            if (!r.ok) { toast('Не удалось загрузить ящики', 'err'); return; }
            state.accounts = await r.json();
            renderTabs();
            if (state.accounts.length > 0) {
                selectAccount(state.accounts[0].address);
            } else {
                $('message-list').innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">Нет настроенных ящиков. Проверьте Mail__Accounts в env.</div>';
            }
        }
        function renderTabs() {
            const tabs = $('account-tabs');
            tabs.innerHTML = state.accounts.map(a => {
                const isActive = a.address === state.activeAccount;
                return `<button onclick="selectAccount('${a.address}')" class="account-tab ${isActive ? 'active' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'} flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">
                    <i data-lucide="at-sign" class="w-3.5 h-3.5"></i>${escapeHtml(a.address)}
                </button>`;
            }).join('');
            lucide.createIcons();
        }
        async function selectAccount(addr) {
            state.activeAccount = addr;
            state.selectedUid = null;
            state.selectedDetail = null;
            renderTabs();
            renderDetail(null);
            await loadMessages();
            schedulePoll();
        }
        async function loadMessages() {
            if (!state.activeAccount) return;
            $('message-list').innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">Загрузка...</div>';
            setStatus('Загрузка', true);
            try {
                const r = await fetch(`/api/mail/${encodeURIComponent(state.activeAccount)}/messages?folder=INBOX&page=0&size=50`);
                if (r.status === 401) { window.location.href = '/'; return; }
                if (!r.ok) {
                    const t = await r.text();
                    $('message-list').innerHTML = `<div class="p-8 text-center text-rose-500 text-sm">${escapeHtml(t || 'Ошибка загрузки')}</div>`;
                    setStatus('Ошибка', false);
                    return;
                }
                const data = await r.json();
                state.messages = data.items || [];
                renderList();
                setStatus(`${state.messages.length} писем · ${data.total} всего`, true);
            } catch (e) {
                $('message-list').innerHTML = `<div class="p-8 text-center text-rose-500 text-sm">${escapeHtml(e.message)}</div>`;
                setStatus('Ошибка', false);
            }
        }
        function renderList() {
            if (state.messages.length === 0) {
                $('message-list').innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">Нет писем</div>';
                return;
            }
            const html = state.messages.map(m => `
                <div class="msg-item ${m.isRead ? '' : 'unread'} ${m.uid === state.selectedUid ? 'selected' : ''} px-4 py-3 border-b border-gray-100 cursor-pointer" onclick="selectMessage(${m.uid})">
                    <div class="flex items-center justify-between gap-2">
                        <span class="msg-from text-sm truncate text-slate-700">${escapeHtml(addrShort(m.from))}</span>
                        <span class="text-xs text-slate-400 flex-shrink-0">${fmtDate(m.date)}</span>
                    </div>
                    <div class="text-sm text-slate-800 truncate mt-0.5 ${m.isRead ? '' : 'font-semibold'}">${escapeHtml(m.subject || '(без темы)')}</div>
                    <div class="text-xs text-slate-500 truncate mt-0.5 flex items-center gap-1.5">
                        ${m.hasAttachments ? '<i data-lucide="paperclip" class="w-3 h-3"></i>' : ''}
                        <span class="truncate">${escapeHtml(m.preview || '')}</span>
                    </div>
                </div>
            `).join('');
            $('message-list').innerHTML = html;
            lucide.createIcons();
        }

        async function selectMessage(uid) {
            state.selectedUid = uid;
            renderList();
            $('message-detail').innerHTML = '<div class="p-12 text-center text-gray-400"><div class="spinner mx-auto"></div></div>';
            try {
                const r = await fetch(`/api/mail/${encodeURIComponent(state.activeAccount)}/messages/${uid}`);
                if (r.status === 401) { window.location.href = '/'; return; }
                if (!r.ok) {
                    $('message-detail').innerHTML = '<div class="p-12 text-center text-rose-500 text-sm">Не удалось загрузить письмо</div>';
                    return;
                }
                state.selectedDetail = await r.json();
                const localMsg = state.messages.find(m => m.uid === uid);
                if (localMsg) { localMsg.isRead = true; renderList(); }
                renderDetail(state.selectedDetail);
            } catch (e) {
                $('message-detail').innerHTML = `<div class="p-12 text-center text-rose-500 text-sm">${escapeHtml(e.message)}</div>`;
            }
        }

        function renderDetail(d) {
            if (!d) {
                $('message-detail').innerHTML = '<div class="flex-1 flex items-center justify-center text-gray-400"><div class="text-center"><i data-lucide="mail-open" class="w-12 h-12 mx-auto mb-3 opacity-50"></i><p class="text-sm">Выберите письмо для просмотра</p></div></div>';
                lucide.createIcons();
                return;
            }
            const attHtml = (d.attachments || []).length === 0 ? '' : `
                <div class="flex-shrink-0 px-6 py-4 border-t border-gray-200 bg-slate-50">
                    <div class="max-w-4xl mx-auto">
                        <div class="text-xs font-medium text-slate-500 mb-2">Вложения (${d.attachments.length})</div>
                        <div class="space-y-1">
                            ${d.attachments.map(a => `
                                <a href="/api/mail/${encodeURIComponent(state.activeAccount)}/messages/${d.uid}/attachments/${a.index}" target="_blank"
                                   class="flex items-center gap-2 px-3 py-2 bg-white hover:bg-slate-100 rounded text-sm text-slate-700 border border-slate-200">
                                    <i data-lucide="paperclip" class="w-4 h-4 text-slate-400"></i>
                                    <span class="flex-1 truncate">${escapeHtml(a.fileName)}</span>
                                    <span class="text-xs text-slate-400">${fmtSize(a.size)}</span>
                                    <i data-lucide="download" class="w-4 h-4 text-slate-400"></i>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            const imageAtts = (d.attachments || []).filter(a => (a.mimeType || '').toLowerCase().startsWith('image/'));
            const inlineImagesHtml = imageAtts.length === 0 ? '' : `
                <div class="mt-4 space-y-3">
                    ${imageAtts.map(a => {
                        const url = `/api/mail/${encodeURIComponent(state.activeAccount)}/messages/${d.uid}/attachments/${a.index}`;
                        return `<div><a href="${url}" target="_blank" rel="noopener" class="inline-block"><img src="${url}" alt="${escapeHtml(a.fileName)}" loading="lazy" class="max-w-full max-h-[600px] rounded border border-slate-200 shadow-sm hover:shadow-md transition-shadow"></a></div>`;
                    }).join('')}
                </div>
            `;

            const bodyHtml = d.htmlBody
                ? `<iframe class="mail-body-frame" sandbox="" srcdoc="${escapeHtml(d.htmlBody)}"></iframe>`
                : `<div class="h-full overflow-y-auto p-6"><div class="max-w-4xl mx-auto"><pre class="whitespace-pre-wrap break-words font-sans text-sm text-slate-800">${escapeHtml(d.textBody || '(пусто)')}</pre>${inlineImagesHtml}</div></div>`;

            $('message-detail').innerHTML = `
                <div class="flex-shrink-0 px-6 pt-6 pb-4 border-b border-gray-200">
                    <div class="max-w-4xl mx-auto">
                        <h2 class="text-xl font-bold text-slate-900 mb-3">${escapeHtml(d.subject || '(без темы)')}</h2>
                        <div class="text-sm space-y-1 mb-3">
                            <div><span class="text-slate-500">От:</span> ${escapeHtml(addrText(d.from))}</div>
                            <div><span class="text-slate-500">Кому:</span> ${escapeHtml((d.to || []).map(addrText).join(', '))}</div>
                            ${(d.cc || []).length > 0 ? `<div><span class="text-slate-500">Копия:</span> ${escapeHtml(d.cc.map(addrText).join(', '))}</div>` : ''}
                            <div><span class="text-slate-500">Дата:</span> ${new Date(d.date).toLocaleString('ru-RU')}</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openCompose('reply')" class="flex items-center gap-2 px-3 py-1.5 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">
                                <i data-lucide="reply" class="w-4 h-4"></i>Ответить
                            </button>
                            <button onclick="openCompose('forward')" class="flex items-center gap-2 px-3 py-1.5 text-sm bg-slate-100 text-slate-700 rounded hover:bg-slate-200">
                                <i data-lucide="forward" class="w-4 h-4"></i>Переслать
                            </button>
                        </div>
                    </div>
                </div>
                <div class="flex-1 min-h-0 bg-white">${bodyHtml}</div>
                ${attHtml}
            `;
            lucide.createIcons();
        }

        function openCompose(mode) {
            if (!state.activeAccount) { toast('Сначала выберите ящик', 'warn'); return; }
            const d = state.selectedDetail;
            $('compose-from').textContent = state.activeAccount;
            $('compose-files').value = '';
            $('compose-files-list').innerHTML = '';
            state.pendingFiles = [];
            $('compose-html').checked = false;

            if (mode === 'reply' && d) {
                state.replyContext = { inReplyTo: d.messageId, references: [...(d.references || []), d.messageId].filter(Boolean) };
                $('compose-title').textContent = 'Ответ';
                $('compose-to').value = d.from?.address || '';
                $('compose-cc').value = '';
                const subj = d.subject || '';
                $('compose-subject').value = subj.toLowerCase().startsWith('re:') ? subj : `Re: ${subj}`;
                const quote = (d.textBody || '').split('\n').map(l => '> ' + l).join('\n');
                $('compose-body').value = `\n\n----- Исходное сообщение -----\nОт: ${addrText(d.from)}\nДата: ${new Date(d.date).toLocaleString('ru-RU')}\nТема: ${subj}\n\n${quote}`;
            } else if (mode === 'forward' && d) {
                state.replyContext = null;
                $('compose-title').textContent = 'Пересылка';
                $('compose-to').value = '';
                $('compose-cc').value = '';
                const subj = d.subject || '';
                $('compose-subject').value = subj.toLowerCase().startsWith('fwd:') ? subj : `Fwd: ${subj}`;
                $('compose-body').value = `\n\n----- Пересланное сообщение -----\nОт: ${addrText(d.from)}\nКому: ${(d.to || []).map(addrText).join(', ')}\nДата: ${new Date(d.date).toLocaleString('ru-RU')}\nТема: ${subj}\n\n${d.textBody || ''}`;
            } else {
                state.replyContext = null;
                $('compose-title').textContent = 'Новое письмо';
                $('compose-to').value = '';
                $('compose-cc').value = '';
                $('compose-subject').value = '';
                $('compose-body').value = '';
            }
            $('compose-modal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeCompose() {
            $('compose-modal').classList.add('hidden');
        }
        function onFilesSelected() {
            const input = $('compose-files');
            state.pendingFiles = Array.from(input.files);
            const list = $('compose-files-list');
            list.innerHTML = state.pendingFiles.map((f, i) => `
                <div class="flex items-center gap-2 px-3 py-2 bg-slate-50 rounded text-sm">
                    <i data-lucide="file" class="w-4 h-4 text-slate-400"></i>
                    <span class="flex-1 truncate">${escapeHtml(f.name)}</span>
                    <span class="text-xs text-slate-400">${fmtSize(f.size)}</span>
                    <button onclick="removeFile(${i})" class="text-slate-400 hover:text-rose-600"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }
        function removeFile(i) {
            state.pendingFiles.splice(i, 1);
            const dt = new DataTransfer();
            state.pendingFiles.forEach(f => dt.items.add(f));
            $('compose-files').files = dt.files;
            onFilesSelected();
        }
        async function sendMail() {
            const to = $('compose-to').value.split(',').map(s => s.trim()).filter(Boolean);
            const cc = $('compose-cc').value.split(',').map(s => s.trim()).filter(Boolean);
            const subject = $('compose-subject').value;
            const body = $('compose-body').value;
            const isHtml = $('compose-html').checked;
            if (to.length === 0) { toast('Укажите получателя', 'warn'); return; }

            const payload = {
                to, cc, subject, body, isHtml,
                inReplyTo: state.replyContext?.inReplyTo || null,
                references: state.replyContext?.references || []
            };

            const fd = new FormData();
            fd.append('payload', JSON.stringify(payload));
            state.pendingFiles.forEach(f => fd.append('files', f, f.name));

            const btn = $('compose-send-btn');
            btn.disabled = true;
            btn.classList.add('opacity-60');
            try {
                const r = await fetch(`/api/mail/${encodeURIComponent(state.activeAccount)}/send`, { method: 'POST', body: fd });
                if (r.ok) {
                    toast('Письмо отправлено', 'ok');
                    closeCompose();
                } else {
                    let msg = 'Ошибка отправки';
                    try { const j = await r.json(); msg = j.error || j.detail || msg; } catch {}
                    toast(msg, 'err');
                }
            } catch (e) {
                toast(e.message, 'err');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-60');
            }
        }

        function refreshActive() { loadMessages(); }
        function schedulePoll() {
            if (state.pollTimer) clearInterval(state.pollTimer);
            state.pollTimer = setInterval(() => { loadMessages(); }, 60000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !$('compose-modal').classList.contains('hidden')) closeCompose();
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        });

        (async function init() {
            lucide.createIcons();
            try {
                const tk = await fetch('/api/auth/me');
                if (tk.ok) {
                    const j = await tk.json();
                    $('token-name').textContent = j.name || '-';
                    $('token-created').textContent = j.createdAt ? new Date(j.createdAt).toLocaleDateString('ru-RU') : '-';
                }
            } catch {}
            await loadAccounts();
            showLoading(false);
            lucide.createIcons();
        })();
    </script>
</body>
</html>
