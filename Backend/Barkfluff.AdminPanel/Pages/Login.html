<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff Admin — Авторизация</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-hover: #5649c0;
            --bg-card: rgba(255, 255, 255, 0.08);
            --text: #fff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --border: rgba(255, 255, 255, 0.12);
            --error: #ff6b6b;
            --success: #51cf66;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0a0a1a;
            color: var(--text);
        }

        /* Gradient mesh background */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-mesh .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: blobMove 12s ease-in-out infinite alternate;
        }

        .bg-mesh .blob:nth-child(1) {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            top: -10%;
            left: -10%;
            animation-duration: 14s;
        }

        .bg-mesh .blob:nth-child(2) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #3b82f6, transparent 70%);
            bottom: -15%;
            right: -10%;
            animation-duration: 16s;
            animation-delay: -4s;
        }

        .bg-mesh .blob:nth-child(3) {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #8b5cf6, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 18s;
            animation-delay: -8s;
        }

        .bg-mesh .blob:nth-child(4) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #4f46e5, transparent 70%);
            top: 20%;
            right: 15%;
            animation-duration: 13s;
            animation-delay: -2s;
        }

        .bg-mesh .blob:nth-child(5) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #2563eb, transparent 70%);
            bottom: 10%;
            left: 20%;
            animation-duration: 15s;
            animation-delay: -6s;
        }

        @keyframes blobMove {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(60px, -40px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 50px) scale(0.95);
            }
            100% {
                transform: translate(40px, 20px) scale(1.05);
            }
        }

        /* Card */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            margin: 20px;
            padding: 48px 40px;
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* Lock icon */
        .lock-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.35);
        }

        .lock-icon svg {
            width: 34px;
            height: 34px;
            fill: #fff;
        }

        .login-card h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .login-card .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Nickname input */
        .nickname-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 14px;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            margin-bottom: 16px;
        }

        .nickname-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .nickname-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .nickname-input.input-error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15);
        }

        .validation-message {
            font-size: 12px;
            color: var(--error);
            margin-top: -10px;
            margin-bottom: 12px;
            text-align: left;
            padding-left: 4px;
            display: none;
        }

        .validation-message.visible {
            display: block;
        }

        /* Login button */
        .login-btn {
            width: 100%;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.25s ease;
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.3);
        }

        .login-btn:hover {
            background: linear-gradient(135deg, var(--primary-hover), #4338ca);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(108, 92, 231, 0.45);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            flex-shrink: 0;
        }

        /* Device info */
        .device-info {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .device-info .label {
            color: rgba(255, 255, 255, 0.35);
            margin-right: 4px;
        }

        /* Status container */
        .status-container {
            margin-top: 24px;
            display: none;
        }

        .status-container.active {
            display: block;
        }

        /* Waiting spinner */
        .status-waiting {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .status-waiting.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-waiting .status-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Success state */
        .status-success {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .status-success.active {
            display: flex;
        }

        .status-success .check-circle {
            width: 48px;
            height: 48px;
            background: rgba(81, 207, 102, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-success .check-circle svg {
            width: 24px;
            height: 24px;
            fill: var(--success);
        }

        .status-success .status-text {
            font-size: 14px;
            color: var(--success);
            font-weight: 600;
        }

        /* Error state */
        .status-error {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .status-error.active {
            display: flex;
        }

        .status-error .error-circle {
            width: 48px;
            height: 48px;
            background: rgba(255, 107, 107, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-error .error-circle svg {
            width: 24px;
            height: 24px;
            fill: var(--error);
        }

        .status-error .status-text {
            font-size: 14px;
            color: var(--error);
            font-weight: 500;
        }

        /* Retry button */
        .retry-btn {
            margin-top: 8px;
            padding: 10px 28px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Gradient mesh background -->
    <div class="bg-mesh">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <!-- Login card -->
    <div class="login-card">

        <!-- Lock icon -->
        <div class="lock-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 1C8.676 1 6 3.676 6 7v2H4a1 1 0 0 0-1 1v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V10a1 1 0 0 0-1-1h-2V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v2H8V7c0-2.276 1.724-4 4-4zm0 10a2 2 0 0 1 1 3.732V18a1 1 0 1 1-2 0v-1.268A2 2 0 0 1 12 13z"/>
            </svg>
        </div>

        <h1>Авторизация</h1>
        <p class="subtitle">Для входа в панель администратора подтвердите запрос через Telegram</p>

        <!-- Nickname input -->
        <input
            type="text"
            id="nicknameInput"
            class="nickname-input"
            placeholder="Введите ваше имя пользователя"
            autocomplete="off"
            spellcheck="false"
        >
        <div id="validationMessage" class="validation-message">Введите ваше имя пользователя</div>

        <!-- Login button -->
        <button id="loginBtn" class="login-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
            </svg>
            Войти через Telegram
        </button>

        <!-- Status container -->
        <div id="statusContainer" class="status-container">
            <!-- Waiting -->
            <div id="statusWaiting" class="status-waiting">
                <div class="spinner"></div>
                <span class="status-text">Ожидание подтверждения в Telegram...</span>
            </div>

            <!-- Success -->
            <div id="statusSuccess" class="status-success">
                <div class="check-circle">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                </div>
                <span class="status-text">Авторизация успешна! Перенаправление...</span>
            </div>

            <!-- Error -->
            <div id="statusError" class="status-error">
                <div class="error-circle">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </div>
                <span id="errorText" class="status-text">Произошла ошибка</span>
                <button id="retryBtn" class="retry-btn">Попробовать снова</button>
            </div>
        </div>

        <!-- Device info -->
        <div class="device-info">
            <div>
                <span class="label">Устройство:</span>
                <span id="deviceInfo">—</span>
            </div>
            <div>
                <span class="label">IP-адрес:</span>
                <span id="ipAddress">загрузка...</span>
            </div>
        </div>

    </div>

    <script>
        (function () {
            // Elements
            var nicknameInput = document.getElementById('nicknameInput');
            var validationMessage = document.getElementById('validationMessage');
            var loginBtn = document.getElementById('loginBtn');
            var statusContainer = document.getElementById('statusContainer');
            var statusWaiting = document.getElementById('statusWaiting');
            var statusSuccess = document.getElementById('statusSuccess');
            var statusError = document.getElementById('statusError');
            var errorText = document.getElementById('errorText');
            var retryBtn = document.getElementById('retryBtn');
            var deviceInfoEl = document.getElementById('deviceInfo');
            var ipAddressEl = document.getElementById('ipAddress');

            var pollInterval = null;
            var pollTimeout = null;

            // Detect device info from user agent
            function detectDevice() {
                var ua = navigator.userAgent;
                var browser = 'Неизвестный браузер';
                var os = 'Неизвестная ОС';

                // Detect browser
                if (ua.indexOf('Firefox/') !== -1) {
                    browser = 'Firefox';
                } else if (ua.indexOf('Edg/') !== -1) {
                    browser = 'Edge';
                } else if (ua.indexOf('OPR/') !== -1 || ua.indexOf('Opera/') !== -1) {
                    browser = 'Opera';
                } else if (ua.indexOf('YaBrowser/') !== -1) {
                    browser = 'Yandex Browser';
                } else if (ua.indexOf('Chrome/') !== -1) {
                    browser = 'Chrome';
                } else if (ua.indexOf('Safari/') !== -1 && ua.indexOf('Chrome') === -1) {
                    browser = 'Safari';
                }

                // Detect OS
                if (ua.indexOf('Windows NT 10') !== -1) {
                    os = 'Windows 10/11';
                } else if (ua.indexOf('Windows NT') !== -1) {
                    os = 'Windows';
                } else if (ua.indexOf('Mac OS X') !== -1) {
                    os = 'macOS';
                } else if (ua.indexOf('Linux') !== -1 && ua.indexOf('Android') !== -1) {
                    os = 'Android';
                } else if (ua.indexOf('Linux') !== -1) {
                    os = 'Linux';
                } else if (ua.indexOf('iPhone') !== -1 || ua.indexOf('iPad') !== -1) {
                    os = 'iOS';
                }

                return browser + ' / ' + os;
            }

            // Fetch IP address
            function fetchIP() {
                fetch('https://api.ipify.org?format=json')
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        ipAddressEl.textContent = data.ip || '—';
                    })
                    .catch(function () {
                        ipAddressEl.textContent = 'не удалось определить';
                    });
            }

            // Initialize device info
            var deviceString = detectDevice();
            deviceInfoEl.textContent = deviceString;
            fetchIP();

            // Clear validation on input
            nicknameInput.addEventListener('input', function () {
                nicknameInput.classList.remove('input-error');
                validationMessage.classList.remove('visible');
            });

            // Show a specific status panel
            function showStatus(state) {
                statusContainer.classList.add('active');
                statusWaiting.classList.remove('active');
                statusSuccess.classList.remove('active');
                statusError.classList.remove('active');

                if (state === 'waiting') {
                    statusWaiting.classList.add('active');
                } else if (state === 'success') {
                    statusSuccess.classList.add('active');
                } else if (state === 'error') {
                    statusError.classList.add('active');
                }
            }

            // Hide all statuses
            function hideStatus() {
                statusContainer.classList.remove('active');
                statusWaiting.classList.remove('active');
                statusSuccess.classList.remove('active');
                statusError.classList.remove('active');
            }

            // Show error with message
            function showError(message) {
                errorText.textContent = message;
                showStatus('error');
            }

            // Stop polling
            function stopPolling() {
                if (pollInterval) {
                    clearInterval(pollInterval);
                    pollInterval = null;
                }
                if (pollTimeout) {
                    clearTimeout(pollTimeout);
                    pollTimeout = null;
                }
            }

            // Reset to initial state
            function resetState() {
                stopPolling();
                hideStatus();
                loginBtn.disabled = false;
                nicknameInput.disabled = false;
                nicknameInput.value = '';
                nicknameInput.classList.remove('input-error');
                validationMessage.classList.remove('visible');
            }

            // Set cookie
            function setCookie(name, value, days) {
                var expires = '';
                if (days) {
                    var date = new Date();
                    date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
                    expires = '; expires=' + date.toUTCString();
                }
                document.cookie = name + '=' + encodeURIComponent(value) + expires + '; path=/';
            }

            // Poll auth status
            function pollAuthStatus(requestId) {
                showStatus('waiting');

                // 10 minute timeout
                pollTimeout = setTimeout(function () {
                    stopPolling();
                    loginBtn.disabled = false;
                    nicknameInput.disabled = false;
                    showError('Время ожидания истекло');
                }, 10 * 60 * 1000);

                pollInterval = setInterval(function () {
                    fetch('/api/auth/status/' + requestId)
                        .then(function (res) { return res.json(); })
                        .then(function (data) {
                            // status 1 = approved
                            if (data.status === 1) {
                                stopPolling();
                                showStatus('success');
                                setCookie('auth_token', data.token, 7);
                                setTimeout(function () {
                                    window.location.href = '/';
                                }, 1000);
                            }
                            // status 2 = rejected
                            else if (data.status === 2) {
                                stopPolling();
                                loginBtn.disabled = false;
                                nicknameInput.disabled = false;
                                showError('Запрос отклонен администратором');
                            }
                            // status 3 = expired
                            else if (data.status === 3) {
                                stopPolling();
                                loginBtn.disabled = false;
                                nicknameInput.disabled = false;
                                showError('Время ожидания истекло');
                            }
                        })
                        .catch(function () {
                            stopPolling();
                            loginBtn.disabled = false;
                            nicknameInput.disabled = false;
                            showError('Ошибка соединения с сервером');
                        });
                }, 2000);
            }

            // Login button click
            loginBtn.addEventListener('click', function () {
                var nickname = nicknameInput.value.trim();

                // Validate nickname
                if (!nickname) {
                    nicknameInput.classList.add('input-error');
                    validationMessage.classList.add('visible');
                    nicknameInput.focus();
                    return;
                }

                loginBtn.disabled = true;
                nicknameInput.disabled = true;

                fetch('/api/auth/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userAgent: navigator.userAgent,
                        tokenName: detectDevice(),
                        nickname: nickname
                    })
                })
                .then(function (res) {
                    if (!res.ok) {
                        // Error response - parse the error message
                        return res.json().then(function (data) {
                            throw new Error(data.message || 'Ошибка запроса');
                        });
                    }
                    return res.json();
                })
                .then(function (data) {
                    if (data.requestId) {
                        pollAuthStatus(data.requestId);
                    } else {
                        loginBtn.disabled = false;
                        nicknameInput.disabled = false;
                        showError('Не удалось создать запрос авторизации');
                    }
                })
                .catch(function (err) {
                    loginBtn.disabled = false;
                    nicknameInput.disabled = false;
                    showError(err.message || 'Ошибка соединения с сервером');
                });
            });

            // Enter key on nickname input
            nicknameInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });

            // Retry button
            retryBtn.addEventListener('click', function () {
                resetState();
            });
        })();
    </script>
</body>
</html>
