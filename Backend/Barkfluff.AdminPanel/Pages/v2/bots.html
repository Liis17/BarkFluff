<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff Admin — Боты</title>
    <link rel="stylesheet" href="assets/md3.css">
    <style>
        .bots-table { width: 100%; border-collapse: collapse; }
        .bots-table th, .bots-table td {
            padding: 12px 16px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid var(--md-outline-variant);
        }
        .bots-table th { color: var(--md-on-surface-variant); font-weight: 500; font-size: 12px; }
        .bots-table tr:hover td { background: var(--md-surface-container); }
        .bots-table .actions { display: flex; gap: 4px; justify-content: flex-end; }

        .token-box {
            background: var(--md-surface-container);
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--md-shape-sm);
            padding: 12px 14px;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="md-page-loading" id="loading-overlay">
    <div class="md-loader-expressive"></div>
    <div class="label">Загрузка...</div>
</div>

<div class="md-app-shell">
    <div id="md-nav-root" data-active="bots"></div>

    <main class="md-main">
        <header class="md-app-bar">
            <h1>Боты</h1>
            <div style="display:flex;gap:8px;">
                <button class="md-btn md-btn-filled md-btn-square-press" onclick="openCreateModal()">
                    <span class="msr size-18">add</span>
                    Создать системного бота
                </button>
                <button id="logoutBtn" class="md-icon-btn" title="Выйти">
                    <span class="msr">logout</span>
                </button>
            </div>
        </header>

        <div class="md-page">
            <div class="md-card" style="padding:0;overflow:auto;">
                <table class="bots-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Имя</th>
                            <th>Владелец</th>
                            <th>Роль</th>
                            <th>Создан</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="botsBody"></tbody>
                </table>
            </div>
            <div id="emptyState" class="md-empty" style="display:none;">
                <span class="msr size-48">smart_toy</span>
                <h3>Ботов пока нет</h3>
                <p>Создайте первого системного бота или дождитесь ботов пользователей через @botfather.</p>
            </div>
        </div>
    </main>
</div>

<!-- Create modal -->
<div id="createScrim" class="md-scrim" onclick="if(event.target===this)closeCreateModal()">
    <div class="md-dialog">
        <div class="md-dialog-header">
            <h3>Создать системного бота</h3>
            <button class="md-icon-btn" onclick="closeCreateModal()"><span class="msr">close</span></button>
        </div>
        <form onsubmit="createBot(event)">
            <div class="md-dialog-body">
                <div>
                    <label style="font-size:13px;font-weight:500;color:var(--md-on-surface-variant);display:block;margin-bottom:8px;">
                        Username <span style="color:var(--md-error);">*</span>
                    </label>
                    <input type="text" id="botUsername" required maxlength="32"
                        placeholder="Например: news_bot (суффикс bot обязателен)"
                        class="md-input-outlined" style="width:100%;">
                </div>
                <div>
                    <label style="font-size:13px;font-weight:500;color:var(--md-on-surface-variant);display:block;margin-bottom:8px;">
                        Имя <span style="color:var(--md-error);">*</span>
                    </label>
                    <input type="text" id="botName" required maxlength="100"
                        placeholder="Отображаемое имя бота"
                        class="md-input-outlined" style="width:100%;">
                </div>
            </div>
            <div class="md-dialog-actions">
                <button type="button" class="md-btn md-btn-text" onclick="closeCreateModal()">Отмена</button>
                <button type="submit" id="createBtn" class="md-btn md-btn-filled md-btn-square-press">
                    <span class="msr size-18">add</span>
                    Создать
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Token modal -->
<div id="tokenScrim" class="md-scrim" onclick="if(event.target===this)closeTokenModal()">
    <div class="md-dialog">
        <div class="md-dialog-header">
            <h3>Токен бота</h3>
            <button class="md-icon-btn" onclick="closeTokenModal()"><span class="msr">close</span></button>
        </div>
        <div class="md-dialog-body">
            <p style="font-size:14px;color:var(--md-on-surface-variant);">
                Сохраните токен — он показывается <b>один раз</b>. Потерянный токен можно только перегенерировать.
            </p>
            <div class="token-box" id="tokenValue"></div>
        </div>
        <div class="md-dialog-actions">
            <button class="md-btn md-btn-tonal md-btn-square-press" onclick="copyToken()">
                <span class="msr size-18">content_copy</span>
                Скопировать
            </button>
            <button class="md-btn md-btn-filled" onclick="closeTokenModal()">Готово</button>
        </div>
    </div>
</div>

<script src="assets/sidebar.js"></script>
<script>
    let bots = [];
    const ROLE_NAMES = { 0: '', 1: 'BotFather', 2: 'Login Notifier' };

    async function checkAuth() {
        try {
            const r = await fetch('/api/auth/me');
            if (!r.ok) { window.location.href = '/'; return null; }
            return await r.json();
        } catch { window.location.href = '/'; return null; }
    }

    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
    function formatDate(s) { if (!s) return ''; return new Date(s).toLocaleString('ru-RU'); }

    async function loadBots() {
        try {
            const r = await fetch('/api/bots');
            bots = await r.json();
            renderBots();
        } catch {}
    }

    function renderBots() {
        const body = document.getElementById('botsBody');
        const empty = document.getElementById('emptyState');
        if (!bots.length) { body.innerHTML = ''; empty.style.display = 'flex'; return; }
        empty.style.display = 'none';

        body.innerHTML = bots.map(b => `
            <tr>
                <td>${b.id}</td>
                <td>@${escapeHtml(b.username)}</td>
                <td>${escapeHtml(b.name)}</td>
                <td>${b.ownerUserId ? b.ownerUserId : '<span class="md-status md-status-neutral">системный</span>'}</td>
                <td>${b.systemRole ? `<span class="md-status md-status-success">${ROLE_NAMES[b.systemRole] || b.systemRole}</span>` : ''}</td>
                <td>${formatDate(b.createdAt)}</td>
                <td>
                    <div class="actions">
                        <button class="md-icon-btn" title="Перегенерировать токен" onclick="regenerateToken(${b.id})">
                            <span class="msr">key</span>
                        </button>
                        <button class="md-icon-btn" title="Удалить" style="color:var(--md-error);" onclick="deleteBot(${b.id})">
                            <span class="msr">delete</span>
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    // ---- Create ----
    window.openCreateModal = function () {
        document.getElementById('botUsername').value = '';
        document.getElementById('botName').value = '';
        document.getElementById('createScrim').classList.add('open');
    };
    window.closeCreateModal = function () { document.getElementById('createScrim').classList.remove('open'); };

    window.createBot = async function (event) {
        event.preventDefault();
        const btn = document.getElementById('createBtn');
        btn.disabled = true;
        try {
            const res = await fetch('/api/bots', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('botUsername').value.trim(),
                    name: document.getElementById('botName').value.trim()
                })
            });
            if (!res.ok) { alert('Не удалось создать бота: ' + (await res.text())); return; }
            const data = await res.json();
            closeCreateModal();
            showToken(data.token);
            await loadBots();
        } finally {
            btn.disabled = false;
        }
    };

    // ---- Token ----
    function showToken(token) {
        document.getElementById('tokenValue').textContent = token;
        document.getElementById('tokenScrim').classList.add('open');
    }
    window.closeTokenModal = function () {
        document.getElementById('tokenValue').textContent = '';
        document.getElementById('tokenScrim').classList.remove('open');
    };
    window.copyToken = async function () {
        try { await navigator.clipboard.writeText(document.getElementById('tokenValue').textContent); } catch {}
    };

    window.regenerateToken = async function (id) {
        const b = bots.find(x => x.id === id); if (!b) return;
        if (!confirm(`Перегенерировать токен @${b.username}? Старый токен перестанет работать.`)) return;
        const res = await fetch(`/api/bots/${id}/regenerate-token`, { method: 'POST' });
        if (!res.ok) { alert('Не удалось перегенерировать токен: ' + (await res.text())); return; }
        const data = await res.json();
        showToken(data.token);
    };

    window.deleteBot = async function (id) {
        const b = bots.find(x => x.id === id); if (!b) return;
        if (!confirm(`Удалить бота @${b.username}? Токен будет отозван, чаты сохранятся. Это действие необратимо.`)) return;
        const res = await fetch(`/api/bots/${id}`, { method: 'DELETE' });
        if (!res.ok) { alert('Не удалось удалить бота: ' + (await res.text())); return; }
        bots = bots.filter(x => x.id !== id);
        renderBots();
    };

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        if (!confirm('Выйти?')) return;
        try { await fetch('/api/auth/logout', { method:'POST' }); } catch {}
        window.location.href = '/';
    });

    (async function () {
        const auth = await checkAuth(); if (!auth) return;
        if (window.mdNavSetUser) window.mdNavSetUser(auth.name || 'Admin', auth.createdAt ? formatDate(auth.createdAt) : '');
        await loadBots();
        document.getElementById('loading-overlay').classList.add('hidden');
        setTimeout(() => document.getElementById('loading-overlay').remove(), 300);
    })();
</script>
</body>
</html>
