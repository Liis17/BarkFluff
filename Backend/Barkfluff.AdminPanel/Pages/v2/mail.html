<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff Admin — Почта</title>
    <link rel="stylesheet" href="assets/md3.css?v=3">
    <style>
        .md-page { padding: 0; }
        .mail-shell {
            flex: 1;
            display: grid;
            grid-template-columns: 360px 1fr;
            min-height: 0;
            background: var(--md-surface-container-low);
        }

        /* Account tabs strip */
        .accounts-strip {
            display: flex; gap: 8px; flex-wrap: wrap;
            padding: 0 24px 12px;
            border-bottom: 1px solid var(--md-outline-variant);
        }
        .acc-chip {
            display: inline-flex; align-items: center; gap: 8px;
            height: 36px; padding: 0 14px;
            border-radius: var(--md-shape-full);
            border: 1px solid var(--md-outline);
            background: transparent;
            color: var(--md-on-surface);
            font-size: 13px; font-weight: 500;
            cursor: pointer;
            transition: background .2s, color .2s, border-color .2s;
        }
        .acc-chip .unread-badge {
            background: var(--md-error-container);
            color: var(--md-on-error-container);
            font-size: 11px; padding: 1px 8px;
            border-radius: var(--md-shape-full);
        }
        .acc-chip.active {
            background: var(--md-primary);
            color: var(--md-on-primary);
            border-color: transparent;
        }
        .acc-chip.active .unread-badge { background: rgba(255,255,255,.25); color: var(--md-on-primary); }

        .list-pane {
            border-right: 1px solid var(--md-outline-variant);
            background: var(--md-surface-container-lowest);
            overflow-y: auto;
        }
        .msg-item {
            padding: 14px 20px;
            border-bottom: 1px solid var(--md-outline-variant);
            cursor: pointer;
            transition: background .2s;
        }
        .msg-item:hover { background: var(--md-surface-container); }
        .msg-item.selected { background: var(--md-secondary-container); }
        .msg-item.selected .msg-subject { color: var(--md-on-secondary-container); font-weight: 600; }
        .msg-item.unread { background: var(--md-primary-container); }
        .msg-item.unread.selected { background: var(--md-secondary-container); }
        .msg-item.unread .msg-subject { font-weight: 700; }

        .msg-top { display: flex; justify-content: space-between; gap: 8px; }
        .msg-from { font-size: 14px; color: var(--md-on-surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .msg-time { font-size: 12px; color: var(--md-on-surface-variant); flex-shrink: 0; }
        .msg-subject { font-size: 14px; color: var(--md-on-surface); margin: 4px 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .msg-preview {
            font-size: 13px; color: var(--md-on-surface-variant);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            display: flex; align-items: center; gap: 6px;
        }
        .msg-preview .msr { font-size: 14px; }

        .detail-pane {
            display: flex; flex-direction: column;
            overflow: hidden;
            background: var(--md-surface-container-lowest);
        }
        /* #message-detail — внутренний контейнер письма: тянем на всю высоту секции,
           чтобы .detail-body (flex:1) растягивался до низа страницы */
        #message-detail { flex: 1; min-height: 0; }
        .detail-empty {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 8px;
            color: var(--md-on-surface-variant);
        }
        .detail-empty .msr { font-size: 64px; opacity: .4; }
        .detail-header {
            padding: 20px 32px;
            border-bottom: 1px solid var(--md-outline-variant);
        }
        .detail-subject { font-size: 22px; font-weight: 500; color: var(--md-on-surface); margin: 0 0 8px; }
        .detail-meta-row { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--md-on-surface-variant); flex-wrap: wrap; }
        .detail-meta-row .from-pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; background: var(--md-surface-container); border-radius: var(--md-shape-full); color: var(--md-on-surface); }
        .detail-body {
            flex: 1;
            padding: 24px 32px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.7;
            color: var(--md-on-surface);
            white-space: pre-wrap;
        }
        .detail-body iframe { width: 100%; height: 100%; border: 0; }
        .attachments-bar { padding: 16px 32px; border-top: 1px solid var(--md-outline-variant); background: var(--md-surface-container); }
        .attachment-row {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px;
            background: var(--md-surface-container-lowest);
            border-radius: var(--md-shape-md);
            margin-bottom: 6px;
            text-decoration: none;
            color: var(--md-on-surface);
            font-size: 13px;
        }
        .attachment-row:hover { background: var(--md-surface-container-high); }

        .compose-fab {
            position: absolute;
            top: 76px;
            right: 32px;
        }

        /* Compose dialog */
        .compose-grid { display: grid; gap: 12px; }
        .compose-grid input[type="text"], .compose-grid input[type="email"], .compose-grid textarea {
            width: 100%;
        }

        #toast {
            position: fixed; bottom: 24px; right: 24px;
            padding: 12px 16px;
            background: var(--md-inverse-surface);
            color: var(--md-inverse-on-surface);
            border-radius: var(--md-shape-md);
            box-shadow: var(--md-elev-3);
            z-index: 999;
            display: none;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .mail-shell { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
        }
    </style>
</head>
<body>

<div class="md-page-loading" id="loading-overlay">
    <div class="md-loader-expressive"></div>
    <div class="label">Загрузка...</div>
</div>

<div class="md-app-shell">
    <div id="md-nav-root" data-active="mail"></div>

    <main class="md-main" style="height:100vh;overflow:hidden;">
        <header class="md-app-bar">
            <div style="display:flex;align-items:center;gap:12px;">
                <h1>Почта</h1>
                <span id="connection-status" class="md-status md-status-info">
                    <span class="dot"></span>Готово
                </span>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <button class="md-btn md-btn-tonal md-btn-square-press" onclick="loadMessages()">
                    <span class="msr size-18">refresh</span>
                    Обновить
                </button>
                <button class="md-btn md-btn-filled md-btn-square-press" onclick="openCompose()">
                    <span class="msr size-18">edit</span>
                    Написать
                </button>
                <button id="logout-btn" class="md-icon-btn" title="Выйти"><span class="msr">logout</span></button>
            </div>
        </header>

        <div id="account-tabs" class="accounts-strip" style="padding-top:12px;"></div>

        <div class="mail-shell">
            <aside class="list-pane">
                <div id="message-list">
                    <div style="padding:48px 24px;text-align:center;color:var(--md-on-surface-variant);font-size:13px;">Выберите ящик</div>
                </div>
            </aside>
            <section class="detail-pane">
                <div id="message-detail" class="detail-empty">
                    <span class="msr">mark_email_read</span>
                    <div style="font-size:14px;">Выберите письмо для просмотра</div>
                </div>
            </section>
        </div>
    </main>
</div>

<!-- Compose dialog -->
<div id="composeScrim" class="md-scrim" onclick="if(event.target===this)closeCompose()">
    <div class="md-dialog md-dialog-lg">
        <div class="md-dialog-header">
            <h3 id="compose-title">Новое письмо</h3>
            <button class="md-icon-btn" onclick="closeCompose()"><span class="msr">close</span></button>
        </div>
        <div class="md-dialog-body">
            <div class="compose-grid">
                <input id="compose-to" type="text" placeholder="Кому (через запятую)" class="md-input-outlined">
                <input id="compose-subject" type="text" placeholder="Тема" class="md-input-outlined">
                <textarea id="compose-body" rows="12" placeholder="Сообщение..." class="md-input-outlined" style="padding:12px 14px;height:auto;font-family:'Roboto Mono',monospace;resize:vertical;"></textarea>
                <div style="display:flex;align-items:center;justify-content:space-between;">
                    <label class="md-switch">
                        <input type="checkbox" id="compose-html">
                        <span class="track"><span class="thumb"></span></span>
                        <span style="margin-left:8px;font-size:13px;">Отправить как HTML</span>
                    </label>
                    <button type="button" class="md-btn md-btn-text" onclick="document.getElementById('compose-files').click()">
                        <span class="msr size-18">attach_file</span>
                        Прикрепить файлы
                    </button>
                    <input type="file" id="compose-files" multiple style="display:none;" onchange="onFilesSelected()">
                </div>
                <div id="compose-files-list"></div>
            </div>
        </div>
        <div class="md-dialog-actions">
            <button class="md-btn md-btn-text" onclick="closeCompose()">Отмена</button>
            <button id="compose-send-btn" class="md-btn md-btn-filled md-btn-square-press" onclick="sendMail()">
                <span class="msr size-18">send</span>
                Отправить
            </button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script src="assets/icons.js?v=3"></script>
<script src="assets/api.js?v=3"></script>
<script src="assets/sidebar.js?v=3"></script>
<script src="assets/command-palette.js?v=3"></script>
<script>
    const state = {
        accounts: [], activeAccount: null,
        messages: [], selectedUid: null, selectedDetail: null,
        pendingFiles: [], pollTimer: null, replyContext: null
    };
    const $ = id => document.getElementById(id);

    function toast(msg, kind = 'info') {
        const el = $('toast');
        el.textContent = msg;
        const colors = { info: 'var(--md-inverse-surface)', ok: 'var(--md-success)', err: 'var(--md-error)', warn: 'var(--md-tertiary)' };
        const fgs = { info: 'var(--md-inverse-on-surface)', ok: '#fff', err: '#fff', warn: '#fff' };
        el.style.background = colors[kind] || colors.info;
        el.style.color = fgs[kind] || fgs.info;
        el.style.display = '';
        setTimeout(() => { el.style.display = 'none'; }, 4000);
    }
    function setStatus(text, ok = true) {
        const el = $('connection-status');
        el.className = 'md-status ' + (ok ? 'md-status-success' : 'md-status-error');
        el.innerHTML = `<span class="dot"></span>${text}`;
    }
    function fmtDate(d) {
        const dt = new Date(d); if (isNaN(dt)) return '-';
        const now = new Date();
        const sameDay = dt.toDateString() === now.toDateString();
        if (sameDay) return dt.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
        const sameYear = dt.getFullYear() === now.getFullYear();
        return dt.toLocaleDateString('ru-RU', sameYear ? { day:'2-digit', month:'short' } : { day:'2-digit', month:'2-digit', year:'numeric' });
    }
    function fmtSize(b) { if (b < 1024) return b + ' Б'; if (b < 1048576) return (b/1024).toFixed(1) + ' КБ'; return (b/1048576).toFixed(1) + ' МБ'; }
    function escapeHtml(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function addrShort(a) { if (!a) return '—'; return a.name || a.address; }
    function addrText(a) { if (!a) return ''; return a.name ? `${a.name} <${a.address}>` : a.address; }

    async function loadAccounts() {
        const r = await fetch('/api/mail/accounts');
        if (r.status === 401) { window.location.href = '/'; return; }
        if (!r.ok) { toast('Не удалось загрузить ящики', 'err'); return; }
        state.accounts = await r.json();
        renderTabs();
        if (state.accounts.length > 0) selectAccount(state.accounts[0].address);
        else $('message-list').innerHTML = '<div style="padding:48px 24px;text-align:center;color:var(--md-on-surface-variant);font-size:13px;">Нет настроенных ящиков.</div>';
    }
    function renderTabs() {
        $('account-tabs').innerHTML = state.accounts.map(a => {
            const isActive = a.address === state.activeAccount;
            return `<button class="acc-chip ${isActive?'active':''}" onclick="selectAccount('${a.address}')">
                <span class="msr size-18">alternate_email</span>
                ${escapeHtml(a.address)}
                ${a.unread > 0 ? `<span class="unread-badge">${a.unread}</span>` : ''}
            </button>`;
        }).join('');
    }
    window.selectAccount = async function (addr) {
        state.activeAccount = addr;
        state.selectedUid = null;
        state.selectedDetail = null;
        renderTabs();
        renderDetail(null);
        await loadMessages();
    };
    async function loadMessages() {
        if (!state.activeAccount) return;
        $('message-list').innerHTML = '<div style="padding:48px 24px;text-align:center;color:var(--md-on-surface-variant);font-size:13px;"><div class="md-loader-expressive" style="display:inline-block;margin-bottom:8px;"></div><div>Загрузка...</div></div>';
        setStatus('Загрузка', true);
        try {
            const r = await fetch(`/api/mail/${encodeURIComponent(state.activeAccount)}/messages?folder=INBOX&page=0&size=50`);
            if (r.status === 401) { window.location.href = '/'; return; }
            if (!r.ok) {
                $('message-list').innerHTML = `<div style="padding:48px 24px;text-align:center;color:var(--md-error);font-size:13px;">Ошибка загрузки</div>`;
                setStatus('Ошибка', false);
                return;
            }
            const data = await r.json();
            state.messages = data.items || [];
            renderList();
            setStatus(`${state.messages.length} писем${data.total != null ? ` · ${data.total} всего` : ''}`, true);
        } catch (e) {
            $('message-list').innerHTML = `<div style="padding:48px 24px;text-align:center;color:var(--md-error);">${escapeHtml(e.message)}</div>`;
            setStatus('Ошибка', false);
        }
    }
    function renderList() {
        if (!state.messages.length) {
            $('message-list').innerHTML = '<div style="padding:48px 24px;text-align:center;color:var(--md-on-surface-variant);font-size:13px;">Нет писем</div>';
            return;
        }
        $('message-list').innerHTML = state.messages.map(m => `
            <div class="msg-item ${m.isRead?'':'unread'} ${m.uid===state.selectedUid?'selected':''}" onclick="selectMessage(${m.uid})">
                <div class="msg-top">
                    <span class="msg-from">${escapeHtml(addrShort(m.from))}</span>
                    <span class="msg-time">${fmtDate(m.date)}</span>
                </div>
                <div class="msg-subject">${escapeHtml(m.subject || '(без темы)')}</div>
                <div class="msg-preview">
                    ${m.hasAttachments ? '<span class="msr">attach_file</span>' : ''}
                    <span style="overflow:hidden;text-overflow:ellipsis;">${escapeHtml(m.preview || '')}</span>
                </div>
            </div>
        `).join('');
    }
    window.selectMessage = async function (uid) {
        state.selectedUid = uid;
        renderList();
        $('message-detail').className = 'detail-pane';
        $('message-detail').innerHTML = '<div style="padding:48px;text-align:center;flex:1;"><div class="md-loader-expressive" style="display:inline-block;"></div></div>';
        try {
            const r = await fetch(`/api/mail/${encodeURIComponent(state.activeAccount)}/messages/${uid}`);
            if (!r.ok) throw new Error();
            state.selectedDetail = await r.json();
            const localMsg = state.messages.find(m => m.uid === uid);
            if (localMsg && !localMsg.isRead) {
                localMsg.isRead = true; renderList();
                fetch(`/api/mail/${encodeURIComponent(state.activeAccount)}/messages/${uid}/read`, { method:'POST' }).catch(() => {});
            }
            renderDetail(state.selectedDetail);
        } catch (e) {
            $('message-detail').innerHTML = '<div style="padding:48px;text-align:center;color:var(--md-error);">Не удалось загрузить письмо</div>';
        }
    };
    function renderDetail(d) {
        const el = $('message-detail');
        if (!d) {
            el.className = 'detail-pane';
            el.innerHTML = `<div class="detail-empty"><span class="msr">mark_email_read</span><div style="font-size:14px;">Выберите письмо для просмотра</div></div>`;
            return;
        }
        const atts = d.attachments || [];
        const attHtml = !atts.length ? '' : `
            <div class="attachments-bar">
                <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--md-on-surface-variant);margin-bottom:8px;">Вложения (${atts.length})</div>
                ${atts.map(a => `<a class="attachment-row" target="_blank" href="/api/mail/${encodeURIComponent(state.activeAccount)}/messages/${d.uid}/attachments/${a.index}">
                    <span class="msr" style="color:var(--md-primary);">attach_file</span>
                    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(a.fileName)}</span>
                    <span style="font-size:12px;color:var(--md-on-surface-variant);">${fmtSize(a.size)}</span>
                    <span class="msr size-18" style="color:var(--md-on-surface-variant);">download</span>
                </a>`).join('')}
            </div>`;
        el.innerHTML = `
            <div class="detail-header">
                <h2 class="detail-subject">${escapeHtml(d.subject || '(без темы)')}</h2>
                <div class="detail-meta-row">
                    <span class="from-pill"><span class="msr size-18">person</span>${escapeHtml(addrText(d.from))}</span>
                    <span>•</span>
                    <span>${fmtDate(d.date)}</span>
                </div>
                <div style="margin-top:12px;display:flex;gap:8px;">
                    <button class="md-btn md-btn-tonal md-btn-square-press" onclick="replyToMessage()">
                        <span class="msr size-18">reply</span>Ответить
                    </button>
                </div>
            </div>
            <div class="detail-body">${d.htmlBody
                ? `<iframe sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" srcdoc="${escapeHtml(d.htmlBody)}"></iframe>`
                : escapeHtml(d.textBody || '')}</div>
            ${attHtml}
        `;
    }

    // Compose
    window.openCompose = function (prefill) {
        $('composeScrim').classList.add('open');
        if (prefill) {
            $('compose-to').value = prefill.to || '';
            $('compose-subject').value = prefill.subject || '';
            $('compose-body').value = prefill.body || '';
        } else {
            $('compose-to').value = '';
            $('compose-subject').value = '';
            $('compose-body').value = '';
            state.replyContext = null;
        }
        state.pendingFiles = [];
        $('compose-files-list').innerHTML = '';
    };
    window.closeCompose = function () { $('composeScrim').classList.remove('open'); };
    window.onFilesSelected = function () {
        const input = $('compose-files');
        state.pendingFiles = Array.from(input.files || []);
        $('compose-files-list').innerHTML = state.pendingFiles.map(f => `
            <div class="attachment-row" style="margin-bottom:4px;background:var(--md-surface-container);">
                <span class="msr" style="color:var(--md-primary);">attach_file</span>
                <span style="flex:1;">${escapeHtml(f.name)}</span>
                <span style="font-size:12px;color:var(--md-on-surface-variant);">${fmtSize(f.size)}</span>
            </div>`).join('');
    };
    window.sendMail = async function () {
        const toRaw = $('compose-to').value.trim();
        const subject = $('compose-subject').value.trim();
        const body = $('compose-body').value;
        if (!toRaw || !subject) { toast('Укажите получателя и тему', 'err'); return; }
        const payload = {
            to: toRaw.split(',').map(s => s.trim()).filter(Boolean),
            cc: [],
            subject, body,
            isHtml: $('compose-html').checked,
            inReplyTo: state.replyContext?.inReplyTo || null,
            references: state.replyContext?.references || []
        };
        const fd = new FormData();
        fd.append('payload', JSON.stringify(payload));
        state.pendingFiles.forEach(f => fd.append('files', f, f.name));
        const btn = $('compose-send-btn'); btn.disabled = true;
        try {
            const r = await fetch(`/api/mail/${encodeURIComponent(state.activeAccount)}/send`, { method:'POST', body: fd });
            if (!r.ok) { let m = 'Ошибка отправки'; try { const j = await r.json(); m = j.error || j.detail || m; } catch {} throw new Error(m); }
            toast('Письмо отправлено', 'ok');
            closeCompose();
        } catch (e) { toast(e.message || 'Ошибка отправки', 'err'); }
        finally { btn.disabled = false; }
    };
    window.replyToMessage = function () {
        if (!state.selectedDetail) return;
        const d = state.selectedDetail;
        state.replyContext = { inReplyTo: d.messageId, references: [...(d.references || []), d.messageId].filter(Boolean) };
        const subj = d.subject || '';
        openCompose({
            to: d.from?.address || '',
            subject: subj.toLowerCase().startsWith('re:') ? subj : 'Re: ' + subj,
            body: '\n\n----- Исходное сообщение -----\nОт: ' + addrText(d.from) + '\nТема: ' + subj + '\n\n' + (d.textBody || '')
        });
    };

    $('logout-btn').addEventListener('click', async () => {
        if (!confirm('Выйти?')) return;
        try { await fetch('/api/auth/logout', { method:'POST' }); } catch {}
        window.location.href = '/';
    });

    (async function () {
        try {
            const tk = await fetch('/api/auth/me');
            if (!tk.ok) { window.location.href = '/'; return; }
            const j = await tk.json();
            if (window.mdNavSetUser) window.mdNavSetUser(j.name || 'Admin', j.createdAt ? new Date(j.createdAt).toLocaleDateString('ru-RU') : '');
        } catch { window.location.href = '/'; return; }
        await loadAccounts();
        $('loading-overlay').classList.add('hidden');
        setTimeout(() => $('loading-overlay').remove(), 300);
    })();
</script>
</body>
</html>
