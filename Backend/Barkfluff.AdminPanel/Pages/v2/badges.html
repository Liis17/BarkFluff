<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff Admin — Бейджи</title>
    <link rel="stylesheet" href="assets/md3.css?v=4">
    <style>
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .badge-card {
            background: var(--md-surface-container-lowest);
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--md-shape-lg);
            overflow: hidden;
            position: relative;
            transition: box-shadow var(--md-dur-2) var(--md-easing-standard),
                        border-color var(--md-dur-2) var(--md-easing-standard);
            display: flex; flex-direction: column;
        }
        .badge-card:hover { box-shadow: var(--md-elev-2); border-color: var(--md-primary); }

        .badge-card .menu-btn {
            position: absolute; top: 8px; right: 8px;
            z-index: 2;
            background: var(--md-surface-container);
            opacity: 0;
            transition: opacity var(--md-dur-2);
        }
        .badge-card:hover .menu-btn { opacity: 1; }
        .dropdown {
            position: absolute; top: 52px; right: 8px;
            background: var(--md-surface-container-high);
            border-radius: var(--md-shape-sm);
            box-shadow: var(--md-elev-3);
            padding: 6px;
            min-width: 160px;
            z-index: 3;
            display: none;
        }
        .dropdown.open { display: block; }
        .dropdown button {
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 8px 12px;
            border: none; background: transparent;
            font-size: 13px; color: var(--md-on-surface);
            border-radius: var(--md-shape-xs);
            cursor: pointer;
            text-align: left;
        }
        .dropdown button:hover { background: var(--md-surface-container-highest); }
        .dropdown button.danger { color: var(--md-error); }

        .badge-image-wrap {
            aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center;
            background: var(--md-surface-container);
            padding: 24px;
        }
        .badge-image-pair { display:flex; align-items:center; gap:18px; }
        .badge-image-full { width:128px; height:128px; object-fit:contain; }
        .badge-mini-card { display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--md-on-surface-variant); font-size:11px; }
        .badge-mini-card img { width:32px; height:32px; object-fit:contain; }
        .badge-image-wrap .placeholder {
            width: 96px; height: 96px;
            border-radius: 50%;
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            display: flex; align-items: center; justify-content: center;
        }
        .badge-image-wrap .placeholder .msr { font-size: 48px; }

        .badge-meta { padding: 14px 16px; }
        .badge-meta .top { display: flex; align-items: flex-start; gap: 8px; justify-content: space-between; margin-bottom: 4px; }
        .badge-meta .name { font-weight: 600; font-size: 14px; color: var(--md-on-surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .badge-meta .desc { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.4em; }
        .badge-meta .date { font-size: 11px; color: var(--md-outline); margin-top: 8px; }

        .image-mode-options { display:flex; gap:10px; flex-wrap:wrap; }
        .image-mode-option { display:flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid var(--md-outline-variant); border-radius:var(--md-shape-sm); cursor:pointer; }
        .image-zone { display:flex; align-items:center; gap:16px; }
        .image-preview-wrap { width:96px; height:96px; border-radius:var(--md-shape-md); border:1px dashed var(--md-outline); background:var(--md-surface-container); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
        .image-preview-wrap img { width:100%; height:100%; object-fit:contain; }
        .badge-previews { display:flex; align-items:flex-end; gap:20px; padding:12px; border-radius:var(--md-shape-md); background:var(--md-surface-container); }
        .badge-preview { display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--md-on-surface-variant); font-size:12px; }
        .badge-preview img { object-fit:contain; background:var(--md-surface-container-lowest); border-radius:var(--md-shape-sm); }
        #fullPreview { width:112px; height:112px; }
        #miniPreview { width:48px; height:48px; }
        .badge-validation { margin:0; color:var(--md-error); font-size:12px; white-space:pre-wrap; }
        [hidden] { display:none !important; }
    </style>
</head>
<body>

<div class="md-page-loading" id="loading-overlay">
    <div class="md-loader-expressive"></div>
    <div class="label">Загрузка...</div>
</div>

<div class="md-app-shell">
    <div id="md-nav-root" data-active="badges"></div>

    <main class="md-main">
        <header class="md-app-bar">
            <h1>Бейджи</h1>
            <div style="display:flex;gap:8px;">
                <button class="md-btn md-btn-filled md-btn-square-press" onclick="openCreateModal()">
                    <span class="msr size-18">add</span>
                    Добавить бейдж
                </button>
                <button id="logoutBtn" class="md-icon-btn" title="Выйти">
                    <span class="msr">logout</span>
                </button>
            </div>
        </header>

        <div class="md-page">
            <div id="badgesGrid" class="badges-grid"></div>
            <div id="emptyState" class="md-empty" style="display:none;">
                <span class="msr size-48">workspace_premium</span>
                <h3>Бейджей пока нет</h3>
                <p>Создайте первый бейдж, чтобы выдавать пользователям.</p>
                <button class="md-btn md-btn-filled md-btn-square-press" onclick="openCreateModal()" style="margin-top:8px;">
                    <span class="msr size-18">add</span>
                    Создать бейдж
                </button>
            </div>
        </div>
    </main>
</div>

<!-- Modal -->
<div id="badgeScrim" class="md-scrim" onclick="if(event.target===this)closeModal()">
    <div class="md-dialog">
        <div class="md-dialog-header">
            <h3 id="modalTitle">Добавить бейдж</h3>
            <button class="md-icon-btn" onclick="closeModal()"><span class="msr">close</span></button>
        </div>
        <form id="badgeForm" onsubmit="saveBadge(event)">
            <div class="md-dialog-body">
                <div>
                    <label class="field-label" style="font-size:13px;font-weight:500;color:var(--md-on-surface-variant);display:block;margin-bottom:8px;">Изображения бейджа</label>
                    <div class="image-mode-options">
                        <label class="image-mode-option"><input type="radio" name="imageMode" value="single" checked onchange="setImageMode('single')"> Одна исходная картинка</label>
                        <label class="image-mode-option"><input type="radio" name="imageMode" value="separate" onchange="setImageMode('separate')"> Две отдельные картинки</label>
                    </div>
                    <div id="singleImageControls" class="image-zone" style="margin-top:12px;">
                        <div>
                            <label class="md-btn md-btn-tonal md-btn-square-press" style="cursor:pointer;">
                                <span class="msr size-18">upload</span> Выбрать исходник
                                <input type="file" id="singleImageInput" accept="image/*" onchange="prepareSingleImage(this.files[0])" style="display:none;">
                            </label>
                            <p style="font-size:12px;color:var(--md-on-surface-variant);margin-top:6px;">Центр-кроп в квадрат; браузер создаст PNG 256×256 и 32×32.</p>
                        </div>
                    </div>
                    <div id="separateImageControls" style="margin-top:12px;" hidden>
                        <div class="image-zone" style="margin-bottom:10px;">
                            <div class="image-preview-wrap"><img id="separateFullInputPreview" alt="" hidden><span class="msr size-32" id="separateFullIcon" style="color:var(--md-outline);">image</span></div>
                            <div><label class="md-btn md-btn-tonal md-btn-square-press" style="cursor:pointer;">
                                <span class="msr size-18">upload</span> Полная PNG (256×256)
                                <input type="file" id="fullImageInput" accept=".png,image/png" onchange="selectSeparateImage('full', this.files[0])" style="display:none;">
                            </label></div>
                        </div>
                        <div class="image-zone">
                            <div class="image-preview-wrap"><img id="separateMiniInputPreview" alt="" hidden><span class="msr size-32" id="separateMiniIcon" style="color:var(--md-outline);">image</span></div>
                            <div><label class="md-btn md-btn-tonal md-btn-square-press" style="cursor:pointer;">
                                <span class="msr size-18">upload</span> Мини PNG (32×32)
                                <input type="file" id="miniImageInput" accept=".png,image/png" onchange="selectSeparateImage('mini', this.files[0])" style="display:none;">
                            </label></div>
                        </div>
                    </div>
                    <div class="badge-previews" style="margin-top:12px;">
                        <div class="badge-preview"><img id="fullPreview" alt="Превью полной картинки" hidden><span id="fullPreviewPlaceholder" class="msr size-40">workspace_premium</span><span>Полная 256×256</span></div>
                        <div class="badge-preview"><img id="miniPreview" alt="Превью миниатюры" hidden><span id="miniPreviewPlaceholder" class="msr size-28">workspace_premium</span><span>Мини 32×32</span></div>
                    </div>
                    <p id="badgeValidation" class="badge-validation" role="alert" style="margin-top:8px;" hidden></p>
                </div>

                <div>
                    <label style="font-size:13px;font-weight:500;color:var(--md-on-surface-variant);display:block;margin-bottom:8px;">
                        Название <span style="color:var(--md-error);">*</span>
                    </label>
                    <input type="text" id="badgeName" required maxlength="100"
                        placeholder="Например: «Ранний пользователь»"
                        class="md-input-outlined" style="width:100%;">
                </div>

                <div>
                    <label style="font-size:13px;font-weight:500;color:var(--md-on-surface-variant);display:block;margin-bottom:8px;">
                        Описание
                    </label>
                    <textarea id="badgeDescription" rows="3" maxlength="500"
                        placeholder="Краткое описание бейджа"
                        class="md-input-outlined" style="width:100%;padding:10px 14px;height:auto;resize:vertical;"></textarea>
                </div>

                <div>
                    <label class="md-switch">
                        <input type="checkbox" id="badgeIsActive" checked>
                        <span class="track"><span class="thumb"></span></span>
                        <span style="margin-left:12px;font-size:14px;">Активен (виден пользователям)</span>
                    </label>
                </div>

                <input type="hidden" id="editBadgeId" value="">
                <input type="hidden" id="editImageUrl" value="">
                <input type="hidden" id="editMiniImageUrl" value="">
            </div>
            <div class="md-dialog-actions">
                <button type="button" class="md-btn md-btn-text" onclick="closeModal()">Отмена</button>
                <button type="submit" id="saveBtn" class="md-btn md-btn-filled md-btn-square-press">
                    <span class="msr size-18">save</span>
                    Сохранить
                </button>
            </div>
        </form>
    </div>
</div>

<script src="assets/icons.js?v=3"></script>
<script src="assets/api.js?v=6"></script>
<script src="assets/sidebar.js?v=4"></script>
<script src="assets/command-palette.js?v=4"></script>
<script>
    let badges = [];
    let pendingImages = { full: null, mini: null };
    let selectedImageMode = 'single';
    let singleImagePreparing = false;
    let imagePreparationGeneration = 0;

    function checkAuth() { return BF.requireAuth(); }

    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
    function formatDate(s) { if (!s) return ''; return new Date(s).toLocaleDateString('ru-RU'); }

    async function loadBadges() {
        try {
            badges = await BF.request('/api/badges');
            renderBadges();
        } catch {}
    }

    function renderBadges() {
        const grid = document.getElementById('badgesGrid');
        const empty = document.getElementById('emptyState');
        if (!badges.length) { grid.innerHTML = ''; empty.style.display = 'flex'; return; }
        empty.style.display = 'none';

        grid.innerHTML = badges.map(b => `
            <div class="badge-card">
                <button class="md-icon-btn menu-btn" onclick="toggleDropdown(${b.id}, event)" aria-label="Меню">
                    <span class="msr">more_vert</span>
                </button>
                <div class="dropdown" id="dropdown-${b.id}">
                    <button onclick="openEditModal(${b.id})"><span class="msr size-18">edit</span> Редактировать</button>
                    <button class="danger" onclick="deleteBadge(${b.id})"><span class="msr size-18">delete</span> Удалить</button>
                </div>

                <div class="badge-image-wrap">
                    <div class="badge-image-pair">
                        ${b.imageUrl
                            ? `<img class="badge-image-full" src="${escapeHtml(b.imageUrl)}" alt="${escapeHtml(b.name)}">`
                            : `<div class="placeholder"><span class="msr">workspace_premium</span></div>`}
                        <div class="badge-mini-card">
                            ${b.miniImageUrl
                                ? `<img src="${escapeHtml(b.miniImageUrl)}" alt="Миниатюра ${escapeHtml(b.name)}">`
                                : `<span class="msr size-28">workspace_premium</span>`}
                            <span>32×32</span>
                        </div>
                    </div>
                </div>

                <div class="badge-meta">
                    <div class="top">
                        <div class="name" title="${escapeHtml(b.name)}">${escapeHtml(b.name)}</div>
                        <span class="md-status ${b.isActive ? 'md-status-success' : 'md-status-neutral'}">${b.isActive ? 'Активен' : 'Скрыт'}</span>
                    </div>
                    <div class="desc">${b.description ? escapeHtml(b.description) : '<span style="color:var(--md-outline);">Без описания</span>'}</div>
                    <div class="date">${b.createdDate ? formatDate(b.createdDate) : (b.createdAt ? formatDate(b.createdAt) : '')}</div>
                </div>
            </div>
        `).join('');
    }

    window.toggleDropdown = function (id, e) {
        if (e) e.stopPropagation();
        document.querySelectorAll('.dropdown.open').forEach(el => { if (el.id !== `dropdown-${id}`) el.classList.remove('open'); });
        document.getElementById(`dropdown-${id}`).classList.toggle('open');
    };
    document.addEventListener('click', () => {
        document.querySelectorAll('.dropdown.open').forEach(el => el.classList.remove('open'));
    });

    // ---- Окно редактора ----
    window.openCreateModal = function () {
        document.getElementById('badgeForm').reset();
        document.getElementById('modalTitle').textContent = 'Добавить бейдж';
        document.getElementById('editBadgeId').value = '';
        document.getElementById('editImageUrl').value = '';
        document.getElementById('editMiniImageUrl').value = '';
        clearPendingImages();
        setImageMode('single');
        setPreview('fullPreview', 'fullPreviewPlaceholder', '');
        setPreview('miniPreview', 'miniPreviewPlaceholder', '');
        setPreview('separateFullInputPreview', 'separateFullIcon', '');
        setPreview('separateMiniInputPreview', 'separateMiniIcon', '');
        showValidation('');
        document.getElementById('badgeScrim').classList.add('open');
    };

    window.openEditModal = function (id) {
        const b = badges.find(x => x.id === id); if (!b) return;
        document.getElementById('badgeForm').reset();
        document.getElementById('modalTitle').textContent = 'Редактировать бейдж';
        document.getElementById('editBadgeId').value = b.id;
        document.getElementById('editImageUrl').value = b.imageUrl || '';
        document.getElementById('editMiniImageUrl').value = b.miniImageUrl || '';
        document.getElementById('badgeName').value = b.name;
        document.getElementById('badgeDescription').value = b.description || '';
        document.getElementById('badgeIsActive').checked = b.isActive;
        clearPendingImages();
        setImageMode('single');
        setPreview('fullPreview', 'fullPreviewPlaceholder', b.imageUrl || '');
        setPreview('miniPreview', 'miniPreviewPlaceholder', b.miniImageUrl || '');
        setPreview('separateFullInputPreview', 'separateFullIcon', b.imageUrl || '');
        setPreview('separateMiniInputPreview', 'separateMiniIcon', b.miniImageUrl || '');
        showValidation('');
        document.getElementById('badgeScrim').classList.add('open');
    };

    window.closeModal = function () { document.getElementById('badgeScrim').classList.remove('open'); };

    function setPreview(imageId, placeholderId, src) {
        const img = document.getElementById(imageId);
        const placeholder = document.getElementById(placeholderId);
        if (img.dataset.objectUrl) URL.revokeObjectURL(img.dataset.objectUrl);
        img.dataset.objectUrl = '';
        if (!src) {
            img.removeAttribute('src');
            img.hidden = true;
            placeholder.hidden = false;
            return;
        }
        if (src.startsWith('blob:')) img.dataset.objectUrl = src;
        img.src = src;
        img.hidden = false;
        placeholder.hidden = true;
    }

    function clearPendingImages() {
        imagePreparationGeneration++;
        pendingImages = { full: null, mini: null };
        singleImagePreparing = false;
        document.getElementById('singleImageInput').value = '';
        document.getElementById('fullImageInput').value = '';
        document.getElementById('miniImageInput').value = '';
    }

    window.setImageMode = function (mode) {
        selectedImageMode = mode;
        document.getElementById('singleImageControls').hidden = mode !== 'single';
        document.getElementById('separateImageControls').hidden = mode !== 'separate';
        if (pendingImages.full || pendingImages.mini || singleImagePreparing) {
            clearPendingImages();
            const badge = badges.find(item => String(item.id) === document.getElementById('editBadgeId').value);
            setPreview('fullPreview', 'fullPreviewPlaceholder', badge?.imageUrl || '');
            setPreview('miniPreview', 'miniPreviewPlaceholder', badge?.miniImageUrl || '');
            setPreview('separateFullInputPreview', 'separateFullIcon', badge?.imageUrl || '');
            setPreview('separateMiniInputPreview', 'separateMiniIcon', badge?.miniImageUrl || '');
        }
        showValidation('');
    };

    function showValidation(message) {
        const error = document.getElementById('badgeValidation');
        error.textContent = message;
        error.hidden = !message;
    }

    function loadImage(file) {
        return new Promise((resolve, reject) => {
            const objectUrl = URL.createObjectURL(file);
            const image = new Image();
            image.onload = () => { URL.revokeObjectURL(objectUrl); resolve(image); };
            image.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('Не удалось открыть изображение')); };
            image.src = objectUrl;
        });
    }

    function drawScaled(source, targetSize) {
        let current = source;
        let size = source.width;
        while (size > targetSize) {
            const nextSize = Math.max(targetSize, Math.floor(size / 2));
            const canvas = document.createElement('canvas');
            canvas.width = nextSize;
            canvas.height = nextSize;
            const context = canvas.getContext('2d');
            context.imageSmoothingEnabled = true;
            context.imageSmoothingQuality = 'high';
            context.drawImage(current, 0, 0, nextSize, nextSize);
            current = canvas;
            size = nextSize;
        }
        if (size !== targetSize) {
            const canvas = document.createElement('canvas');
            canvas.width = targetSize;
            canvas.height = targetSize;
            const context = canvas.getContext('2d');
            context.imageSmoothingEnabled = true;
            context.imageSmoothingQuality = 'high';
            context.drawImage(current, 0, 0, targetSize, targetSize);
            current = canvas;
        }
        return current;
    }

    function canvasPngFile(canvas, name) {
        return new Promise((resolve, reject) => canvas.toBlob(blob => {
            if (!blob) { reject(new Error('Не удалось создать PNG')); return; }
            resolve(new File([blob], name, { type: 'image/png' }));
        }, 'image/png'));
    }

    window.prepareSingleImage = async function (file) {
        if (!file) return;
        clearPendingImages();
        const generation = imagePreparationGeneration;
        singleImagePreparing = true;
        showValidation('Подготовка картинок…');
        try {
            const image = await loadImage(file);
            if (generation !== imagePreparationGeneration) return;
            const cropSize = Math.min(image.naturalWidth, image.naturalHeight);
            const crop = document.createElement('canvas');
            crop.width = cropSize;
            crop.height = cropSize;
            const context = crop.getContext('2d');
            context.drawImage(image,
                (image.naturalWidth - cropSize) / 2,
                (image.naturalHeight - cropSize) / 2,
                cropSize, cropSize, 0, 0, cropSize, cropSize);

            const fullCanvas = drawScaled(crop, 256);
            const miniCanvas = drawScaled(fullCanvas, 32);
            const fullFile = await canvasPngFile(fullCanvas, 'badge-full.png');
            const miniFile = await canvasPngFile(miniCanvas, 'badge-mini.png');
            if (generation !== imagePreparationGeneration) return;
            pendingImages = { full: fullFile, mini: miniFile };
            setPreview('fullPreview', 'fullPreviewPlaceholder', URL.createObjectURL(pendingImages.full));
            setPreview('miniPreview', 'miniPreviewPlaceholder', URL.createObjectURL(pendingImages.mini));

            const sizeErrors = [];
            if (pendingImages.full.size > 256 * 1024) sizeErrors.push('Полная картинка больше 256 КБ. Выберите исходник с меньшей детализацией.');
            if (pendingImages.mini.size > 256 * 1024) sizeErrors.push('Миниатюра больше 256 КБ.');
            showValidation(sizeErrors.join('\n'));
        } catch (error) {
            if (generation !== imagePreparationGeneration) return;
            pendingImages = { full: null, mini: null };
            showValidation(error.message || 'Не удалось обработать изображение');
        } finally {
            if (generation === imagePreparationGeneration) singleImagePreparing = false;
        }
    };

    async function validateSeparateImage(file, expectedSize, label) {
        if (file.size > 256 * 1024) throw new Error(`${label}: размер не должен превышать 256 КБ.`);
        const signature = new Uint8Array(await file.slice(0, 8).arrayBuffer());
        const pngSignature = [137, 80, 78, 71, 13, 10, 26, 10];
        if (!pngSignature.every((value, index) => signature[index] === value)) {
            throw new Error(`${label}: файл должен быть PNG.`);
        }
        const image = await loadImage(file);
        if (image.naturalWidth !== expectedSize || image.naturalHeight !== expectedSize) {
            throw new Error(`${label}: требуется размер ${expectedSize}×${expectedSize}.`);
        }
    }

    window.selectSeparateImage = async function (kind, file) {
        if (!file) return;
        const isFull = kind === 'full';
        pendingImages[kind] = file;
        const url = URL.createObjectURL(file);
        setPreview(isFull ? 'fullPreview' : 'miniPreview', isFull ? 'fullPreviewPlaceholder' : 'miniPreviewPlaceholder', url);
        setPreview(isFull ? 'separateFullInputPreview' : 'separateMiniInputPreview', isFull ? 'separateFullIcon' : 'separateMiniIcon', url);
        showValidation('Проверка изображения…');
        try {
            await validateSeparateImage(file, isFull ? 256 : 32, isFull ? 'Полная картинка' : 'Миниатюра');
            showValidation('');
        } catch (error) {
            showValidation(error.message);
        }
    };

    window.saveBadge = async function (event) {
        event.preventDefault();
        const id = document.getElementById('editBadgeId').value;
        const isEdit = !!id;
        if (singleImagePreparing) {
            showValidation('Дождитесь завершения подготовки картинок.');
            return;
        }
        if (!isEdit && (!pendingImages.full || !pendingImages.mini)) {
            showValidation(selectedImageMode === 'single'
                ? 'Для создания бейджа выберите исходную картинку.'
                : 'Для создания бейджа выберите обе картинки.');
            return;
        }
        const validationErrors = [];
        for (const [kind, expectedSize, label] of [['full', 256, 'Полная картинка'], ['mini', 32, 'Миниатюра']]) {
            if (!pendingImages[kind]) continue;
            try { await validateSeparateImage(pendingImages[kind], expectedSize, label); }
            catch (error) { validationErrors.push(error.message); }
        }
        if (validationErrors.length) {
            showValidation(validationErrors.join('\n'));
            return;
        }

        const btn = document.getElementById('saveBtn');
        const orig = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = 'Сохранение...';
        try {
            const fd = new FormData();
            fd.append('name', document.getElementById('badgeName').value);
            fd.append('description', document.getElementById('badgeDescription').value);
            fd.append('isActive', document.getElementById('badgeIsActive').checked.toString());
            if (isEdit) {
                fd.append('imageUrl', document.getElementById('editImageUrl').value);
                fd.append('miniImageUrl', document.getElementById('editMiniImageUrl').value);
            }
            if (pendingImages.full) fd.append('image', pendingImages.full);
            if (pendingImages.mini) fd.append('miniImage', pendingImages.mini);
            if (isEdit)
                await BF.request(`/api/badges/${id}`, { method:'PUT', body: fd });
            else
                await BF.request('/api/badges', { method:'POST', body: fd });
            closeModal();
            await loadBadges();
        } catch (error) {
            showValidation(error.message || 'Не удалось сохранить бейдж.');
        } finally {
            btn.disabled = false; btn.innerHTML = orig;
        }
    };
    window.deleteBadge = async function (id) {
        const b = badges.find(x => x.id === id); if (!b) return;
        if (!confirm(`Удалить бейдж «${b.name}»? Это действие необратимо.`)) return;
        try { await BF.request(`/api/badges/${id}`, { method:'DELETE' }); } catch { return; }
        badges = badges.filter(x => x.id !== id);
        renderBadges();
    };

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        if (!confirm('Выйти?')) return;
        await BF.logout();
    });

    (async function () {
        const auth = await checkAuth(); if (!auth) return;
        if (window.mdNavSetUser) window.mdNavSetUser(auth.name || 'Admin', auth.createdAt ? formatDate(auth.createdAt) : '');
        await loadBadges();
        BF.pageReady();
    })();
</script>
</body>
</html>
