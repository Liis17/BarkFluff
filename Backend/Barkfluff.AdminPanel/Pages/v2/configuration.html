<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff Admin — Settings</title>
    <link rel="stylesheet" href="assets/md3.css?v=4">
    <style>
        .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .toolbar input { flex: 1; max-width: 420px; }

        .settings-card {
            background: var(--md-surface-container-lowest);
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--md-shape-lg);
            margin-bottom: 12px;
            overflow: hidden;
        }
        .settings-head {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 20px;
            cursor: pointer; user-select: none;
        }
        .settings-head:hover { background: var(--md-surface-container); }
        .settings-icon {
            width: 40px; height: 40px;
            border-radius: var(--md-shape-md);
            background: var(--md-secondary-container);
            color: var(--md-on-secondary-container);
            display: inline-flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .settings-name { font-size: 15px; font-weight: 600; color: var(--md-on-surface); flex: 1; }
        .settings-count { font-size: 12px; color: var(--md-on-surface-variant); }
        .settings-chevron { transition: transform .2s; color: var(--md-on-surface-variant); }
        .settings-card.open .settings-chevron { transform: rotate(180deg); }

        .config-table { width: 100%; border-collapse: collapse; }
        .config-table th {
            text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
            color: var(--md-on-surface-variant);
            padding: 8px 12px;
            border-top: 1px solid var(--md-outline-variant);
            border-bottom: 1px solid var(--md-outline-variant);
            background: var(--md-surface-container);
        }
        .config-table td {
            padding: 8px 12px; font-size: 13px;
            border-bottom: 1px solid var(--md-outline-variant);
            color: var(--md-on-surface);
            vertical-align: middle;
        }
        .config-table tr:last-child td { border-bottom: none; }
        .config-table tr:hover td { background: var(--md-surface-container); }

        .cell-key { font-family: 'Roboto Mono', monospace; font-size: 12px; white-space: nowrap; }
        .cell-value { max-width: 340px; }
        .value-text { font-family: 'Roboto Mono', monospace; font-size: 12px; overflow-wrap: anywhere; word-break: break-all; }
        .value-masked { letter-spacing: 2px; color: var(--md-on-surface-variant); }
        .cell-meta { font-size: 12px; color: var(--md-on-surface-variant); white-space: nowrap; }
        .cell-actions { white-space: nowrap; text-align: right; }
        .cell-actions .md-icon-btn { width: 32px; height: 32px; }

        .value-edit-wrap { display: grid; gap: 4px; }
        .value-edit-wrap input, .value-edit-wrap select {
            min-width: 220px; font-family: 'Roboto Mono', monospace; font-size: 12px;
        }
        .field-hint { font-size: 11px; color: var(--md-on-surface-variant); }
        .diff-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
        .diff-value {
            min-height: 72px; padding: 12px; border-radius: var(--md-shape-md);
            background: var(--md-surface-container); font: 12px/1.45 'Roboto Mono', monospace;
            overflow-wrap: anywhere;
        }
        .diff-label { display: block; margin-bottom: 6px; color: var(--md-on-surface-variant); font: 11px/1.2 sans-serif; text-transform: uppercase; }
        .history-list { display: grid; gap: 10px; max-height: 520px; overflow-y: auto; }
        .history-item { padding: 14px; border: 1px solid var(--md-outline-variant); border-radius: var(--md-shape-md); }
        .history-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .history-head strong { flex: 1; }
        .history-diff { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
        .history-diff code { padding: 8px; border-radius: 8px; background: var(--md-surface-container); overflow-wrap: anywhere; }

        @media (max-width: 600px) {
            .config-table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
            .diff-grid, .history-diff { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="md-page-loading" id="loading-overlay">
    <div class="md-loader-expressive"></div>
    <div class="label">Загрузка...</div>
</div>

<div class="md-app-shell">
    <div id="md-nav-root" data-active="settings"></div>

    <main class="md-main">
        <header class="md-app-bar">
            <div style="display:flex;align-items:center;gap:12px;">
                <h1>Settings</h1>
                <span class="md-status md-status-info"><span class="dot"></span>Таблицы Settings</span>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <button id="refresh-btn" class="md-icon-btn" title="Обновить"><span class="msr">refresh</span></button>
                <button id="logout-btn" class="md-icon-btn" title="Выйти"><span class="msr">logout</span></button>
            </div>
        </header>

        <div class="md-page">
            <div class="toolbar">
                <input type="text" id="search-input" class="md-input-outlined" placeholder="Поиск по таблице, ключу или значению...">
                <span class="settings-count" id="total-count"></span>
            </div>

            <div id="settings-tables-list"></div>

            <div id="empty-state" class="md-empty" style="display:none;">
                <span class="msr size-48">tune</span>
                <h3>Ничего не найдено</h3>
                <p>Нет настроек, подходящих под фильтр.</p>
            </div>

            <div id="error-state" class="md-empty" style="display:none;color:var(--md-error);">
                <span class="msr size-48">error</span>
                <h3 style="color:var(--md-error);">Ошибка загрузки</h3>
                <p id="error-message"></p>
                <button class="md-btn md-btn-filled md-btn-square-press" onclick="loadSettings()">
                    <span class="msr size-18">refresh</span>
                    Попробовать снова
                </button>
            </div>
        </div>
    </main>
</div>

<div id="diff-scrim" class="md-scrim" onclick="if(event.target===this)closeDiff()">
    <div class="md-dialog md-dialog-lg">
        <div class="md-dialog-header"><h3>Проверка изменения</h3></div>
        <div class="md-dialog-body">
            <div>
                <strong id="diff-key"></strong>
                <div class="field-hint" id="diff-table"></div>
            </div>
            <div class="diff-grid">
                <div class="diff-value"><span class="diff-label">Было</span><span id="diff-before"></span></div>
                <span class="msr">arrow_forward</span>
                <div class="diff-value"><span class="diff-label">Станет</span><span id="diff-after"></span></div>
            </div>
        </div>
        <div class="md-dialog-actions">
            <button class="md-btn md-btn-text" onclick="closeDiff()">Отмена</button>
            <button id="diff-confirm-btn" class="md-btn md-btn-filled md-btn-square-press" onclick="confirmSave()">Сохранить</button>
        </div>
    </div>
</div>

<div id="history-scrim" class="md-scrim" onclick="if(event.target===this)closeHistory()">
    <div class="md-dialog md-dialog-lg">
        <div class="md-dialog-header">
            <div>
                <h3>История настройки</h3>
                <div class="field-hint" id="history-title"></div>
            </div>
            <button class="md-icon-btn" title="Закрыть" onclick="closeHistory()"><span class="msr">close</span></button>
        </div>
        <div class="md-dialog-body" id="history-body"></div>
    </div>
</div>

<script src="assets/icons.js?v=3"></script>
<script src="assets/api.js?v=5"></script>
<script src="assets/sidebar.js?v=4"></script>
<script src="assets/command-palette.js?v=4"></script>
<script>
    let allItems = [];               // строки физических таблиц Settings
    const openTables = new Set();    // раскрытые таблицы
    let editingIdx = null;           // индекс редактируемой строки
    let searchQuery = '';
    let canWriteConfig = false;

    let pendingSave = null;
    let historyTarget = null;

    async function checkAuth() {
        const me = await BF.requireAuth();
        canWriteConfig = !!me && BF.can('config.write');
        return me;
    }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
    function formatDate(s) { if (!s) return '—'; const d = new Date(s); if (isNaN(d.getTime())) return '—'; return d.toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
    function isSecret(item) { return item.fieldType === 'secret' || item.masked; }

    async function loadSettings() {
        const err = document.getElementById('error-state');
        try {
            allItems = await BF.request('/api/configuration/all', { errorToast: false });
            editingIdx = null;
            err.style.display = 'none';
            render();
        } catch (e) {
            document.getElementById('settings-tables-list').innerHTML = '';
            document.getElementById('empty-state').style.display = 'none';
            err.style.display = 'flex';
            document.getElementById('error-message').textContent = e.message;
        }
    }

    function matchesSearch(item) {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return item.section.toLowerCase().includes(q)
            || item.settingsTable.toLowerCase().includes(q)
            || item.storageKey.toLowerCase().includes(q)
            || item.value.toLowerCase().includes(q);
    }

    function render() {
        const list = document.getElementById('settings-tables-list');
        const empty = document.getElementById('empty-state');

        const groups = new Map();
        allItems.forEach((item, idx) => {
            if (!matchesSearch(item)) return;
            if (!groups.has(item.settingsTable)) groups.set(item.settingsTable, []);
            groups.get(item.settingsTable).push(idx);
        });

        const shown = [...groups.values()].reduce((n, a) => n + a.length, 0);
        document.getElementById('total-count').textContent = `Таблиц: ${groups.size} · Параметров: ${shown} из ${allItems.length}`;

        if (groups.size === 0) {
            list.innerHTML = '';
            empty.style.display = 'flex';
            return;
        }
        empty.style.display = 'none';

        const names = [...groups.keys()].sort((a, b) => a.localeCompare(b));
        list.innerHTML = names.map(name => {
            const idxs = groups.get(name);
            const open = searchQuery ? true : openTables.has(name);
            return `
                <div class="settings-card${open ? ' open' : ''}" data-table="${escapeHtml(name)}">
                    <div class="settings-head" onclick="toggleTable('${escapeHtml(name)}')">
                        <div class="settings-icon"><span class="msr">table</span></div>
                        <div class="settings-name">${escapeHtml(name)}</div>
                        <span class="settings-count">${idxs.length} параметров</span>
                        <span class="msr settings-chevron">expand_more</span>
                    </div>
                    ${open ? renderTable(idxs) : ''}
                </div>
            `;
        }).join('');
    }

    function renderTable(idxs) {
        return `
            <table class="config-table">
                <thead>
                    <tr>
                        <th>Ключ</th>
                        <th>Значение</th>
                        <th>Изменено</th>
                        <th>Кем</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    ${idxs.map(renderRow).join('')}
                </tbody>
            </table>
        `;
    }

    function renderRow(idx) {
        const item = allItems[idx];
        const secret = isSecret(item);
        const editing = editingIdx === idx;

        let valueCell, actionsCell;
        if (editing) {
            valueCell = renderEditor(item, idx);
            actionsCell = `
                <button class="md-icon-btn" title="Сохранить" onclick="saveValue(${idx})"><span class="msr size-20" style="color:var(--md-primary);">check</span></button>
                <button class="md-icon-btn" title="Отмена" onclick="cancelEdit()"><span class="msr size-20">close</span></button>
            `;
        } else {
            const masked = item.masked;
            valueCell = masked
                ? `<span class="value-text value-masked">••••••••</span>`
                : `<span class="value-text">${escapeHtml(item.value)}</span>`;
            actionsCell = `
                <button class="md-icon-btn" title="История" onclick="openHistory(${idx})"><span class="msr size-20">history</span></button>
                ${canWriteConfig ? `<button class="md-icon-btn" title="Изменить" onclick="startEdit(${idx})"><span class="msr size-20">edit</span></button>` : ''}
            `;
        }

        return `
            <tr data-idx="${idx}">
                <td class="cell-key">${escapeHtml(item.storageKey)}</td>
                <td class="cell-value">${valueCell}</td>
                <td class="cell-meta" title="${escapeHtml(item.editedFrom || '')}">${formatDate(item.editedAt)}</td>
                <td class="cell-meta">${escapeHtml(item.editedBy || '—')}</td>
                <td class="cell-actions">${actionsCell}</td>
            </tr>
        `;
    }

    function renderEditor(item, idx) {
        const value = item.masked ? '' : item.value;
        const required = item.required ? 'required' : '';
        const keydown = `onkeydown="onEditKey(event, ${idx})"`;
        let control;

        if (item.fieldType === 'boolean') {
            control = `<select id="edit-input-${idx}" class="md-input-outlined" ${required} ${keydown}>
                <option value="true"${String(value).toLowerCase() === 'true' ? ' selected' : ''}>true</option>
                <option value="false"${String(value).toLowerCase() === 'false' ? ' selected' : ''}>false</option>
            </select>`;
        } else {
            const inputType = item.fieldType === 'integer' ? 'number'
                : item.fieldType === 'url' ? 'url'
                : item.fieldType === 'secret' ? 'password'
                : 'text';
            const limits = item.fieldType === 'integer'
                ? `${item.minimum != null ? `min="${item.minimum}"` : ''} ${item.maximum != null ? `max="${item.maximum}"` : ''} step="1"`
                : '';
            const placeholder = item.masked ? 'placeholder="Введите новое значение (текущее скрыто)"' : '';
            const autocomplete = item.fieldType === 'secret' ? 'autocomplete="new-password"' : '';
            control = `<input type="${inputType}" id="edit-input-${idx}" class="md-input-outlined"
                value="${escapeHtml(value)}" ${required} ${limits} ${placeholder} ${autocomplete} ${keydown}>`;
        }

        return `<div class="value-edit-wrap">${control}${item.hint ? `<span class="field-hint">${escapeHtml(item.hint)}</span>` : ''}</div>`;
    }

    window.toggleTable = function (name) {
        if (openTables.has(name)) openTables.delete(name); else openTables.add(name);
        render();
    };

    window.startEdit = function (idx) {
        if (!canWriteConfig) return;
        editingIdx = idx;
        render();
        const input = document.getElementById(`edit-input-${idx}`);
        if (input) { input.focus(); input.select(); }
    };

    window.cancelEdit = function () {
        editingIdx = null;
        render();
    };

    window.onEditKey = function (e, idx) {
        if (e.key === 'Enter') saveValue(idx);
        else if (e.key === 'Escape') cancelEdit();
    };

    window.saveValue = async function (idx) {
        if (!canWriteConfig) return;
        const item = allItems[idx];
        const input = document.getElementById(`edit-input-${idx}`);
        if (!input) return;
        const newValue = input.value;

        const validationError = validateValue(item, newValue);
        if (validationError) {
            BF.toast(validationError, 'error');
            input.focus();
            return;
        }

        if (!item.masked && newValue === item.value) {
            BF.toast('Значение не изменилось', 'info');
            return;
        }

        pendingSave = { idx, newValue };
        document.getElementById('diff-key').textContent = item.storageKey;
        document.getElementById('diff-table').textContent = item.settingsTable;
        document.getElementById('diff-before').textContent = item.masked ? '•••••••• (текущее значение)' : (item.value || '∅ пусто');
        document.getElementById('diff-after').textContent = isSecret(item) ? '•••••••• (новое значение)' : (newValue || '∅ пусто');
        document.getElementById('diff-scrim').classList.add('open');
    };

    function validateValue(item, value) {
        if (value.length > 8192) return 'Значение не должно быть длиннее 8192 символов';
        if (item.required && !value.trim()) return 'Значение обязательно';
        if (!value.trim()) return null;

        if (item.fieldType === 'boolean' && value !== 'true' && value !== 'false')
            return 'Допустимы только true или false';

        if (item.fieldType === 'integer') {
            if (!/^-?\d+$/.test(value)) return 'Введите целое число';
            const number = Number(value);
            if (!Number.isSafeInteger(number)) return 'Число выходит за допустимый диапазон';
            if (item.minimum != null && number < item.minimum) return `Значение должно быть не меньше ${item.minimum}`;
            if (item.maximum != null && number > item.maximum) return `Значение должно быть не больше ${item.maximum}`;
        }

        if (item.fieldType === 'url') {
            try {
                const url = new URL(value);
                if (!['http:', 'https:', 'ws:', 'wss:'].includes(url.protocol)) throw new Error();
            } catch (_) {
                return 'Введите абсолютный HTTP(S) или WS(S)-адрес';
            }
        }

        return null;
    }

    window.closeDiff = function () {
        pendingSave = null;
        document.getElementById('diff-scrim').classList.remove('open');
    };

    window.confirmSave = async function () {
        if (!pendingSave) return;
        const { idx, newValue } = pendingSave;
        const item = allItems[idx];
        const button = document.getElementById('diff-confirm-btn');

        try {
            await BF.request('/api/configuration/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    section: item.section,
                    key: item.key,
                    serviceId: item.serviceId,
                    value: newValue
                }),
                loading: button,
                successToast: 'Настройка сохранена'
            });
            pendingSave = null;
            document.getElementById('diff-scrim').classList.remove('open');
            editingIdx = null;
            await loadSettings();
        } catch (_) {}
    };

    window.openHistory = async function (idx) {
        const item = allItems[idx];
        historyTarget = { section: item.section, key: item.key, serviceId: item.serviceId };
        document.getElementById('history-title').textContent = `${item.settingsTable} · ${item.storageKey}`;
        const body = document.getElementById('history-body');
        body.innerHTML = '<div class="md-empty"><div class="md-loader-expressive"></div><p>Загрузка истории...</p></div>';
        document.getElementById('history-scrim').classList.add('open');

        try {
            const query = new URLSearchParams({
                section: item.section,
                key: item.key,
                serviceId: String(item.serviceId),
                count: '50'
            });
            const revisions = await BF.request(`/api/configuration/history?${query}`, { errorToast: false });
            renderHistory(revisions);
        } catch (error) {
            body.innerHTML = `<div class="md-empty" style="color:var(--md-error);"><span class="msr size-48">error</span><p>${escapeHtml(error.message)}</p></div>`;
        }
    };

    function renderHistory(revisions) {
        const body = document.getElementById('history-body');
        if (!revisions.length) {
            body.innerHTML = '<div class="md-empty"><span class="msr size-48">history</span><h3>История пока пуста</h3><p>Она появится после следующего изменения.</p></div>';
            return;
        }

        body.innerHTML = `<div class="history-list">${revisions.map(revision => `
            <div class="history-item">
                <div class="history-head">
                    <span class="md-status ${revision.changeKind === 'Rollback' ? 'md-status-warning' : 'md-status-info'}">${revision.changeKind === 'Rollback' ? 'Rollback' : 'Изменение'} #${revision.id}</span>
                    <strong>${escapeHtml(revision.changedBy || '—')}</strong>
                    <span class="cell-meta" title="${escapeHtml(revision.changedFrom || '')}">${formatDate(revision.changedAt)}</span>
                    ${canWriteConfig ? `<button class="md-btn md-btn-text" onclick="rollbackRevision(${revision.id})">Откатить</button>` : ''}
                </div>
                <div class="history-diff">
                    <code>${escapeHtml(revision.previousValue || '∅ пусто')}</code>
                    <span class="msr size-18">arrow_forward</span>
                    <code>${escapeHtml(revision.newValue || '∅ пусто')}</code>
                </div>
                ${revision.sourceRevisionId ? `<div class="field-hint" style="margin-top:8px;">Откат изменения #${revision.sourceRevisionId}</div>` : ''}
            </div>
        `).join('')}</div>`;
    }

    window.rollbackRevision = async function (revisionId) {
        if (!canWriteConfig || !confirm(`Откатить изменение #${revisionId} и восстановить прежнее значение?`)) return;

        try {
            await BF.request('/api/configuration/rollback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ revisionId }),
                successToast: 'Настройка восстановлена'
            });
            const target = historyTarget;
            await loadSettings();
            if (target) {
                const idx = allItems.findIndex(item => item.section === target.section && item.key === target.key && item.serviceId === target.serviceId);
                if (idx >= 0) await openHistory(idx);
            }
        } catch (_) {}
    };

    window.closeHistory = function () {
        historyTarget = null;
        document.getElementById('history-scrim').classList.remove('open');
    };

    document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        editingIdx = null;
        render();
    });

    document.getElementById('refresh-btn').addEventListener('click', loadSettings);

    document.getElementById('logout-btn').addEventListener('click', async () => {
        if (!confirm('Выйти?')) return;
        await BF.logout();
    });

    (async function () {
        const auth = await checkAuth(); if (!auth) return;
        if (window.mdNavSetUser) window.mdNavSetUser(auth.name || 'Admin', auth.createdAt ? formatDate(auth.createdAt) : '');
        await loadSettings();
        BF.pageReady();
    })();
</script>
</body>
</html>
