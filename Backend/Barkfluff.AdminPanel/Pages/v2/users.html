<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff Admin — Юзеры</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/adminpanel.svg">
    <link rel="stylesheet" href="assets/md3.css?v=5">
    <style>
        .users-list { display: flex; flex-direction: column; gap: 6px; }
        .user-row {
            display: flex; align-items: center; gap: 16px;
            padding: 12px 16px;
            background: var(--md-surface-container-lowest);
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--md-shape-md);
            cursor: pointer;
            transition: background var(--md-dur-2) var(--md-easing-standard),
                        border-color var(--md-dur-2) var(--md-easing-standard);
        }
        .user-row:hover { background: var(--md-surface-container); border-color: var(--md-primary); }
        .user-status-badge { display: inline-flex; align-items: center; margin-left: 8px; vertical-align: middle; }
        .user-status-info { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0; }
        .avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--md-tertiary-container);
            color: var(--md-on-tertiary-container);
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 600;
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .info { flex: 1; min-width: 0; }
        .info .name { font-weight: 500; color: var(--md-on-surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display:flex; align-items:center; gap:8px; }
        .info .uname { color: var(--md-on-surface-variant); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .uid { color: var(--md-on-surface-variant); font-size: 13px; flex-shrink: 0; font-family: 'Roboto Mono', monospace; }

        /* User modal: profile hero + tabs */
        .user-dialog { max-width: 760px; position: relative; }
        .user-dialog .md-dialog-body { padding: 0; }
        .user-dialog .md-dialog-body > * + * { margin-top: 0; }
        .user-dialog-close {
            position: absolute; top: 12px; right: 12px; z-index: 4;
            background: color-mix(in srgb, var(--md-surface-container-high) 82%, transparent);
            backdrop-filter: blur(6px);
        }
        .user-hero-cover {
            position: relative;
            height: 120px;
            background-image: linear-gradient(135deg, var(--md-primary-container), var(--md-tertiary-container));
            overflow: hidden;
        }
        .user-hero-cover > img { width: 100%; height: 100%; object-fit: cover; }
        .user-hero-cover-btn {
            position: absolute; top: 14px; right: 60px;
            height: 32px; padding: 0 12px;
            background: color-mix(in srgb, var(--md-surface-container-high) 82%, transparent);
            backdrop-filter: blur(6px);
            color: var(--md-on-surface);
        }
        .user-hero {
            position: relative;
            display: flex; align-items: flex-start; gap: 16px;
            padding: 0 20px;
        }
        .user-hero-avatar {
            position: relative;
            flex-shrink: 0;
            width: 96px; height: 96px;
            margin-top: -48px;
            padding: 0;
            border: 4px solid var(--md-surface-container-high);
            border-radius: 50%;
            background: var(--md-tertiary-container);
            color: var(--md-on-tertiary-container);
            display: inline-flex; align-items: center; justify-content: center;
            font: inherit; font-weight: 600; font-size: 28px;
            cursor: pointer;
            overflow: hidden;
        }
        .user-hero-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-hero-avatar-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,.45);
            display: flex; align-items: center; justify-content: center;
            color: white; opacity: 0;
            transition: opacity var(--md-dur-2) var(--md-easing-standard);
        }
        .user-hero-avatar:focus-visible .user-hero-avatar-overlay { opacity: 1; }
        @media (hover: hover) and (pointer: fine) {
            .user-hero-avatar:hover .user-hero-avatar-overlay { opacity: 1; }
        }
        .user-hero-main { flex: 1; min-width: 0; padding-top: 10px; }
        .user-hero-name {
            display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px;
            font-size: 20px; font-weight: 600; line-height: 1.25;
            color: var(--md-on-surface);
        }
        .user-hero-name .user-status-badge { margin-left: 0; }
        .user-hero-sub {
            display: flex; flex-wrap: wrap; gap: 2px 12px;
            margin-top: 4px;
            font-size: 13px;
            color: var(--md-on-surface-variant);
        }
        .user-hero-sub .mono { font-family: 'Roboto Mono', monospace; font-size: 12px; }
        .user-actions { position: relative; padding-top: 12px; }
        .user-actions-menu {
            position: absolute; right: 0; top: calc(100% - 2px); z-index: 5;
            min-width: 232px;
            padding: 6px 0;
            border-radius: var(--md-shape-md);
            background: var(--md-surface-container);
            box-shadow: var(--md-elev-2);
            opacity: 0; transform: translateY(-4px) scale(.98); transform-origin: top right;
            pointer-events: none;
            transition: opacity 120ms var(--md-easing-standard), transform 120ms var(--md-easing-standard);
        }
        .user-actions-menu.open { opacity: 1; transform: none; pointer-events: auto; }
        .user-actions-menu button {
            display: flex; align-items: center; gap: 12px;
            width: 100%; padding: 10px 16px;
            border: 0; background: none;
            font: inherit; font-size: 14px; text-align: left;
            color: var(--md-on-surface);
            cursor: pointer;
        }
        .user-actions-menu button:hover,
        .user-actions-menu button:focus-visible { background: var(--md-surface-container-highest); outline: none; }
        .user-actions-menu button.danger { color: var(--md-error); }
        .user-dialog .user-restriction-note {
            display: flex; flex-wrap: wrap; gap: 4px 14px;
            margin: 12px 20px 0;
            padding: 10px 12px;
            border-radius: var(--md-shape-md);
            background: var(--md-error-container);
            color: var(--md-on-error-container);
            font-size: 13px;
        }
        .user-hero-badges { padding: 14px 20px 0; }
        .user-dialog .user-data-warning { margin: 12px 20px 0; }

        .badge-tiles { display: flex; flex-wrap: wrap; gap: 8px; }
        .badge-tile {
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px;
            width: 84px; min-height: 76px;
            padding: 10px 6px 8px;
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--md-shape-md);
            background: var(--md-surface-container-lowest);
            color: var(--md-on-surface);
            font: inherit;
            text-align: center;
        }
        button.badge-tile {
            cursor: pointer;
            transition: background var(--md-dur-2) var(--md-easing-standard),
                        border-color var(--md-dur-2) var(--md-easing-standard),
                        transform 100ms ease-out;
        }
        button.badge-tile:active { transform: scale(.97); }
        .badge-tile img { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }
        .badge-tile .badge-name {
            width: 100%;
            overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            font-size: 11px; line-height: 1.2;
        }
        .badge-primary-label { color: var(--md-primary); font-size: 10px; font-weight: 600; }
        .badge-tile-add { border-style: dashed; background: transparent; color: var(--md-primary); }
        .badges-empty { font-size: 13px; color: var(--md-on-surface-variant); }
        @media (hover: hover) and (pointer: fine) {
            button.badge-tile:hover { border-color: var(--md-primary); }
            .badge-tile-add:hover { background: var(--md-primary-container); }
        }

        .user-dialog .user-tabs {
            position: sticky; top: 0; z-index: 3;
            display: flex; gap: 2px;
            margin-top: 14px;
            padding: 0 12px;
            border-bottom: 1px solid var(--md-outline-variant);
            background: var(--md-surface-container-high);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .user-tab {
            flex-shrink: 0;
            padding: 12px 12px 10px;
            border: 0; border-bottom: 3px solid transparent;
            border-radius: 8px 8px 0 0;
            background: none;
            font: inherit; font-size: 14px; font-weight: 500;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            white-space: nowrap;
            transition: color var(--md-dur-2) var(--md-easing-standard),
                        background var(--md-dur-2) var(--md-easing-standard);
        }
        .user-tab[aria-selected="true"] { color: var(--md-primary); border-bottom-color: var(--md-primary); }
        .user-tab .count { color: var(--md-on-surface-variant); font-weight: 400; }
        @media (hover: hover) and (pointer: fine) {
            .user-tab:hover { background: var(--md-surface-container-highest); }
        }
        .user-tab-panel { padding: 16px 20px 20px; min-height: 300px; }
        .user-panel-section + .user-panel-section { margin-top: 22px; }
        .user-panel-section h4 {
            margin: 0 0 10px;
            font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .8px;
            color: var(--md-on-surface-variant);
        }
        .user-profile-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .user-deleted { padding: 56px 20px 24px; }

        /* Account restriction confirmation */
        #restrictionScrim { z-index: 90; }
        .restriction-dialog { max-width: 440px; }
        .restriction-dialog .md-dialog-body p { margin: 0 0 12px; }
        .reason-counter { margin-top: 4px; font-size: 11px; text-align: right; color: var(--md-on-surface-variant); }
        .md-btn-danger { background: var(--md-error); color: var(--md-on-error); }

        /* Badge picker */
        #badgePickerScrim { z-index: 90; }
        .badge-picker-dialog { max-width: 920px; }
        .badge-picker-dialog .md-dialog-header { padding: 18px 16px 12px 24px; border-bottom: 1px solid var(--md-outline-variant); }
        .badge-picker-dialog .md-dialog-header h3 { font-size: 20px; }
        .badge-picker-dialog .md-dialog-header .subtitle { font-size: 13px; color: var(--md-on-surface-variant); margin-top: 2px; }
        .badge-picker-dialog .md-dialog-body { padding: 0; display: grid; grid-template-columns: minmax(0, 1fr) 232px; min-height: 0; }
        .badge-picker-dialog .md-dialog-body > * + * { margin-top: 0; }
        .bp-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--md-outline-variant); }
        .bp-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 16px 10px; }
        .bp-toolbar .md-search { flex: 1 1 220px; min-width: 0; }
        .bp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
            gap: 8px;
            align-content: start;
            padding: 4px 16px 16px;
            height: min(52vh, 460px);
            overflow-y: auto;
        }
        .bp-tile {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            gap: 6px;
            padding: 14px 6px 10px;
            border: 1px solid var(--md-outline-variant);
            border-radius: 14px;
            background: var(--md-surface-container-lowest);
            color: var(--md-on-surface);
            font: inherit; font-size: 12px; line-height: 1.25; text-align: center;
            cursor: pointer;
            transition: background 150ms var(--md-easing-standard),
                        border-color 150ms var(--md-easing-standard),
                        box-shadow 150ms var(--md-easing-standard),
                        transform 100ms ease-out;
        }
        .bp-tile:active { transform: scale(.97); }
        .bp-tile:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
        .bp-tile img, .bp-tile .bp-fallback { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; }
        .bp-tile .bp-fallback { display: grid; place-items: center; color: var(--md-primary); }
        .bp-tile-name { width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .bp-check {
            position: absolute; top: 6px; right: 6px;
            display: grid; place-items: center;
            width: 20px; height: 20px;
            border: 2px solid var(--md-outline);
            border-radius: 6px;
            background: var(--md-surface-container-lowest);
            color: transparent;
        }
        .bp-check .bf-icon { font-size: 14px; }
        .bp-tag {
            position: absolute; top: 7px; left: 7px;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 9px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase;
        }
        .bp-tile[data-state="assigned"] { background: var(--md-surface-container); }
        .bp-tile[data-state="assigned"] .bp-check { background: var(--md-on-surface-variant); border-color: var(--md-on-surface-variant); color: var(--md-surface); }
        .bp-tile[data-state="assigned"] .bp-tag { background: var(--md-surface-container-highest); color: var(--md-on-surface-variant); }
        .bp-tile[data-state="add"] { background: var(--md-primary-container); border-color: var(--md-primary); box-shadow: inset 0 0 0 1px var(--md-primary); }
        .bp-tile[data-state="add"] .bp-check { background: var(--md-primary); border-color: var(--md-primary); color: var(--md-on-primary); }
        .bp-tile[data-state="add"] .bp-tag { background: var(--md-primary); color: var(--md-on-primary); }
        .bp-tile[data-state="remove"] { border: 1px dashed var(--md-error); box-shadow: inset 0 0 0 1px var(--md-error); }
        .bp-tile[data-state="remove"] img, .bp-tile[data-state="remove"] .bp-tile-name { opacity: .55; filter: grayscale(1); }
        .bp-tile[data-state="remove"] .bp-check { background: var(--md-error); border-color: var(--md-error); color: var(--md-on-error); }
        .bp-tile[data-state="remove"] .bp-tag { background: var(--md-error); color: var(--md-on-error); }
        @media (hover: hover) and (pointer: fine) {
            .bp-tile[data-state="none"]:hover { border-color: var(--md-primary); }
        }
        .bp-empty { grid-column: 1 / -1; padding: 32px 0; text-align: center; color: var(--md-on-surface-variant); }
        .bp-preview {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            padding: 16px;
            background: var(--md-surface-container-low);
            text-align: center;
            overflow-y: auto;
        }
        .bp-preview h4 {
            align-self: flex-start; margin: 0;
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
            color: var(--md-on-surface-variant);
        }
        .bp-preview-image {
            display: grid; place-items: center;
            width: 136px; height: 136px;
            border-radius: 24px;
            background: var(--md-surface-container-lowest);
            border: 1px solid var(--md-outline-variant);
        }
        .bp-preview-image img { width: 112px; height: 112px; object-fit: contain; }
        .bp-preview-name { font-weight: 600; color: var(--md-on-surface); overflow-wrap: anywhere; }
        .bp-preview-desc { font-size: 12px; color: var(--md-on-surface-variant); overflow-wrap: anywhere; }
        .bp-preview-mini { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--md-on-surface-variant); }
        .bp-preview-mini img { width: 24px; height: 24px; object-fit: contain; }
        .bp-preview-state { font-size: 12px; font-weight: 500; }
        .bp-preview-placeholder { margin: auto 0; font-size: 13px; color: var(--md-on-surface-variant); }
        .badge-picker-dialog .md-dialog-actions {
            align-items: center; flex-wrap: wrap;
            padding: 12px 16px;
            border-top: 1px solid var(--md-outline-variant);
        }
        .bp-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 1; min-width: 0; font-size: 12px; color: var(--md-on-surface-variant); }
        .bp-summary .pill { padding: 4px 10px; border-radius: 8px; font-weight: 500; font-size: 13px; }
        .bp-summary .pill.add { background: var(--md-primary-container); color: var(--md-on-primary-container); }
        .bp-summary .pill.remove { background: var(--md-error-container); color: var(--md-on-error-container); }
        @media (max-width: 720px) {
            .badge-picker-dialog .md-dialog-body { grid-template-columns: 1fr; }
            .bp-main { border-right: 0; }
            .bp-preview { display: none; }
        }
        @media (max-width: 600px) {
            .user-hero { flex-wrap: wrap; row-gap: 4px; }
            .user-hero-avatar { width: 80px; height: 80px; margin-top: -40px; font-size: 24px; }
            .user-actions { order: 2; margin-left: auto; }
            .user-hero-main { order: 3; flex-basis: 100%; padding-top: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .bp-tile, button.badge-tile, .user-actions-menu { transition: none; }
            .bp-tile:active, button.badge-tile:active { transform: none; }
        }

        .session-list { display: flex; flex-direction: column; gap: 6px; }
        .session-row { margin-bottom: 0; }
        .sessions-toggle { width: 100%; justify-content: center; margin-top: 8px; }
        .user-data-warning {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 16px;
            padding: 10px 12px;
            border-radius: var(--md-shape-md);
            background: var(--md-warning-container);
            color: var(--md-on-warning-container);
            font-size: 13px;
        }
        .user-section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
        }
        .user-panel-section .user-section-heading h4 { margin: 0; }
        .user-section-heading { margin: 0 0 10px; }
        .admin-reason {
            width: 100%;
            min-height: 64px;
            margin-top: 8px;
            padding: 10px 14px;
            resize: vertical;
        }

        .storage-card {
            display: grid;
            grid-template-columns: 148px minmax(0, 1fr);
            gap: 18px;
            align-items: center;
            padding: 14px;
            border-radius: var(--md-shape-lg);
            background: var(--md-surface-container);
        }
        .storage-ring {
            position: relative;
            display: grid;
            place-items: center;
            width: 148px;
            height: 148px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .storage-ring::after {
            content: "";
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            background: var(--md-surface-container);
        }
        .storage-ring.is-overflow { box-shadow: 0 0 0 2px var(--md-error); }
        .storage-ring-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            max-width: 94px;
            text-align: center;
        }
        .storage-ring-content strong { font-size: 20px; color: var(--md-on-surface); }
        .storage-ring-content span { font-size: 10px; line-height: 1.25; color: var(--md-on-surface-variant); }
        .storage-ring-content .storage-overflow { color: var(--md-error); }
        .storage-legend {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 12px;
            min-width: 0;
        }
        .storage-legend-item {
            display: grid;
            grid-template-columns: 8px minmax(0, 1fr) auto;
            align-items: center;
            gap: 6px;
            min-width: 0;
            font-size: 11px;
        }
        .storage-legend-dot { width: 8px; height: 8px; border-radius: 50%; }
        .storage-legend-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .storage-legend-value { color: var(--md-on-surface-variant); white-space: nowrap; }
        .storage-empty { grid-column: 1 / -1; font-size: 12px; color: var(--md-on-surface-variant); }
        .storage-limit-row { display: flex; gap: 12px; align-items: center; margin-top: 12px; }

        .badge-row {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 12px;
            background: var(--md-surface-container);
            border-radius: var(--md-shape-md);
            margin-bottom: 6px;
        }
        .session-row {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px;
            background: var(--md-surface-container);
            border-radius: var(--md-shape-md);
            margin-bottom: 6px;
            cursor: pointer;
            transition: background .2s;
        }
        .session-list .session-row { margin-bottom: 0; }
        .session-row:hover { background: var(--md-surface-container-high); }
        .tfa-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px;
            background: var(--md-surface-container);
            border-radius: var(--md-shape-md);
            margin-bottom: 6px;
        }
        .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .field-grid .full { grid-column: 1 / -1; }
        .field-label { font-size: 12px; font-weight: 500; color: var(--md-on-surface-variant); margin-bottom: 6px; display:block; }

        @media (max-width: 600px) {
            .field-grid { grid-template-columns: 1fr; }
            .md-search { width: 100% !important; }
            .storage-card { grid-template-columns: 1fr; }
            .storage-ring { margin: 0 auto; }
            .storage-legend { grid-template-columns: 1fr; }
            .storage-empty { grid-column: auto; }
            .storage-limit-row { flex-wrap: wrap; }
            .storage-limit-row input { min-width: 140px; }
        }
    </style>
</head>
<body>

<div class="md-page-loading" id="loading-overlay">
    <div class="md-loader-expressive"></div>
    <div class="label">Загрузка...</div>
</div>

<div class="md-app-shell">
    <div id="md-nav-root" data-active="users"></div>

    <main class="md-main">
        <header class="md-app-bar">
            <h1>Юзеры</h1>
            <div style="display:flex;gap:8px;align-items:center;">
                <div class="md-search" style="width:320px;">
                    <span class="bf-icon" style="--bf-icon-url:url(/assets/icons/search.svg);" aria-hidden="true"></span>
                    <input id="searchInput" type="text" placeholder="Поиск по username или ID...">
                </div>
                <button class="md-btn md-btn-tonal md-btn-square-press" onclick="openReservedNamesModal()">
                    <span class="bf-icon size-18" style="--bf-icon-url:url(/assets/icons/security.svg);" aria-hidden="true"></span>
                    Зарезервированные
                </button>
                <button id="logoutBtn" class="md-icon-btn" title="Выйти">
                    <span class="bf-icon" style="--bf-icon-url:url(/assets/icons/logout.svg);" aria-hidden="true"></span>

        <div class="md-page">

                <button type="button" class="md-chip" data-status="blocked" onclick="setUserStatusFilter('blocked')">Заблокированные</button>

<script src="assets/icons.js?v=3"></script>
<script src="assets/api.js?v=8"></script>
<script src="assets/sidebar.js?v=4"></script>
<script src="assets/command-palette.js?v=5"></script>
<script>
    let users = [];
    let totalCount = 0;
    let currentOffset = 0;
    let isLoading = false;
    let currentQuery = '';
    let currentStatusFilter = 'all';
    let searchTimeout = null;
    let allBadges = [];
    let currentUserData = null;
    let sessionsExpanded = false;
    let userModalTab = 'profile';
    let restrictionRequest = null;
    const PAGE_SIZE = 50;
    const USER_STATUSES = ['all', 'blocked', 'pending_deletion', 'deleted'];
    const MAX_RESTORED_PAGES = 20;
    let openedUserId = null;

    // URL выборки: q, status (all не пишется), page — число подгруженных порций, userId — открытая карточка.
    function buildUsersUrlQuery({ query = '', status = 'all', pages = 1, userId = null } = {}) {
        const params = new URLSearchParams();
        if (query) params.set('q', query);
        if (status !== 'all') params.set('status', status);
        if (pages > 1) params.set('page', String(pages));
        if (userId) params.set('userId', String(userId));
        return params.toString();
    }

    function readUsersUrlState(search) {
        const params = new URLSearchParams(search);
        const linkedUserId = /^\d+$/.test(params.get('userId') || '') ? params.get('userId') : null;
        const status = USER_STATUSES.includes(params.get('status')) ? params.get('status') : 'all';
        const rawPage = params.get('page') || '';
        const page = /^[1-9]\d*$/.test(rawPage) ? Math.min(Number(rawPage), MAX_RESTORED_PAGES) : 1;
        // Ссылка /users?userId=N без q — поиск по id с открытием карточки, как раньше.
        const query = (params.get('q') || '').trim() || linkedUserId || '';
        return { query, status, page, userId: linkedUserId };
    }

    function syncUsersUrl() {
        const pages = Math.max(1, Math.ceil(users.length / PAGE_SIZE));
        const search = buildUsersUrlQuery({ query: currentQuery, status: currentStatusFilter, pages, userId: openedUserId });
        history.replaceState(null, '', `${window.location.pathname}${search ? `?${search}` : ''}`);
    }

    function checkAuth() { return BF.requireAuth(); }

    function getInitials(f, l) { return ((f?.[0] || '') + (l?.[0] || '')).toUpperCase() || '?'; }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML.replace(/\"/g, '&quot;').replace(/'/g, '&#39;'); }
    function formatDate(s) { if (!s) return '—'; const d = new Date(s); return d.toLocaleDateString('ru-RU'); }
    function formatDateTime(s) { if (!s) return '—'; const d = new Date(s); return d.toLocaleString('ru-RU'); }
    function accountStatusLabel(status) {
        return ({ Active: 'Активен', Blocked: 'Заблокирован', PendingDeletion: 'В удалении', Deleted: 'Удалён' })[status] || 'Неизвестный статус';
    }
    function accountStatusBadge(status) {
        const level = status === 'Blocked' || status === 'Deleted' ? 'level-error' : status === 'PendingDeletion' ? 'level-warning' : 'level-info';
        return `<span class="md-chip selected ${level} user-status-badge">${escapeHtml(accountStatusLabel(status))}</span>`;
    }

    async function loadUsers(reset = false) {
        if (isLoading) return;
        if (!reset && currentOffset >= totalCount && totalCount > 0) return;

        isLoading = true;
        if (reset) { currentOffset = 0; users = []; }
        document.getElementById('loadingMore').style.display = '';

        try {
            const params = new URLSearchParams({ query: currentQuery, status: currentStatusFilter, offset: currentOffset, size: PAGE_SIZE });
            const data = await BF.request(`/api/users?${params}`);
            totalCount = data.totalCount;
            users = reset ? data.users : users.concat(data.users);
            currentOffset += data.users.length;
            renderUsers();
            syncUsersUrl();
        } catch (e) { /* ignore */ }
        finally { isLoading = false; document.getElementById('loadingMore').style.display = 'none'; }
    }

    function renderUsers() {
        const list = document.getElementById('usersList');
        const empty = document.getElementById('emptyState');
        if (users.length === 0) { list.innerHTML = ''; empty.style.display = ''; return; }
        empty.style.display = 'none';

        list.innerHTML = users.map(u => `
            <div class="user-row" onclick="openUserModal(${u.id})">
                <div class="avatar">
                    ${(u.profilePicturePreview || u.profilePicture)
                        ? `<img src="${escapeHtml(u.profilePicturePreview || u.profilePicture)}" alt="">`
                        : escapeHtml(getInitials(u.firstName, u.lastName))}
                </div>
                <div class="info">
                    <div class="name">${escapeHtml(u.firstName)} ${escapeHtml(u.lastName)} ${accountStatusBadge(u.accountStatus)}</div>
                    <div class="uname">@${escapeHtml(u.username)}</div>
                </div>
                <div class="uid">ID: ${escapeHtml(u.id)}</div>
            </div>
        `).join('');
    }

    function syncStatusChips() {
        document.querySelectorAll('#userStatusFilters [data-status]').forEach(button => {
            button.classList.toggle('selected', button.dataset.status === currentStatusFilter);
        });
    }

    window.setUserStatusFilter = function (status) {
        if (!USER_STATUSES.includes(status)) return;
        currentStatusFilter = status;
        syncStatusChips();
        loadUsers(true);
    };

    document.getElementById('searchInput').addEventListener('input', e => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => { currentQuery = e.target.value.trim(); loadUsers(true); }, 300);
    });

    const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting && !isLoading) loadUsers();
    }, { threshold: 0.1 });

    // ---- USER MODAL ----
    window.openUserModal = async function (userId) {
        const sameUser = openedUserId === String(userId);
        sessionsExpanded = false;
        closeBadgePicker(true);
        closeRestrictionDialog();
        if (!sameUser) userModalTab = 'profile';
        openedUserId = String(userId);
        syncUsersUrl();
        document.getElementById('userScrim').classList.add('open');
        if (!sameUser || !currentUserData) {
            document.getElementById('modalContent').innerHTML = '<div style="padding:72px 48px;text-align:center;"><div class="md-loader-expressive" style="display:inline-block;"></div></div>';
        }
        await refreshUserModal(userId);
    };

    async function refreshUserModal(userId) {
        try {
            const data = await BF.request(`/api/users/${userId}`, { errorToast: false });
            if (openedUserId !== String(userId)) return;
            currentUserData = data;
            renderUserModal(data);
        } catch (e) {
            if (openedUserId !== String(userId)) return;
            document.getElementById('modalContent').innerHTML = `<div style="padding:72px 48px;text-align:center;color:var(--md-error);">Ошибка загрузки</div>`;
        }
    }

    window.closeUserModal = function () {
        if (document.getElementById('badgePickerScrim').classList.contains('open')) {
            closeBadgePicker();
            if (badgePicker.userId) return;
        }
        closeRestrictionDialog();
        document.getElementById('userScrim').classList.remove('open');
        currentUserData = null;
        openedUserId = null;
        userModalTab = 'profile';
        syncUsersUrl();
    };

    const restrictionLabels = {
        block: { label: 'Заблокировать', icon: 'ban', danger: false },
        unblock: { label: 'Разблокировать', icon: 'unlock', danger: false },
        deletion: { label: 'Удалить аккаунт', icon: 'delete', danger: true },
        'cancel-deletion': { label: 'Отменить удаление', icon: 'undo', danger: false }
    };

    function availableRestrictionActions(status) {
        const canChangeBlock = !window.BF || BF.can('users.block');
        const canScheduleDeletion = !window.BF || BF.can('users.delete');
        const actions = [];
        if (status === 'Active' && canChangeBlock) actions.push('block');
        if (status === 'Blocked' && canChangeBlock) actions.push('unblock');
        if ((status === 'Active' || status === 'Blocked') && canScheduleDeletion) actions.push('deletion');
        if (status === 'PendingDeletion' && canScheduleDeletion) actions.push('cancel-deletion');
        return actions;
    }

    function renderUserModal(data) {
        const p = data.profile;
        const status = p.accountStatus || 'Active';
        const content = document.getElementById('modalContent');
        if (status === 'Deleted') {
            content.innerHTML = `
                <section class="user-deleted">
                    <div class="user-hero-name" id="userModalName"><span>Удалённый пользователь</span>${accountStatusBadge(status)}</div>
                    <div class="user-hero-sub"><span>ID <span class="mono">${escapeHtml(p.id)}</span></span></div>
                    <p>Аккаунт окончательно удалён.</p>
                </section>`;
            return;
        }

        const fullName = `${p.firstName || ''} ${p.lastName || ''}`.trim() || 'Пользователь';
        const canChangePassword = !window.BF || BF.can('users.password.set');
        const actions = availableRestrictionActions(status);
        const unavailableLabels = {
            contacts: 'контакты',
            devices: 'устройства',
            storage: 'хранилище',
            twoFactor: '2FA',
            sessions: 'сессии',
            poster: 'постер профиля'
        };
        const unavailable = Object.entries(data.availability || {})
            .filter(([, available]) => available === false)
            .map(([section]) => unavailableLabels[section] || section);
        const availabilityWarning = unavailable.length
            ? `<div class="user-data-warning" role="status">
                    <span class="bf-icon size-20" style="--bf-icon-url:url(/assets/icons/warning.svg);" aria-hidden="true"></span>
                    <span>Часть данных временно недоступна: ${unavailable.map(escapeHtml).join(', ')}. Остальные сведения актуальны.</span>
               </div>`
            : '';
        const restrictionNote = p.restrictionReason || p.deletionScheduledAt
            ? `<div class="user-restriction-note">
                    ${p.restrictionReason ? `<span>Причина: ${escapeHtml(p.restrictionReason)}</span>` : ''}
                    ${p.deletionScheduledAt ? `<span>Окончательное удаление: ${escapeHtml(formatDateTime(p.deletionScheduledAt))}</span>` : ''}
               </div>`
            : '';
        const actionsMenu = actions.length ? `
            <div class="user-actions">
                <button type="button" id="userActionsButton" class="md-btn md-btn-outlined" aria-haspopup="menu" aria-expanded="false" aria-controls="userActionsMenu" onclick="toggleUserActionsMenu()">
                    Действия <span class="bf-icon size-18" style="--bf-icon-url:url(/assets/icons/chevron-down.svg);" aria-hidden="true"></span>
                </button>
                <div class="user-actions-menu" id="userActionsMenu" role="menu">
                    ${actions.map(action => `
                        <button type="button" role="menuitem" class="${restrictionLabels[action].danger ? 'danger' : ''}" onclick="openRestrictionDialog(${p.id}, '${action}')">
                            <span class="bf-icon size-20" style="--bf-icon-url:url(/assets/icons/${restrictionLabels[action].icon}.svg);" aria-hidden="true"></span>
                            ${restrictionLabels[action].label}
                        </button>`).join('')}
                </div>
            </div>` : '';

        const sessionsAvailable = data.availability?.sessions !== false;
        const tabs = [
            { id: 'profile', label: 'Профиль' },
            { id: 'security', label: 'Безопасность' },
            { id: 'devices', label: 'Устройства', count: sessionsAvailable ? (data.sessions || []).length : null },
            data.storage ? { id: 'storage', label: 'Хранилище' } : null
        ].filter(Boolean);
        if (!tabs.some(tab => tab.id === userModalTab)) userModalTab = 'profile';

        const panels = {
            profile: `
                <div class="field-grid">
                    <div><label class="field-label" for="editFirstName">Имя</label>
                        <input id="editFirstName" type="text" value="${escapeHtml(p.firstName)}" class="md-input-outlined" style="width:100%;"></div>
                    <div><label class="field-label" for="editLastName">Фамилия</label>
                        <input id="editLastName" type="text" value="${escapeHtml(p.lastName)}" class="md-input-outlined" style="width:100%;"></div>
                    <div class="full"><label class="field-label" for="editUsername">Username</label>
                        <div style="display:flex;align-items:stretch;">
                            <span style="display:inline-flex;align-items:center;padding:0 12px;background:var(--md-surface-container);border:1px solid var(--md-outline);border-right:0;border-radius:var(--md-shape-sm) 0 0 var(--md-shape-sm);color:var(--md-on-surface-variant);">@</span>
                            <input id="editUsername" type="text" value="${escapeHtml(p.username)}" class="md-input-outlined" style="flex:1;border-radius:0 var(--md-shape-sm) var(--md-shape-sm) 0;">
                        </div>
                    </div>
                    <div class="full"><label class="field-label" for="editBio">Био</label>
                        <textarea id="editBio" rows="3" class="md-input-outlined" style="width:100%;padding:10px 14px;height:auto;resize:vertical;">${escapeHtml(p.bio || '')}</textarea>
                    </div>
                </div>
                <div class="user-profile-actions">
                    <button type="button" class="md-btn md-btn-text" onclick="resetProfileForm()">Отменить</button>
                    <button type="button" class="md-btn md-btn-filled md-btn-square-press" onclick="saveProfileChanges(${p.id})">
                        <span class="bf-icon size-18" style="--bf-icon-url:url(/assets/icons/save.svg);" aria-hidden="true"></span> Сохранить
                    </button>
                </div>`,
            security: `
                <section class="user-panel-section" id="tfa-section">
                    <h4>Двухфакторная аутентификация</h4>
                    ${data.twoFactor ? `
                        <div class="tfa-row">
                            <div>
                                <div style="font-weight:500;">Authenticator</div>
                                <div style="font-size:12px;color:${data.twoFactor.authenticatorEnabled ? 'var(--md-success)' : 'var(--md-on-surface-variant)'};">${data.twoFactor.authenticatorEnabled ? 'Включён' : 'Выключен'}</div>
                            </div>
                            <button class="md-btn md-btn-text tfa-disable-btn" style="color:var(--md-error);" onclick="disableOtp(${p.id}, 1)" ${!data.twoFactor.authenticatorEnabled ? 'disabled' : ''}>Отключить</button>
                        </div>
                        <div class="tfa-row">
                            <div>
                                <div style="font-weight:500;">Email</div>
                                <div style="font-size:12px;color:${data.twoFactor.emailEnabled ? 'var(--md-success)' : 'var(--md-on-surface-variant)'};">${data.twoFactor.emailEnabled ? 'Включён' : 'Выключен'}</div>
                            </div>
                            <button class="md-btn md-btn-text tfa-disable-btn" style="color:var(--md-error);" onclick="disableOtp(${p.id}, 2)" ${!data.twoFactor.emailEnabled ? 'disabled' : ''}>Отключить</button>
                        </div>
                        <label class="field-label" for="twoFactorReason">Причина отключения</label>
                        <textarea id="twoFactorReason" maxlength="500" class="md-input-outlined admin-reason" placeholder="Обязательная причина для аудита"></textarea>
                    ` : '<div style="color:var(--md-on-surface-variant);font-size:13px;">Данные недоступны</div>'}
                </section>
                ${canChangePassword ? `
                <section class="user-panel-section">
                    <h4>Смена пароля</h4>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <input id="newPasswordInput" type="password" placeholder="Новый пароль (мин. 6 символов)" aria-label="Новый пароль" class="md-input-outlined" style="flex:1;">
                        <button class="md-btn md-btn-square-press" style="background:var(--md-tertiary);color:var(--md-on-tertiary);" onclick="changeUserPassword(${p.id})">Применить</button>
                    </div>
                    <label class="field-label" for="passwordReason" style="margin-top:10px;">Причина смены пароля</label>
                    <textarea id="passwordReason" maxlength="500" class="md-input-outlined admin-reason" placeholder="Обязательная причина для аудита"></textarea>
                    <p style="font-size:12px;color:var(--md-on-surface-variant);margin-top:8px;">Пользователь получит email об изменении пароля.</p>
                </section>` : ''}`,
            devices: `
                <section class="user-panel-section">
                    <div class="user-section-heading">
                        <h4>Устройства и сессии</h4>
                        ${sessionsAvailable && (data.sessions || []).length > 0 && (!window.BF || BF.can('users.sessions.revoke')) ? `
                            <button id="revokeAllSessionsButton" type="button" class="md-btn md-btn-text" style="color:var(--md-error);" onclick="revokeAllSessions(${p.id})">
                                Завершить все
                            </button>` : ''}
                    </div>
                    <div id="sessionsList" class="session-list"></div>
                    <button id="sessionsToggle" type="button" class="md-btn md-btn-text sessions-toggle" onclick="toggleSessions(${p.id})"></button>
                </section>`,
            storage: data.storage ? renderStorageSection(data.storage, p) : ''
        };

        content.innerHTML = `
            <div class="user-hero-cover">

    window.selectUserTab = function (tabId, focus = false) {
        userModalTab = tabId;
        document.querySelectorAll('#modalContent .user-tab').forEach(tab => {
            const selected = tab.dataset.tab === tabId;
            tab.setAttribute('aria-selected', String(selected));
            tab.tabIndex = selected ? 0 : -1;
            if (selected && focus) tab.focus();
        });
        document.querySelectorAll('#modalContent .user-tab-panel').forEach(panel => {
            panel.hidden = panel.id !== `userTabPanel-${tabId}`;
        });
    };

    window.handleUserTabKeys = function (event) {
        if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
        const tabs = [...document.querySelectorAll('#modalContent .user-tab')];
        const index = tabs.findIndex(tab => tab.dataset.tab === userModalTab);
        const next = tabs[(index + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
        event.preventDefault();
        selectUserTab(next.dataset.tab, true);
    };

    const storageTypeNames = {
        1: 'Аватарки', 2: 'Изображения', 3: 'Видео', 4: 'GIF', 5: 'Документы',
        6: 'Обложки чатов', 7: 'Аудио', 8: 'Голосовые', 9: 'Стикеры', 10: 'Постер'
    };

        'var(--md-on-surface-variant)', 'var(--md-outline)', '#af5f45', '#776b2f'

    function renderBadgeTiles(profile) {

                    </div>

    function renderStorageSection(storage, profile) {
        const totalUsed = Math.max(Number(storage.totalUsedStorage) || 0, 0);
        const limit = Math.max(Number(storage.storageLimit) || 0, 0);
        const usedPercent = limit > 0 ? Math.min((totalUsed / limit) * 100, 100) : (totalUsed > 0 ? 100 : 0);
        const overflow = totalUsed > limit;
        const usedMb = (totalUsed / 1048576).toFixed(1);
        const limitGb = (limit / 1073741824).toFixed(1);
        const types = (storage.storageByTypes || [])
            .map(type => ({
                ...type,
                usedStorage: Math.max(Number(type.usedStorage) || 0, 0),
                name: storageTypeNames[type.fileType] || type.fileTypeName || 'Другое'
            }))
            .filter(type => type.usedStorage > 0)
            .sort((left, right) => right.usedStorage - left.usedStorage);
        const typesTotal = types.reduce((sum, type) => sum + type.usedStorage, 0);
        const chartTotal = typesTotal || totalUsed;
        const segments = [];
        let cursor = 0;

        if (chartTotal > 0 && usedPercent > 0) {
            types.forEach((type, index) => {
                const next = Math.min(usedPercent, cursor + usedPercent * (type.usedStorage / chartTotal));
                if (next > cursor) {
                    segments.push(`${storageChartColors[index % storageChartColors.length]} ${cursor.toFixed(2)}% ${next.toFixed(2)}%`);
                }
                cursor = next;
            });
            if (cursor < usedPercent) {
                segments.push(`${storageChartColors[0]} ${cursor.toFixed(2)}% ${usedPercent.toFixed(2)}%`);
            }
        }
        if (usedPercent < 100) {
            segments.push(`var(--md-surface-container-highest) ${usedPercent.toFixed(2)}% 100%`);
        }
        if (segments.length === 0) segments.push('var(--md-surface-container-highest) 0 100%');

        const chartStyle = `background:conic-gradient(${segments.join(', ')});`;
        const ariaLabel = `Занято ${usedMb} МБ из ${limitGb} ГБ, ${usedPercent.toFixed(1)} процентов`;
        const legend = types.length
            ? types.map((type, index) => `
                <div class="storage-legend-item" title="${escapeHtml(type.name)}">
                    <span class="storage-legend-dot" style="background:${storageChartColors[index % storageChartColors.length]};"></span>
                    <span class="storage-legend-name">${escapeHtml(type.name)}</span>
                    <span class="storage-legend-value">${formatBytes(type.usedStorage)}</span>
                </div>`).join('')
            : '<div class="storage-empty">Нет загруженных файлов</div>';

        return `
            <section class="user-panel-section">
                <h4>Хранилище</h4>
                <div class="storage-card">
                    <div class="storage-ring${overflow ? ' is-overflow' : ''}" style="${chartStyle}" role="img" aria-label="${escapeHtml(ariaLabel)}">
                        <div class="storage-ring-content">
                            <strong>${usedPercent.toFixed(1)}%</strong>
                            <span class="${overflow ? 'storage-overflow' : ''}">${overflow ? 'Превышен лимит' : `${usedMb} МБ из ${limitGb} ГБ`}</span>
                        </div>
                    </div>
                    <div class="storage-legend">${legend}</div>
                </div>
                <div class="storage-limit-row">
                    <label style="font-size:13px;color:var(--md-on-surface-variant);" for="storageLimitSlider">Лимит:</label>
                    <input type="range" id="storageLimitSlider" min="1" max="250" step="1" value="${profile.storageLimitGb || 1}"
                        oninput="document.getElementById('storageLimitValue').textContent=this.value" style="flex:1;accent-color:var(--md-primary);">
                    <span id="storageLimitValue" style="font-weight:500;min-width:24px;text-align:right;">${profile.storageLimitGb || 1}</span>
                    <span style="font-size:13px;color:var(--md-on-surface-variant);">ГБ</span>
                    <button class="md-btn md-btn-tonal md-btn-square-press" onclick="updateStorageLimit(${profile.id})">Применить</button>
                </div>
            </section>`;
    }

    function formatBytes(b) {
        if (!b) return '0 Б';
        if (b < 1024) return b + ' Б';
        if (b < 1048576) return (b/1024).toFixed(1) + ' КБ';
        if (b < 1073741824) return (b/1048576).toFixed(1) + ' МБ';
        return (b/1073741824).toFixed(2) + ' ГБ';
    }

    // ---- BADGE PICKER ----
    // Selection is local until "Применить": the whole diff goes in one request under one step-up.
    const badgePicker = { userId: null, assigned: new Set(), add: new Set(), remove: new Set(), filter: 'all', query: '', previewId: null };

    function badgePickerChangeCount() { return badgePicker.add.size + badgePicker.remove.size; }

    function badgePickerState(id) {
        if (badgePicker.remove.has(id)) return 'remove';
        if (badgePicker.add.has(id)) return 'add';
        if (badgePicker.assigned.has(id)) return 'assigned';
        return 'none';
    }

    function badgePickerCatalog() {
        const byId = new Map();
        allBadges.forEach(badge => byId.set(Number(badge.id), badge));
        (currentUserData?.profile?.badges || []).forEach(userBadge => {
            const id = Number(userBadge.badge?.id);
            if (id && !byId.has(id)) byId.set(id, { ...userBadge.badge, isActive: false });
        });
        // Inactive badges cannot be assigned; they stay visible only while assigned, so they can be removed.
        const items = [...byId.values()].filter(badge => badge.isActive || badgePicker.assigned.has(Number(badge.id)));
        return items.sort((left, right) =>
            Number(badgePicker.assigned.has(Number(right.id))) - Number(badgePicker.assigned.has(Number(left.id))));
    }

    function badgePickerTileHtml(badge) {
        const id = Number(badge.id);
        const state = badgePickerState(id);
        const imageUrl = badge.imageUrl || badge.miniImageUrl;
        const tag = {
            assigned: badge.isActive === false ? 'Неактивен' : 'Есть',
            add: 'Новый',
            remove: 'Снять'
        }[state];
        const checkIcon = state === 'remove' ? 'close' : 'check';
        return `
            <button type="button" class="bp-tile" data-badge-id="${id}" data-state="${state}"
                aria-pressed="${state === 'add' || state === 'assigned'}" title="${escapeHtml(badge.name || 'Бейдж')}">
                ${tag ? `<span class="bp-tag">${tag}</span>` : ''}
                <span class="bp-check"><span class="bf-icon" style="--bf-icon-url:url(/assets/icons/${checkIcon}.svg);" aria-hidden="true"></span></span>
                ${imageUrl
                    ? `<img src="${escapeHtml(imageUrl)}" alt="" loading="lazy">`
                    : '<span class="bp-fallback"><span class="bf-icon size-32" style="--bf-icon-url:url(/assets/icons/badge.svg);" aria-hidden="true"></span></span>'}
                <span class="bp-tile-name">${escapeHtml(badge.name || 'Бейдж')}</span>
            </button>`;
    }

    function renderBadgePicker() {
        const grid = document.getElementById('badgePickerGrid');
        const query = badgePicker.query.trim().toLocaleLowerCase('ru');
        const items = badgePickerCatalog().filter(badge => {
            const id = Number(badge.id);
            if (badgePicker.filter === 'changes' && !badgePicker.add.has(id) && !badgePicker.remove.has(id)) return false;
            if (badgePicker.filter === 'assigned' && !badgePicker.assigned.has(id)) return false;
            return !query || (badge.name || '').toLocaleLowerCase('ru').includes(query);
        });
        const empty = {
            changes: 'Изменений пока нет — отметьте бейджи в списке «Все»',
            assigned: 'У пользователя нет бейджей'
        }[badgePicker.filter] || 'Ничего не найдено';
        grid.innerHTML = items.length ? items.map(badgePickerTileHtml).join('') : `<div class="bp-empty">${empty}</div>`;
        renderBadgePickerSummary();
        renderBadgePreview();
    }

    function renderBadgePickerSummary() {
        const total = badgePickerChangeCount();
        const counts = {
            all: badgePickerCatalog().length,
            changes: total,
            assigned: badgePicker.assigned.size
        };
        const labels = { all: 'Все', changes: 'Изменения', assigned: 'У пользователя' };
        document.querySelectorAll('#badgePickerFilters .md-chip').forEach(chip => {
            const filter = chip.dataset.filter;
            chip.classList.toggle('selected', filter === badgePicker.filter);
            chip.setAttribute('aria-pressed', String(filter === badgePicker.filter));
            chip.textContent = `${labels[filter]} ${counts[filter]}`;
        });
        document.getElementById('badgePickerSummary').innerHTML = total
            ? `${badgePicker.add.size ? `<span class="pill add">+${badgePicker.add.size} добавить</span>` : ''}
               ${badgePicker.remove.size ? `<span class="pill remove">−${badgePicker.remove.size} снять</span>` : ''}
               <span>Одно подтверждение в Telegram</span>`
            : '<span>Отметьте бейджи — изменения применятся разом</span>';
        const apply = document.getElementById('badgePickerApply');
        apply.disabled = total === 0;
        apply.textContent = total ? `Применить (${total})` : 'Применить';
    }

    function renderBadgePreview() {
        const preview = document.getElementById('badgePickerPreview');
        const badge = badgePickerCatalog().find(item => Number(item.id) === badgePicker.previewId);
        if (!badge) {
            preview.innerHTML = '<h4>Превью</h4><div class="bp-preview-placeholder">Наведите на бейдж, чтобы увидеть его крупно</div>';
            return;
        }
        const state = badgePickerState(Number(badge.id));
        const stateText = {
            none: ['Не назначен', 'var(--md-on-surface-variant)'],
            assigned: [badge.isActive === false ? 'Назначен, бейдж неактивен' : 'Назначен пользователю', 'var(--md-on-surface-variant)'],
            add: ['Будет добавлен', 'var(--md-primary)'],
            remove: ['Будет снят', 'var(--md-error)']
        }[state];
        const full = badge.imageUrl || badge.miniImageUrl;
        preview.innerHTML = `
            <h4>Превью</h4>
            <div class="bp-preview-image">
                ${full ? `<img src="${escapeHtml(full)}" alt="">` : '<span class="bf-icon size-48" style="--bf-icon-url:url(/assets/icons/badge.svg);color:var(--md-primary);" aria-hidden="true"></span>'}
            </div>
            <div class="bp-preview-name">${escapeHtml(badge.name || 'Бейдж')}</div>
            ${badge.description ? `<div class="bp-preview-desc">${escapeHtml(badge.description)}</div>` : ''}
            ${badge.miniImageUrl ? `<div class="bp-preview-mini"><img src="${escapeHtml(badge.miniImageUrl)}" alt=""> MINI-версия</div>` : ''}
            <div class="bp-preview-state" style="color:${stateText[1]};">${stateText[0]}</div>`;
    }

    function setBadgePreview(id) {
        if (badgePicker.previewId === id) return;
        badgePicker.previewId = id;
        renderBadgePreview();
    }

    function toggleBadgeInPicker(id) {
        if (badgePicker.assigned.has(id)) {
            if (!badgePicker.remove.delete(id)) badgePicker.remove.add(id);
        } else if (!badgePicker.add.delete(id)) {
            badgePicker.add.add(id);
        }
        const tile = document.querySelector(`#badgePickerGrid .bp-tile[data-badge-id="${id}"]`);
        const badge = badgePickerCatalog().find(item => Number(item.id) === id);
        if (tile && badge) {
            tile.outerHTML = badgePickerTileHtml(badge);
            document.querySelector(`#badgePickerGrid .bp-tile[data-badge-id="${id}"]`)?.focus({ preventScroll: true });
        }
        badgePicker.previewId = id;
        renderBadgePickerSummary();
        renderBadgePreview();
    }

    (function bindBadgePickerGrid() {
        const grid = document.getElementById('badgePickerGrid');
        grid.addEventListener('click', event => {
            const tile = event.target.closest('.bp-tile');
            if (tile) toggleBadgeInPicker(Number(tile.dataset.badgeId));
        });
        grid.addEventListener('mouseover', event => {
            const tile = event.target.closest('.bp-tile');
            if (tile) setBadgePreview(Number(tile.dataset.badgeId));
        });
        grid.addEventListener('focusin', event => {
            const tile = event.target.closest('.bp-tile');
            if (tile) setBadgePreview(Number(tile.dataset.badgeId));
        });
    })();

    window.openBadgePicker = async function (uid, focusBadgeId) {
        if (window.BF && !BF.can('badges.manage')) return;
        const profile = currentUserData?.profile;
        badgePicker.userId = uid;
        badgePicker.assigned = new Set((profile?.badges || []).map(userBadge => Number(userBadge.badge?.id)));
        badgePicker.add.clear();
        badgePicker.remove.clear();
        badgePicker.filter = 'all';
        badgePicker.query = '';
        badgePicker.previewId = focusBadgeId ?? null;
        const search = document.getElementById('badgePickerSearch');
        search.value = '';
        document.getElementById('badgePickerSubtitle').textContent =
            `${profile?.firstName || ''} ${profile?.lastName || ''}`.trim() + (profile?.username ? ` · @${profile.username}` : '');
        document.getElementById('badgePickerGrid').innerHTML = '<div class="bp-empty"><div class="md-loader-expressive" style="display:inline-block;"></div></div>';
        renderBadgePickerSummary();
        renderBadgePreview();
        document.getElementById('badgePickerScrim').classList.add('open');
        try {
            allBadges = await BF.request('/api/badges', { errorToast: false });
        } catch {
            if (badgePicker.userId === uid) {
                document.getElementById('badgePickerGrid').innerHTML = '<div class="bp-empty" style="color:var(--md-error);">Не удалось загрузить бейджи</div>';
            }
            return;
        }
        if (badgePicker.userId !== uid) return;
        renderBadgePicker();
        const focusTile = focusBadgeId != null
            ? document.querySelector(`#badgePickerGrid .bp-tile[data-badge-id="${focusBadgeId}"]`)
            : null;
        if (focusTile) focusTile.focus();
        else search.focus();
    };

    window.closeBadgePicker = function (force = false) {
        if (!force && badgePickerChangeCount() > 0 && !confirm('Сбросить выбранные изменения бейджей?')) return;
        document.getElementById('badgePickerScrim').classList.remove('open');
        badgePicker.userId = null;
        badgePicker.add.clear();
        badgePicker.remove.clear();
    };

    window.setBadgePickerFilter = function (filter) {
        badgePicker.filter = filter;
        renderBadgePicker();
    };

    window.setBadgePickerQuery = function (query) {
        badgePicker.query = query;
        renderBadgePicker();
    };

    window.applyBadgePicker = async function () {
        if (window.BF && !BF.can('badges.manage')) return;
        const uid = badgePicker.userId;
        const add = [...badgePicker.add];
        const remove = [...badgePicker.remove];
        if (!uid || add.length + remove.length === 0) return;
        let result;
        try {
            result = await BF.request(`/api/users/${uid}/badges/batch`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ add, remove }),
                loading: '#badgePickerApply'
            });
        } catch (_) {
            return;
        }
        if (badgePicker.userId !== uid) return;

        (result.removed || []).forEach(id => {
            badgePicker.assigned.delete(Number(id));
            badgePicker.remove.delete(Number(id));
        });
        (result.added || []).forEach(userBadge => {
            const id = Number(userBadge.badge?.id);
            badgePicker.assigned.add(id);
            badgePicker.add.delete(id);
        });
        const failed = result.failed || [];
        await refreshUserModal(uid);
        if (failed.length === 0) {
            BF.toast('Бейджи обновлены', 'success');
            closeBadgePicker(true);
            return;
        }
        // Failed changes stay selected, so "Применить" retries only them.
        const catalog = badgePickerCatalog();
        const names = failed.map(item => catalog.find(badge => Number(badge.id) === Number(item.badgeId))?.name || `#${item.badgeId}`);
        const reason = failed.find(item => item.message)?.message;
        BF.toast(`Не применено: ${names.join(', ')}${reason ? ` — ${reason}` : ''}`, 'warning');
        badgePicker.filter = 'changes';
        renderBadgePicker();
    };

    window.removeSession = async function (uid, did) {
        if (window.BF && !BF.can('users.sessions.revoke')) return;
        if (!confirm('Завершить сессию?')) return;
        try { await BF.request(`/api/users/${uid}/sessions/${did}`, { method:'DELETE' }); await openUserModal(uid); } catch (_) {}
    };
    window.revokeAllSessions = async function (uid) {
        if (window.BF && !BF.can('users.sessions.revoke')) return;
        if (!confirm('Завершить все активные сессии пользователя?')) return;
        try {
            const result = await BF.request(`/api/users/${uid}/sessions`, {
                method: 'DELETE',
                loading: '#revokeAllSessionsButton',
                errorToast: true
            });
            if (result.failedDeviceIds?.length) {
                BF.toast(`Завершено ${result.revokedCount} из ${result.requestedCount} сессий`, 'warning');
            } else {
                BF.toast(`Завершено сессий: ${result.revokedCount}`, 'success');
            }
            await openUserModal(uid);
        } catch (_) {}
    };
    window.showDeviceDetails = function (session) {
        const html = `
            <p><strong>Device ID:</strong> <span style="font-family:'Roboto Mono',monospace;font-size:12px;">${escapeHtml(session.deviceId)}</span></p>
            <p><strong>Имя:</strong> ${escapeHtml(session.customName || session.originalName || '—')}</p>
            <p><strong>ОС:</strong> ${escapeHtml(session.operationSystem || '—')}</p>
            <p><strong>Приложение:</strong> ${escapeHtml(session.appName || '—')}</p>
            <p><strong>Локация:</strong> ${escapeHtml(session.location || '—')}</p>
            <p><strong>Создана:</strong> ${session.createdAt ? new Date(session.createdAt).toLocaleString('ru-RU') : '—'}</p>
            <p><strong>Истекает:</strong> ${session.expirationAt ? new Date(session.expirationAt).toLocaleString('ru-RU') : '—'}</p>`;
        document.getElementById('deviceModalContent').innerHTML = html;
        document.getElementById('deviceScrim').classList.add('open');
    };
    window.closeDeviceModal = function () { document.getElementById('deviceScrim').classList.remove('open'); };
    window.disableOtp = async function (uid, otpType) {
        if (window.BF && !BF.can('users.2fa.disable')) return;
        const name = otpType === 1 ? 'Authenticator' : 'Email';
        const reason = document.getElementById('twoFactorReason')?.value.trim();
        if (!reason) { BF.toast('Укажите причину отключения 2FA', 'warning'); return; }
        if (!confirm(`Отключить ${name} 2FA?`)) return;
        try {
            await BF.request(`/api/users/${uid}/2fa/disable`, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({otpType, reason}),
                successToast: `${name} 2FA отключён`
            });
            await openUserModal(uid);
        } catch (_) {}
    };
    const restrictionConfig = {
        block: { path: 'block', method: 'POST', title: 'Заблокировать аккаунт', text: 'Аккаунт будет заблокирован до ручной разблокировки.', submit: 'Заблокировать', danger: true, success: 'Аккаунт заблокирован' },
        unblock: { path: 'unblock', method: 'POST', title: 'Разблокировать аккаунт', text: 'Пользователь снова получит доступ к аккаунту.', submit: 'Разблокировать', danger: false, success: 'Аккаунт разблокирован' },
        deletion: { path: 'deletion', method: 'POST', title: 'Удалить аккаунт', text: 'Аккаунт будет поставлен на удаление и окончательно удалён через 7 дней. До этого удаление можно отменить.', submit: 'Поставить на удаление', danger: true, success: 'Удаление аккаунта запланировано' },
        'cancel-deletion': { path: 'deletion', method: 'DELETE', title: 'Отменить удаление', text: 'Запланированное удаление аккаунта будет отменено.', submit: 'Отменить удаление', danger: false, success: 'Удаление аккаунта отменено' }
    };

    window.openRestrictionDialog = function (uid, action) {
        const permission = action === 'block' || action === 'unblock' ? 'users.block' : 'users.delete';
        if (window.BF && !BF.can(permission)) return;
        const config = restrictionConfig[action];
        if (!config) return;
        toggleUserActionsMenu(false);
        restrictionRequest = { uid, action };
        document.getElementById('restrictionTitle').textContent = config.title;
        document.getElementById('restrictionText').textContent = config.text;
        const reason = document.getElementById('accountRestrictionReason');
        reason.value = '';
        document.getElementById('restrictionReasonCounter').textContent = '0 / 500';
        const submit = document.getElementById('restrictionSubmit');
        submit.textContent = config.submit;
        submit.classList.toggle('md-btn-danger', config.danger);
        document.getElementById('restrictionScrim').classList.add('open');
        reason.focus();
    };

    window.closeRestrictionDialog = function () {
        document.getElementById('restrictionScrim').classList.remove('open');
        restrictionRequest = null;
    };

    window.submitAccountRestriction = async function () {
        if (!restrictionRequest) return;
        const { uid, action } = restrictionRequest;
        const config = restrictionConfig[action];
        const reason = document.getElementById('accountRestrictionReason').value.trim();
        if (!reason || reason.length > 500) { BF.toast('Укажите причину (не более 500 символов)', 'warning'); return; }
        try {
            const result = await BF.request(`/api/users/${uid}/${config.path}`, {
                method: config.method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reason }),
                loading: '#restrictionSubmit'
            });
            const success = action === 'cancel-deletion'
                ? result.accountStatus === 'Blocked'
                    ? 'Удаление отменено, аккаунт остаётся заблокированным'
                    : 'Удаление отменено, аккаунт активен'
                : config.success;
            BF.toast(success, 'success');
            closeRestrictionDialog();
            await refreshUserModal(uid);
            await loadUsers(true);
        } catch (_) {}
    };
    window.updateStorageLimit = async function (uid) {
        const v = parseInt(document.getElementById('storageLimitSlider').value);
        try { await BF.request(`/api/users/${uid}/storage-limit`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({storageLimitGb:v}) }); await openUserModal(uid); } catch (_) {}
    };
    window.saveProfileChanges = async function (uid) {
        const firstName = document.getElementById('editFirstName').value.trim();
        const lastName = document.getElementById('editLastName').value.trim();
        const username = document.getElementById('editUsername').value.trim();
        const bio = document.getElementById('editBio').value.trim();
        try { await BF.request(`/api/users/${uid}/profile`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({firstName,lastName,bio,username}) }); await openUserModal(uid); await loadUsers(true); } catch (_) {}
    };
    window.changeUserPassword = async function (uid) {
        if (window.BF && !BF.can('users.password.set')) return;
        const input = document.getElementById('newPasswordInput');
        const p = input.value.trim();
        const reason = document.getElementById('passwordReason')?.value.trim();
        if (!p || p.length < 6) { BF.toast('Пароль должен быть не менее 6 символов', 'warning'); return; }
        if (!reason) { BF.toast('Укажите причину смены пароля', 'warning'); return; }
        if (!confirm('Сменить пароль пользователю?')) return;
        try {
            await BF.request(`/api/users/${uid}/password`, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({newPassword:p, reason}),
                successToast: 'Пароль изменён'
            });
            input.value = '';
            document.getElementById('passwordReason').value = '';
        } catch (_) {}
    };
    window.handleAvatarUpload = async function (input, uid) {
        const f = input.files[0]; if (!f) return;
        const fd = new FormData(); fd.append('avatar', f, f.name);
        try { await BF.request(`/api/users/${uid}/avatar`, { method:'POST', body: fd }); await openUserModal(uid); await loadUsers(true); } catch (_) {}
        input.value = '';
    };
    window.handlePosterUpload = async function (input, uid) {
        const f = input.files[0]; if (!f) return;
        const fd = new FormData(); fd.append('poster', f, f.name);
        try { await BF.request(`/api/users/${uid}/poster`, { method:'POST', body: fd }); await openUserModal(uid); } catch (_) {}
        input.value = '';
    };

    // ---- Reserved names ----
    let reservedNames = [];
    window.openReservedNamesModal = function () { document.getElementById('reservedScrim').classList.add('open'); loadReservedNames(); };
    window.closeReservedNamesModal = function () { document.getElementById('reservedScrim').classList.remove('open'); };
    async function loadReservedNames() {
        const list = document.getElementById('reservedNamesList');
        list.innerHTML = '<div style="padding:16px;text-align:center;"><div class="md-loader-expressive" style="display:inline-block;"></div></div>';
        try {
            reservedNames = await BF.request('/api/reserved-names', { errorToast: false });
            renderReservedNames();
        } catch { list.innerHTML = '<p style="color:var(--md-error);">Ошибка загрузки</p>'; }
    }
    function renderReservedNames() {
        const list = document.getElementById('reservedNamesList');
        if (!reservedNames.length) { list.innerHTML = '<p style="color:var(--md-on-surface-variant);font-size:13px;text-align:center;padding:16px;">Нет зарезервированных имён</p>'; return; }
        list.innerHTML = reservedNames.map(n => `
            <div class="badge-row">
                <span class="bf-icon size-18" style="--bf-icon-url:url(/assets/icons/code.svg);color:var(--md-primary);" aria-hidden="true"></span>
                <span style="flex:1;font-family:'Roboto Mono',monospace;">${escapeHtml(n)}</span>
                <button class="md-btn md-btn-text" style="color:var(--md-error);" onclick="removeReservedName('${escapeHtml(n)}')">Удалить</button>
            </div>`).join('');
    }
    window.addReservedName = async function () {
        const input = document.getElementById('newReservedName');
        const name = input.value.trim(); if (!name) return;
        try { await BF.request('/api/reserved-names', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name}) }); input.value = ''; await loadReservedNames(); } catch (_) {}
    };
    window.removeReservedName = async function (name) {
        if (!confirm(`Удалить «${name}»?`)) return;
        try { await BF.request(`/api/reserved-names/${encodeURIComponent(name)}`, { method:'DELETE' }); await loadReservedNames(); } catch (_) {}
    };

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        if (!confirm('Выйти?')) return;
        await BF.logout();
    });

    (async function () {
        const auth = await checkAuth();
        if (!auth) return;
        if (window.mdNavSetUser) window.mdNavSetUser(auth.name || 'Admin', auth.createdAt ? formatDate(auth.createdAt) : '');
        const initial = readUsersUrlState(window.location.search);
        currentQuery = initial.query;
        currentStatusFilter = initial.status;
        document.getElementById('searchInput').value = initial.query;
        syncStatusChips();
        await loadUsers(true);
        // GET /api/users ограничивает size 50, поэтому восстанавливаем порции последовательно.
        for (let loaded = 1; loaded < initial.page; loaded++) {
            const before = users.length;
            await loadUsers();
            if (users.length === before) break;
        }
        if (initial.userId) await openUserModal(initial.userId);
        observer.observe(document.getElementById('sentinel'));
        BF.pageReady();
    })();
</script>
</body>
</html>
