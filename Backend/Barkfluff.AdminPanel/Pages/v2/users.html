<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff Admin — Юзеры</title>
    <link rel="stylesheet" href="assets/md3.css?v=4">
    <style>
        .users-list { display: flex; flex-direction: column; gap: 6px; }
        .user-row {
            display: flex; align-items: center; gap: 16px;
            padding: 12px 16px;
            background: var(--md-surface-container-lowest);
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--md-shape-md);
            cursor: pointer;
            transition: background var(--md-dur-2) var(--md-easing-standard),
                        border-color var(--md-dur-2) var(--md-easing-standard);
        }
        .user-row:hover { background: var(--md-surface-container); border-color: var(--md-primary); }
        .avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--md-tertiary-container);
            color: var(--md-on-tertiary-container);
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 600;
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .info { flex: 1; min-width: 0; }
        .info .name { font-weight: 500; color: var(--md-on-surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display:flex; align-items:center; gap:8px; }
        .info .uname { color: var(--md-on-surface-variant); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .uid { color: var(--md-on-surface-variant); font-size: 13px; flex-shrink: 0; font-family: 'Roboto Mono', monospace; }

        /* Compact user modal */
        .user-dialog { max-width: 760px; }
        .user-dialog .md-dialog-header {
            min-height: 56px;
            padding: 12px 20px;
        }
        .user-dialog .md-dialog-header h3 { font-size: 18px; }
        .user-dialog .md-dialog-body { padding: 0; }
        .user-modal-cover {
            position: relative;
            aspect-ratio: 3 / 1;
            background: var(--md-surface-container-high);
            background-image: linear-gradient(135deg, var(--md-primary-container), var(--md-tertiary-container));
            display: flex; align-items: center; justify-content: center;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            overflow: hidden;
        }
        .user-modal-cover > img { width: 100%; height: 100%; object-fit: cover; }
        .user-modal-cover .overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            color: white; gap: 8px;
            opacity: 0; transition: opacity .2s;
            font-size: 14px; font-weight: 500;
        }
        @media (hover: hover) and (pointer: fine) {
            .user-modal-cover:hover .overlay { opacity: 1; }
        }
        .user-modal-avatar-wrap {
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px; height: 160px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 4px solid var(--md-surface-container-high);
            background: var(--md-tertiary-container);
            color: var(--md-on-tertiary-container);
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 28px;
            cursor: pointer;
            overflow: hidden;
        }
        .user-modal-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .user-modal-avatar-overlay {
            position: absolute; inset: 0; border-radius: 50%;
            background: rgba(0,0,0,.45);
            display: flex; align-items: center; justify-content: center;
            color: white; opacity: 0; transition: opacity .2s;
        }
        @media (hover: hover) and (pointer: fine) {
            .user-modal-avatar-wrap:hover .user-modal-avatar-overlay { opacity: 1; }
        }

        .user-modal-profile { padding: 92px 20px 0; }
        .user-modal-identity { margin-bottom: 14px; }
        .user-modal-name { font-size: 18px; font-weight: 600; line-height: 1.25; }
        .user-modal-username { margin-top: 2px; color: var(--md-on-surface-variant); }
        .user-modal-profile h4 {
            margin: 0 0 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--md-on-surface-variant);
        }
        .user-modal-meta {
            display: flex; flex-wrap: wrap; gap: 8px 12px;
            margin: 14px 0 12px;
            font-size: 12px;
            color: var(--md-on-surface-variant);
        }
        .user-modal-section { padding: 0 20px; }
        .user-modal-section h4 {
            margin: 22px 0 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--md-on-surface-variant);
        }
        .user-modal-section-last { padding-bottom: 20px; }

        .badge-tiles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .badge-tile {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 88px;
            min-height: 78px;
            padding: 10px 7px 8px;
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--md-shape-md);
            background: var(--md-surface-container);
            color: var(--md-on-surface);
            text-align: center;
        }
        .badge-tile img {
            width: 32px; height: 32px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .badge-tile .badge-name {
            width: 100%;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            font-size: 11px;
            line-height: 1.2;
        }
        .badge-tile-add {
            border-style: dashed;
            background: transparent;
            color: var(--md-primary);
            cursor: pointer;
            font: inherit;
            transition: background var(--md-dur-2) var(--md-easing-standard),
                        border-color var(--md-dur-2) var(--md-easing-standard),
                        transform 160ms ease-out;
        }
        .badge-tile-add:active { transform: scale(.97); }
        .badge-tile-remove {
            position: absolute;
            top: 4px; right: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px; height: 22px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: var(--md-error-container);
            color: var(--md-on-error-container);
            cursor: pointer;
            pointer-events: none;
            opacity: 0;
            transform: scale(.9);
            transition: opacity 160ms ease-out, transform 160ms ease-out, background 160ms ease-out;
        }
        .badge-tile-remove .msr { font-size: 16px; }
        @media (hover: hover) and (pointer: fine) {
            .badge-tile-add:hover { background: var(--md-primary-container); border-color: var(--md-primary); }
            .badge-tile:hover .badge-tile-remove,
            .badge-tile-remove:focus-visible { opacity: 1; transform: scale(1); pointer-events: auto; }
            .badge-tile-remove:hover { background: var(--md-error); color: var(--md-on-error); }
        }
        @media (hover: none) {
            .badge-tile-remove { opacity: 1; transform: scale(1); pointer-events: auto; }
        }
        .badge-add-dialog { max-width: 420px; }
        .badge-add-dialog .md-dialog-body { padding: 0 20px 8px; }
        #badgeAddScrim { z-index: 90; }

        .session-list { display: flex; flex-direction: column; gap: 6px; }
        .session-row { margin-bottom: 0; }
        .sessions-toggle { width: 100%; justify-content: center; margin-top: 8px; }
        .user-data-warning {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 16px;
            padding: 10px 12px;
            border-radius: var(--md-shape-md);
            background: var(--md-warning-container);
            color: var(--md-on-warning-container);
            font-size: 13px;
        }
        .user-section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
        }
        .user-modal-section .user-section-heading h4 { margin: 0; }
        .admin-reason {
            width: 100%;
            min-height: 64px;
            margin-top: 8px;
            padding: 10px 14px;
            resize: vertical;
        }

        .storage-card {
            display: grid;
            grid-template-columns: 148px minmax(0, 1fr);
            gap: 18px;
            align-items: center;
            padding: 14px;
            border-radius: var(--md-shape-lg);
            background: var(--md-surface-container);
        }
        .storage-ring {
            position: relative;
            display: grid;
            place-items: center;
            width: 148px;
            height: 148px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .storage-ring::after {
            content: "";
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            background: var(--md-surface-container);
        }
        .storage-ring.is-overflow { box-shadow: 0 0 0 2px var(--md-error); }
        .storage-ring-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            max-width: 94px;
            text-align: center;
        }
        .storage-ring-content strong { font-size: 20px; color: var(--md-on-surface); }
        .storage-ring-content span { font-size: 10px; line-height: 1.25; color: var(--md-on-surface-variant); }
        .storage-ring-content .storage-overflow { color: var(--md-error); }
        .storage-legend {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 12px;
            min-width: 0;
        }
        .storage-legend-item {
            display: grid;
            grid-template-columns: 8px minmax(0, 1fr) auto;
            align-items: center;
            gap: 6px;
            min-width: 0;
            font-size: 11px;
        }
        .storage-legend-dot { width: 8px; height: 8px; border-radius: 50%; }
        .storage-legend-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .storage-legend-value { color: var(--md-on-surface-variant); white-space: nowrap; }
        .storage-empty { grid-column: 1 / -1; font-size: 12px; color: var(--md-on-surface-variant); }
        .storage-limit-row { display: flex; gap: 12px; align-items: center; margin-top: 12px; }

        .badge-row {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 12px;
            background: var(--md-surface-container);
            border-radius: var(--md-shape-md);
            margin-bottom: 6px;
        }
        .session-row {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px;
            background: var(--md-surface-container);
            border-radius: var(--md-shape-md);
            margin-bottom: 6px;
            cursor: pointer;
            transition: background .2s;
        }
        .session-list .session-row { margin-bottom: 0; }
        .session-row:hover { background: var(--md-surface-container-high); }
        .tfa-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px;
            background: var(--md-surface-container);
            border-radius: var(--md-shape-md);
            margin-bottom: 6px;
        }
        .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .field-grid .full { grid-column: 1 / -1; }
        .field-label { font-size: 12px; font-weight: 500; color: var(--md-on-surface-variant); margin-bottom: 6px; display:block; }

        @media (max-width: 600px) {
            .field-grid { grid-template-columns: 1fr; }
            .md-search { width: 100% !important; }
            .storage-card { grid-template-columns: 1fr; }
            .storage-ring { margin: 0 auto; }
            .storage-legend { grid-template-columns: 1fr; }
            .storage-empty { grid-column: auto; }
            .storage-limit-row { flex-wrap: wrap; }
            .storage-limit-row input { min-width: 140px; }
        }
    </style>
</head>
<body>

<div class="md-page-loading" id="loading-overlay">
    <div class="md-loader-expressive"></div>
    <div class="label">Загрузка...</div>
</div>

<div class="md-app-shell">
    <div id="md-nav-root" data-active="users"></div>

    <main class="md-main">
        <header class="md-app-bar">
            <h1>Юзеры</h1>
            <div style="display:flex;gap:8px;align-items:center;">
                <div class="md-search" style="width:320px;">
                    <span class="msr">search</span>
                    <input id="searchInput" type="text" placeholder="Поиск по username или ID...">
                </div>
                <button class="md-btn md-btn-tonal md-btn-square-press" onclick="openReservedNamesModal()">
                    <span class="msr size-18">shield</span>
                    Зарезервированные
                </button>
                <button id="logoutBtn" class="md-icon-btn" title="Выйти">
                    <span class="msr">logout</span>
                </button>
            </div>
        </header>

        <div class="md-page">
            <div class="users-list" id="usersList"></div>
            <div id="emptyState" class="md-empty" style="display:none;">
                <span class="msr size-48">group_off</span>
                <h3>Пользователи не найдены</h3>
                <p>Попробуйте изменить параметры поиска.</p>
            </div>
            <div id="loadingMore" style="text-align:center;padding:24px;display:none;color:var(--md-on-surface-variant);">
                <div class="md-loader-expressive" style="display:inline-block;width:18px;height:18px;"></div>
                <span style="margin-left:8px;">Загрузка...</span>
            </div>
            <div id="sentinel" style="height:1px;"></div>
        </div>
    </main>
</div>

<!-- User modal -->
<div id="userScrim" class="md-scrim" onclick="if(event.target===this)closeUserModal()">
    <div class="md-dialog user-dialog">
        <div class="md-dialog-header" style="border-bottom:1px solid var(--md-outline-variant);background:var(--md-surface-container-high);">
            <h3 id="modalUserTitle">Пользователь</h3>
            <button class="md-icon-btn" onclick="closeUserModal()"><span class="msr">close</span></button>
        </div>
        <div class="md-dialog-body" id="modalContent" style="padding:0;"></div>
    </div>
</div>

<!-- Add badge modal -->
<div id="badgeAddScrim" class="md-scrim" onclick="if(event.target===this)closeBadgeAddModal()">
    <div class="md-dialog badge-add-dialog">
        <div class="md-dialog-header">
            <h3>Добавить бейдж</h3>
            <button class="md-icon-btn" onclick="closeBadgeAddModal()"><span class="msr">close</span></button>
        </div>
        <div class="md-dialog-body">
            <label class="field-label" for="badgeAddSelect">Бейдж</label>
            <select id="badgeAddSelect" class="md-input-outlined" style="width:100%;">
                <option value="">Загрузка...</option>
            </select>
        </div>
        <div class="md-dialog-actions">
            <button class="md-btn md-btn-text" onclick="closeBadgeAddModal()">Отмена</button>
            <button id="addBadgeSubmit" class="md-btn md-btn-filled md-btn-square-press" onclick="addUserBadge()">Добавить</button>
        </div>
    </div>
</div>

<!-- Device modal -->
<div id="deviceScrim" class="md-scrim" onclick="if(event.target===this)closeDeviceModal()">
    <div class="md-dialog">
        <div class="md-dialog-header">
            <h3>Устройство</h3>
            <button class="md-icon-btn" onclick="closeDeviceModal()"><span class="msr">close</span></button>
        </div>
        <div class="md-dialog-body" id="deviceModalContent"></div>
    </div>
</div>

<!-- Reserved names modal -->
<div id="reservedScrim" class="md-scrim" onclick="if(event.target===this)closeReservedNamesModal()">
    <div class="md-dialog">
        <div class="md-dialog-header">
            <h3>Зарезервированные юзернеймы</h3>
            <button class="md-icon-btn" onclick="closeReservedNamesModal()"><span class="msr">close</span></button>
        </div>
        <div class="md-dialog-body" id="reservedNamesList" style="max-height:400px;overflow-y:auto;"></div>
        <div class="md-dialog-actions" style="gap:8px;">
            <input id="newReservedName" type="text" placeholder="Новое имя..."
                onkeydown="if(event.key==='Enter')addReservedName()"
                class="md-input-outlined" style="flex:1;">
            <button class="md-btn md-btn-filled md-btn-square-press" onclick="addReservedName()">Добавить</button>
        </div>
    </div>
</div>

<script src="assets/icons.js?v=3"></script>
<script src="assets/api.js?v=4"></script>
<script src="assets/sidebar.js?v=4"></script>
<script src="assets/command-palette.js?v=4"></script>
<script>
    let users = [];
    let totalCount = 0;
    let currentOffset = 0;
    let isLoading = false;
    let currentQuery = '';
    let searchTimeout = null;
    let allBadges = [];
    let currentUserData = null;
    let sessionsExpanded = false;
    let badgeAddUserId = null;
    const PAGE_SIZE = 50;

    function checkAuth() { return BF.requireAuth(); }

    function getInitials(f, l) { return ((f?.[0] || '') + (l?.[0] || '')).toUpperCase() || '?'; }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
    function formatDate(s) { if (!s) return '—'; const d = new Date(s); return d.toLocaleDateString('ru-RU'); }

    async function loadUsers(reset = false) {
        if (isLoading) return;
        if (!reset && currentOffset >= totalCount && totalCount > 0) return;

        isLoading = true;
        if (reset) { currentOffset = 0; users = []; }
        document.getElementById('loadingMore').style.display = '';

        try {
            const params = new URLSearchParams({ query: currentQuery, offset: currentOffset, size: PAGE_SIZE });
            const res = await BF.api(`/api/users?${params}`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            totalCount = data.totalCount;
            users = reset ? data.users : users.concat(data.users);
            currentOffset += data.users.length;
            renderUsers();
        } catch (e) { /* ignore */ }
        finally { isLoading = false; document.getElementById('loadingMore').style.display = 'none'; }
    }

    function renderUsers() {
        const list = document.getElementById('usersList');
        const empty = document.getElementById('emptyState');
        if (users.length === 0) { list.innerHTML = ''; empty.style.display = ''; return; }
        empty.style.display = 'none';

        list.innerHTML = users.map(u => `
            <div class="user-row" onclick="openUserModal(${u.id})">
                <div class="avatar">
                    ${(u.profilePicturePreview || u.profilePicture)
                        ? `<img src="${u.profilePicturePreview || u.profilePicture}">`
                        : getInitials(u.firstName, u.lastName)}
                </div>
                <div class="info">
                    <div class="name">${escapeHtml(u.firstName)} ${escapeHtml(u.lastName)}</div>
                    <div class="uname">@${escapeHtml(u.username)}</div>
                </div>
                <div class="uid">ID: ${u.id}</div>
            </div>
        `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', e => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => { currentQuery = e.target.value.trim(); loadUsers(true); }, 300);
    });

    const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting && !isLoading) loadUsers();
    }, { threshold: 0.1 });

    // ---- USER MODAL ----
    window.openUserModal = async function (userId) {
        sessionsExpanded = false;
        closeBadgeAddModal();
        document.getElementById('userScrim').classList.add('open');
        document.getElementById('modalContent').innerHTML = '<div style="padding:48px;text-align:center;"><div class="md-loader-expressive" style="display:inline-block;"></div></div>';
        try {
            const res = await BF.api(`/api/users/${userId}`);
            if (!res.ok) throw new Error();
            currentUserData = await res.json();
            renderUserModal(currentUserData);
        } catch (e) {
            document.getElementById('modalContent').innerHTML = `<div style="padding:48px;text-align:center;color:var(--md-error);">Ошибка загрузки</div>`;
        }
    };
    window.closeUserModal = function () {
        document.getElementById('userScrim').classList.remove('open');
        currentUserData = null;
    };

    function renderUserModal(data) {
        const p = data.profile;
        const canChangePassword = !window.BF || BF.can('users.password.set');
        const unavailableLabels = {
            contacts: 'контакты',
            devices: 'устройства',
            storage: 'хранилище',
            twoFactor: '2FA',
            sessions: 'сессии',
            poster: 'постер профиля'
        };
        const unavailable = Object.entries(data.availability || {})
            .filter(([, available]) => available === false)
            .map(([section]) => unavailableLabels[section] || section);
        const availabilityWarning = unavailable.length
            ? `<div class="user-data-warning" role="status">
                    <span class="msr size-20">warning</span>
                    <span>Часть данных временно недоступна: ${unavailable.map(escapeHtml).join(', ')}. Остальные сведения актуальны.</span>
               </div>`
            : '';
        document.getElementById('modalUserTitle').textContent = `${p.firstName || ''} ${p.lastName || ''}`.trim() || 'Пользователь';

        let html = `
        <section style="position:relative;">
            <div class="user-modal-cover" onclick="document.getElementById('posterFileInput').click()">
                ${p.profilePosterUrl
                    ? `<img src="${escapeHtml(p.profilePosterUrl)}" alt="Постер профиля">`
                    : `<span class="msr size-48" style="opacity:.55;">image</span>`}
                <div class="overlay"><span class="msr">image</span> Изменить постер</div>
            </div>
            <div class="user-modal-avatar-wrap" onclick="document.getElementById('avatarFileInput').click()">
                ${p.profilePicture
                    ? `<img src="${escapeHtml(p.profilePicture)}" alt="Аватар профиля">`
                    : `<span>${getInitials(p.firstName, p.lastName)}</span>`}
                <div class="user-modal-avatar-overlay"><span class="msr">photo_camera</span></div>
            </div>
            <input type="file" id="posterFileInput" accept="image/*" style="display:none;" onchange="handlePosterUpload(this, ${p.id})">
            <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handleAvatarUpload(this, ${p.id})">
        </section>

        <section class="user-modal-profile">
            ${availabilityWarning}
            <div class="user-modal-identity">
                <div class="user-modal-name">${escapeHtml(`${p.firstName || ''} ${p.lastName || ''}`.trim() || 'Пользователь')}</div>
                <div class="user-modal-username">@${escapeHtml(p.username || '')}</div>
            </div>
            <h4>Бейджи</h4>
            <div class="badge-tiles">
                ${renderBadgeTiles(p)}
            </div>
            <div class="user-modal-meta">
                <span>ID: <strong>${p.id}</strong></span>
                <span>•</span>
                <span>Email: ${escapeHtml(data.contacts?.email || '—')}</span>
                <span>•</span>
                <span>Регистрация: ${p.registrationDate ? formatDate(p.registrationDate) : '—'}</span>
            </div>
            <div class="field-grid">
                <div><label class="field-label">Имя</label>
                    <input id="editFirstName" type="text" value="${escapeHtml(p.firstName)}" class="md-input-outlined" style="width:100%;"></div>

    function renderStorageSection(storage, profile) {
        const totalUsed = Math.max(Number(storage.totalUsedStorage) || 0, 0);
        const limit = Math.max(Number(storage.storageLimit) || 0, 0);
        const usedPercent = limit > 0 ? Math.min((totalUsed / limit) * 100, 100) : (totalUsed > 0 ? 100 : 0);
        const overflow = totalUsed > limit;
        const usedMb = (totalUsed / 1048576).toFixed(1);
        const limitGb = (limit / 1073741824).toFixed(1);
        const types = (storage.storageByTypes || [])
            .map(type => ({
                ...type,
                usedStorage: Math.max(Number(type.usedStorage) || 0, 0),
                name: storageTypeNames[type.fileType] || type.fileTypeName || 'Другое'
            }))
            .filter(type => type.usedStorage > 0)
            .sort((left, right) => right.usedStorage - left.usedStorage);
        const typesTotal = types.reduce((sum, type) => sum + type.usedStorage, 0);
        const chartTotal = typesTotal || totalUsed;
        const segments = [];
        let cursor = 0;

        if (chartTotal > 0 && usedPercent > 0) {
            types.forEach((type, index) => {
                const next = Math.min(usedPercent, cursor + usedPercent * (type.usedStorage / chartTotal));
                if (next > cursor) {
                    segments.push(`${storageChartColors[index % storageChartColors.length]} ${cursor.toFixed(2)}% ${next.toFixed(2)}%`);
                }
                cursor = next;
            });
            if (cursor < usedPercent) {
                segments.push(`${storageChartColors[0]} ${cursor.toFixed(2)}% ${usedPercent.toFixed(2)}%`);
            }
        }
        if (usedPercent < 100) {
            segments.push(`var(--md-surface-container-highest) ${usedPercent.toFixed(2)}% 100%`);
        }
        if (segments.length === 0) segments.push('var(--md-surface-container-highest) 0 100%');

        const chartStyle = `background:conic-gradient(${segments.join(', ')});`;
        const ariaLabel = `Занято ${usedMb} МБ из ${limitGb} ГБ, ${usedPercent.toFixed(1)} процентов`;
        const legend = types.length
            ? types.map((type, index) => `
                <div class="storage-legend-item" title="${escapeHtml(type.name)}">
                    <span class="storage-legend-dot" style="background:${storageChartColors[index % storageChartColors.length]};"></span>
                    <span class="storage-legend-name">${escapeHtml(type.name)}</span>
                    <span class="storage-legend-value">${formatBytes(type.usedStorage)}</span>
                </div>`).join('')
            : '<div class="storage-empty">Нет загруженных файлов</div>';

        return `
            <section class="user-modal-section user-modal-section-last">
                <h4>Хранилище</h4>
                <div class="storage-card">
                    <div class="storage-ring${overflow ? ' is-overflow' : ''}" style="${chartStyle}" role="img" aria-label="${escapeHtml(ariaLabel)}">
                        <div class="storage-ring-content">
                            <strong>${usedPercent.toFixed(1)}%</strong>
                            <span class="${overflow ? 'storage-overflow' : ''}">${overflow ? 'Превышен лимит' : `${usedMb} МБ из ${limitGb} ГБ`}</span>
                        </div>
                    </div>
                    <div class="storage-legend">${legend}</div>
                </div>
                <div class="storage-limit-row">
                    <label style="font-size:13px;color:var(--md-on-surface-variant);" for="storageLimitSlider">Лимит:</label>
                    <input type="range" id="storageLimitSlider" min="1" max="250" step="1" value="${profile.storageLimitGb || 1}"
                        oninput="document.getElementById('storageLimitValue').textContent=this.value" style="flex:1;accent-color:var(--md-primary);">
                    <span id="storageLimitValue" style="font-weight:500;min-width:24px;text-align:right;">${profile.storageLimitGb || 1}</span>
                    <span style="font-size:13px;color:var(--md-on-surface-variant);">ГБ</span>
                    <button class="md-btn md-btn-tonal md-btn-square-press" onclick="updateStorageLimit(${profile.id})">Применить</button>
                </div>
            </section>`;
    }

    function formatBytes(b) {
        if (!b) return '0 Б';
        if (b < 1024) return b + ' Б';
        if (b < 1048576) return (b/1024).toFixed(1) + ' КБ';
        if (b < 1073741824) return (b/1048576).toFixed(1) + ' МБ';
        return (b/1073741824).toFixed(2) + ' ГБ';
    }

    async function loadAllBadgesForSelect() {
        const select = document.getElementById('badgeAddSelect');
        const submit = document.getElementById('addBadgeSubmit');
        if (!select) return;
        try {
            if (allBadges.length === 0) {
                const r = await BF.api('/api/badges');
                if (r.ok) allBadges = await r.json();
            }
            const existing = new Set((currentUserData?.profile?.badges || []).map(ub => ub.badge.id));
            const available = allBadges.filter(b => b.isActive && !existing.has(b.id));
            select.innerHTML = available.length
                ? '<option value="">Выберите бейдж...</option>' + available.map(b => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('')
                : '<option value="">Нет доступных бейджей</option>';
            submit.disabled = available.length === 0;
        } catch {
            select.innerHTML = '<option value="">Ошибка загрузки</option>';
            submit.disabled = true;
        }
    }

        await BF.logout();
    });

    (async function () {
        const auth = await checkAuth();
        if (!auth) return;
        if (window.mdNavSetUser) window.mdNavSetUser(auth.name || 'Admin', auth.createdAt ? formatDate(auth.createdAt) : '');
        const linkedUserIdParam = new URLSearchParams(window.location.search).get('userId');
        const linkedUserId = /^\d+$/.test(linkedUserIdParam || '') ? linkedUserIdParam : null;
        if (linkedUserId) {
            currentQuery = linkedUserId;
            document.getElementById('searchInput').value = linkedUserId;
        }
        await loadUsers(true);
        if (linkedUserId) await openUserModal(linkedUserId);
        observer.observe(document.getElementById('sentinel'));
        BF.pageReady();
    })();
</script>
</body>
</html>
