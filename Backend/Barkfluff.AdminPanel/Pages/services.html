<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff Admin Panel | Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #dfe6e9;
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 font-sans antialiased">

    <div id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="flex h-screen overflow-hidden">

        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl">
            <div class="h-16 flex items-center justify-center border-b border-slate-700">
                <h1 class="text-xl font-bold tracking-wider flex items-center gap-2">
                    <i data-lucide="message-circle" class="text-blue-400"></i>
                    BF::ADMIN
                </h1>
            </div>

            <nav class="flex-1 px-3 py-6 space-y-2 overflow-y-auto">
                <a href="/" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    Дашборд
                </a>
                <a href="/services" class="flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white transition-colors">
                    <i data-lucide="server" class="w-5 h-5"></i>
                    Сервисы
                </a>
                <a href="/logs" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="terminal-square" class="w-5 h-5"></i>
                    Логи
                </a>
            </nav>

            <div class="p-4 border-t border-slate-700">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center font-bold">A</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium truncate" id="tokenName">Loading...</p>
                        <p class="text-xs text-slate-400" id="tokenInfo">...</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 flex flex-col overflow-hidden">

            <!-- HEADER -->
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10">
                <h2 class="text-xl font-semibold text-slate-700">Сервисы</h2>
                <div class="flex items-center gap-4">
                    <span id="autoRefreshBadge" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-medium flex items-center gap-1">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                        Авто-обновление: 30с
                    </span>
                    <button id="logoutBtn" class="p-2 text-slate-400 hover:text-red-500" title="Выйти">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>

            <!-- SCROLLABLE CONTENT -->
            <div class="flex-1 overflow-y-auto p-8">

                <!-- SERVICES TABLE -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="font-bold text-lg text-slate-700">Состояние сервисов</h3>
                        <button id="refreshBtn" class="text-sm text-blue-600 hover:underline flex items-center gap-1">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                            Обновить
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-xs text-slate-400 border-b border-slate-100">
                                    <th class="py-3 font-semibold uppercase">Сервис</th>
                                    <th class="py-3 font-semibold uppercase">Статус</th>
                                    <th class="py-3 font-semibold uppercase">Последний лог</th>
                                    <th class="py-3 font-semibold uppercase">Ошибки</th>
                                    <th class="py-3 font-semibold uppercase">gRPC запросы</th>
                                </tr>
                            </thead>
                            <tbody id="servicesTableBody" class="text-sm">
                                <tr>
                                    <td colspan="5" class="py-8 text-center text-slate-400">
                                        <div class="flex flex-col items-center gap-2">
                                            <i data-lucide="loader" class="w-6 h-6 animate-spin"></i>
                                            Загрузка сервисов...
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        let servicesData = [];
        let refreshInterval = null;

        // Проверка авторизации
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/me');
                if (!response.ok) {
                    window.location.href = '/';
                    return;
                }
                const data = await response.json();
                document.getElementById('tokenName').textContent = data.name || 'Unknown Session';
                document.getElementById('tokenInfo').textContent = `Создан: ${formatDate(data.createdAt)}`;
                document.getElementById('loadingOverlay').style.display = 'none';
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/';
            }
        }

        // Форматирование даты
        function formatDate(isoDate) {
            if (!isoDate) return '—';
            const date = new Date(isoDate);
            return date.toLocaleDateString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Загрузка списка сервисов и их событий
        async function loadServices() {
            try {
                const servicesResponse = await fetch('/api/seq/services');
                if (!servicesResponse.ok) {
                    throw new Error(`Failed to fetch services: ${servicesResponse.status}`);
                }
                const serviceNames = await servicesResponse.json();

                // Загружаем события для каждого сервиса параллельно
                const servicePromises = serviceNames.map(async (name) => {
                    try {
                        const eventsResponse = await fetch(`/api/seq/events?application=${encodeURIComponent(name)}&count=5`);
                        const events = eventsResponse.ok ? await eventsResponse.json() : [];
                        return { name, events };
                    } catch (err) {
                        console.error(`Failed to fetch events for ${name}:`, err);
                        return { name, events: [] };
                    }
                });

                servicesData = await Promise.all(servicePromises);
                renderServicesTable();

            } catch (error) {
                console.error('Failed to load services:', error);
                document.getElementById('servicesTableBody').innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-red-400">
                            <div class="flex flex-col items-center gap-2">
                                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                                Ошибка загрузки сервисов
                            </div>
                        </td>
                    </tr>
                `;
                lucide.createIcons();
            }
        }

        // Отрисовка таблицы сервисов
        function renderServicesTable() {
            const tbody = document.getElementById('servicesTableBody');

            if (servicesData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-slate-400">
                            <div class="flex flex-col items-center gap-2">
                                <i data-lucide="server-off" class="w-6 h-6"></i>
                                Сервисы не найдены
                            </div>
                        </td>
                    </tr>
                `;
                lucide.createIcons();
                return;
            }

            const rows = servicesData.map(service => {
                const events = service.events || [];
                const now = new Date();

                // Определяем последний лог
                let lastLogTimestamp = null;
                if (events.length > 0 && events[0].Timestamp) {
                    lastLogTimestamp = new Date(events[0].Timestamp);
                }

                // Статус: активен, если последний лог менее 5 минут назад
                const fiveMinutesAgo = new Date(now.getTime() - 5 * 60 * 1000);
                const isActive = lastLogTimestamp && lastLogTimestamp > fiveMinutesAgo;

                // Считаем ошибки (уровни Error, Fatal)
                const errorCount = events.filter(e =>
                    e.Level === 'Error' || e.Level === 'Fatal'
                ).length;

                // Приблизительное количество gRPC запросов (события уровня Information/Debug)
                const requestCount = events.filter(e =>
                    e.Level === 'Information' || e.Level === 'Debug'
                ).length;

                const statusBadge = isActive
                    ? `<span class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded-md font-medium inline-flex items-center gap-1">
                           <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                           Активен
                       </span>`
                    : `<span class="px-2 py-1 bg-red-100 text-red-700 text-xs rounded-md font-medium inline-flex items-center gap-1">
                           <span class="w-2 h-2 bg-red-500 rounded-full"></span>
                           Неактивен
                       </span>`;

                const errorBadge = errorCount > 0
                    ? `<span class="px-2 py-1 bg-red-50 text-red-600 text-xs rounded-md font-medium">${errorCount}</span>`
                    : `<span class="px-2 py-1 bg-green-50 text-green-600 text-xs rounded-md font-medium">0</span>`;

                return `
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition">
                        <td class="py-4 font-medium text-slate-700">
                            <div class="flex items-center gap-2">
                                <i data-lucide="server" class="w-4 h-4 text-blue-400"></i>
                                ${escapeHtml(service.name)}
                            </div>
                        </td>
                        <td class="py-4">${statusBadge}</td>
                        <td class="py-4 text-slate-500 text-xs font-mono">
                            ${lastLogTimestamp ? formatDate(lastLogTimestamp.toISOString()) : '<span class="text-slate-300">Нет данных</span>'}
                        </td>
                        <td class="py-4">${errorBadge}</td>
                        <td class="py-4">
                            <span class="px-2 py-1 bg-blue-50 text-blue-600 text-xs rounded-md font-medium">${requestCount}</span>
                        </td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = rows;
            lucide.createIcons();
        }

        // Экранирование HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Выход из системы
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (!confirm('Вы уверены, что хотите выйти?')) return;
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (error) {
                console.error('Logout error:', error);
            }
            document.cookie = 'auth_token=; path=/; max-age=0';
            window.location.href = '/';
        });

        // Кнопка ручного обновления
        document.getElementById('refreshBtn').addEventListener('click', () => {
            loadServices();
        });

        // Инициализация
        checkAuth();
        loadServices();

        // Авто-обновление каждые 30 секунд
        refreshInterval = setInterval(() => {
            loadServices();
        }, 30000);
    </script>
</body>
</html>
