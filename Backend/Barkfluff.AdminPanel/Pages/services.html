<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff Admin Panel | Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #dfe6e9;
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slide-in {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .animate-slide-in {
            animation: slide-in 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 font-sans antialiased">

    <div id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="flex h-screen overflow-hidden">

        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl flex-shrink-0">
            <div class="h-16 flex items-center justify-center border-b border-slate-700">
                <h1 class="text-xl font-bold tracking-wider flex items-center gap-2">
                    <i data-lucide="message-circle" class="text-blue-400"></i>
                    BF::ADMIN
                </h1>
            </div>

            <nav class="flex-1 px-3 py-6 space-y-2 overflow-y-auto">
                <a href="/" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    Дашборд
                </a>
                <a href="/services" class="flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white transition-colors">
                    <i data-lucide="server" class="w-5 h-5"></i>
                    Сервисы
                </a>
                <a href="/logs" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="terminal-square" class="w-5 h-5"></i>
                    Логи
                </a>
                <a href="/badges" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="award" class="w-5 h-5"></i>
                    Бейджи
                </a>
                <a href="/users" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    Юзеры
                </a>
            </nav>

            <div class="p-4 border-t border-slate-700">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center font-bold">A</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium truncate" id="tokenName">Loading...</p>
                        <p class="text-xs text-slate-400" id="tokenInfo">...</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 flex flex-col overflow-hidden min-w-0">

            <!-- HEADER -->
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10">
                <h2 class="text-xl font-semibold text-slate-700">Сервисы</h2>
                <div class="flex items-center gap-3">
                    <button onclick="restartAdminPanel()" 
                        class="flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                        Перезапустить
                    </button>
                    <button onclick="updateAdminPanel()" 
                        class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                        <i data-lucide="download-cloud" class="w-4 h-4"></i>
                        Обновить
                    </button>
                    <span id="autoRefreshBadge" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-medium flex items-center gap-1">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                        Авто-обновление: 30с
                    </span>
                    <button id="logoutBtn" class="p-2 text-slate-400 hover:text-red-500" title="Выйти">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>

            <!-- SCROLLABLE CONTENT -->
            <div class="flex-1 overflow-y-auto p-8">

                <!-- SERVICES TABLE -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-3">
                            <h3 class="font-bold text-lg text-slate-700">Состояние сервисов</h3>
                            <button onclick="restartAllServices()"
                                class="flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">
                                <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                                Перезапустить все
                            </button>
                            <button onclick="updateAllServices()"
                                class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">
                                <i data-lucide="download-cloud" class="w-3.5 h-3.5"></i>
                                Обновить все
                            </button>
                        </div>
                        <button id="refreshBtn" class="text-sm text-blue-600 hover:underline flex items-center gap-1">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                            Обновить
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-xs text-slate-400 border-b border-slate-100">
                                    <th class="py-3 font-semibold uppercase">Сервис</th>
                                    <th class="py-3 font-semibold uppercase">Статус</th>
                                    <th class="py-3 font-semibold uppercase">Последний лог</th>
                                    <th class="py-3 font-semibold uppercase">Ошибки</th>
                                    <th class="py-3 font-semibold uppercase">Событий</th>
                                    <th class="py-3 font-semibold uppercase text-center">Действия</th>
                                </tr>
                            </thead>
                            <tbody id="servicesTableBody" class="text-sm">
                                <tr>
                                    <td colspan="6" class="py-8 text-center text-slate-400">
                                        <div class="flex flex-col items-center gap-2">
                                            <i data-lucide="loader" class="w-6 h-6 animate-spin"></i>
                                            Загрузка сервисов...
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        let servicesData = [];
        let refreshInterval = null;

        // Проверка авторизации
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/me');
                if (!response.ok) {
                    window.location.href = '/';
                    return;
                }
                const data = await response.json();
                document.getElementById('tokenName').textContent = data.name || 'Unknown Session';
                document.getElementById('tokenInfo').textContent = `Создан: ${formatDate(data.createdAt)}`;
                document.getElementById('loadingOverlay').style.display = 'none';
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/';
            }
        }

        // Форматирование даты
        function formatDate(isoDate) {
            if (!isoDate) return '—';
            const date = new Date(isoDate);
            return date.toLocaleDateString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Форматирование относительного времени
        function formatRelativeTime(isoDate) {
            if (!isoDate) return 'Нет данных';
            const date = new Date(isoDate);
            const now = new Date();
            const diff = Math.floor((now - date) / 1000); // seconds

            if (diff < 60) return 'только что';
            if (diff < 3600) return `${Math.floor(diff / 60)} мин назад`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} ч назад`;
            return formatDate(isoDate);
        }

        // Загрузка статуса сервисов одним запросом
        async function loadServices() {
            const tbody = document.getElementById('servicesTableBody');

            try {
                const response = await fetch('/api/seq/services/status');
                if (!response.ok) {
                    throw new Error(`Failed to fetch services status: ${response.status}`);
                }

                servicesData = await response.json();
                renderServicesTable();

            } catch (error) {
                console.error('Failed to load services:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-red-400">
                            <div class="flex flex-col items-center gap-2">
                                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                                Ошибка загрузки сервисов
                            </div>
                        </td>
                    </tr>
                `;
                lucide.createIcons();
            }
        }

        // Отрисовка таблицы сервисов
        function renderServicesTable() {
            const tbody = document.getElementById('servicesTableBody');

            if (servicesData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-slate-400">
                            <div class="flex flex-col items-center gap-2">
                                <i data-lucide="server-off" class="w-6 h-6"></i>
                                Сервисы не найдены
                            </div>
                        </td>
                    </tr>
                `;
                lucide.createIcons();
                return;
            }

            const rows = servicesData.map(svc => {
                const dockerStateMap = {
                    'running':    { cls: 'bg-green-100 text-green-700',  dot: 'bg-green-500',  label: 'Запущен' },
                    'restarting': { cls: 'bg-blue-100 text-blue-700',    dot: 'bg-blue-500',   label: 'Перезапуск' },
                    'paused':     { cls: 'bg-yellow-100 text-yellow-700',dot: 'bg-yellow-500', label: 'Приостановлен' },
                    'exited':     { cls: 'bg-red-100 text-red-700',      dot: 'bg-red-500',    label: 'Остановлен' },
                    'dead':       { cls: 'bg-red-100 text-red-700',      dot: 'bg-red-500',    label: 'Остановлен' },
                };
                const stateInfo = svc.dockerState
                    ? (dockerStateMap[svc.dockerState] || { cls: 'bg-slate-100 text-slate-600', dot: 'bg-slate-400', label: svc.dockerState })
                    : { cls: 'bg-slate-100 text-slate-500', dot: 'bg-slate-300', label: 'Нет данных' };

                const statusBadge = `<span class="px-2 py-1 ${stateInfo.cls} text-xs rounded-md font-medium inline-flex items-center gap-1">
                           <span class="w-2 h-2 ${stateInfo.dot} rounded-full"></span>
                           ${stateInfo.label}
                       </span>`;

                const errorBadge = (svc.errorCount || 0) > 0
                    ? `<span class="px-2 py-1 bg-red-50 text-red-600 text-xs rounded-md font-medium">${svc.errorCount}</span>`
                    : `<span class="px-2 py-1 bg-green-50 text-green-600 text-xs rounded-md font-medium">0</span>`;

                const eventCount = svc.eventCount || 0;

                // Определяем иконку и статус для кнопки старт/стоп по реальному состоянию Docker
                const isRunning = svc.dockerState === 'running';
                const startStopIcon = isRunning ? 'square' : 'play';
                const startStopTitle = isRunning ? 'Остановить' : 'Запустить';
                const startStopClass = isRunning ? 'text-amber-600 hover:bg-amber-50' : 'text-green-600 hover:bg-green-50';

                // Получаем имя контейнера из имени сервиса
                const containerName = getContainerNameFromServiceName(svc.name);

                return `
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition">
                        <td class="py-4 font-medium text-slate-700">
                            <div class="flex items-center gap-2">
                                <i data-lucide="server" class="w-4 h-4 text-blue-400"></i>
                                ${escapeHtml(svc.name)}
                            </div>
                        </td>
                        <td class="py-4">${statusBadge}</td>
                        <td class="py-4 text-slate-500 text-xs font-mono" title="${svc.lastSeen || ''}">
                            ${svc.lastSeen ? formatRelativeTime(svc.lastSeen) : '<span class="text-slate-300">Нет данных</span>'}
                        </td>
                        <td class="py-4">${errorBadge}</td>
                        <td class="py-4">
                            <span class="px-2 py-1 bg-blue-50 text-blue-600 text-xs rounded-md font-medium">${eventCount}</span>
                        </td>
                        <td class="py-4">
                            <div class="flex items-center justify-center gap-1">
                                <button class="p-2 rounded-lg transition-colors ${startStopClass}" 
                                        title="${startStopTitle}"
                                        onclick="handleContainerAction(event, '${containerName}', '${isRunning ? 'stop' : 'start'}')">
                                    <i data-lucide="${startStopIcon}" class="w-4 h-4"></i>
                                </button>
                                <button class="p-2 rounded-lg transition-colors text-blue-600 hover:bg-blue-50" 
                                        title="Перезапустить"
                                        onclick="handleContainerAction(event, '${containerName}', 'restart')">
                                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                                </button>
                                <button class="p-2 rounded-lg transition-colors text-purple-600 hover:bg-purple-50" 
                                        title="Обновить образ и пересоздать"
                                        onclick="handleContainerAction(event, '${containerName}', 'pull')">
                                    <i data-lucide="download-cloud" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = rows;
            lucide.createIcons();
        }

        // Экранирование HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Получение имени контейнера из имени сервиса
        function getContainerNameFromServiceName(serviceName) {
            // Маппинг имен сервисов на имена контейнеров
            const serviceToContainerMap = {
                'BarkFluff.Beacon': 'beacon',
                'BarkFluff.Configuration': 'configuration',
                'BarkFluff.Files': 'files',
                'BarkFluff.Identity': 'identity',
                'BarkFluff.Messages': 'messages',
                'BarkFluff.Notification': 'notification',
                'BarkFluff.Users': 'users',
                'BarkFluff.FastAuth': 'fast-auth',
                'BarkFluff.Updates': 'updates',
                'BarkFluff.Onliner': 'onliner',
                'Seq': 'seq',
                'Minio': 'minio',
                'RabbitMQ': 'rabbitmq',
                'Redis': 'redis',
                'PostgreSQL': 'postgres_barkfluff'
            };

            // Ищем точное совпадение
            if (serviceToContainerMap[serviceName]) {
                return serviceToContainerMap[serviceName];
            }

            // Ищем частичное совпадение
            for (const [service, container] of Object.entries(serviceToContainerMap)) {
                if (serviceName.includes(service) || serviceName.includes(container)) {
                    return container;
                }
            }

            // Если не нашли, возвращаем имя сервиса в нижнем регистре
            return serviceName.toLowerCase().replace('barkfluff.', '');
        }

        // Обработка действий с контейнером
        async function handleContainerAction(event, containerName, action) {
            event.stopPropagation();

            const actionNames = {
                'start': 'запуска',
                'stop': 'остановки',
                'restart': 'перезапуска',
                'pull': 'обновления образа и пересоздания'
            };

            if (!confirm(`Вы уверены, что хотите выполнить действие "${actionNames[action]}" для контейнера "${containerName}"?`)) {
                return;
            }

            // Блокируем кнопку на время выполнения
            const button = event.currentTarget;
            const originalContent = button.innerHTML;
            button.disabled = true;
            button.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i>';
            lucide.createIcons();

            try {
                const response = await fetch(`/api/docker/containers/${containerName}/${action}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    // Показываем уведомление об успехе
                    showNotification('success', result.message);
                    // Обновляем список сервисов через 2 секунды (чтобы контейнер успел изменить статус)
                    setTimeout(() => loadServices(), 2000);
                } else {
                    showNotification('error', result.message || 'Ошибка выполнения действия');
                }
            } catch (error) {
                console.error('Action error:', error);
                showNotification('error', 'Ошибка выполнения действия: ' + error.message);
            } finally {
                // Возвращаем кнопку в исходное состояние
                button.disabled = false;
                button.innerHTML = originalContent;
                lucide.createIcons();
            }
        }

        // Показ уведомления
        function showNotification(type, message) {
            const colors = {
                'success': 'bg-green-100 text-green-800 border-green-300',
                'error': 'bg-red-100 text-red-800 border-red-300'
            };

            const icons = {
                'success': 'check-circle',
                'error': 'alert-circle'
            };

            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 px-4 py-3 rounded-lg border shadow-lg z-50 ${colors[type]} flex items-center gap-2 animate-slide-in`;
            notification.innerHTML = `
                <i data-lucide="${icons[type]}" class="w-5 h-5"></i>
                <span>${escapeHtml(message)}</span>
            `;

            document.body.appendChild(notification);
            lucide.createIcons();

            // Удаляем уведомление через 5 секунд
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 5000);
        }

        // Перезапуск админ-панели
        async function restartAdminPanel() {
            if (!confirm('Вы уверены, что хотите перезапустить админ-панель?\n\nВы будете перенаправлены на страницу ожидания, пока панель перезапускается.')) {
                return;
            }

            try {
                const response = await fetch('/api/docker/containers/admin-panel/restart-own', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    // Открываем страницу-заглушку в том же окне
                    window.location.href = '/restarting';
                } else {
                    showNotification('error', result.message || 'Ошибка перезапуска админ-панели');
                }
            } catch (error) {
                console.error('Restart error:', error);
                showNotification('error', 'Ошибка перезапуска: ' + error.message);
            }
        }

        // Обновление админ-панели
        async function updateAdminPanel() {
            if (!confirm('Вы уверены, что хотите обновить админ-панель?\n\nБудет загружен новый образ и контейнер пересоздан.\n\nВы будете перенаправлены на страницу ожидания.')) {
                return;
            }

            try {
                const response = await fetch('/api/docker/containers/admin-panel/update-own', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    // Открываем страницу-заглушку в том же окне
                    window.location.href = '/updating';
                } else {
                    showNotification('error', result.message || 'Ошибка обновления админ-панели');
                }
            } catch (error) {
                console.error('Update error:', error);
                showNotification('error', 'Ошибка обновления: ' + error.message);
            }
        }

        // Выход из системы
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (!confirm('Вы уверены, что хотите выйти?')) return;
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (error) {
                console.error('Logout error:', error);
            }
            document.cookie = 'auth_token=; path=/; max-age=0';
            window.location.href = '/';
        });

        // Кнопка ручного обновления
        document.getElementById('refreshBtn').addEventListener('click', () => {
            loadServices();
        });

        // Перезапуск всех сервисов BarkFluff
        async function restartAllServices() {
            if (!confirm('Вы уверены, что хотите перезапустить ВСЕ сервисы BarkFluff?\n\n' +
                'Сервисы будут перезапущены последовательно, начиная с Configuration.\n' +
                'Это может занять несколько минут.')) {
                return;
            }

            showNotification('success', 'Начинаем последовательный перезапуск всех сервисов...');

            try {
                const response = await fetch('/api/docker/containers/restart-all', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('success', result.message);
                    // Обновляем список сервисов через 5 секунд
                    setTimeout(() => loadServices(), 5000);
                } else {
                    showNotification('error', result.message || 'Ошибка перезапуска сервисов');
                }
            } catch (error) {
                console.error('Restart all error:', error);
                showNotification('error', 'Ошибка перезапуска: ' + error.message);
            }
        }

        // Обновление всех сервисов BarkFluff
        async function updateAllServices() {
            if (!confirm('Вы уверены, что хотите обновить ВСЕ сервисы BarkFluff?\n\n' +
                'Будут загружены новые образы и контейнеры пересозданы.\n' +
                'Сервисы будут обновлены последовательно, начиная с Configuration.\n' +
                'Это может занять длительное время.')) {
                return;
            }

            showNotification('success', 'Начинаем последовательное обновление всех сервисов...');

            try {
                const response = await fetch('/api/docker/containers/update-all', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('success', result.message);
                    // Обновляем список сервисов через 5 секунд
                    setTimeout(() => loadServices(), 5000);
                } else {
                    showNotification('error', result.message || 'Ошибка обновления сервисов');
                }
            } catch (error) {
                console.error('Update all error:', error);
                showNotification('error', 'Ошибка обновления: ' + error.message);
            }
        }

        // Инициализация
        checkAuth();
        loadServices();

        // Авто-обновление каждые 30 секунд
        refreshInterval = setInterval(() => {
            loadServices();
        }, 30000);
    </script>
</body>
</html>
