<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff Admin Panel | Стикеры</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        #loadingOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #dfe6e9;
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .pack-card {
            width: 200px;
        }

        .pack-cover {
            width: 128px;
            height: 128px;
        }

        .sticker-tile {
            width: 100px;
            height: 120px;
        }

        .sticker-img {
            width: 80px;
            height: 80px;
        }

        .dropdown-menu { display: none; }
        .dropdown-menu.open { display: block; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 font-sans antialiased">

    <div id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="flex h-screen overflow-hidden">

        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl flex-shrink-0">
            <div class="h-16 flex items-center justify-center border-b border-slate-700">
                <h1 class="text-xl font-bold tracking-wider flex items-center gap-2">
                    <i data-lucide="message-circle" class="text-blue-400"></i>
                    BF::ADMIN
                </h1>
            </div>

            <nav class="flex-1 px-3 py-6 space-y-2 overflow-y-auto">
                <a href="/" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    Дашборд
                </a>
                <a href="/services" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="server" class="w-5 h-5"></i>
                    Сервисы
                </a>
                <a href="/logs" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="terminal-square" class="w-5 h-5"></i>
                    Логи
                </a>
                <a href="/badges" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="award" class="w-5 h-5"></i>
                    Бейджи
                </a>
                <a href="/stickers" class="flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white transition-colors">
                    <i data-lucide="smile" class="w-5 h-5"></i>
                    Стикеры
                </a>
                <a href="/users" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    Юзеры
                </a>
                <!-- S3 Storage with submenu -->
                <div>
                    <div class="flex items-center">
                        <a href="/s3-storage" class="flex-1 flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                            <i data-lucide="hard-drive" class="w-5 h-5"></i>
                            Хранилище S3
                        </a>
                        <button onclick="toggleS3Menu()" class="p-1.5 text-slate-400 hover:text-white transition-colors">
                            <i data-lucide="chevron-down" id="s3-chevron" class="w-4 h-4" style="transition:transform 0.2s ease"></i>
                        </button>
                    </div>
                    <div id="s3-submenu" class="hidden ml-6 mt-1 space-y-0.5">
                        <div class="text-xs text-slate-500 py-1">Загрузка...</div>
                    </div>
                </div>
            </nav>

            <div class="p-4 border-t border-slate-700">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center font-bold">A</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium truncate" id="tokenName">Loading...</p>
                        <p class="text-xs text-slate-400" id="tokenInfo">...</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 flex flex-col overflow-hidden min-w-0">

            <!-- HEADER -->
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10">
                <h2 class="text-xl font-semibold text-slate-700">Стикеры</h2>
                <div class="flex items-center gap-4">
                    <button onclick="openCreatePackModal()"
                        class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        Добавить пак
                    </button>
                    <button onclick="handleLogout()"
                        class="flex items-center gap-2 text-slate-500 hover:text-red-600 transition-colors text-sm">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        Выйти
                    </button>
                </div>
            </header>

            <!-- PACKS GRID -->
            <div class="flex-1 overflow-y-auto p-8">
                <div id="packsGrid" class="flex flex-wrap gap-5">
                </div>
                <div id="emptyState" class="hidden flex-col items-center justify-center py-24 text-slate-400">
                    <i data-lucide="smile" class="w-16 h-16 mb-4 opacity-30"></i>
                    <p class="text-lg">Стикерпаков пока нет</p>
                    <p class="text-sm mt-1">Нажмите «Добавить пак», чтобы создать первый</p>
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL: Создание стикерпака -->
    <div id="createPackModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 p-6">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-semibold text-slate-800">Новый стикерпак</h3>
                <button onclick="closeCreatePackModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="createPackForm" onsubmit="submitCreatePack(event)">
                <!-- Обложка -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Обложка (любое изображение, будет сконвертировано в WebP 512x512)</label>
                    <div class="flex items-center gap-4">
                        <div class="w-20 h-20 rounded-lg border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden bg-slate-50" id="createCoverPreviewWrapper">
                            <img id="createCoverPreview" src="" alt="" class="hidden w-full h-full object-contain" />
                            <i data-lucide="image" class="w-8 h-8 text-slate-300" id="createCoverIcon"></i>
                        </div>
                        <div class="flex-1">
                            <input type="file" id="createCoverInput" accept="image/*"
                                class="block w-full text-sm text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
                                onchange="previewCreateCover(this)" />
                            <p class="text-xs text-slate-400 mt-1">PNG, JPG, WebP — будет конвертировано</p>
                        </div>
                    </div>
                </div>

                <!-- Название -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Название <span class="text-red-500">*</span></label>
                    <input type="text" id="createPackName" required maxlength="100"
                        placeholder="Например: «Котики»"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <div class="flex gap-3 justify-end">
                    <button type="button" onclick="closeCreatePackModal()"
                        class="px-4 py-2 text-sm text-slate-600 border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
                        Отмена
                    </button>
                    <button type="submit" id="createPackBtn"
                        class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors font-medium">
                        Создать
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Детали стикерпака -->
    <div id="packDetailModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl mx-4 p-6 max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-semibold text-slate-800" id="detailPackTitle">Стикерпак</h3>
                <div class="flex items-center gap-2">
                    <button onclick="deleteCurrentPack()" class="text-red-400 hover:text-red-600 transition-colors" title="Удалить пак">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                    <button onclick="closePackDetailModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Pack info -->
            <div class="flex items-start gap-4 mb-5 pb-5 border-b border-slate-200">
                <!-- Cover -->
                <div class="relative group cursor-pointer" onclick="triggerCoverChange()">
                    <div class="w-24 h-24 rounded-lg border-2 border-slate-200 overflow-hidden bg-slate-50 flex items-center justify-center">
                        <img id="detailCoverImg" src="" alt="" class="hidden w-full h-full object-contain" />
                        <i data-lucide="image" class="w-10 h-10 text-slate-300" id="detailCoverIcon"></i>
                    </div>
                    <div class="absolute inset-0 bg-black/40 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <i data-lucide="camera" class="w-6 h-6 text-white"></i>
                    </div>
                    <input type="file" id="coverChangeInput" class="hidden" accept="image/*" onchange="handleCoverChange(this)" />
                </div>
                <!-- Name edit -->
                <div class="flex-1">
                    <div class="flex items-center gap-2">
                        <input type="text" id="detailPackNameInput" maxlength="100"
                            class="text-lg font-semibold text-slate-800 border-b border-transparent hover:border-slate-300 focus:border-blue-500 focus:outline-none px-1 py-0.5 w-full transition-colors" />
                        <button onclick="savePackName()" id="saveNameBtn" class="hidden text-blue-600 hover:text-blue-700 transition-colors" title="Сохранить">
                            <i data-lucide="check" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <p class="text-xs text-slate-400 mt-2" id="detailPackInfo"></p>
                </div>
            </div>

            <!-- Stickers grid -->
            <div class="flex-1 overflow-y-auto">
                <div id="stickersGrid" class="flex flex-wrap gap-3">
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: Добавить стикер -->
    <div id="addStickerModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4 p-6">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-semibold text-slate-800">Новый стикер</h3>
                <button onclick="closeAddStickerModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="addStickerForm" onsubmit="submitAddSticker(event)">
                <!-- Изображение -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Изображение стикера</label>
                    <div class="flex items-center gap-4">
                        <div class="w-20 h-20 rounded-lg border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden bg-slate-50">
                            <img id="stickerPreview" src="" alt="" class="hidden w-full h-full object-contain" />
                            <i data-lucide="image" class="w-8 h-8 text-slate-300" id="stickerPreviewIcon"></i>
                        </div>
                        <div class="flex-1">
                            <input type="file" id="stickerImageInput" accept="image/*" required
                                class="block w-full text-sm text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
                                onchange="previewStickerImage(this)" />
                            <p class="text-xs text-slate-400 mt-1">Будет конвертировано в WebP 512x512</p>
                        </div>
                    </div>
                </div>

                <!-- Emoji -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Эмодзи <span class="text-red-500">*</span></label>
                    <input type="text" id="stickerEmoji" required maxlength="20"
                        placeholder="Нажмите Win+. для выбора эмодзи"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <div class="flex gap-3 justify-end">
                    <button type="button" onclick="closeAddStickerModal()"
                        class="px-4 py-2 text-sm text-slate-600 border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
                        Отмена
                    </button>
                    <button type="submit" id="addStickerBtn"
                        class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors font-medium">
                        Добавить
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let packs = [];
        let currentPackId = null;
        let currentPackData = null;
        let originalPackName = '';

        // ---- S3 Submenu ----
        let s3MenuLoaded = false;
        function toggleS3Menu() {
            const submenu = document.getElementById('s3-submenu');
            const chevron = document.getElementById('s3-chevron');
            const isHidden = submenu.classList.contains('hidden');
            if (isHidden) {
                submenu.classList.remove('hidden');
                chevron.style.transform = 'rotate(180deg)';
                localStorage.setItem('s3-menu-open', 'true');
                if (!s3MenuLoaded) loadS3Submenu();
            } else {
                submenu.classList.add('hidden');
                chevron.style.transform = '';
                localStorage.setItem('s3-menu-open', 'false');
            }
        }
        async function loadS3Submenu() {
            try {
                const res = await fetch('/api/s3/buckets');
                if (!res.ok) throw new Error();
                const buckets = await res.json();
                const submenu = document.getElementById('s3-submenu');
                submenu.innerHTML = buckets.map(b =>
                    `<a href="/s3-browser?bucket=${encodeURIComponent(b.id)}" class="block px-3 py-1.5 text-xs text-slate-400 hover:text-white rounded" style="background:transparent" onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='transparent'">${b.displayName}</a>`
                ).join('');
                s3MenuLoaded = true;
            } catch (e) { console.error('S3 submenu error:', e); }
        }
        function initS3Menu() {
            if (localStorage.getItem('s3-menu-open') === 'true') {
                const submenu = document.getElementById('s3-submenu');
                const chevron = document.getElementById('s3-chevron');
                if (submenu && chevron) {
                    submenu.classList.remove('hidden');
                    chevron.style.transform = 'rotate(180deg)';
                    loadS3Submenu();
                }
            }
        }

        // ---- AUTH ----
        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) { window.location.href = '/'; return; }
                const data = await res.json();
                document.getElementById('tokenName').textContent = data.name || 'Admin';
                document.getElementById('tokenInfo').textContent = new Date(data.createdAt).toLocaleDateString('ru-RU');
            } catch {
                window.location.href = '/';
            }
        }

        async function handleLogout() {
            if (!confirm('Выйти из панели?')) return;
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        }

        // ---- HELPERS ----
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function convertToWebP512(file) {
            const bitmap = await createImageBitmap(file, { colorSpaceConversion: 'none' });

            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            // Прозрачный фон
            ctx.clearRect(0, 0, 512, 512);
            // Масштабируем с сохранением пропорций
            const scale = Math.min(512 / bitmap.width, 512 / bitmap.height);
            const w = bitmap.width * scale;
            const h = bitmap.height * scale;
            ctx.drawImage(bitmap, (512 - w) / 2, (512 - h) / 2, w, h);
            bitmap.close();

            return new Promise((resolve, reject) => {
                canvas.toBlob(
                    blob => blob ? resolve(blob) : reject('WebP conversion failed'),
                    'image/webp',
                    0.9
                );
            });
        }

        // ---- PACKS LIST ----
        async function loadPacks() {
            try {
                const res = await fetch('/api/stickers/packs');
                if (!res.ok) throw new Error('Failed to load packs');
                const data = await res.json();
                packs = data.packs;
                renderPacks();
            } catch (e) {
                console.error('Ошибка загрузки паков:', e);
            }
        }

        function renderPacks() {
            const grid = document.getElementById('packsGrid');
            const empty = document.getElementById('emptyState');

            if (packs.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                empty.classList.add('flex');
                return;
            }

            empty.classList.add('hidden');
            empty.classList.remove('flex');

            grid.innerHTML = packs.map(pack => `
                <div class="pack-card bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden cursor-pointer hover:shadow-md transition-shadow relative group"
                     onclick="openPackDetail('${pack.id}')">
                    <!-- Три точки -->
                    <div class="absolute top-2 right-2 z-10">
                        <button onclick="event.stopPropagation(); toggleDropdown('${pack.id}')"
                            class="w-8 h-8 rounded-full bg-white/80 backdrop-blur flex items-center justify-center text-slate-500 hover:bg-white hover:text-slate-800 shadow transition-all opacity-0 group-hover:opacity-100">
                            <i data-lucide="more-vertical" class="w-4 h-4"></i>
                        </button>
                        <div id="dropdown-${pack.id}" class="dropdown-menu absolute right-0 mt-1 w-36 bg-white rounded-lg shadow-lg border border-slate-200 py-1 z-20">
                            <button onclick="event.stopPropagation(); deletePack('${pack.id}')"
                                class="w-full flex items-center gap-2 px-3 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                Удалить
                            </button>
                        </div>
                    </div>

                    <!-- Обложка -->
                    <div class="flex items-center justify-center bg-slate-50 p-4">
                        ${pack.coverUrl
                            ? `<img src="${pack.coverUrl}" alt="" class="pack-cover object-contain rounded-lg" />`
                            : `<div class="pack-cover rounded-lg bg-slate-200 flex items-center justify-center"><i data-lucide="smile" class="w-12 h-12 text-slate-400"></i></div>`
                        }
                    </div>

                    <!-- Информация -->
                    <div class="p-3 border-t border-slate-100">
                        <h3 class="font-semibold text-slate-800 text-sm leading-tight truncate" title="${escapeHtml(pack.name)}">${escapeHtml(pack.name)}</h3>
                        <p class="text-xs text-slate-400 mt-1">${pack.stickerCount} стикер${getStickerSuffix(pack.stickerCount)}</p>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function getStickerSuffix(count) {
            const mod10 = count % 10;
            const mod100 = count % 100;
            if (mod100 >= 11 && mod100 <= 19) return 'ов';
            if (mod10 === 1) return '';
            if (mod10 >= 2 && mod10 <= 4) return 'а';
            return 'ов';
        }

        function toggleDropdown(id) {
            document.querySelectorAll('.dropdown-menu.open').forEach(el => {
                if (el.id !== `dropdown-${id}`) el.classList.remove('open');
            });
            document.getElementById(`dropdown-${id}`).classList.toggle('open');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('[id^="dropdown-"]') && !e.target.closest('button[onclick*="toggleDropdown"]')) {
                document.querySelectorAll('.dropdown-menu.open').forEach(el => el.classList.remove('open'));
            }
        });

        // ---- CREATE PACK MODAL ----
        function openCreatePackModal() {
            document.getElementById('createPackForm').reset();
            document.getElementById('createCoverPreview').classList.add('hidden');
            document.getElementById('createCoverPreview').src = '';
            document.getElementById('createCoverIcon').classList.remove('hidden');
            showModal('createPackModal');
        }

        function closeCreatePackModal() { hideModal('createPackModal'); }

        function previewCreateCover(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('createCoverPreview').src = e.target.result;
                document.getElementById('createCoverPreview').classList.remove('hidden');
                document.getElementById('createCoverIcon').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function submitCreatePack(event) {
            event.preventDefault();
            const btn = document.getElementById('createPackBtn');
            btn.disabled = true;
            btn.textContent = 'Создание...';

            try {
                const formData = new FormData();
                formData.append('name', document.getElementById('createPackName').value);

                const imageFile = document.getElementById('createCoverInput').files[0];
                if (imageFile) {
                    const webpBlob = await convertToWebP512(imageFile);
                    formData.append('image', webpBlob, 'cover.webp');
                }

                const res = await fetch('/api/stickers/packs', { method: 'POST', body: formData });
                if (!res.ok) {
                    const err = await res.text();
                    alert(`Ошибка: ${err}`);
                    return;
                }

                closeCreatePackModal();
                await loadPacks();
            } catch (e) {
                alert(`Ошибка: ${e.message || e}`);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Создать';
            }
        }

        // ---- PACK DETAIL MODAL ----
        async function openPackDetail(packId) {
            currentPackId = packId;
            document.querySelectorAll('.dropdown-menu.open').forEach(el => el.classList.remove('open'));

            try {
                const res = await fetch(`/api/stickers/packs/${packId}`);
                if (!res.ok) throw new Error(await res.text());
                currentPackData = await res.json();

                document.getElementById('detailPackTitle').textContent = 'Стикерпак';
                document.getElementById('detailPackNameInput').value = currentPackData.name;
                originalPackName = currentPackData.name;
                document.getElementById('detailPackInfo').textContent = `${currentPackData.stickers.length} стикер${getStickerSuffix(currentPackData.stickers.length)}`;

                // Обложка
                if (currentPackData.coverUrl) {
                    document.getElementById('detailCoverImg').src = currentPackData.coverUrl;
                    document.getElementById('detailCoverImg').classList.remove('hidden');
                    document.getElementById('detailCoverIcon').classList.add('hidden');
                } else {
                    document.getElementById('detailCoverImg').classList.add('hidden');
                    document.getElementById('detailCoverIcon').classList.remove('hidden');
                }

                renderStickersGrid();
                showModal('packDetailModal');
                lucide.createIcons();
            } catch (e) {
                alert(`Ошибка загрузки пака: ${e.message}`);
            }
        }

        function closePackDetailModal() {
            hideModal('packDetailModal');
            currentPackId = null;
            currentPackData = null;
        }

        function renderStickersGrid() {
            const grid = document.getElementById('stickersGrid');
            if (!currentPackData) return;

            let html = currentPackData.stickers.map(s => `
                <div class="sticker-tile bg-slate-50 rounded-lg border border-slate-200 flex flex-col items-center justify-center p-2 relative group">
                    <button onclick="event.stopPropagation(); removeSticker('${s.id}')"
                        class="absolute top-1 right-1 w-6 h-6 rounded-full bg-red-500 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-xs hover:bg-red-600">
                        &times;
                    </button>
                    <img src="${s.previewUrl || s.fileUrl}" alt="" class="sticker-img object-contain rounded" />
                    <span class="text-sm mt-1 leading-none">${escapeHtml(s.emoji)}</span>
                </div>
            `).join('');

            // Кнопка добавления стикера
            html += `
                <div class="sticker-tile bg-white rounded-lg border-2 border-dashed border-slate-300 flex items-center justify-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-colors"
                     onclick="openAddStickerModal()">
                    <i data-lucide="plus" class="w-8 h-8 text-slate-400"></i>
                </div>
            `;

            grid.innerHTML = html;
            lucide.createIcons();
        }

        // Name edit
        document.getElementById('detailPackNameInput').addEventListener('input', function() {
            const btn = document.getElementById('saveNameBtn');
            if (this.value !== originalPackName) {
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }
        });

        async function savePackName() {
            const newName = document.getElementById('detailPackNameInput').value.trim();
            if (!newName || !currentPackId) return;

            try {
                const res = await fetch(`/api/stickers/packs/${currentPackId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: newName,
                        description: currentPackData.description || '',
                        coverStickerId: currentPackData.coverStickerId || ''
                    })
                });
                if (!res.ok) throw new Error(await res.text());

                originalPackName = newName;
                document.getElementById('saveNameBtn').classList.add('hidden');
                await loadPacks();
            } catch (e) {
                alert(`Ошибка: ${e.message}`);
            }
        }

        // Cover change
        function triggerCoverChange() {
            document.getElementById('coverChangeInput').click();
        }

        async function handleCoverChange(input) {
            const file = input.files[0];
            if (!file || !currentPackId) return;

            try {
                const webpBlob = await convertToWebP512(file);
                const formData = new FormData();
                formData.append('image', webpBlob, 'cover.webp');

                const res = await fetch(`/api/stickers/packs/${currentPackId}/cover`, {
                    method: 'PUT',
                    body: formData
                });
                if (!res.ok) throw new Error(await res.text());

                // Обновляем UI
                await openPackDetail(currentPackId);
                await loadPacks();
            } catch (e) {
                alert(`Ошибка: ${e.message || e}`);
            }

            input.value = '';
        }

        // Delete pack
        async function deletePack(packId) {
            const pack = packs.find(p => p.id === packId);
            if (!pack) return;
            if (!confirm(`Удалить стикерпак «${pack.name}»?\n\nВсе стикеры в паке будут удалены. Это действие нельзя отменить.`)) return;

            try {
                const res = await fetch(`/api/stickers/packs/${packId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(await res.text());
                await loadPacks();
            } catch (e) {
                alert(`Ошибка: ${e.message}`);
            }
        }

        async function deleteCurrentPack() {
            if (!currentPackId) return;
            if (!confirm(`Удалить этот стикерпак?\n\nВсе стикеры будут удалены. Это действие нельзя отменить.`)) return;

            try {
                const res = await fetch(`/api/stickers/packs/${currentPackId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(await res.text());
                closePackDetailModal();
                await loadPacks();
            } catch (e) {
                alert(`Ошибка: ${e.message}`);
            }
        }

        // ---- ADD STICKER MODAL ----
        function openAddStickerModal() {
            document.getElementById('addStickerForm').reset();
            document.getElementById('stickerPreview').classList.add('hidden');
            document.getElementById('stickerPreview').src = '';
            document.getElementById('stickerPreviewIcon').classList.remove('hidden');
            showModal('addStickerModal');
            lucide.createIcons();
        }

        function closeAddStickerModal() { hideModal('addStickerModal'); }

        function previewStickerImage(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('stickerPreview').src = e.target.result;
                document.getElementById('stickerPreview').classList.remove('hidden');
                document.getElementById('stickerPreviewIcon').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function submitAddSticker(event) {
            event.preventDefault();
            if (!currentPackId) return;

            const btn = document.getElementById('addStickerBtn');
            btn.disabled = true;
            btn.textContent = 'Добавление...';

            try {
                const imageFile = document.getElementById('stickerImageInput').files[0];
                if (!imageFile) {
                    alert('Выберите изображение');
                    return;
                }

                const webpBlob = await convertToWebP512(imageFile);
                const formData = new FormData();
                formData.append('image', webpBlob, 'sticker.webp');
                formData.append('emoji', document.getElementById('stickerEmoji').value);

                const res = await fetch(`/api/stickers/packs/${currentPackId}/stickers`, {
                    method: 'POST',
                    body: formData
                });
                if (!res.ok) {
                    const err = await res.text();
                    alert(`Ошибка: ${err}`);
                    return;
                }

                closeAddStickerModal();
                await openPackDetail(currentPackId);
                await loadPacks();
            } catch (e) {
                alert(`Ошибка: ${e.message || e}`);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Добавить';
            }
        }

        // ---- REMOVE STICKER ----
        async function removeSticker(stickerId) {
            if (!confirm('Удалить этот стикер?')) return;

            try {
                const res = await fetch(`/api/stickers/${stickerId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(await res.text());
                await openPackDetail(currentPackId);
                await loadPacks();
            } catch (e) {
                alert(`Ошибка: ${e.message}`);
            }
        }

        // ---- MODAL HELPERS ----
        function showModal(id) {
            const el = document.getElementById(id);
            el.classList.remove('hidden');
            el.classList.add('flex');
        }
        function hideModal(id) {
            const el = document.getElementById(id);
            el.classList.add('hidden');
            el.classList.remove('flex');
        }

        // ---- INIT ----
        async function init() {
            await checkAuth();
            initS3Menu();
            await loadPacks();
            document.getElementById('loadingOverlay').style.display = 'none';
            lucide.createIcons();
        }

        init();
    </script>
</body>
</html>
