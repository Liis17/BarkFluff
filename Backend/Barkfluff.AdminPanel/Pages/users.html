<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff Admin Panel | Юзеры</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        #loadingOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #dfe6e9;
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 font-sans antialiased">

    <div id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="flex h-screen overflow-hidden">

        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl flex-shrink-0">
            <div class="h-16 flex items-center justify-center border-b border-slate-700">
                <h1 class="text-xl font-bold tracking-wider flex items-center gap-2">
                    <i data-lucide="message-circle" class="text-blue-400"></i>
                    BF::ADMIN
                </h1>
            </div>

            <nav class="flex-1 px-3 py-6 space-y-2 overflow-y-auto">
                <a href="/" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    Дашборд
                </a>
                <a href="/services" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="server" class="w-5 h-5"></i>
                    Сервисы
                </a>
                <a href="/logs" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="terminal-square" class="w-5 h-5"></i>
                    Логи
                </a>
                <a href="/badges" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="award" class="w-5 h-5"></i>
                    Бейджи
                </a>
                <a href="/stickers" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="smile" class="w-5 h-5"></i>
                    Стикеры
                </a>
                <a href="/users" class="flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white transition-colors">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    Юзеры
                </a>
                <!-- S3 Storage with submenu -->
                <div>
                    <div class="flex items-center">
                        <a href="/s3-storage" class="flex-1 flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                            <i data-lucide="hard-drive" class="w-5 h-5"></i>
                            Хранилище S3
                        </a>
                        <button onclick="toggleS3Menu()" class="p-1.5 text-slate-400 hover:text-white transition-colors">
                            <i data-lucide="chevron-down" id="s3-chevron" class="w-4 h-4" style="transition:transform 0.2s ease"></i>
                        </button>
                    </div>
                    <div id="s3-submenu" class="hidden ml-6 mt-1 space-y-0.5">
                        <div class="text-xs text-slate-500 py-1">Загрузка...</div>
                    </div>
                </div>
            </nav>

            <div class="p-4 border-t border-slate-700">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center font-bold">A</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium truncate" id="tokenName">Loading...</p>
                        <p class="text-xs text-slate-400" id="tokenInfo">...</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 flex flex-col overflow-hidden min-w-0">

            <!-- HEADER -->
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10">
                <h2 class="text-xl font-semibold text-slate-700">Юзеры</h2>
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="searchInput" placeholder="Поиск по username или ID..."
                            class="pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-72" />
                    </div>
                    <button onclick="openReservedNamesModal()"
                        class="flex items-center gap-2 px-3 py-2 text-slate-500 hover:text-blue-600 bg-slate-100 hover:bg-blue-50 rounded-lg transition-colors text-sm">
                        <i data-lucide="shield" class="w-4 h-4"></i>
                        Зарезервированные
                    </button>
                    <button onclick="handleLogout()"
                        class="flex items-center gap-2 text-slate-500 hover:text-red-600 transition-colors text-sm">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        Выйти
                    </button>
                </div>
            </header>

            <!-- USERS LIST -->
            <div class="flex-1 overflow-y-auto p-6" id="usersContainer">
                <div id="usersList" class="space-y-1">
                    <!-- Юзеры вставляются JS -->
                </div>
                <div id="emptyState" class="hidden flex-col items-center justify-center py-24 text-slate-400">
                    <i data-lucide="users" class="w-16 h-16 mb-4 opacity-30"></i>
                    <p class="text-lg">Пользователи не найдены</p>
                </div>
                <div id="loadingMore" class="hidden py-4 text-center text-slate-400 text-sm">
                    <div class="spinner mx-auto mb-2" style="width:24px;height:24px;border-width:2px;"></div>
                    Загрузка...
                </div>
                <div id="sentinel" class="h-1"></div>
            </div>
        </main>
    </div>

    <!-- MODAL: Информация о пользователе -->
    <div id="userModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50" onclick="if(event.target===this)closeUserModal()">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between z-10">
                <h3 class="text-lg font-semibold text-slate-800" id="modalUserTitle">Пользователь</h3>
                <button onclick="closeUserModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-6 space-y-8" id="modalContent">
                <!-- Заполняется через JS -->
            </div>
        </div>
    </div>

    <!-- MODAL: Информация об устройстве -->
    <div id="deviceModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/30" onclick="if(event.target===this)closeDeviceModal()">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-slate-800">Устройство</h3>
                <button onclick="closeDeviceModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="deviceModalContent" class="space-y-3 text-sm"></div>
        </div>
    </div>

    <!-- MODAL: Зарезервированные юзернеймы -->
    <div id="reservedNamesModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50" onclick="if(event.target===this)closeReservedNamesModal()">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 max-h-[80vh] flex flex-col">
            <div class="border-b border-slate-200 px-6 py-4 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-slate-800">Зарезервированные юзернеймы</h3>
                <button onclick="closeReservedNamesModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-2" id="reservedNamesList">
                <div class="flex justify-center py-8"><div class="spinner"></div></div>
            </div>
            <div class="border-t border-slate-200 px-6 py-4 flex items-center gap-2">
                <input type="text" id="newReservedName" placeholder="Новое имя..."
                    class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    onkeydown="if(event.key==='Enter')addReservedName()" />
                <button onclick="addReservedName()"
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">
                    Добавить
                </button>
            </div>
        </div>
    </div>

    <script>
        let users = [];
        let totalCount = 0;
        let currentOffset = 0;
        let isLoading = false;
        let currentQuery = '';
        let searchTimeout = null;
        let allBadges = [];
        let currentUserData = null;

        const PAGE_SIZE = 50;

        // ---- S3 Submenu ----
        let s3MenuLoaded = false;
        function toggleS3Menu() {
            const submenu = document.getElementById('s3-submenu');
            const chevron = document.getElementById('s3-chevron');
            const isHidden = submenu.classList.contains('hidden');
            if (isHidden) {
                submenu.classList.remove('hidden');
                chevron.style.transform = 'rotate(180deg)';
                localStorage.setItem('s3-menu-open', 'true');
                if (!s3MenuLoaded) loadS3Submenu();
            } else {
                submenu.classList.add('hidden');
                chevron.style.transform = '';
                localStorage.setItem('s3-menu-open', 'false');
            }
        }
        async function loadS3Submenu() {
            try {
                const res = await fetch('/api/s3/buckets');
                if (!res.ok) throw new Error();
                const buckets = await res.json();
                const submenu = document.getElementById('s3-submenu');
                submenu.innerHTML = buckets.map(b =>
                    `<a href="/s3-browser?bucket=${encodeURIComponent(b.id)}" class="block px-3 py-1.5 text-xs text-slate-400 hover:text-white rounded" style="background:transparent" onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='transparent'">${b.displayName}</a>`
                ).join('');
                s3MenuLoaded = true;
            } catch (e) { console.error('S3 submenu error:', e); }
        }
        function initS3Menu() {
            if (localStorage.getItem('s3-menu-open') === 'true') {
                const submenu = document.getElementById('s3-submenu');
                const chevron = document.getElementById('s3-chevron');
                if (submenu && chevron) {
                    submenu.classList.remove('hidden');
                    chevron.style.transform = 'rotate(180deg)';
                    loadS3Submenu();
                }
            }
        }

        // ─── AUTH ─────────────────────────────────────────────────────────────────

        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) { window.location.href = '/'; return; }
                const data = await res.json();
                document.getElementById('tokenName').textContent = data.name || 'Admin';
                document.getElementById('tokenInfo').textContent = new Date(data.createdAt).toLocaleDateString('ru-RU');
            } catch {
                window.location.href = '/';
            }
        }

        async function handleLogout() {
            if (!confirm('Выйти из панели?')) return;
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        }

        // ─── USERS LIST ──────────────────────────────────────────────────────────

        async function loadUsers(reset = false) {
            if (isLoading) return;
            if (!reset && currentOffset >= totalCount && totalCount > 0) return;

            isLoading = true;
            if (reset) {
                currentOffset = 0;
                users = [];
            }

            document.getElementById('loadingMore').classList.remove('hidden');

            try {
                const params = new URLSearchParams({
                    query: currentQuery,
                    offset: currentOffset,
                    size: PAGE_SIZE
                });
                const res = await fetch(`/api/users?${params}`);
                if (!res.ok) throw new Error('Failed to load users');
                const data = await res.json();

                totalCount = data.totalCount;

                if (reset) {
                    users = data.users;
                } else {
                    users = users.concat(data.users);
                }

                currentOffset += data.users.length;
                renderUsers();
            } catch (e) {
                console.error('Ошибка загрузки юзеров:', e);
            } finally {
                isLoading = false;
                document.getElementById('loadingMore').classList.add('hidden');
            }
        }

        function renderUsers() {
            const list = document.getElementById('usersList');
            const empty = document.getElementById('emptyState');

            if (users.length === 0) {
                list.innerHTML = '';
                empty.classList.remove('hidden');
                empty.classList.add('flex');
                return;
            }

            empty.classList.add('hidden');
            empty.classList.remove('flex');

            list.innerHTML = users.map(u => `
                <div class="flex items-center gap-4 px-4 py-3 bg-white rounded-lg border border-slate-200 hover:border-blue-300 hover:shadow-sm cursor-pointer transition-all"
                     onclick="openUserModal(${u.id})">
                    <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center overflow-hidden flex-shrink-0">
                        ${u.profilePicturePreview || u.profilePicture
                            ? `<img src="${u.profilePicturePreview || u.profilePicture}" class="w-full h-full object-cover" />`
                            : `<span class="text-sm font-semibold text-slate-500">${getInitials(u.firstName, u.lastName)}</span>`
                        }
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <p class="font-medium text-slate-800 truncate">${escapeHtml(u.firstName)} ${escapeHtml(u.lastName)}</p>
                            ${(u.badges && u.badges.length > 0) ? u.badges.map(ub =>
                                ub.badge.imageUrl ? `<img src="${ub.badge.imageUrl}" title="${escapeHtml(ub.badge.name)}" class="w-5 h-5 object-contain flex-shrink-0" />` : ''
                            ).join('') : ''}
                        </div>
                        <p class="text-sm text-slate-500 truncate">@${escapeHtml(u.username)}</p>
                    </div>
                    <span class="text-sm text-slate-400 flex-shrink-0">ID: ${u.id}</span>
                </div>
            `).join('');
        }

        function getInitials(first, last) {
            return ((first?.[0] || '') + (last?.[0] || '')).toUpperCase() || '?';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ─── SEARCH ──────────────────────────────────────────────────────────────

        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentQuery = e.target.value.trim();
                loadUsers(true);
            }, 300);
        });

        // ─── INFINITE SCROLL ─────────────────────────────────────────────────────

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isLoading) {
                loadUsers();
            }
        }, { threshold: 0.1 });

        // ─── USER MODAL ──────────────────────────────────────────────────────────

        async function openUserModal(userId) {
            document.getElementById('userModal').classList.remove('hidden');
            document.getElementById('userModal').classList.add('flex');
            document.getElementById('modalContent').innerHTML = '<div class="flex justify-center py-12"><div class="spinner"></div></div>';

            try {
                const res = await fetch(`/api/users/${userId}`);
                if (!res.ok) throw new Error('Failed to load user');
                currentUserData = await res.json();
                renderUserModal(currentUserData);
            } catch (e) {
                document.getElementById('modalContent').innerHTML = `<p class="text-red-500 text-center py-8">Ошибка загрузки: ${e.message}</p>`;
            }
        }

        function closeUserModal() {
            document.getElementById('userModal').classList.add('hidden');
            document.getElementById('userModal').classList.remove('flex');
            currentUserData = null;
        }

        function renderUserModal(data) {
            const p = data.profile;
            document.getElementById('modalUserTitle').textContent = `${p.firstName} ${p.lastName}`;

            let html = '';

            // ─── PROFILE SECTION ───
            html += `
            <section>
                <h4 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Профиль</h4>
                <div class="flex items-start gap-6">
                    <div class="relative w-24 h-24 rounded-full bg-slate-200 flex items-center justify-center overflow-hidden flex-shrink-0 group cursor-pointer"
                         onclick="document.getElementById('avatarFileInput').click()">
                        ${p.profilePicture
                            ? `<img id="modalAvatarImg" src="${p.profilePicture}" class="w-full h-full object-cover" />`
                            : `<span id="modalAvatarInitials" class="text-2xl font-bold text-slate-400">${getInitials(p.firstName, p.lastName)}</span>`
                        }
                        <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded-full">
                            <i data-lucide="image" class="w-8 h-8 text-white"></i>
                        </div>
                    </div>
                    <input type="file" id="avatarFileInput" accept="image/*" class="hidden" onchange="handleAvatarUpload(this, ${p.id})" />
                    <div class="space-y-1 text-sm">
                        <p><span class="text-slate-500">Имя:</span> ${escapeHtml(p.firstName)} ${escapeHtml(p.lastName)}</p>
                        <p><span class="text-slate-500">Username:</span> @${escapeHtml(p.username)}</p>
                        <p><span class="text-slate-500">Email:</span> ${data.contacts?.email || '—'}</p>
                        <p><span class="text-slate-500">ID:</span> ${p.id}</p>
                        <p><span class="text-slate-500">Регистрация:</span> ${p.registrationDate ? new Date(p.registrationDate).toLocaleString('ru-RU') : '—'}</p>
                        ${p.bio ? `<p><span class="text-slate-500">Био:</span> ${escapeHtml(p.bio)}</p>` : ''}
                    </div>
                </div>
            </section>`;

            // ─── BADGES SECTION ───
            html += `
            <section>
                <h4 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Бейджи</h4>
                <div id="userBadgesList" class="space-y-2">
                    ${(p.badges && p.badges.length > 0) ? p.badges.map(ub => `
                        <div class="flex items-center gap-3 px-3 py-2 bg-slate-50 rounded-lg">
                            ${ub.badge.imageUrl ? `<img src="${ub.badge.imageUrl}" class="w-8 h-8 object-contain" />` : ''}
                            <span class="flex-1 text-sm font-medium">${escapeHtml(ub.badge.name)}</span>
                            <button onclick="removeUserBadge(${p.id}, ${ub.badge.id})"
                                class="px-2 py-1 text-xs bg-red-100 text-red-700 hover:bg-red-200 rounded-md font-medium transition-colors flex-shrink-0">Удалить</button>
                        </div>
                    `).join('') : '<p class="text-sm text-slate-400">Нет бейджей</p>'}
                </div>
                <div class="mt-3 flex items-center gap-2">
                    <select id="addBadgeSelect" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm flex-1 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Выберите бейдж...</option>
                    </select>
                    <button onclick="addUserBadge(${p.id})"
                        class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">
                        Добавить
                    </button>
                </div>
            </section>`;

            // ─── DEVICES / SESSIONS SECTION ───
            const sessions = data.sessions || [];
            html += `
            <section>
                <h4 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Устройства и сессии</h4>
                ${sessions.length > 0 ? `
                <div class="space-y-2">
                    ${sessions.map(s => `
                        <div class="flex items-center gap-3 px-3 py-2 bg-slate-50 rounded-lg cursor-pointer hover:bg-slate-100 transition-colors"
                             onclick='showDeviceDetails(${JSON.stringify(s).replace(/'/g, "&#39;")})'>
                            <i data-lucide="monitor" class="w-5 h-5 text-slate-400 flex-shrink-0"></i>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium truncate">${escapeHtml(s.customName || s.originalName || 'Неизвестное устройство')}</p>
                                <p class="text-xs text-slate-400 truncate">${escapeHtml(s.operationSystem || '')} ${escapeHtml(s.appName || '')} ${s.location ? '| ' + escapeHtml(s.location) : ''}</p>
                            </div>
                            <p class="text-xs text-slate-400 flex-shrink-0">${s.createdAt ? new Date(s.createdAt).toLocaleDateString('ru-RU') : ''}</p>
                            <button onclick="event.stopPropagation(); removeSession(${p.id}, '${escapeHtml(s.deviceId)}')"
                                class="text-xs text-red-500 hover:text-red-700 transition-colors flex-shrink-0">Завершить</button>
                        </div>
                    `).join('')}
                </div>` : '<p class="text-sm text-slate-400">Нет активных сессий</p>'}
            </section>`;

            // ─── 2FA SECTION ───
            const tfa = data.twoFactor;
            html += `
            <section>
                <h4 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Двухфакторная аутентификация</h4>
                ${tfa ? `
                <div class="space-y-3">
                    <div class="flex items-center justify-between px-3 py-2 bg-slate-50 rounded-lg">
                        <div>
                            <p class="text-sm font-medium">Authenticator</p>
                            <p class="text-xs ${tfa.authenticatorEnabled ? 'text-green-600' : 'text-slate-400'}">${tfa.authenticatorEnabled ? 'Включен' : 'Выключен'}</p>
                        </div>
                        <button onclick="disableOtp(${p.id}, 1)" ${!tfa.authenticatorEnabled ? 'disabled' : ''}
                            class="px-3 py-1 text-xs rounded-lg font-medium transition-colors ${tfa.authenticatorEnabled ? 'bg-red-100 text-red-700 hover:bg-red-200' : 'bg-slate-100 text-slate-400 opacity-50 cursor-not-allowed'}">
                            Отключить
                        </button>
                    </div>
                    <div class="flex items-center justify-between px-3 py-2 bg-slate-50 rounded-lg">
                        <div>
                            <p class="text-sm font-medium">Email</p>
                            <p class="text-xs ${tfa.emailEnabled ? 'text-green-600' : 'text-slate-400'}">${tfa.emailEnabled ? 'Включен' : 'Выключен'}</p>
                        </div>
                        <button onclick="disableOtp(${p.id}, 2)" ${!tfa.emailEnabled ? 'disabled' : ''}
                            class="px-3 py-1 text-xs rounded-lg font-medium transition-colors ${tfa.emailEnabled ? 'bg-red-100 text-red-700 hover:bg-red-200' : 'bg-slate-100 text-slate-400 opacity-50 cursor-not-allowed'}">
                            Отключить
                        </button>
                    </div>
                </div>` : '<p class="text-sm text-slate-400">Данные недоступны</p>'}
            </section>`;

            // ─── STORAGE SECTION ───
            const st = data.storage;
            html += `
            <section>
                <h4 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Хранилище</h4>
                ${st ? (() => {
                    const usedMb = (st.totalUsedStorage / (1024 * 1024)).toFixed(1);
                    const limitMb = (st.storageLimit / (1024 * 1024)).toFixed(1);
                    const limitGb = (st.storageLimit / (1024 * 1024 * 1024)).toFixed(1);
                    const pct = st.storageLimit > 0 ? Math.min((st.totalUsedStorage / st.storageLimit) * 100, 100) : 0;
                    const overflow = st.totalUsedStorage > st.storageLimit;
                    const overflowMb = overflow ? ((st.totalUsedStorage - st.storageLimit) / (1024 * 1024)).toFixed(1) : 0;

                    const typeNames = {
                        1: 'Аватарки',
                        2: 'Изображения',
                        3: 'Видео',
                        4: 'GIF',
                        5: 'Документы',
                        6: 'Обложки чатов'
                    };

                    return `
                    <div class="mb-4">
                        <div class="flex justify-between text-sm mb-1">
                            <span>${usedMb} МБ / ${limitGb} ГБ</span>
                            <span>${pct.toFixed(1)}%</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-3">
                            <div class="h-3 rounded-full transition-all ${overflow ? 'bg-red-500' : 'bg-blue-500'}" style="width:${Math.min(pct, 100)}%"></div>
                        </div>
                        ${overflow ? `<p class="text-xs text-red-600 mt-1 font-medium">Переполнение: ${overflowMb} МБ</p>` : ''}
                    </div>

                    ${st.storageByTypes && st.storageByTypes.length > 0 ? `
                    <table class="w-full text-sm mb-4">
                        <thead><tr class="text-slate-500 text-left"><th class="pb-1">Тип</th><th class="pb-1 text-right">Занято</th></tr></thead>
                        <tbody>
                            ${st.storageByTypes.map(t => `
                                <tr class="border-t border-slate-100">
                                    <td class="py-1">${typeNames[t.fileType] || t.fileTypeName}</td>
                                    <td class="py-1 text-right text-slate-500">${formatBytes(t.usedStorage)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>` : ''}

                    <div class="flex items-center gap-4">
                        <label class="text-sm text-slate-600 flex-shrink-0">Лимит:</label>
                        <input type="range" id="storageLimitSlider" min="1" max="250" step="1" value="${p.storageLimitGb}"
                            oninput="document.getElementById('storageLimitValue').textContent=this.value"
                            class="flex-1 accent-blue-600" />
                        <span id="storageLimitValue" class="text-sm font-medium w-8 text-right">${p.storageLimitGb}</span>
                        <span class="text-sm text-slate-400">ГБ</span>
                        <button onclick="updateStorageLimit(${p.id})"
                            class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">
                            Применить
                        </button>
                    </div>`;
                })() : '<p class="text-sm text-slate-400">Данные недоступны</p>'}
            </section>`;

            document.getElementById('modalContent').innerHTML = html;
            lucide.createIcons();

            // Загрузить все бейджи для выпадающего списка
            loadAllBadgesForSelect();
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Б';
            if (bytes < 1024) return bytes + ' Б';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' МБ';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' ГБ';
        }

        // ─── BADGE ACTIONS ───────────────────────────────────────────────────────

        async function loadAllBadgesForSelect() {
            try {
                if (allBadges.length === 0) {
                    const res = await fetch('/api/badges');
                    if (res.ok) allBadges = await res.json();
                }
                const select = document.getElementById('addBadgeSelect');
                if (!select) return;

                const existingIds = new Set((currentUserData?.profile?.badges || []).map(ub => ub.badge.id));
                select.innerHTML = '<option value="">Выберите бейдж...</option>' +
                    allBadges
                        .filter(b => b.isActive && !existingIds.has(b.id))
                        .map(b => `<option value="${b.id}">${escapeHtml(b.name)}</option>`)
                        .join('');
            } catch (e) {
                console.error('Ошибка загрузки бейджей:', e);
            }
        }

        async function addUserBadge(userId) {
            const select = document.getElementById('addBadgeSelect');
            const badgeId = parseInt(select.value);
            if (!badgeId) return;

            try {
                const res = await fetch(`/api/users/${userId}/badges`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ badgeId })
                });
                if (!res.ok) throw new Error(await res.text());
                await openUserModal(userId);
            } catch (e) {
                alert(`Ошибка: ${e.message}`);
            }
        }

        async function removeUserBadge(userId, badgeId) {
            if (!confirm('Удалить этот бейдж у пользователя?')) return;
            try {
                const res = await fetch(`/api/users/${userId}/badges/${badgeId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(await res.text());
                await openUserModal(userId);
            } catch (e) {
                alert(`Ошибка: ${e.message}`);
            }
        }

        // ─── SESSION ACTIONS ─────────────────────────────────────────────────────

        async function removeSession(userId, deviceId) {
            if (!confirm('Завершить эту сессию?')) return;
            try {
                const res = await fetch(`/api/users/${userId}/sessions/${deviceId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(await res.text());
                await openUserModal(userId);
            } catch (e) {
                alert(`Ошибка: ${e.message}`);
            }
        }

        function showDeviceDetails(session) {
            const html = `
                <p><span class="text-slate-500 font-medium">Device ID:</span> <span class="font-mono text-xs">${escapeHtml(session.deviceId)}</span></p>
                <p><span class="text-slate-500 font-medium">Имя:</span> ${escapeHtml(session.customName || session.originalName || '—')}</p>
                <p><span class="text-slate-500 font-medium">ОС:</span> ${escapeHtml(session.operationSystem || '—')}</p>
                <p><span class="text-slate-500 font-medium">Приложение:</span> ${escapeHtml(session.appName || '—')}</p>
                <p><span class="text-slate-500 font-medium">Локация:</span> ${escapeHtml(session.location || '—')}</p>
                <p><span class="text-slate-500 font-medium">Создана:</span> ${session.createdAt ? new Date(session.createdAt).toLocaleString('ru-RU') : '—'}</p>
                <p><span class="text-slate-500 font-medium">Истекает:</span> ${session.expirationAt ? new Date(session.expirationAt).toLocaleString('ru-RU') : '—'}</p>
            `;
            document.getElementById('deviceModalContent').innerHTML = html;
            document.getElementById('deviceModal').classList.remove('hidden');
            document.getElementById('deviceModal').classList.add('flex');
        }

        function closeDeviceModal() {
            document.getElementById('deviceModal').classList.add('hidden');
            document.getElementById('deviceModal').classList.remove('flex');
        }

        // ─── 2FA ACTIONS ─────────────────────────────────────────────────────────

        async function disableOtp(userId, otpType) {
            const typeName = otpType === 1 ? 'Authenticator' : 'Email';
            if (!confirm(`Принудительно отключить ${typeName} 2FA для этого пользователя?`)) return;

            try {
                const res = await fetch(`/api/users/${userId}/2fa/disable`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ otpType })
                });
                if (!res.ok) throw new Error(await res.text());
                await openUserModal(userId);
            } catch (e) {
                alert(`Ошибка: ${e.message}`);
            }
        }

        // ─── STORAGE ACTIONS ─────────────────────────────────────────────────────

        async function updateStorageLimit(userId) {
            const slider = document.getElementById('storageLimitSlider');
            const newLimit = parseInt(slider.value);

            try {
                const res = await fetch(`/api/users/${userId}/storage-limit`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ storageLimitGb: newLimit })
                });
                if (!res.ok) throw new Error(await res.text());
                await openUserModal(userId);
            } catch (e) {
                alert(`Ошибка: ${e.message}`);
            }
        }

        // ─── AVATAR UPLOAD ─────────────────────────────────────────────────────

        async function handleAvatarUpload(input, userId) {
            const file = input.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Выберите изображение');
                input.value = '';
                return;
            }

            try {
                const compressed = await compressImage(file, 1500, 0.85);

                const formData = new FormData();
                formData.append('avatar', compressed, file.name.replace(/\.[^.]+$/, '.jpg'));

                const res = await fetch(`/api/users/${userId}/avatar`, {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) throw new Error(await res.text());

                // Обновляем модалку и список
                await openUserModal(userId);
                await loadUsers(true);
            } catch (e) {
                alert(`Ошибка загрузки аватара: ${e.message}`);
            } finally {
                input.value = '';
            }
        }

        async function compressImage(file, maxSize, quality) {
            const bitmap = await createImageBitmap(file, { colorSpaceConversion: 'none' });

            let { width, height } = bitmap;

            // Сжимаем если больше maxSize по любой стороне
            if (width > maxSize || height > maxSize) {
                if (width > height) {
                    height = Math.round(height * (maxSize / width));
                    width = maxSize;
                } else {
                    width = Math.round(width * (maxSize / height));
                    height = maxSize;
                }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            // Белый фон — JPEG не поддерживает прозрачность,
            // без заливки альфа-канал компонуется с чёрным и даёт цветовой сдвиг
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(bitmap, 0, 0, width, height);
            bitmap.close();

            return new Promise((resolve, reject) => {
                canvas.toBlob(
                    (blob) => {
                        if (blob) resolve(blob);
                        else reject(new Error('Не удалось сжать изображение'));
                    },
                    'image/jpeg',
                    quality
                );
            });
        }

        // ─── RESERVED NAMES ─────────────────────────────────────────────────────

        let reservedNames = [];

        function openReservedNamesModal() {
            document.getElementById('reservedNamesModal').classList.remove('hidden');
            document.getElementById('reservedNamesModal').classList.add('flex');
            loadReservedNames();
        }

        function closeReservedNamesModal() {
            document.getElementById('reservedNamesModal').classList.add('hidden');
            document.getElementById('reservedNamesModal').classList.remove('flex');
        }

        async function loadReservedNames() {
            document.getElementById('reservedNamesList').innerHTML = '<div class="flex justify-center py-8"><div class="spinner"></div></div>';
            try {
                const res = await fetch('/api/reserved-names');
                if (!res.ok) throw new Error('Ошибка загрузки');
                reservedNames = await res.json();
                renderReservedNames();
            } catch (e) {
                document.getElementById('reservedNamesList').innerHTML = `<p class="text-red-500 text-center py-4">${e.message}</p>`;
            }
        }

        function renderReservedNames() {
            const list = document.getElementById('reservedNamesList');
            if (reservedNames.length === 0) {
                list.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">Нет зарезервированных имён</p>';
                return;
            }
            list.innerHTML = reservedNames.map(name => `
                <div class="flex items-center gap-2 px-3 py-2 bg-slate-50 rounded-lg">
                    <input type="text" value="${escapeHtml(name)}" data-original="${escapeHtml(name)}"
                        class="flex-1 border border-transparent hover:border-slate-300 focus:border-blue-500 rounded px-2 py-1 text-sm bg-transparent focus:bg-white focus:outline-none transition-colors"
                        onchange="showSaveBtn(this)" />
                    <button onclick="updateReservedName(this)" class="hidden px-2 py-1 text-xs bg-green-100 text-green-700 hover:bg-green-200 rounded-md font-medium transition-colors flex-shrink-0">
                        Сохранить
                    </button>
                    <button onclick="deleteReservedName('${escapeHtml(name)}')"
                        class="px-2 py-1 text-xs bg-red-100 text-red-700 hover:bg-red-200 rounded-md font-medium transition-colors flex-shrink-0">
                        Удалить
                    </button>
                </div>
            `).join('');
        }

        function showSaveBtn(input) {
            const saveBtn = input.nextElementSibling;
            if (input.value.trim() !== input.dataset.original) {
                saveBtn.classList.remove('hidden');
            } else {
                saveBtn.classList.add('hidden');
            }
        }

        async function addReservedName() {
            const input = document.getElementById('newReservedName');
            const name = input.value.trim();
            if (!name) return;

            try {
                const res = await fetch('/api/reserved-names', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.message || 'Ошибка');
                }
                input.value = '';
                await loadReservedNames();
            } catch (e) {
                alert(`Ошибка: ${e.message}`);
            }
        }

        async function updateReservedName(btn) {
            const input = btn.previousElementSibling;
            const oldName = input.dataset.original;
            const newName = input.value.trim();
            if (!newName || newName === oldName) return;

            try {
                const res = await fetch('/api/reserved-names', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldName, newName })
                });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.message || 'Ошибка');
                }
                await loadReservedNames();
            } catch (e) {
                alert(`Ошибка: ${e.message}`);
            }
        }

        async function deleteReservedName(name) {
            if (!confirm(`Удалить "${name}" из зарезервированных?`)) return;

            try {
                const res = await fetch(`/api/reserved-names/${encodeURIComponent(name)}`, { method: 'DELETE' });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.message || 'Ошибка');
                }
                await loadReservedNames();
            } catch (e) {
                alert(`Ошибка: ${e.message}`);
            }
        }

        // ─── INIT ────────────────────────────────────────────────────────────────

        async function init() {
            await checkAuth();
            initS3Menu();
            await loadUsers(true);
            document.getElementById('loadingOverlay').style.display = 'none';
            lucide.createIcons();

            // Start observing sentinel for infinite scroll
            const sentinel = document.getElementById('sentinel');
            if (sentinel) observer.observe(sentinel);
        }

        init();
    </script>
</body>
