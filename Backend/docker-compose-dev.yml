version: '3.8'

x-common-variables: &common-variables
  CONFIGURATION_SERVICE_URL: "${CONFIGURATION_SERVICE_URL}"
  ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"

services:
  # === Основные микросервисы ===
  
  beacon:
    image: docker.barkfluff.com:5000/barkfluff-beacon-dev:latest
    container_name: beacon
    restart: always
    environment:
      <<: *common-variables
      BEACON_PORT: ${BEACON_PORT}
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  configuration:
    image: docker.barkfluff.com:5000/barkfluff-configuration-dev:latest
    container_name: configuration
    restart: always
    env_file:
      - .env
    environment:
      <<: *common-variables
      CONFIGURATION_HOST: ${CONFIGURATION_HOST}
      CONFIGURATION_DATABASE: ${CONFIGURATION_DATABASE}
      CONFIGURATION_USERNAME: ${CONFIGURATION_USERNAME}
      CONFIGURATION_PASSWORD: ${CONFIGURATION_PASSWORD}
      CONFIGURATION_PORT: ${CONFIGURATION_PORT}
    networks:
      - barkfluff-network

  files:
    image: docker.barkfluff.com:5000/barkfluff-files-dev:latest
    container_name: files
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  identity:
    image: docker.barkfluff.com:5000/barkfluff-identity-dev:latest
    container_name: identity
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  messages:
    image: docker.barkfluff.com:5000/barkfluff-messages-dev:latest
    container_name: messages
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  notification:
    image: docker.barkfluff.com:5000/barkfluff-notification-dev:latest
    container_name: notification
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  users:
    image: docker.barkfluff.com:5000/barkfluff-users-dev:latest
    container_name: users
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  fast-auth:
    image: docker.barkfluff.com:5000/barkfluff-fast-auth-dev:latest
    container_name: fast-auth
    restart: always
    environment:
      <<: *common-variables
      FASTAUTH_PORT: ${FASTAUTH_PORT}
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  updates:
    image: docker.barkfluff.com:5000/barkfluff-updates-dev:latest
    container_name: updates
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  onliner:
    image: docker.barkfluff.com:5000/barkfluff-onliner-dev:latest
    container_name: onliner
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  cloud-messaging:
    image: docker.barkfluff.com:5000/barkfluff-cloud-messaging-dev:latest
    container_name: cloud-messaging
    restart: always
    environment:
      <<: *common-variables
    volumes:
      - ./barkfluff-firebase-adminsdk.json:/app/firebase/barkfluff-firebase-adminsdk.json:ro
    networks:
      - barkfluff-network
    depends_on:
      - configuration

  # === Панель администрирования ===

  admin-panel:
    image: docker.barkfluff.com:5000/barkfluff-admin-panel-dev:latest
    container_name: admin-panel
    restart: always
    user: root
    environment:
      <<: *common-variables
      ConfigurationServiceAddr: "${CONFIGURATION_SERVICE_URL}"
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN}"
      Telegram__Admins: "${TELEGRAM_ADMINS}"
      Seq__ServerUrl: "http://seq:80"
      Seq__ApiKey: "${SEQ_API_KEY:-}"
      UsersService__Host: "http://users:7001"
      FilesService__Host: "http://files:7005"
      UsersService__Token: "${USERS_SERVICE_TOKEN}"
      FilesService__Token: "${FILES_SERVICE_TOKEN}"
      IdentityService__Host: "http://identity:7000"
      IdentityService__Token: "${IDENTITY_SERVICE_TOKEN}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - admin_panel_data:/app/db
      - ./docker-compose.yml:/docker-compose.yml:ro
      - ./.env:/.env:ro
    networks:
      - barkfluff-network
    depends_on:
      - configuration
      - seq

  # === Инфраструктурные сервисы ===

  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: always
    ports:
      - "${SEQ_WEBPORT}:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_ADMIN_PASSWORD}"
    volumes:
      - seq_data:/data
    networks:
      - barkfluff-network

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    container_name: minio
    restart: always
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"       # S3 API (9000)
      - "${MINIO_WEBPORT}:${MINIO_WEBPORT}" # Console (9001)
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":${MINIO_WEBPORT}"
    networks:
      - barkfluff-network

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    restart: always
    # Порты не проброшены наружу — доступен только внутри Docker-сети
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
    networks:
      - barkfluff-network

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    # Порты не проброшены наружу — доступен только внутри Docker-сети
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - barkfluff-network

  postgres:
    image: postgres:18
    container_name: postgres_barkfluff
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql
      - backup_volume:/backup
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    networks:
      - barkfluff-network

networks:
  barkfluff-network:
    driver: bridge

volumes:
  pgdata:
  rabbitmq_data:
  redis_data:
  minio_data:
  backup_volume:
  seq_data:
  admin_panel_data:
