# minio.barkfluff.com - MinIO Web Console
server {
    listen 80;
    server_name minio.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name minio.barkfluff.com;

    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Ignore invalid headers from MinIO
    ignore_invalid_headers off;
    
    # Allow any size file to be uploaded
    client_max_body_size 0;
    
    # Disable buffering
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        set $minio_backend http://minio:9001;
        proxy_pass $minio_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy true;
        
        # WebSocket support for MinIO console
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Chunked transfer
        chunked_transfer_encoding off;
    }
}

# minio-api.barkfluff.com - MinIO S3 API (optional, если нужен прямой доступ к S3 API)
server {
    listen 80;
    server_name minio-api.barkfluff.com s3.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name minio-api.barkfluff.com s3.barkfluff.com;

    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;

    ignore_invalid_headers off;
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        set $minio_api http://minio:9000;
        proxy_pass $minio_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy true;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }
}
