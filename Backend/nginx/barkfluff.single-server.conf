upstream barkfluff_gateway {
    server 127.0.0.1:64641;
}

upstream barkfluff_clientstorage {
    server 127.0.0.1:7050;
}

upstream barkfluff_files_http {
    server 127.0.0.1:7006;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name storage.barkfluff.com;

    ssl_certificate     /etc/nginx/certs/barkfluff.com-crt.pem;
    ssl_certificate_key /etc/nginx/certs/barkfluff.com-key.pem;

    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 512m;
    client_body_timeout  1800s;

    location / {
        proxy_pass http://barkfluff_clientstorage;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
        proxy_connect_timeout 60s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name barkfluff.com api.barkfluff.com *.barkfluff.com;

    ssl_certificate     /etc/nginx/certs/barkfluff.com-crt.pem;
    ssl_certificate_key /etc/nginx/certs/barkfluff.com-key.pem;

    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 512m;

    # Bootstrap-канал discovery (docs/rearch/02-trust-and-certs.md, "Слой 1"): CA-валидный серт
    # на apex обязателен для публичных нод — без него нода знакомится только через ручных пиров
    # (docs/rearch/03-discovery.md, источник 3).
    location = /.well-known/barkfluff {
        limit_req zone=federation_wellknown burst=5 nodelay;
        proxy_pass http://federation:7031/.well-known/barkfluff;
        proxy_set_header Host $host;
    }

    location = /web {
        return 301 /web/;
    }

    location /web/ {
        proxy_pass http://barkfluff_files_http/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://barkfluff_gateway;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 80;
    server_name barkfluff.com *.barkfluff.com;
    return 301 https://$host$request_uri;
}
