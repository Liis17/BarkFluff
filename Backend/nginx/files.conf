# files.barkfluff.com - Files Service (gRPC on 7005, HTTP on 7006)
server {
    listen 80;
    server_name files.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name files.barkfluff.com;

    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # gRPC API (основной)
    location / {
        set $grpc_backend grpc://files:7005;
        grpc_pass $grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }

    # HTTP web interface для скачивания/загрузки файлов
    location /web/ {
        set $http_backend http://files:7006;
        rewrite ^/web/(.*) /$1 break;
        proxy_pass $http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Для больших файлов
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
