<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачать Barkfluff</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #e0e0e0;
            --accent-color: #7b61ff;
            --accent-hover: #644bd9;
            --secondary-bg: rgba(30, 30, 30, 0.6); /* Полупрозрачность для эффекта стекла */
            --code-bg: rgba(45, 45, 45, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden; /* Чтобы фон не создавал полосы прокрутки */
            position: relative;
        }

        /* --- ДИНАМИЧЕСКИЙ ФОН --- */
        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Помещаем назад */
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px); /* Сильное размытие */
            opacity: 0.4; /* Прозрачность для "еле заметности" */
            animation: float 20s infinite ease-in-out alternate;
        }

        .blob-1 {
            background: #2a1b5e; /* Темно-фиолетовый */
            width: 500px;
            height: 500px;
            top: -100px;
            left: -100px;
            animation-duration: 25s;
        }

        .blob-2 {
            background: #1a1a2e; /* Темно-синий */
            width: 400px;
            height: 400px;
            bottom: -50px;
            right: -100px;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        .blob-3 {
            background: #252525; /* Темно-серый */
            width: 300px;
            height: 300px;
            top: 40%;
            left: 40%;
            opacity: 0.3;
            animation-duration: 20s;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
            100% { transform: translate(-20px, -40px) scale(0.95); }
        }
        /* ----------------------- */

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            /* Эффект матового стекла (Glassmorphism) */
            backdrop-filter: blur(10px); 
            background: rgba(18, 18, 18, 0.4);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.8s ease-out;
            z-index: 1; /* Контент поверх фона */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        p.subtitle {
            color: #aaa;
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 4px 15px rgba(123, 97, 255, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 97, 255, 0.4);
        }

        .btn-secondary {
            background-color: var(--secondary-bg);
            color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-secondary:hover {
            border-color: rgba(255,255,255,0.2);
            background-color: rgba(255,255,255,0.05);
        }

        .cli-section {
            text-align: left;
            background-color: var(--secondary-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .cli-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777;
            margin-bottom: 10px;
            display: block;
        }

        .code-block {
            background-color: var(--code-bg);
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #a5d6ff;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.2);
        }

        .prompt {
            color: #666;
            margin-right: 10px;
            user-select: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.2rem; }
            .btn { width: 100%; text-align: center; }
            .container { padding: 20px; width: 90%; }
        }
    </style>
</head>
<body>

    <!-- Динамический фон -->
    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <!-- Логотип / Название -->
        <h1>Barkfluff</h1>
        <p class="subtitle">Легкий. Быстрый. Пушистый.</p>

        <!-- Кнопки загрузки -->
        <div class="btn-group">
            <a href="PLACEHOLDER_LINK_INSTALLER" class="btn btn-primary">
                Скачать установщик
            </a>
            <a href="PLACEHOLDER_LINK_PORTABLE" class="btn btn-secondary">
                Скачать Portable (.zip)
            </a>
        </div>

        <!-- CLI Установка -->
        <div class="cli-section">
            <span class="cli-label">Установка через терминал</span>
            <div class="code-block">
                <span class="prompt">$</span>
                PLACEHOLDER_INSTALL_COMMAND
            </div>
        </div>
    </main>

</body>
</html>
