<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачать Barkfluff</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #e0e0e0;
            --accent-color: #7b61ff;
            --accent-hover: #644bd9;
            --secondary-bg: rgba(30, 30, 30, 0.6);
            --code-bg: rgba(45, 45, 45, 0.8);
            --icon-color: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- ДИНАМИЧЕСКИЙ ФОН --- */
        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
        }

        .blob-1 {
            background: #2a1b5e;
            width: 500px;
            height: 500px;
            top: -100px;
            left: -100px;
            animation-duration: 25s;
        }

        .blob-2 {
            background: #1a1a2e;
            width: 400px;
            height: 400px;
            bottom: -50px;
            right: -100px;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        .blob-3 {
            background: #252525;
            width: 300px;
            height: 300px;
            top: 40%;
            left: 40%;
            opacity: 0.3;
            animation-duration: 20s;
            animation-delay: -10s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(50px, 30px) scale(1.1);
            }

            100% {
                transform: translate(-20px, -40px) scale(0.95);
            }
        }

        /* --- КОНТЕЙНЕР --- */
        .container {
            text-align: center;
            width: 90%;
            max-width: 550px;
            padding: 40px;
            backdrop-filter: blur(12px);
            background: rgba(20, 20, 20, 0.5);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.8s ease-out;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 2.5rem; /* Отступ между основными блоками */
        }

        /* Блок заголовка */
        .header-content {
            display: flex;
            flex-direction: column;
            gap: 0.5rem; /* Безопасное расстояние между H1 и подзаголовком */
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.1; /* Плотный интерлиньяж, но без наложения */
            margin: 0;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, #fff 0%, #b0b0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-bottom: 5px; /* Чтобы нижние выносные элементы букв (р, у, ф) не обрезались */
        }

        p.subtitle {
            color: #aaa;
            font-size: 1.1rem;
            margin: 0;
            font-weight: 400;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 4px 15px rgba(123, 97, 255, 0.2);
        }

            .btn-primary:hover {
                background-color: var(--accent-hover);
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(123, 97, 255, 0.4);
            }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.1);
        }

            .btn-secondary:hover {
                background-color: rgba(255, 255, 255, 0.1);
                border-color: rgba(255,255,255,0.3);
            }

        /* --- CLI SECTION --- */
        .cli-section {
            text-align: left;
        }

        .cli-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #888;
            margin-bottom: 8px;
            display: block;
            margin-left: 4px;
        }

        .code-wrapper {
            background-color: var(--code-bg);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px;
            transition: border-color 0.2s;
        }

            .code-wrapper:hover {
                border-color: rgba(255,255,255,0.3);
            }

        .code-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #a5d6ff;
            padding: 10px 15px;
            overflow-x: auto;
            white-space: nowrap;
            flex-grow: 1;
        }

        .prompt {
            color: #666;
            margin-right: 10px;
            user-select: none;
        }

        .copy-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--icon-color);
            transition: all 0.2s;
            margin-right: 2px;
            flex-shrink: 0; /* Чтобы кнопка не сплющивалась */
        }

            .copy-btn:hover {
                background-color: rgba(255,255,255,0.1);
                color: white;
            }

            .copy-btn svg {
                width: 20px;
                height: 20px;
            }

        /* --- FOOTER / CONTACTS --- */
        .contacts {
            margin-top: 0.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .contact-link {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

            .contact-link:hover {
                color: var(--accent-color);
            }

            .contact-link svg {
                width: 18px;
                height: 18px;
                fill: currentColor;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }

            .btn {
                width: 100%;
            }

            .container {
                padding: 25px 20px;
                width: 95%;
                gap: 2rem;
            }

            .contacts {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <!-- Шапка (Исправленная) -->
        <div class="header-content">
            <h1>Barkfluff</h1>
            <p class="subtitle">Легкий. Быстрый. Пушистый.</p>
        </div>

        <!-- Кнопки -->
        <div class="btn-group">
            <a href="PLACEHOLDER_LINK_INSTALLER" class="btn btn-primary">
                Скачать установщик
            </a>
            <a href="PLACEHOLDER_LINK_PORTABLE" class="btn btn-secondary">
                Portable (.zip)
            </a>
        </div>

        <!-- CLI + Copy Button -->
        <div class="cli-section">
            <span class="cli-label">Быстрая установка</span>
            <div class="code-wrapper">
                <div class="code-text">
                    <span class="prompt">$</span><span id="install-cmd">PLACEHOLDER_INSTALL_COMMAND</span>
                </div>
                <button class="copy-btn" onclick="copyToClipboard()" title="Скопировать команду">
                    <!-- Иконка копирования -->
                    <svg id="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <!-- Иконка галочки -->
                    <svg id="check-icon" style="display:none; color: #4cd964;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </button>
            </div>
        </div>

        <!-- Контакты -->
        <footer class="contacts">
            <a href="https://t.me/barkfluff?direct" target="_blank" class="contact-link">
                <!-- Telegram Icon -->
                <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 11.944 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" /></svg>
                Telegram
            </a>
            <a href="mailto:help@barkfluff.com" class="contact-link">
                <!-- Mail Icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                Email
            </a>
        </footer>
    </main>

    <script>
        function copyToClipboard() {
            const commandText = document.getElementById('install-cmd').innerText;
            navigator.clipboard.writeText(commandText).then(() => {
                const copyIcon = document.getElementById('copy-icon');
                const checkIcon = document.getElementById('check-icon');

                copyIcon.style.display = 'none';
                checkIcon.style.display = 'block';

                setTimeout(() => {
                    checkIcon.style.display = 'none';
                    copyIcon.style.display = 'block';
                }, 2000);
            }).catch(err => {
                console.error('Ошибка копирования:', err);
            });
        }
    </script>
</body>
</html>
