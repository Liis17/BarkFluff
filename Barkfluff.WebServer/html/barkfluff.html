<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barkfluff Мессенджер</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --primary: #3b82f6;
            --card-bg: rgba(30, 41, 59, 0.6);
            --card-border: rgba(255, 255, 255, 0.1);
            --code-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: var(--text-main);
            position: relative;
            padding: 20px 0;
        }

        .blobs {
            position: absolute;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            animation: float 20s infinite alternate;
        }

        .b1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: #4f46e5;
            animation-duration: 25s;
        }

        .b2 {
            bottom: -10%;
            right: -10%;
            width: 40vw;
            height: 40vw;
            background: #0ea5e9;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(40px, -40px);
            }
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            padding: 40px 30px;
            border-radius: 32px;
            text-align: center;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.6);
            animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 16px;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
        }

            .btn-main:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 30px rgba(37, 99, 235, 0.6);
            }

        .btn-text {
            text-align: left;
            line-height: 1.2;
        }

        .btn-small {
            font-size: 10px;
            opacity: 0.8;
            text-transform: uppercase;
            display: block;
        }

        .btn-big {
            font-size: 16px;
            font-weight: 700;
            display: block;
        }

        .win-icon {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .btn-secondary {
            padding: 12px;
            background: rgba(255,255,255,0.05);
            color: var(--text-sub);
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            transition: 0.2s;
            font-size: 14px;
        }

            .btn-secondary:hover {
                background: rgba(255,255,255,0.1);
                color: white;
                border-color: rgba(255,255,255,0.3);
            }

        .cli-section {
            text-align: left;
        }

        .cli-label {
            font-size: 11px;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 6px;
            margin-left: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .code-box {
            background: var(--code-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.2s;
        }

            .code-box:hover {
                border-color: rgba(255,255,255,0.3);
            }

        .code-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #a5b4fc;
            padding: 10px 14px;
            white-space: nowrap;
            overflow-x: auto;
            flex-grow: 1;
        }

        .prompt {
            color: var(--text-sub);
            margin-right: 8px;
            user-select: none;
        }

        .copy-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            transition: 0.2s;
            flex-shrink: 0;
            margin-right: 2px;
        }

            .copy-btn:hover {
                background: rgba(255,255,255,0.1);
                color: white;
            }

            .copy-btn svg {
                width: 16px;
                height: 16px;
            }

        .contacts {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--card-border);
        }

        .contact-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
        }

            .contact-link:hover {
                color: var(--primary);
            }


            .contact-link svg {
                width: 16px;
                height: 16px;
                fill: currentColor;
            }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .qr-label {
            font-size: 11px;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .qr-box {
            background: white;
            padding: 8px;
            border-radius: 16px;
            width: 256px;
            height: 256px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .qr-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

        <div class="blob b1"></div>

    <main class="container">
        <div class="header">
            <h1>Barkfluff</h1>
            <s>Легкий. Быстрый. Пушистый.</s>
            <p>Работает. И. Слава Богу.</p>

                </button>
