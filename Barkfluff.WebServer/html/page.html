<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarkFluff User @%%username%%</title>
    <style>
        :root {
            --bg-color: #f1f3f5;
            --card-bg: #ffffff;
            --primary-color: #3390ec; 
            --text-color: #000000;
            --subtext-color: #838d96;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f0f0f;
                --card-bg: #1c1c1e;
                --text-color: #ffffff;
                --subtext-color: #9e9e9e;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--bg-color);
        }

        /* Круг загрузки вокруг аватарки */
        .loader-ring {
            position: absolute;
            top: -5px;
            left: -5px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--primary-color);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            color: var(--subtext-color);
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            border-radius: 12px;
            transition: transform 0.1s ease, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: var(--subtext-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-wrapper">
            <!-- Вставьте сюда ссылку на реальное фото -->
            <img src="https://icon-library.com/images/default-user-icon/default-user-icon-23.jpg" alt="Avatar" class="avatar">
            <div class="loader-ring"></div>
        </div>
        
        <h1>%%username%%</h1>
        <p>Открываем приложение...</p>

        <a href="#" class="btn" id="redirect-btn">Открыть сейчас</a>
        
        <div class="footer-note">Если переход не сработал автоматически</div>
    </div>

    <script>
        // === НАСТРОЙКИ ===
        // Укажите здесь вашу ссылку (tg://..., https://... или deep link приложения)
        const TARGET_URL = "bf://user-username=%%username%%"; 
        
        // Время задержки в миллисекундах (1000 = 1 секунда)
        const DELAY_MS = 1000;

        // === ЛОГИКА ===
        const btn = document.getElementById('redirect-btn');

        // Устанавливаем ссылку в кнопку
        btn.href = TARGET_URL;

        // Функция редиректа
        function doRedirect() {
            window.location.href = TARGET_URL;
        }

        // Запуск таймера
        setTimeout(() => {
            doRedirect();
        }, DELAY_MS);
    </script>
</body>
</html>
