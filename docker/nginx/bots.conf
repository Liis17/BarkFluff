# bots.barkfluff.com - Bots Service (gRPC on 7027, HTTP Bot REST API on 7028)
# Bot-JWT передаётся в заголовке x-auth-token — в URL/логи не попадает.
server {
    listen 80;
    server_name bots.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bots.barkfluff.com;

    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Bot REST API (HTTP/1.1)
    location ~ ^/bot/ {
        set $http_backend http://bots:7028;
        proxy_pass $http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # multipart-загрузки sendPhoto/sendDocument
        client_max_body_size 50m;

        # long-poll getUpdates (timeout ≤ 50с + запас)
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # gRPC API (BotsExternalApi / BotsServerApi)
    location / {
        set $grpc_backend grpc://bots:7027;
        grpc_pass $grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}
