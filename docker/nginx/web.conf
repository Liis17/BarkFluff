# gRPC-Web шлюз ноды.
#
# Статику раздаёт глобальный web.barkfluff.com (отдельный стек docker/webshell),
# а браузер обращается сюда напрямую — за gRPC-Web и загрузкой файлов.
#
# web.barkfluff.com пока указан здесь же, чтобы переключение прошло без простоя:
# после того как шелл поднят и DNS web.barkfluff.com переведён на него, этот
# server_name отсюда убирается, и у ноды остаётся только gw.*.
#
# gw.barkfluff.com — имя-заглушка: подставьте домен своей ноды и укажите его же
# в ExternalEndpoint:Host сервиса Web, откуда Beacon берёт web_endpoint для Navigator.
server {
    listen 80;
    server_name gw.barkfluff.com web.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gw.barkfluff.com web.barkfluff.com;

    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Загрузка файлов через YARP — нужен увеличенный лимит тела запроса
    location /api/files/upload/ {
        set $backend http://web:7016;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }

    location / {
        set $backend http://web:7016;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
