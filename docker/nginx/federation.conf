# federation.barkfluff.com - Federation Service S2S (gRPC)
server {
    listen 80;
    server_name federation.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name federation.barkfluff.com;

    # Серт ноды: для S2S допустим self-signed (чужие ноды проверяют SPKI-пин, а не CA) — оператор
    # подставляет свой сертификат теми же путями, что и остальные сервисы (docs/rearch/02-trust-and-certs.md).
    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;

    limit_req zone=federation_s2s burst=20 nodelay;

    location / {
        set $grpc_backend grpc://federation:7030;
        grpc_pass $grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;

        # Отличие от соседей — долгоживущие стримы (SubscribePresence часами, FetchFile гигабайты
        # в Фазах 3-4): таймауты подняты на порядок. У ngx_http_grpc_module нет directive'а
        # "grpc_buffering off" (проверено по официальной документации nginx — в отличие от
        # proxy_buffering для HTTP-проксирования такого рычага у grpc_pass нет); чанки и так
        # прокидываются по мере поступления DATA-фреймов HTTP/2, без искусственного накопления.
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }
}
