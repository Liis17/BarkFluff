events {
    worker_connections 1024;
}

http {
    # Увеличиваем лимит для загрузки больших слоев образов
    client_max_body_size 0;

    upstream docker-registry {
        server registry:5000;
    }

    server {
        listen 5000 ssl;
        server_name docker.barkfluff.com;

        # SSL сертификаты (пути внутри контейнера)
        ssl_certificate /certs/barkfluff.com-crt.pem;
        ssl_certificate_key /certs/barkfluff.com-key.pem;

        # Рекомендованные настройки SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Стримим большие слои потоком, не буферизуя на диск nginx'а.
        # Важно при S3 backend — registry сам стримит в S3, незачем держать копию у nginx.
        proxy_request_buffering off;
        proxy_http_version      1.1;
        chunked_transfer_encoding on;

        location / {
            # Самая важная часть: Разделение прав
            # Для всех методов КРОМЕ GET и HEAD требуем пароль
            limit_except GET HEAD {
                auth_basic "Registry Realm";
                auth_basic_user_file /auth/htpasswd;
            }

            proxy_pass http://docker-registry;

            # Заголовки для правильной работы Registry
            proxy_set_header  Host              $http_host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;

            # Таймауты подняты под push/pull больших слоёв через S3
            proxy_connect_timeout               60;
            proxy_send_timeout                  900;
            proxy_read_timeout                  900;
            send_timeout                        900;
        }
    }
}
