# navigator.barkfluff.com — Navigator (реестр серверов BarkFluff)
#
# Источник истины для nginx-конфига выделенного хоста Navigator (docker/navigator/,
# деплой живёт на отдельном хосте вне основного стека ноды — см. Obsidian Backend/Navigator).
#
# Установка: скопировать в /etc/nginx/conf.d/ (или sites-enabled/) хостового nginx
# рядом с 01-ssl-params.conf и wildcard-сертификатом barkfluff.com.
# Upstream — хостовые порты, публикуемые compose Navigator'а:
#   64646 — gRPC/HTTP2 (NAVIGATOR_PORT), 64647 — HTTP/1.1 админки (NAVIGATOR_HTTP_PORT).
# Если nginx работает в общей docker-сети с контейнером navigator — замени
# 127.0.0.1:64646/64647 на navigator:7010/7011 и добавь resolver 127.0.0.11.

server {
    listen 80;
    server_name navigator.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name navigator.barkfluff.com;

    include /etc/nginx/conf.d/01-ssl-params.conf;

    # --- Публичная часть (HTTP/1.1 порт): главная страница, статика, публичный API, админка ---

    location = / {
        proxy_pass http://127.0.0.1:64647;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:64647;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Публичный список серверов для главной страницы (без авторизации).
    location /api/ {
        proxy_pass http://127.0.0.1:64647;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ping {
        proxy_pass http://127.0.0.1:64647;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React-админка + /admin/api/* (cookie-сессия NavigatorAdmin).
    location /admin/ {
        proxy_pass http://127.0.0.1:64647;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Всё остальное — gRPC API (ListServers / RegisterServer / GetServerByName) ---

    location / {
        set $grpc_backend grpc://127.0.0.1:64646;
        grpc_pass $grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}
