# proxy.barkfluff.com — Web Proxy (зеркало ноды, доступное из РФ)
#
# Точка входа прокси-стека (docker/proxy/): раздаёт веб-клиент и релеит весь
# трафик на Web-шлюз origin-ноды за Cloudflare (см. Obsidian Backend/Web, режим Proxy).
# Домен должен обходить Cloudflare (DNS-запись с серым облаком) — иначе теряется смысл.

server {
    listen 80;
    server_name proxy.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name proxy.barkfluff.com;
    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # HTTP upload файлов: тело большое, стримим без буферизации в tmpfs
    # (лимит 512m соответствует Kestrel-лимиту Web и лимиту origin-ноды).
    location /api/files/upload/ {
        set $backend http://web:7016;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }

    # Media-relay: большие файлы/видео, стримим без буферизации
    # (Range-запросы для seek уже пробрасывает сам Web).
    location /media/ {
        set $backend http://web:7016;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Всё остальное: статика + gRPC-Web (включая долгоживущие server-streaming
    # подписки updates/onliner/fast-auth/calls — они молчат часами, поэтому
    # 86400s и без буферизации; соответствует ActivityTimeout 24h в Web).
    location / {
        set $backend http://web:7016;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
