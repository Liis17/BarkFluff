upstream barkfluff_gateway {
    server 127.0.0.1:64641;
}

upstream barkfluff_clientstorage {
    server 127.0.0.1:7050;
}

upstream barkfluff_files_http {
    server 127.0.0.1:7006;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name storage.barkfluff.com;

    client_max_body_size 512m;
    client_body_timeout  1800s;

    location / {
        proxy_pass http://barkfluff_clientstorage;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
        proxy_connect_timeout 60s;
    }
}

server {
    listen 80;
    server_name barkfluff.com api.barkfluff.com *.barkfluff.com;

    client_max_body_size 512m;

    # /.well-known/barkfluff (federation discovery bootstrap) тут сознательно нет: федерация
    # должна ходить напрямую, вне Cloudflare Tunnel (см. docker/nginx/barkfluff.single-server.conf) —
    # SPKI-пин других нод рассчитан на сертификат самой ноды, а не на серт Cloudflare.

    location = /web {
        return 301 /web/;
    }

    location /web/ {
        proxy_pass http://barkfluff_files_http/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://barkfluff_gateway;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
