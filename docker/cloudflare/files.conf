# files.barkfluff.com - Files Service (gRPC on 7005, HTTP on 7006; за Cloudflare Tunnel)
server {
    listen 80;
    http2 on;
    server_name files.barkfluff.com;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # gRPC API (основной)
    location / {
        set $grpc_backend grpc://files:7005;
        grpc_pass $grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto https;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }

    # HTTP web interface для скачивания/загрузки файлов
    location /web/ {
        set $http_backend http://files:7006;
        rewrite ^/web/(.*) /$1 break;
        proxy_pass $http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Для больших файлов
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_buffering off;

        # Таймауты для загрузки больших файлов (дефолт 60s — недостаточно)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }
}
