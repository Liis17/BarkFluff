# livekit.barkfluff.com - LiveKit SFU: WS-сигнализация + HTTP-API (на 7880; за Cloudflare Tunnel).
#
# ВАЖНО: через nginx идёт ТОЛЬКО сигнализация (WebSocket) и серверный API LiveKit.
# Сам WebRTC-медиатрафик (UDP 50000-50200 + ICE/TCP 7881) через Cloudflare Tunnel не ходит —
# эти порты обязаны быть доступны напрямую на хосте (см. docker-compose / firewall), тунель
# их не проксирует.
# Клиент получает адрес wss://livekit.barkfluff.com (Cloudflare терминирует TLS на входе,
# до nginx долетает голый ws://).

# WebSocket upgrade (http-контекст; conf.d включается внутрь http{}).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Без http2: WS — это HTTP/1.1 Upgrade.
    listen 80;
    server_name livekit.barkfluff.com;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $lk_backend http://livekit:7880;
        proxy_pass $lk_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Сигнализация живёт всё время звонка.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
