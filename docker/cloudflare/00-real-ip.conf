# Клиент не достучится до nginx напрямую — только через локальный контейнер
# cloudflared (Cloudflare Tunnel), поэтому $remote_addr тут всегда IP тунеля,
# а не реального клиента. Cloudflare сам подставляет реальный IP в заголовок
# CF-Connecting-IP, cloudflared передаёт его как есть — восстанавливаем
# $remote_addr отсюда, чтобы limit_req/X-Real-IP/логи в *.conf работали без правок.
#
# 0.0.0.0/0 — nginx наружу не публикуется, единственный, кто сюда достучится, —
# cloudflared в той же docker-сети. Если сеть общая с другими контейнерами,
# сузь до их подсети.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# Во всех *.conf ниже X-Forwarded-Proto захардкожен в "https" вместо $scheme:
# сюда nginx слушает голый 80, но между клиентом и краем Cloudflare всегда TLS
# (публичный hostname тунеля работает только по https).
#
# Сервисы на gRPC (grpc_pass, http2 on) требуют от cloudflared
# originRequest.http2Origin: true в ingress-правиле tunnel-конфига для своего
# hostname — иначе тунель шлёт HTTP/1.1 и gRPC не поднимется.
