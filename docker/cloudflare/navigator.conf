# navigator.barkfluff.com — gRPC registry and Navigator admin UI (за Cloudflare Tunnel)
server {
    listen 80;
    http2 on;
    server_name navigator.barkfluff.com;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location = / {
        return 302 /admin/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        set $http_backend http://navigator:64647;
        proxy_pass $http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $grpc_backend grpc://navigator:64646;
        grpc_pass $grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto https;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}
