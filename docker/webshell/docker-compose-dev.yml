# Глобальный веб-шелл (web.barkfluff.com): раздаёт статику клиента и проксирует
# только каталог нод. К самим нодам браузер ходит напрямую, cross-origin, поэтому
# стек полностью автономен: ни Configuration, ни сети ноды здесь не нужны.
services:
  web-shell:
    container_name: web-shell
    image: docker.barkfluff.com/barkfluff-web-dev:latest
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Shell-режим отключает кластеры сервисов ноды и /api/files/upload,
      # а также пропускает LoadConfiguration — Configuration-сервиса тут нет.
      Web__Mode: "Shell"
      RunSettings__Port: "${WEB_SHELL_PORT}"
      # Каталог нод публичен, идём в него по TLS через тот же адрес, что и клиенты.
      NavigatorService__Host: "${NAVIGATOR_SERVICE_HOST}"
    expose:
      - "${WEB_SHELL_PORT}"
    networks:
      - barkfluff-webshell-network

  nginx:
    image: nginx:alpine
    container_name: nginx-webshell
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sites:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    restart: always
    depends_on:
      - web-shell
    networks:
      - barkfluff-webshell-network

networks:
  barkfluff-webshell-network:
    driver: bridge
