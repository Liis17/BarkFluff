# web.barkfluff.com — глобальный веб-клиент (за Cloudflare Tunnel, TLS терминирует Cloudflare).
#
# Отдаёт статику и проксирует только NavigatorApi для экрана выбора ноды.
# gRPC-Web к сервисам ноды и загрузка файлов сюда не приходят: браузер обращается
# к шлюзу выбранной ноды напрямую (docker/nginx/web.conf).
server {
    listen 80;
    http2 on;
    server_name web.barkfluff.com;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $backend http://web-shell:7016;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
