# Конфиг LiveKit SFU для dev-окружения BarkFluff.
# keys ДОЛЖНЫ совпадать с секцией LiveKit в Configuration (ConfigurationDefaultsPopulator):
#   ApiKey = devkey, ApiSecret = devsecret_change_me_in_production_0123456789
# В production заменить на стойкие креды и публичный домен.

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  # dev: один хост в docker-сети, без внешнего IP. В production включить use_external_ip
  # и пробросить публичный UDP-диапазон.
  use_external_ip: false

keys:
  devkey: devsecret_change_me_in_production_0123456789

# Webhooks LiveKit → сервис Calls (HTTP/1.1-листенер на 7026).
webhook:
  api_key: devkey
  urls:
    - http://calls:7026/livekit/webhook
