# calls.barkfluff.com - Calls Service (gRPC на 7025)
# Webhook-порт 7026 (LiveKit -> Calls) — внутренний, наружу НЕ выходит (только docker-сеть).
server {
    listen 80;
    server_name calls.barkfluff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name calls.barkfluff.com;
    include /etc/nginx/conf.d/01-ssl-params.conf;
    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $grpc_backend grpc://calls:7025;
        grpc_pass $grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }
}
