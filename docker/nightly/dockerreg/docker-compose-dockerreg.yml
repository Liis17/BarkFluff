services:
  registry:
    image: registry:2
    container_name: registry
    restart: always
    expose:
      - "5000"
    environment:
      - REGISTRY_HTTP_ADDR=0.0.0.0:5000
      - REGISTRY_HTTP_SECRET=${REGISTRY_HTTP_SECRET}
      - REGISTRY_STORAGE_DELETE_ENABLED=true
      # S3 backend вместо локального диска
      - REGISTRY_STORAGE=s3
      - REGISTRY_STORAGE_S3_REGIONENDPOINT=${S3_ENDPOINT}
      - REGISTRY_STORAGE_S3_BUCKET=${S3_BUCKET}
      - REGISTRY_STORAGE_S3_REGION=${S3_REGION}
      - REGISTRY_STORAGE_S3_ACCESSKEY=${S3_ACCESS_KEY}
      - REGISTRY_STORAGE_S3_SECRETKEY=${S3_SECRET_KEY}
      - REGISTRY_STORAGE_S3_FORCEPATHSTYLE=true
      - REGISTRY_STORAGE_S3_SECURE=true

      - REGISTRY_STORAGE_S3_CHUNKSIZE=104857600
      - REGISTRY_STORAGE_S3_MULTIPARTCOPYTHRESHOLDSIZE=5368709120
      - REGISTRY_STORAGE_S3_MULTIPARTCOPYCHUNKSIZE=104857600
      - REGISTRY_STORAGE_S3_MULTIPARTCOPYMAXCONCURRENCY=10
    networks:
      - barkfluff-docker-network

  nginx:
    image: nginx:alpine
    container_name: registry_nginx
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./auth:/auth:ro
      - ./certs:/certs:ro
    depends_on:
      - registry
    networks:
      - barkfluff-docker-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-dockerreg
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - barkfluff-docker-network

networks:
  barkfluff-docker-network:
    external: true