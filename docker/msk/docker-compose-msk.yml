services:
  webserver-dev:
    container_name: webserver
    image: docker.barkfluff.com:5000/barkfluff-webserver-dev:latest
    restart: always
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:${WEBSERVER_PORT}"
      WEBSERVER_PORT: ${WEBSERVER_PORT}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      UsersService__Host: ${USERS_SERVICE_HOST}
      UsersService__Token: ${USERS_SERVICE_TOKEN}

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    network_mode: host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:rw
      - ./certs:/etc/nginx/certs:rw
      - ./site:/usr/share/nginx/html:rw
      - ./auth:/etc/nginx/auth:rw

  clientstorage-dev:
    container_name: clientstorage
    image: docker.barkfluff.com:5000/barkfluff-client-storage-dev:latest
    restart: always

    ports:
      - "127.0.0.1:${CLIENTSTORAGE_PORT}:${CLIENTSTORAGE_PORT}"

    volumes:
      - clientstorage-data:/app/data
      - clientstorage-cache:/app/cache

    networks:
      - barkfluff-network

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:${CLIENTSTORAGE_PORT}"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_SERVICE_URL: ${S3_SERVICE_URL}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      REGISTRY_STORAGE_S3_CHUNKSIZE: ${REGISTRY_STORAGE_S3_CHUNKSIZE}
      UPLOAD_TOKEN: ${UPLOAD_TOKEN}
      CLIENTSTORAGE_PORT: ${CLIENTSTORAGE_PORT}

volumes:
  clientstorage-data:
  clientstorage-cache:

networks:
  barkfluff-network:
    driver: bridge