user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # cloudflared — единственный, кто достучится сюда, поэтому $remote_addr тут его IP,
    # а не клиента. Реальный IP приходит в CF-Connecting-IP (Cloudflare ставит, cloudflared
    # передаёт как есть) — восстанавливаем $remote_addr отсюда, чтобы X-Real-IP в sites/*.conf
    # остался как есть.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    include /etc/nginx/conf.d/*.conf;
}
