x-common-variables: &common-variables
  CONFIGURATION_SERVICE_URL: "http://192.168.1.177:7003"
  ASPNETCORE_ENVIRONMENT: Production

services:
  navigator-dev:
    container_name: navigator
    image: docker.barkfluff.com/barkfluff-navigator-dev:latest
    restart: always
    user: root
    ports: [ "${NAVIGATOR_PORT}:${NAVIGATOR_PORT}" ]
    environment:
      <<: *common-variables
      NAVIGATOR_PORT: ${NAVIGATOR_PORT}
      NAVIGATOR_HTTP_PORT: ${NAVIGATOR_HTTP_PORT}
      NavigatorAdmin__Username: ${NAVIGATOR_ADMIN_USERNAME}
      NavigatorAdmin__Password: ${NAVIGATOR_ADMIN_PASSWORD}
      # Этап 1.5 rearch: Navigator вне платформенного шаблона (без LoadConfiguration) — локальная
      # SQLite-БД, путь через переменную окружения напрямую, не через Configuration-сервис.
      NAVIGATOR_DB: "Data Source=/app/db/navigator.db"
    volumes:
      - ./db:/app/db
    expose:
      - "${NAVIGATOR_HTTP_PORT}"
    networks:
      - barkfluff-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sites:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    restart: always
    networks:
      - barkfluff-network

networks:
  barkfluff-navigator-network:
    driver: bridge
